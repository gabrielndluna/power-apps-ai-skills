Screens:
  'PR Log':
    Properties:
      Fill: =RGBA(234, 236, 240, 1)
      LoadingSpinnerColor: =RGBA(176, 51, 63, 1)
      OnVisible: |-
        =If(
            IsBlank(varSelectedProject) && CountRows(colPermittedProjects) > 0,
            Set(varSelectedProject, First(colPermittedProjects))
        );
        Set(
            varCurrentRole,
            Coalesce(
                LookUp(colUserPermissions, Project = varSelectedProject.projectidentifier).Role.Value,
                "Viewer"
            )
        );
        ClearCollect(
            colProjectPRs,
            Filter(colPermittedPRs, projectidentifier = varSelectedProject.projectidentifier)
        );
        ClearCollect(
            colProjectLines,
            Filter(colPermittedLines, StartsWith(pridentifier, varSelectedProject.projectidentifier & "-"))
        )
    Children:
      - log_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =Parent.Width
          Children:
            - log_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =248
                Children:
                  - log_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =18
                        Text: ="PRTrack"
                        Width: =224
                  - log_brand_sub:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(154, 161, 174, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11
                        Text: ="IOC  Requisitions"
                        Width: =224
                  - log_nav_dash:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Dashboard"
                        Width: =224
                  - log_nav_log:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(176, 51, 63, 1)
                        Fill: =RGBA(248, 235, 237, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="PR Log (" & CountRows(colPermittedPRs) & ")"
                        Width: =224
                  - log_nav_settings:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate(Settings, ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Settings"
                        Visible: =varIsAdmin
                        Width: =224
                  - log_new_pr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(176, 51, 63, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =42
                        OnSelect: |-
                          =Set(varCreateNonce, varCreateNonce + 1);
                          ClearCollect(
                              colDraftLines,
                              {
                                  lineid: GUID(),
                                  lineno: 1,
                                  description: "",
                                  uom: "Each",
                                  qty: 1,
                                  notes: ""
                              }
                          );
                          Navigate('New PR', ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="+  New PR"
                        Visible: =varCurrentRole <> "Viewer"
                        Width: =224
                  - log_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutMinHeight: =20
                        LayoutMinWidth: =0
                  - log_user_name:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =User().FullName
                        Width: =224
                  - log_user_role:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(154, 161, 174, 1)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        Size: =11
                        Text: =Coalesce(varCurrentRole, "Viewer")
                        Width: =224
            - log_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(234, 236, 240, 1)
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - log_topbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 0.7)
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        PaddingLeft: =22
                        PaddingRight: =22
                      Children:
                        - log_proj_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Light
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                              PaddingLeft: =12
                              PaddingRight: =8
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =320
                            Children:
                              - log_proj_label:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =10
                                    Text: ="PROJECT"
                                    Width: =68
                              - log_proj_combo:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AllowEmptySelection: =false
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    ChevronBackground: =RGBA(255, 255, 255, 1)
                                    ChevronFill: =RGBA(176, 51, 63, 1)
                                    Default: =varSelectedProject.projectname
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Items: =colPermittedProjects
                                    Items.Value: =projectname
                                    OnChange: |-
                                      =If(
                                          !IsBlank(Self.Selected),
                                          Set(varSelectedProject, Self.Selected);
                                          Set(
                                              varCurrentRole,
                                              Coalesce(
                                                  LookUp(colUserPermissions, Project = Self.Selected.projectidentifier).Role.Value,
                                                  "Viewer"
                                              )
                                          );
                                          ClearCollect(colProjectPRs, Filter(colPermittedPRs, projectidentifier = Self.Selected.projectidentifier));
                                          ClearCollect(colProjectLines, Filter(colPermittedLines, StartsWith(pridentifier, Self.Selected.projectidentifier & "-")));
                                          ClearCollect(colProjectPermissions, Filter('PRTrack - Permissions', Project = Self.Selected.projectidentifier));
                                          ClearCollect(colApprovers, Filter(colProjectPermissions, Role.Value = "Approver"));
                                          ClearCollect(colBuyers, Filter(colProjectPermissions, Role.Value = "Buyer"))
                                      )
                  - log_content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =22
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =22
                      Children:
                        - log_page_head:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - log_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(22, 39, 63, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =38
                                    Size: =22
                                    Text: ="PR Log"
                              - log_search:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    Default: =varLogSearch
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HintText: ="Search PR No., requester, or description"
                                    OnChange: =Set(varLogSearch, Self.Text)
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Size: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =360
                              - log_btn_new:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(176, 51, 63, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varCreateNonce, varCreateNonce + 1);
                                      ClearCollect(
                                          colDraftLines,
                                          {
                                              lineid: GUID(),
                                              lineno: 1,
                                              description: "",
                                              uom: "Each",
                                              qty: 1,
                                              notes: ""
                                          }
                                      );
                                      Navigate('New PR', ScreenTransition.Fade)
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Size: =12
                                    Text: ="+  New PR"
                                    Visible: =varCurrentRole <> "Viewer"
                                    Width: =120
                        - log_filters:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =32
                              LayoutMinWidth: =0
                            Children:
                              - log_f_all:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "all", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "all", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "all", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "all")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="All"
                                    Width: =48
                              - log_f_draft:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "Draft", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "Draft", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "Draft", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "Draft")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Draft"
                                    Width: =60
                              - log_f_sub:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "Approval to Proceed", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "Approval to Proceed", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "Approval to Proceed", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "Approval to Proceed")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Approval to Proceed"
                                    Width: =148
                              - log_f_proc:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "Procurement", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "Procurement", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "Procurement", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "Procurement")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Procurement"
                                    Width: =96
                              - log_f_pc:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "Project Controls", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "Project Controls", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "Project Controls", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "Project Controls")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Project Controls"
                                    Width: =118
                              - log_f_appr:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "DOA Approval", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "DOA Approval", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "DOA Approval", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "DOA Approval")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="DOA Approval"
                                    Width: =108
                              - log_f_rej:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "Rejected", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "Rejected", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "Rejected", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "Rejected")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Rejected"
                                    Width: =74
                              - log_f_po:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varPRFilter = "PO created in SAP", RGBA(248, 235, 237, 1), RGBA(232, 234, 239, 1))
                                    BorderThickness: =1
                                    Color: =If(varPRFilter = "PO created in SAP", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varPRFilter = "PO created in SAP", RGBA(248, 235, 237, 1), RGBA(255, 255, 255, 1))
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    OnSelect: =Set(varPRFilter, "PO created in SAP")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="PO created in SAP"
                                    Width: =132
                        - log_table:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Light
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - log_head:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 251, 252, 1)
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =40
                                    LayoutMinWidth: =0
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                  Children:
                                    - log_h1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="PR No."
                                    - log_h_lines:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="LINES"
                                          Width: =48
                                    - log_h2:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="DESCRIPTION"
                                    - log_h3:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="REQUESTER"
                                    - log_h5:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="EST. TOTAL"
                                    - log_h6:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="STATUS"
                                          Width: =154
                                    - log_h_del:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =0
                                          Height: =20
                                          Size: =10
                                          Text: =""
                                          Visible: =varCurrentRole <> "Viewer"
                                          Width: =28
                              - log_gallery:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    Items: |-
                                      =Filter(
                                          AddColumns(
                                              colProjectPRs,
                                              displayStatus,
                                              If(
                                                  Coalesce(prstatus.Value, "") = "Rejected",
                                                  "Rejected",
                                                  Coalesce(prstatus.Value, "") = "Draft" || Coalesce(prstatus.Value, "") = "On Hold" || CountRows(Filter(colProjectLines, pridentifier = Title && (stage.Value = "Draft" || IsBlank(stage.Value)))) > 0,
                                                  "Draft",
                                                  CountRows(Filter(colProjectLines, pridentifier = Title)) > 0 && CountRows(Filter(colProjectLines, pridentifier = Title && stage.Value = "Approved")) = CountRows(Filter(colProjectLines, pridentifier = Title)),
                                                  "PO created in SAP",
                                                  Switch(
                                                      Min(
                                                          AddColumns(
                                                              Filter(colProjectLines, pridentifier = Title && stage.Value <> "Rejected" && stage.Value <> "On hold"),
                                                              stageRank,
                                                              Switch(
                                                                  stage.Value,
                                                                  "Pending proceed", 1,
                                                                  "Sourcing", 2,
                                                                  "Project control", 3,
                                                                  "Pending approval", 4,
                                                                  "Approved", 5,
                                                                  0
                                                              )
                                                          ),
                                                          stageRank
                                                      ),
                                                      1, "Approval to Proceed",
                                                      2, "Procurement",
                                                      3, "Project Controls",
                                                      4, "DOA Approval",
                                                      5, "PO created in SAP",
                                                      Switch(
                                                          prstatus.Value,
                                                          "In procurement", "Procurement",
                                                          "Submitted", "Approval to Proceed",
                                                          "Approved", "PO created in SAP",
                                                          "On Hold", "Draft",
                                                          Coalesce(prstatus.Value, "Draft")
                                                      )
                                                  )
                                              )
                                          ),
                                          (varPRFilter = "all" || displayStatus = varPRFilter) &&
                                          (
                                              IsBlank(Trim(varLogSearch)) ||
                                              Lower(Trim(varLogSearch)) in Lower(Coalesce(prnumber, "")) ||
                                              Lower(Trim(varLogSearch)) in Lower(Coalesce(requester, "")) ||
                                              CountRows(
                                                  Filter(
                                                      colProjectLines,

                        Height: =36
                        Size: =12
                        Text: ="This will permanently remove " & Coalesce(varDeletePR.prnumber, "this PR") & " and its line items."
                        Width: =Parent.Width
                  - log_delete_btns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =42
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - log_delete_cancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(232, 234, 239, 1)
                              BorderThickness: =1
                              Color: =RGBA(22, 39, 63, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(varShowLogDelete, false);
                                Set(varDeletePR, Blank())
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Cancel"
                              Width: =1
                        - log_delete_confirm:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(176, 51, 63, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =RemoveIf('PRTrack - LineItems', pridentifier = varDeletePR.Title);
                                Remove(
                                    'PRTrack - Requisitions',
                                    LookUp('PRTrack - Requisitions', Title = varDeletePR.Title)
                                );
                                RemoveIf(colProjectLines, pridentifier = varDeletePR.Title);
                                RemoveIf(colPermittedLines, pridentifier = varDeletePR.Title);
                                RemoveIf(colProjectPRs, Title = varDeletePR.Title);
                                RemoveIf(colPermittedPRs, Title = varDeletePR.Title);
                                Set(varShowLogDelete, false);
                                Set(varDeletePR, Blank());
                                Notify("PR deleted.", NotificationType.Success)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Delete"
                              Width: =1

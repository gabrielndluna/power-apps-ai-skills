                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =14
                        Text: ="Delete This PR?"
                        Width: =Parent.Width
                  - log_delete_msg:

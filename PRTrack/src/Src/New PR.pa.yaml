                                =If(
                                    IsBlank(Trim(np_add_supplier_input.Text)),
                                    Notify("Enter a supplier name.", NotificationType.Warning),
                                    !IsBlank(LookUp(colSuppliers, Lower(Value) = Lower(Trim(np_add_supplier_input.Text)))),
                                    Notify("That supplier is already in the list.", NotificationType.Information);
                                    Set(varSupplierDefault, LookUp(colSuppliers, Lower(Value) = Lower(Trim(np_add_supplier_input.Text))).Value);

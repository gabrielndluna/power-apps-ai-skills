Screens:
  'New PR':
    Properties:
      Fill: =RGBA(234, 236, 240, 1)
      LoadingSpinnerColor: =RGBA(176, 51, 63, 1)
      OnVisible: |-
        =If(
            CountRows(colDraftLines) = 0,
            ClearCollect(
                colDraftLines,
                {
                    lineid: GUID(),
                    lineno: 1,
                    description: "",
                    uom: "Each",
                    qty: 1,
                    notes: ""
                }
            )
        );
        Set(varSupplierDefault, "No Preference");
        Set(varShowAddSupplier, false);
        Reset(np_supplier)
    Children:
      - np_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =Parent.Width
          Children:
            - np_head:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =72
                  LayoutMinWidth: =0
                  PaddingLeft: =18
                  PaddingRight: =18
                Children:
                  - np_back:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Height: =40
                        Icon: =Icon.BackArrow
                        OnSelect: =Navigate('PR Log', ScreenTransition.Fade)
                        Width: =40
                  - np_head_text:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =180
                      Children:
                        - np_title:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(22, 39, 63, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Size: =18
                              Text: ="New PR"
                              Wrap: =false
                        - np_sub:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(114, 122, 138, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =18
                              Size: =12
                              Text: =Coalesce(varSelectedProject.projectidentifier, "")
                              Wrap: =false
                  - np_cancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(232, 234, 239, 1)
                        Color: =RGBA(28, 35, 51, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate('PR Log', ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Cancel"
                        Width: =100
                  - np_submit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(176, 51, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: |-
                          =If(
                              CountRows(Filter(colDraftLines, !IsBlank(Trim(description)))) = 0,
                              Notify("Add at least one line item with a description.", NotificationType.Error),
                              With(
                                  {
                                      nextNum: CountRows(Filter(colPermittedPRs, projectidentifier = varSelectedProject.projectidentifier)) + 1,
                                      proceedWho: Coalesce(np_proceed.Selected.displayname, User().FullName),
                                      doaWho: Coalesce(np_doa.Selected.displayname, User().FullName)
                                  },
                                  With(
                                      {
                                          prNum: "PR-" & Text(nextNum, "000"),
                                          prId: varSelectedProject.projectidentifier & "-PR-" & Text(nextNum, "000")
                                      },
                                      Patch(
                                          'PRTrack - Requisitions',
                                          Defaults('PRTrack - Requisitions'),
                                          {
                                              Title: prId,
                                              projectidentifier: varSelectedProject.projectidentifier,
                                              prnumber: prNum,
                                              reqtype: { Value: np_reqtype.Selected.Value },
                                              reqdate: np_reqdate.SelectedDate,
                                              requester: Coalesce(np_requester.Text, varCurrentUserName),
                                              requesteremail: varCurrentUserEmail,
                                              phase: { Value: np_phase.Selected.Value },
                                              category: { Value: np_category.Selected.Value },
                                              onsitedate: np_onsite.SelectedDate,
                                              deliveryloc: np_delivery.Text,
                                              priority: { Value: np_priority.Selected.Value },
                                              supplier: { Value: Coalesce(np_supplier.Selected.Value, varSupplierDefault, "No Preference") },
                                              contact: Coalesce(np_contact.Text, varCurrentUserEmail),
                                              proceedapprover: proceedWho,
                                              doaapprover: doaWho,
                                              comments: np_comments.Text,
                                              prstatus: { Value: "Submitted" }
                                          }
                                      );
                                      ForAll(
                                          Filter(colDraftLines, !IsBlank(Trim(description))) As ln,
                                          Patch(
                                              'PRTrack - LineItems',
                                              Defaults('PRTrack - LineItems'),
                                              {
                                                  Title: prId & "-L" & Text(Coalesce(ln.lineno, 1)),
                                                  pridentifier: prId,
                                                  linenumber: Coalesce(ln.lineno, 1),
                                                  description: ln.description,
                                                  uom: { Value: ln.uom },
                                                  qty: ln.qty,
                                                  notes: ln.notes,
                                                  buyer: "Unassigned",
                                                  proceedstatus: { Value: "Pending" },
                                                  proceedapprover: proceedWho,
                                                  doaapprover: doaWho,
                                                  stage: { Value: "Pending proceed" }
                                              }
                                          )
                                      );
                                      Collect(
                                          colPermittedPRs,
                                          LookUp('PRTrack - Requisitions', Title = prId)
                                      );
                                      Collect(
                                          colPermittedLines,
                                          Filter('PRTrack - LineItems', pridentifier = prId)
                                      );
                                      ClearCollect(colProjectPRs, Filter(colPermittedPRs, projectidentifier = varSelectedProject.projectidentifier));
                                      ClearCollect(colProjectLines, Filter(colPermittedLines, StartsWith(pridentifier, varSelectedProject.projectidentifier & "-")));
                                      Set(varSelectedPR, LookUp(colPermittedPRs, Title = prId));
                                      Notify("PR submitted - waiting on approval to proceed.", NotificationType.Success);
                                      Navigate('PR Detail', ScreenTransition.Fade)
                                  )
                              )
                          )
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Submit PR"
                        Width: =130

Screens:
  Settings:
    Properties:
      Fill: =RGBA(234, 236, 240, 1)
      LoadingSpinnerColor: =RGBA(176, 51, 63, 1)
      OnVisible: |-
        =If(
            IsBlank(varSelectedProject) && CountRows(colPermittedProjects) > 0,
            Set(varSelectedProject, First(colPermittedProjects))
        );
        ClearCollect(
            colProjectPermissions,
            Filter('PRTrack - Permissions', Project = varSelectedProject.projectidentifier)
        );
        Set(varSettingsSelectedEmail, "");
        Set(varSettingsSelectedName, "");
        Reset(st_user_search);
        Clear(colUserHits)
    Children:
      - st_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =Parent.Width
          Children:
            - st_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =248
                Children:
                  - st_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =18
                        Text: ="PRTrack"
                        Width: =224
                  - st_brand_sub:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(154, 161, 174, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11
                        Text: ="IOC  Requisitions"
                        Width: =224
                  - st_nav_dash:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate(Dashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Dashboard"
                        Width: =224
                  - st_nav_log:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate('PR Log', ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="PR Log"
                        Width: =224
                  - st_nav_settings:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(176, 51, 63, 1)
                        Fill: =RGBA(248, 235, 237, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Settings"
                        Width: =224
                  - st_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutMinHeight: =20
                        LayoutMinWidth: =0
                  - st_user_name:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =User().FullName
                        Width: =224
            - st_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(234, 236, 240, 1)
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =22
                  PaddingLeft: =26
                  PaddingRight: =26
                  PaddingTop: =22
                Children:
                  - st_page_head:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - st_title:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(22, 39, 63, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =38
                              Size: =22
                              Text: ="People Access"
                  - st_hint:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(114, 122, 138, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =22
                        Size: =13
                        Text: ="Search a person and add them to this project. Admins can also change role and admin rights below."
                  - st_add_card:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =210
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =14
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =14
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Visible: =varIsAdmin
                      Children:
                        - st_add_row:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =96
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - st_f_user:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =2
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - st_l_user:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(114, 122, 138, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                          Size: =11
                                          Text: ="Person"
                                    - st_user_search:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          PressedBorderColor: =RGBA(176, 51, 63, 1)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          HintText: ="Type a name or email, then pick below"
                                          OnChange: |-
                                            =If(
                                                Len(Trim(Self.Text)) < 2,
                                                Clear(colUserHits);
                                                Set(varSettingsSelectedEmail, "");
                                                Set(varSettingsSelectedName, ""),
                                                ClearCollect(
                                                    colUserHits,
                                                    ShowColumns(
                                                        Office365Users.SearchUser(
                                                            {
                                                                searchTerm: Trim(Self.Text),
                                                                top: 15
                                                            }
                                                        ),
                                                        Id,
                                                        DisplayName,
                                                        Mail,
                                                        UserPrincipalName,
                                                        Department
                                                    )
                                                )
                                            )
                                          Size: =12
                                          Width: =Parent.Width
                                    - st_user_pick:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ChevronBackground: =RGBA(255, 255, 255, 1)
                                          ChevronFill: =RGBA(176, 51, 63, 1)
                                          AllowEmptySelection: =true
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Items: =colUserHits
                                          Items.Value: =DisplayName
                                          OnChange: |-
                                            =If(
                                                !IsBlank(Self.Selected),
                                                Set(
                                                    varSettingsSelectedEmail,
                                                    Lower(Coalesce(Self.Selected.Mail, Self.Selected.UserPrincipalName))
                                                );
                                                Set(varSettingsSelectedName, Self.Selected.DisplayName)
                                            )
                                          Size: =12
                                          Width: =Parent.Width
                                          Visible: =CountRows(colUserHits) > 0
                              - st_f_role:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - st_l_role:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(114, 122, 138, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                          Size: =11
                                          Text: ="Role"
                                    - st_role:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ChevronBackground: =RGBA(255, 255, 255, 1)
                                          ChevronFill: =RGBA(176, 51, 63, 1)
                                          AllowEmptySelection: =false
                                          Default: ="Requester"
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Width: =Parent.Width
                                          Items: =["Requester", "Buyer", "Approver", "Viewer"]
                                          Size: =12
                              - st_f_admin:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =120
                                  Children:
                                    - st_l_admin:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(114, 122, 138, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                          Size: =11
                                          Text: ="Admin"
                                    - st_admin:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ChevronBackground: =RGBA(255, 255, 255, 1)
                                          ChevronFill: =RGBA(176, 51, 63, 1)
                                          AllowEmptySelection: =false
                                          Default: ="No"
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Items: =["No", "Yes"]
                                          Size: =12
                                          Width: =120
                        - st_selected_hint:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(114, 122, 138, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =18
                              Size: =11
                              Text: =varSettingsSelectedName & "  |  " & varSettingsSelectedEmail
                              Visible: =!IsBlank(varSettingsSelectedEmail)
                        - st_add_actions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - st_add_spacer:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                              - st_add_cancel:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(232, 234, 239, 1)
                                    Color: =RGBA(28, 35, 51, 1)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =36
                                    OnSelect: =Reset(st_user_search); Set(varSettingsSelectedEmail, ""); Set(varSettingsSelectedName, "")
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Size: =12
                                    Text: ="Cancel"
                                    Width: =90
                              - st_add_save:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(IsBlank(varSettingsSelectedEmail), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(176, 51, 63, 1)
                                    Height: =36
                                    OnSelect: |-
                                      =If(
                                          IsBlank(varSettingsSelectedEmail),
                                          Notify("Select a person first.", NotificationType.Warning),
                                          If(
                                              !IsBlank(
                                                  LookUp(
                                                      colProjectPermissions,
                                                      Lower(Title) = varSettingsSelectedEmail
                                                  )
                                              ),
                                              Notify("Already has access on this project.", NotificationType.Information),
                                              Collect(
                                                  colProjectPermissions,
                                                  Patch(
                                                      'PRTrack - Permissions',
                                                      Defaults('PRTrack - Permissions'),
                                                      {
                                                          Title: varSettingsSelectedEmail,
                                                          displayname: varSettingsSelectedName,
                                                          Project: varSelectedProject.projectidentifier,
                                                          Role: { Value: st_role.Selected.Value },
                                                          Admin: st_admin.Selected.Value = "Yes"
                                                      }
                                                  )
                                              );
                                              Reset(st_user_search);
                                              Clear(colUserHits);
                                              Set(varSettingsSelectedEmail, "");
                                              Set(varSettingsSelectedName, "");
                                              Notify("Added to app.", NotificationType.Success)
                                          )
                                      )
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Size: =12
                                    Text: ="Add User"
                                    Width: =110
                  - st_table:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - st_head:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(250, 251, 252, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =16
                            Children:
                              - st_h1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =10
                                    Text: ="USER"
                              - st_h2:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =10
                                    Text: ="ADMIN"
                                    Width: =100
                              - st_h3:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =10
                                    Text: ="ROLE"
                                    Width: =148
                              - st_h4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =10
                                    Text: =""
                                    Width: =40
                        - st_gallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderThickness: =0
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Items: =colProjectPermissions
                              LayoutMinHeight: =0
                              TemplatePadding: =0
                              TemplateSize: =64
                              Width: =Parent.Width
                            Children:
                              - st_row:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - st_c_user:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =2
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - st_c_name:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(22, 39, 63, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                Size: =13
                                                Text: =ThisItem.displayname
                                                Width: =Parent.Width
                                                Wrap: =false
                                          - st_c_email:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(114, 122, 138, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =16
                                                Size: =11
                                                Text: =ThisItem.Title
                                                Width: =Parent.Width
                                                Wrap: =false
                                    - st_c_admin:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ChevronBackground: =RGBA(255, 255, 255, 1)
                                          ChevronFill: =RGBA(176, 51, 63, 1)
                                          AllowEmptySelection: =false
                                          Default: =If(ThisItem.Admin, "Yes", "No")
                                          DisplayMode: =If(varIsAdmin, DisplayMode.Edit, DisplayMode.View)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =34
                                          Items: =["No", "Yes"]
                                          OnChange: |-
                                            =Patch(
                                                'PRTrack - Permissions',
                                                ThisItem,
                                                { Admin: Self.Selected.Value = "Yes" }
                                            )
                                          Size: =12
                                          Width: =100
                                    - st_c_role:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          BorderColor: =RGBA(232, 234, 239, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(22, 39, 63, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          HoverBorderColor: =RGBA(176, 51, 63, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ChevronBackground: =RGBA(255, 255, 255, 1)
                                          ChevronFill: =RGBA(176, 51, 63, 1)
                                          AllowEmptySelection: =false
                                          Default: =ThisItem.Role.Value
                                          DisplayMode: =If(varIsAdmin, DisplayMode.Edit, DisplayMode.View)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =34
                                          Items: =["Requester", "Buyer", "Approver", "Viewer"]
                                          OnChange: |-
                                            =Patch(
                                                'PRTrack - Permissions',
                                                ThisItem,
                                                { Role: { Value: Self.Selected.Value } }
                                            )
                                          Size: =12
                                          Width: =148
                                    - st_c_del:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Color: =RGBA(154, 161, 174, 1)
                                          FillPortions: =0
                                          Height: =24
                                          Icon: =Icon.Trash
                                          OnSelect: |-
                                            =Remove('PRTrack - Permissions', ThisItem);
                                            Remove(colProjectPermissions, ThisItem)
                                          Visible: =varIsAdmin
                                          Width: =24

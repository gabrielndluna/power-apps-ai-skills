Screens:
  Dashboard:
    Properties:
      Fill: =RGBA(234, 236, 240, 1)
      LoadingSpinnerColor: =RGBA(176, 51, 63, 1)
      OnVisible: |-
        =If(
            IsBlank(varSelectedProject) && CountRows(colPermittedProjects) > 0,
            Set(varSelectedProject, First(colPermittedProjects))
        );
        Set(
            varCurrentRole,
            Coalesce(
                LookUp(colUserPermissions, Project = varSelectedProject.projectidentifier).Role.Value,
                "Viewer"
            )
        );
        ClearCollect(
            colProjectPRs,
            Filter(colPermittedPRs, projectidentifier = varSelectedProject.projectidentifier)
        );
        ClearCollect(
            colProjectLines,
            Filter(colPermittedLines, StartsWith(pridentifier, varSelectedProject.projectidentifier & "-"))
        )
    Children:
      - dash_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =Parent.Width
          Children:
            - dash_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =248
                Children:
                  - dash_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =18
                        Text: ="PRTrack"
                        Width: =224
                  - dash_brand_sub:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(154, 161, 174, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11
                        Text: ="IOC  Requisitions"
                        Width: =224
                  - dash_nav_dash:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(176, 51, 63, 1)
                        Fill: =RGBA(248, 235, 237, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Dashboard"
                        Width: =224
                  - dash_nav_log:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate('PR Log', ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="PR Log (" & CountRows(colPermittedPRs) & ")"
                        Width: =224
                  - dash_nav_settings:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(114, 122, 138, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        OnSelect: =Navigate(Settings, ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="Settings"
                        Visible: =varIsAdmin
                        Width: =224
                  - dash_new_pr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(176, 51, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =42
                        OnSelect: |-
                          =Set(varCreateNonce, varCreateNonce + 1);
                          ClearCollect(
                              colDraftLines,
                              {
                                  lineid: GUID(),
                                  lineno: 1,
                                  description: "",
                                  uom: "Each",
                                  qty: 1,
                                  notes: ""
                              }
                          );
                          Navigate('New PR', ScreenTransition.Fade)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =13
                        Text: ="+  New PR"
                        Visible: =varCurrentRole <> "Viewer"
                        Width: =224
                  - dash_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutMinHeight: =20
                        LayoutMinWidth: =0
                  - dash_user_name:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =12
                        Text: =User().FullName
                        Width: =224
                  - dash_user_role:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(154, 161, 174, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =16
                        Size: =11
                        Text: =Coalesce(varCurrentRole, "Viewer")
                        Width: =224
            - dash_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(234, 236, 240, 1)
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - dash_topbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 0.7)
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        PaddingLeft: =22
                        PaddingRight: =22
                      Children:
                        - dash_proj_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Light
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                              PaddingLeft: =12
                              PaddingRight: =8
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =320
                            Children:
                              - dash_proj_label:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(154, 161, 174, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =10
                                    Text: ="PROJECT"
                                    Width: =68
                              - dash_proj_combo:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AllowEmptySelection: =false
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    ChevronBackground: =RGBA(255, 255, 255, 1)
                                    ChevronFill: =RGBA(176, 51, 63, 1)
                                    Color: =RGBA(28, 35, 51, 1)
                                    Default: =varSelectedProject.projectname
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Items: =colPermittedProjects
                                    Items.Value: =projectname
                                    OnChange: |-
                                      =If(
                                          !IsBlank(Self.Selected),
                                          Set(varSelectedProject, Self.Selected);
                                          Set(
                                              varCurrentRole,
                                              Coalesce(
                                                  LookUp(colUserPermissions, Project = Self.Selected.projectidentifier).Role.Value,
                                                  "Viewer"
                                              )
                                          );
                                          ClearCollect(
                                              colProjectPRs,
                                              Filter(colPermittedPRs, projectidentifier = Self.Selected.projectidentifier)
                                          );
                                          ClearCollect(
                                              colProjectLines,
                                              Filter(colPermittedLines, StartsWith(pridentifier, Self.Selected.projectidentifier & "-"))
                                          );
                                          ClearCollect(
                                              colProjectPermissions,
                                              Filter('PRTrack - Permissions', Project = Self.Selected.projectidentifier)
                                          );
                                          ClearCollect(colApprovers, Filter(colProjectPermissions, Role.Value = "Approver"));
                                          ClearCollect(colBuyers, Filter(colProjectPermissions, Role.Value = "Buyer"))
                                      )
                  - dash_content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =22
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =22
                      Children:
                        - dash_page_head:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - dash_hello:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(22, 39, 63, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =38
                                    Size: =22
                                    Text: ="Hello, " & Left(User().FullName, If(Find(" ", User().FullName) > 0, Find(" ", User().FullName) - 1, Len(User().FullName)))
                        - dash_kpis:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =68
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =68
                              LayoutMinWidth: =0
                            Children:
                              - dash_kpi_proj:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Light
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =52
                                    LayoutMinWidth: =0
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - dash_kpi_proj_ico:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(248, 235, 237, 1)
                                          FillPortions: =0
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =28
                                        Children:
                                          - dash_kpi_proj_icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Color: =RGBA(176, 51, 63, 1)
                                                Height: =16
                                                Icon: =Icon.Folder
                                                Width: =16
                                                X: =6
                                                Y: =6
                                    - dash_kpi_proj_text:
                                        Control: GroupContainer@1.5.0

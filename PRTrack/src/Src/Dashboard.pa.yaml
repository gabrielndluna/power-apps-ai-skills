                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =28
                                                Size: =16
                                                Text: =CountRows(Filter(colPermittedLines, stage.Value = "Pending proceed" || stage.Value = "Pending approval"))
                                                Width: =Parent.Width
                                          - dash_kpi_pend_lab:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(114, 122, 138, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                Size: =10
                                                Text: ="Awaiting Approval"
                                                Width: =Parent.Width
                              - dash_kpi_val:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Light
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =52
                                    LayoutMinWidth: =0
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - dash_kpi_val_ico:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(231, 246, 238, 1)
                                          FillPortions: =0
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =28
                                        Children:
                                          - dash_kpi_val_icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Color: =RGBA(15, 157, 88, 1)
                                                Height: =16

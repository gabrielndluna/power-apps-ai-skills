                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Start
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =44
                                          LayoutMinWidth: =48
                                        Children:
                                          - dash_kpi_proj_val:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(22, 39, 63, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =28
                                                Size: =16
                                                Text: =CountRows(colPermittedProjects)
                                                Width: =Parent.Width
                                          - dash_kpi_proj_lab:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(114, 122, 138, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                Size: =10
                                                Text: ="Active Projects"
                                                Width: =Parent.Width
                              - dash_kpi_prs:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Light
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =52
                                    LayoutMinWidth: =0
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - dash_kpi_prs_ico:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(230, 244, 251, 1)
                                          FillPortions: =0
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =28
                                        Children:
                                          - dash_kpi_prs_icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Color: =RGBA(27, 135, 176, 1)
                                                Height: =16
                                                Icon: =Icon.Text
                                                Width: =16
                                                X: =6
                                                Y: =6
                                    - dash_kpi_prs_text:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Start
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =44
                                          LayoutMinWidth: =48
                                        Children:
                                          - dash_kpi_prs_val:

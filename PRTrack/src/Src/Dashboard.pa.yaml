                                                FontWeight: =FontWeight.Bold
                                                Height: =28
                                                Size: =16
                                                Text: =Text(Sum(Filter(colPermittedLines, LookUp(colPermittedPRs, Title = pridentifier).prstatus.Value <> "Rejected"), quoted), "$#,##0")

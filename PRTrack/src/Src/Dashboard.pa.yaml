                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(253, 243, 226, 1)
                                          FillPortions: =0
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =28
                                        Children:

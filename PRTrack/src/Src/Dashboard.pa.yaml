                                          - dash_kpi_val_lab:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(114, 122, 138, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                Size: =10
                                                Text: ="Open PR Value"
                                                Width: =Parent.Width

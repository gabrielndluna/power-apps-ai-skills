                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                            Children:
                              - dash_tab_appr:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(varDashTab = "approver", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varDashTab = "approver", RGBA(248, 235, 237, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    OnSelect: =Set(varDashTab, "approver")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12

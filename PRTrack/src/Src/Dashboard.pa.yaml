                              - dash_tab_buyer:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(varDashTab = "buyer", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varDashTab = "buyer", RGBA(248, 235, 237, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    OnSelect: =Set(varDashTab, "buyer")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="Procurement Pool"
                              - dash_tab_req:

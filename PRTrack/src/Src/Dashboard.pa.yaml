                                              Properties:
                                                Color: =RGBA(114, 122, 138, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                Size: =10
                                                Text: ="Total Requisitions"
                                                Width: =Parent.Width
                              - dash_kpi_pend:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout

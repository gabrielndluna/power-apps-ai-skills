                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(varDashTab = "requester", RGBA(176, 51, 63, 1), RGBA(114, 122, 138, 1))
                                    Fill: =If(varDashTab = "requester", RGBA(248, 235, 237, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    OnSelect: =Set(varDashTab, "requester")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="My Requests"
                              - dash_tab_spacer:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =8
                              - dash_view_all:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0

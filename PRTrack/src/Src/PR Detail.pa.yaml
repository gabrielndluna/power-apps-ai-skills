                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: |-
                                =Patch(
                                    'PRTrack - LineItems',
                                    Defaults('PRTrack - LineItems'),
                                    {
                                        Title: varSelectedPR.Title & "-L" & Text(CountRows(colPRLines) + 1),
                                        pridentifier: varSelectedPR.Title,
                                        linenumber: CountRows(colPRLines) + 1,
                                        description: "",
                                        uom: { Value: "Each" },
                                        qty: 1,
                                        buyer: "Unassigned",
                                        proceedstatus: { Value: "Pending" },
                                        proceedapprover: varSelectedPR.proceedapprover,
                                        doaapprover: varSelectedPR.doaapprover,
                                        stage: { Value: "Pending proceed" }
                                    }
                                );
                                ClearCollect(colPRLines, Filter('PRTrack - LineItems', pridentifier = varSelectedPR.Title));
                                Set(varDetailTab, "lines");
                                Set(varExpandedLine, Last(SortByColumns(colPRLines, "linenumber", SortOrder.Ascending)).Title);
                                Set(
                                    varPipeIndex,
                                    If(
                                        CountRows(colPRLines) = 0 || Coalesce(varSelectedPR.prstatus.Value, "") = "Draft" || Coalesce(varSelectedPR.prstatus.Value, "") = "On Hold" || CountRows(Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value))) > 0,
                                        0,
                                        CountRows(Filter(colPRLines, stage.Value <> "Rejected")) > 0 && CountRows(Filter(colPRLines, stage.Value <> "Rejected" && stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(Filter(colPRLines, stage.Value <> "Rejected")),
                                        5,
                                        Coalesce(
                                            Min(
                                                AddColumns(
                                                    Filter(
                                                        colPRLines,
                                                        stage.Value <> "Rejected" && stage.Value <> "On hold" && stage.Value <> "Draft" && !IsBlank(stage.Value)
                                                    ),
                                                    pipeIdx,
                                                    Switch(
                                                        stage.Value,
                                                        "Pending proceed", 1,
                                                        "Sourcing", 2,
                                                        "Project control", 3,
                                                        "Pending approval", 4,
                                                        "PO creation", 5,
                                                        "Approved", 5,
                                                        1
                                                    )
                                                ),
                                                pipeIdx
                                            ),
                                            1
                                        )
                                    )
                                );
                                Set(
                                    varPipeAllPo,
                                    CountRows(Filter(colPRLines, stage.Value <> "Rejected")) > 0 && CountRows(Filter(colPRLines, stage.Value <> "Rejected" && stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(Filter(colPRLines, stage.Value <> "Rejected"))
                                );
                                Set(
                                    varPipeReturned,
                                    Coalesce(varSelectedPR.prstatus.Value, "") = "Rejected" || CountRows(colPRLines) > 0 && CountRows(Filter(colPRLines, stage.Value = "Rejected")) = CountRows(colPRLines)

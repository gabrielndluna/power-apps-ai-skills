Screens:
  'PR Detail':
    Properties:
      Fill: =RGBA(234, 236, 240, 1)
      LoadingSpinnerColor: =RGBA(176, 51, 63, 1)
      OnVisible: |-
        =If(
            !IsBlank(varSelectedPR),
            ClearCollect(
                colPRLines,
                Filter(colPermittedLines, pridentifier = varSelectedPR.Title)
            );
            Set(varExpandedLine, Blank());
            Set(varExpandedPcLine, Blank());
            Set(
                varPipeIndex,
                If(
                    CountRows(colPRLines) = 0 || Coalesce(varSelectedPR.prstatus.Value, "") = "Draft" || Coalesce(varSelectedPR.prstatus.Value, "") = "On Hold" || CountRows(Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value))) > 0,
                    0,
                    CountRows(Filter(colPRLines, stage.Value <> "Rejected")) > 0 && CountRows(Filter(colPRLines, stage.Value <> "Rejected" && stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(Filter(colPRLines, stage.Value <> "Rejected")),
                    5,
                    Coalesce(
                        Min(
                            AddColumns(
                                Filter(
                                    colPRLines,
                                    stage.Value <> "Rejected" && stage.Value <> "On hold" && stage.Value <> "Draft" && !IsBlank(stage.Value)
                                ),
                                pipeIdx,
                                Switch(
                                    stage.Value,
                                    "Pending proceed", 1,
                                    "Sourcing", 2,
                                    "Project control", 3,
                                    "Pending approval", 4,
                                    "PO creation", 5,
                                    "Approved", 5,
                                    1
                                )
                            ),
                            pipeIdx
                        ),
                        1
                    )
                )
            );
            Set(
                varPipeAllPo,
                CountRows(Filter(colPRLines, stage.Value <> "Rejected")) > 0 && CountRows(Filter(colPRLines, stage.Value <> "Rejected" && stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(Filter(colPRLines, stage.Value <> "Rejected"))
            );
            Set(
                varPipeReturned,
                Coalesce(varSelectedPR.prstatus.Value, "") = "Rejected" || CountRows(colPRLines) > 0 && CountRows(Filter(colPRLines, stage.Value = "Rejected")) = CountRows(colPRLines)
            );
            If(
                !IsBlank(varSelectedPR.supplier.Value) && IsBlank(LookUp(colSuppliers, Value = varSelectedPR.supplier.Value)),
                Collect(colSuppliers, { Value: varSelectedPR.supplier.Value })
            );
            Set(varShowLineDelete, false);
            Set(varDeleteLine, Blank());
            Set(varAttachName, "");
            Set(
                varIsProceedApprover,
                varIsAdmin || Lower(Coalesce(varSelectedPR.proceedapprover, "")) = Lower(varCurrentUserEmail)
            );
            Set(
                varIsDoaApprover,
                varIsAdmin || Lower(Coalesce(varSelectedPR.doaapprover, "")) = Lower(varCurrentUserEmail)
            );
            Set(
                varDetailTab,
                Switch(
                    varCurrentRole,
                    "Buyer", "lines",
                    "Project Controls", "pc",
                    "Approver", If(CountRows(Filter(colPRLines, stage.Value = "Pending proceed" || stage.Value = "Pending approval")) > 0, "lines", "request"),
                    "request"
                )
            );
            If(
                varOpenAttachOnDetail,
                Set(varShowAttachmentPane, true);
                Set(varOpenAttachOnDetail, false);
                EditForm(frmPRAttachments)
            )
        )

            Height: =Parent.Height
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Visible: =varShowLineDelete
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - pd_line_delete_card:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =168
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =18
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =Min(Parent.Width * 0.9, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - pd_line_delete_title:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(22, 39, 63, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =14
                        Text: ="Delete This Line Item?"
                        Width: =Parent.Width
                  - pd_line_delete_msg:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(114, 122, 138, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =12
                        Text: ="This will permanently remove " & Coalesce(varDeleteLine.description, "this line") & "."
                        Width: =Parent.Width
                  - pd_line_delete_btns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =42
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - pd_line_delete_cancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(232, 234, 239, 1)
                              BorderThickness: =1
                              Color: =RGBA(22, 39, 63, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(varShowLineDelete, false);
                                Set(varDeleteLine, Blank())
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Cancel"
                              Width: =1
                        - pd_line_delete_confirm:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(176, 51, 63, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Remove(
                                    'PRTrack - LineItems',
                                    LookUp('PRTrack - LineItems', Title = varDeleteLine.Title)
                                );
                                RemoveIf(colPRLines, Title = varDeleteLine.Title);
                                RemoveIf(colPermittedLines, Title = varDeleteLine.Title);
                                RemoveIf(colProjectLines, Title = varDeleteLine.Title);
                                If(
                                    varExpandedLine = varDeleteLine.Title,
                                    Set(varExpandedLine, Blank())
                                );
                                If(
                                    varExpandedPcLine = varDeleteLine.Title,
                                    Set(varExpandedPcLine, Blank())
                                );
                                Set(
                                    varPipeIndex,
                                    If(
                                        CountRows(colPRLines) = 0 || Coalesce(varSelectedPR.prstatus.Value, "") = "Draft" || Coalesce(varSelectedPR.prstatus.Value, "") = "On Hold" || CountRows(Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value))) > 0,
                                        0,
                                        CountRows(Filter(colPRLines, stage.Value = "Approved")) = CountRows(colPRLines),
                                        5,
                                        Coalesce(
                                            Min(
                                                AddColumns(
                                                    Filter(
                                                        colPRLines,
                                                        stage.Value <> "Rejected" && stage.Value <> "On hold" && stage.Value <> "Draft" && !IsBlank(stage.Value)
                                                    ),
                                                    pipeIdx,
                                                    Switch(
                                                        stage.Value,
                                                        "Pending proceed", 1,
                                                        "Sourcing", 2,
                                                        "Project control", 3,
                                                        "Pending approval", 4,
                                                        "Approved", 5,
                                                        1
                                                    )
                                                ),
                                                pipeIdx
                                            ),
                                            1
                                        )
                                    )
                                );
                                Set(
                                    varPipeAllPo,
                                    CountRows(colPRLines) > 0 && CountRows(Filter(colPRLines, stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(colPRLines)
                                );
                                Set(
                                    varPipeReturned,
                                    Coalesce(varSelectedPR.prstatus.Value, "") = "Rejected" || CountRows(Filter(colPRLines, stage.Value = "Rejected")) > 0
                                );
                                Set(varShowLineDelete, false);
                                Set(varDeleteLine, Blank());
                                Notify("Line item deleted.", NotificationType.Success)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Delete"
                              Width: =1

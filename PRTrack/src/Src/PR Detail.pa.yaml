                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - pd_add_buyer_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(22, 39, 63, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =14
                        Text: ="Add buyer"
                  - pd_add_buyer_search:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(232, 234, 239, 1)
                        ChevronBackground: =RGBA(255, 255, 255, 1)
                        ChevronFill: =RGBA(176, 51, 63, 1)
                        DisplayFields: =["DisplayName"]
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        InputTextPlaceholder: =""
                        IsSearchable: =true
                        Items: |-
                          =If(
                              !IsBlank(Trim(Self.SearchText)),
                              ShowColumns(
                                  Office365Users.SearchUser(
                                      { searchTerm: Trim(Self.SearchText), top: 15 }
                                  ),
                                  Id, DisplayName, Mail, UserPrincipalName, Department
                              )
                          )
                        OnChange: |-
                          =If(
                              !IsBlank(Self.Selected),
                              Set(varBuyerPickEmail, Lower(Coalesce(Self.Selected.Mail, Self.Selected.UserPrincipalName)));
                              Set(varBuyerPickName, Self.Selected.DisplayName),
                              Set(varBuyerPickEmail, "");
                              Set(varBuyerPickName, "")
                          )
                        SearchFields: =["DisplayName", "Mail"]
                        SelectMultiple: =false
                        Size: =12
                  - pd_add_buyer_btns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - pd_add_buyer_cancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(232, 234, 239, 1)
                              BorderThickness: =1
                              Color: =RGBA(22, 39, 63, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(varShowAddBuyer, false);
                                Reset(pd_add_buyer_search);
                                Set(varBuyerPickEmail, "");
                                Set(varBuyerPickName, "")
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Cancel"
                              Width: =1
                        - pd_add_buyer_save:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(176, 51, 63, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =With(
                                    {
                                        pickEmail: Lower(Coalesce(pd_add_buyer_search.Selected.Mail, pd_add_buyer_search.Selected.UserPrincipalName, varBuyerPickEmail)),
                                        pickName: Coalesce(pd_add_buyer_search.Selected.DisplayName, varBuyerPickName)
                                    },
                                    If(
                                        IsBlank(pickEmail),
                                        Notify("Search and select a person first.", NotificationType.Warning),
                                        With(
                                            {
                                                existing: LookUp(colProjectPermissions, Lower(Title) = pickEmail)
                                            },
                                            If(
                                                !IsBlank(existing),
                                                If(
                                                    existing.Role.Value <> "Buyer",
                                                    Patch('PRTrack - Permissions', existing, { Role: { Value: "Buyer" } });
                                                    Patch(colProjectPermissions, existing, { Role: { Value: "Buyer" } })
                                                );
                                                Collect(colBuyers, LookUp(colProjectPermissions, Lower(Title) = pickEmail));
                                                Collect(colBuyerPick, LookUp(colProjectPermissions, Lower(Title) = pickEmail)),
                                                Collect(
                                                    colProjectPermissions,
                                                    Patch(
                                                        'PRTrack - Permissions',
                                                        Defaults('PRTrack - Permissions'),
                                                        {
                                                            Title: pickEmail,
                                                            displayname: pickName,
                                                            Project: varSelectedProject.projectidentifier,
                                                            Role: { Value: "Buyer" },
                                                            Admin: false
                                                        }
                                                    )
                                                );
                                                Collect(colAllPermissions, LookUp(colProjectPermissions, Lower(Title) = pickEmail));
                                                Collect(colBuyers, LookUp(colProjectPermissions, Lower(Title) = pickEmail));
                                                Collect(colBuyerPick, LookUp(colProjectPermissions, Lower(Title) = pickEmail))
                                            );
                                            If(
                                                !IsBlank(varExpandedLine),
                                                Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = varExpandedLine), { buyer: pickName });
                                                Patch(colPRLines, LookUp(colPRLines, Title = varExpandedLine), { buyer: pickName })
                                            );
                                            Set(varShowAddBuyer, false);
                                            Reset(pd_add_buyer_search);
                                            Set(varBuyerPickEmail, "");
                                            Set(varBuyerPickName, "");
                                            Notify("Buyer added.", NotificationType.Success)
                                        )
                                    )
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Add"
                              Width: =1

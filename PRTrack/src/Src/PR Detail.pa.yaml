                                      =ForAll(
                                          Filter(colPRLines, stage.Value = "Pending proceed" || stage.Value = "Pending approval") As ln,
                                          Patch(
                                              'PRTrack - LineItems',
                                              ln,
                                              {
                                                  stage: { Value: If(ln.stage.Value = "Pending proceed", "Sourcing", "Approved") },
                                                  proceedstatus: { Value: If(ln.stage.Value = "Pending proceed", "Approved", ln.proceedstatus.Value) }
                                              }
                                          )
                                      );
                                      Patch('PRTrack - Requisitions', varSelectedPR, { prstatus: { Value: "Approved" } });
                                      ClearCollect(colPRLines, Filter('PRTrack - LineItems', pridentifier = varSelectedPR.Title));
                                      ClearCollect(colPermittedLines, Filter(colPermittedLines, pridentifier <> varSelectedPR.Title));
                                      Collect(colPermittedLines, colPRLines);

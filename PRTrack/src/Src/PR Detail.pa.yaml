                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Default: =""
                        Height: =36
                        HintText: =""
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                  - pd_add_vendor_btns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - pd_add_vendor_cancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(232, 234, 239, 1)
                              BorderThickness: =1
                              Color: =RGBA(22, 39, 63, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: =Set(varShowAddVendor, false)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Cancel"
                              Width: =1
                        - pd_add_vendor_save:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(176, 51, 63, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(pd_add_vendor_input.Text)),
                                    Notify("Enter a vendor name.", NotificationType.Warning),
                                    !IsBlank(LookUp(colVendors, Lower(Value) = Lower(Trim(pd_add_vendor_input.Text)))),
                                    Notify("That vendor is already in the list.", NotificationType.Information);
                                    If(
                                        !IsBlank(varExpandedLine),
                                        Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = varExpandedLine), { vendor: LookUp(colVendors, Lower(Value) = Lower(Trim(pd_add_vendor_input.Text))).Value });
                                        Patch(colPRLines, LookUp(colPRLines, Title = varExpandedLine), { vendor: LookUp(colVendors, Lower(Value) = Lower(Trim(pd_add_vendor_input.Text))).Value })
                                    );
                                    Set(varShowAddVendor, false),
                                    Collect(colVendors, { Value: Trim(pd_add_vendor_input.Text) });
                                    If(
                                        !IsBlank(LookUp(colSuppliers, Lower(Value) = Lower(Trim(pd_add_vendor_input.Text)))),
                                        true,
                                        Collect(colSuppliers, { Value: Trim(pd_add_vendor_input.Text) })
                                    );
                                    If(
                                        !IsBlank(varExpandedLine),
                                        Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = varExpandedLine), { vendor: Trim(pd_add_vendor_input.Text) });
                                        Patch(colPRLines, LookUp(colPRLines, Title = varExpandedLine), { vendor: Trim(pd_add_vendor_input.Text) })
                                    );
                                    Set(varShowAddVendor, false);
                                    Notify("Vendor added.", NotificationType.Success)
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Add"
                              Width: =1

                                    Width: =148
                              - pd_ab_approve:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(15, 157, 88, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: |-
                                      =If(
                                          Coalesce(varSelectedPR.prstatus.Value, "") = "Draft",
                                          ForAll(
                                              Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value)) As ln,
                                              Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ln.Title), { stage: { Value: "Pending proceed" } })
                                          );
                                          Patch('PRTrack - Requisitions', varSelectedPR, { prstatus: { Value: "Submitted" } });
                                          Notify("PR submitted - waiting on approval to proceed.", NotificationType.Success),
                                          If(
                                              CountRows(Filter(colPRLines, stage.Value = "Pending proceed")) > 0 && varIsProceedApprover,
                                              ForAll(
                                                  Filter(colPRLines, stage.Value = "Pending proceed") As ln,
                                                  Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ln.Title), { stage: { Value: "Sourcing" }, proceedstatus: { Value: "Approved" } })
                                              );
                                              Patch('PRTrack - Requisitions', varSelectedPR, { prstatus: { Value: "In procurement" } });
                                              Notify("Lines approved to proceed.", NotificationType.Success),
                                              If(
                                                  CountRows(Filter(colPRLines, stage.Value = "Pending approval")) > 0 && varIsDoaApprover,
                                                  ForAll(
                                                      Filter(colPRLines, stage.Value = "Pending approval") As ln,
                                                      Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ln.Title), { stage: { Value: "PO creation" } })
                                                  );
                                                  Patch('PRTrack - Requisitions', varSelectedPR, { prstatus: { Value: "Pending PO" } });
                                                  Notify("DOA approved. Buyer can enter the SAP PO number.", NotificationType.Success),
                                                  false
                                              )
                                          )
                                      );
                                      ClearCollect(colPRLines, Filter('PRTrack - LineItems', pridentifier = varSelectedPR.Title));
                                      ClearCollect(colPermittedLines, Filter(colPermittedLines, pridentifier <> varSelectedPR.Title));
                                      Collect(colPermittedLines, colPRLines);
                                      Set(varSelectedPR, LookUp('PRTrack - Requisitions', Title = varSelectedPR.Title))

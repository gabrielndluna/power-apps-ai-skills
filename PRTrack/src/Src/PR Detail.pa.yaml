                                                      FillPortions: =0
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      OnSelect: |-
                                                        =If(
                                                            ThisItem.stage.Value = "Pending proceed",
                                                            Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ThisItem.Title), { stage: { Value: "Sourcing" }, proceedstatus: { Value: "Approved" } }),
                                                            If(
                                                                ThisItem.stage.Value = "Sourcing",
                                                                Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ThisItem.Title), { stage: { Value: "Project control" } }),
                                                                If(
                                                                    ThisItem.stage.Value = "Project control",
                                                                    Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ThisItem.Title), { stage: { Value: "Pending approval" } }),
                                                                    If(
                                                                        ThisItem.stage.Value = "Pending approval",
                                                                        Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ThisItem.Title), { stage: { Value: "Approved" } }),
                                                                        false
                                                                    )
                                                                )
                                                            )
                                                        );
                                                        ClearCollect(colPRLines, Filter('PRTrack - LineItems', pridentifier = varSelectedPR.Title));
                                                        Set(
                                                            varPipeIndex,
                                                            If(
                                                                CountRows(colPRLines) = 0 || Coalesce(varSelectedPR.prstatus.Value, "") = "Draft" || Coalesce(varSelectedPR.prstatus.Value, "") = "On Hold" || CountRows(Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value))) > 0,
                                                                0,
                                                                CountRows(Filter(colPRLines, stage.Value = "Approved")) = CountRows(colPRLines),
                                                                5,
                                                                Coalesce(
                                                                    Min(
                                                                        AddColumns(
                                                                            Filter(
                                                                                colPRLines,
                                                                                stage.Value <> "Rejected" && stage.Value <> "On hold" && stage.Value <> "Draft" && !IsBlank(stage.Value)
                                                                            ),
                                                                            pipeIdx,
                                                                            Switch(
                                                                                stage.Value,
                                                                                "Pending proceed", 1,
                                                                                "Sourcing", 2,
                                                                                "Project control", 3,
                                                                                "Pending approval", 4,
                                                                                "Approved", 5,
                                                                                1
                                                                            )
                                                                        ),
                                                                        pipeIdx
                                                                    ),
                                                                    1
                                                                )
                                                            )
                                                        );
                                                        Set(
                                                            varPipeAllPo,
                                                            CountRows(colPRLines) > 0 && CountRows(Filter(colPRLines, stage.Value = "Approved" && !IsBlank(ponumber))) = CountRows(colPRLines)
                                                        );
                                                        Set(
                                                            varPipeReturned,
                                                            Coalesce(varSelectedPR.prstatus.Value, "") = "Rejected" || CountRows(Filter(colPRLines, stage.Value = "Rejected")) > 0
                                                        )

                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: |-
                                      =If(
                                          CountRows(Filter(colPRLines, stage.Value = "Pending proceed")) > 0 && varIsProceedApprover,
                                          ForAll(
                                              Filter(colPRLines, stage.Value = "Pending proceed") As ln,
                                              Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ln.Title), { stage: { Value: "Rejected" }, proceedstatus: { Value: "Rejected" } })
                                          ),
                                          If(
                                              CountRows(Filter(colPRLines, stage.Value = "Pending approval")) > 0 && varIsDoaApprover,
                                              ForAll(
                                                  Filter(colPRLines, stage.Value = "Pending approval") As ln,
                                                  Patch('PRTrack - LineItems', LookUp('PRTrack - LineItems', Title = ln.Title), { stage: { Value: "Rejected" } })
                                              ),
                                              false
                                          )
                                      );
                                      ClearCollect(colPRLines, Filter('PRTrack - LineItems', pridentifier = varSelectedPR.Title));
                                      ClearCollect(colPermittedLines, Filter(colPermittedLines, pridentifier <> varSelectedPR.Title));
                                      Collect(colPermittedLines, colPRLines);
                                      If(
                                          CountRows(Filter(colPRLines, stage.Value <> "Rejected")) = 0,
                                          Patch('PRTrack - Requisitions', varSelectedPR, { prstatus: { Value: "Rejected" } }),
                                          true
                                      );

                                  Control: Label@2.5.1
                                  Properties:
                                    Color: |-
                                      =Switch(
                                          If(
                                              Coalesce(varSelectedPR.prstatus.Value, "") = "Rejected" || CountRows(Filter(colPRLines, stage.Value = "Rejected")) > 0,
                                              "Rejected",
                                              Coalesce(varSelectedPR.prstatus.Value, "") = "Draft" || Coalesce(varSelectedPR.prstatus.Value, "") = "On Hold" || CountRows(Filter(colPRLines, stage.Value = "Draft" || IsBlank(stage.Value))) > 0,
                                              "Draft",
                                              CountRows(colPRLines) > 0 && CountRows(Filter(colPRLines, stage.Value = "Approved")) = CountRows(colPRLines),
                                              "PO created in SAP",
                                              Switch(
                                                  varPipeIndex,
                                                  1, "Approval to Proceed",
                                                  2, "Procurement",
                                                  3, "Project Controls",
                                                  4, "DOA Approval",
                                                  5, "PO created in SAP",
                                                  Switch(varSelectedPR.prstatus.Value, "Submitted", "Approval to Proceed", "In procurement", "Procurement", "Approved", "PO created in SAP", "Draft")
                                              )
                                          ),
                                          "PO created in SAP", RGBA(15, 157, 88, 1),
                                          "Rejected", RGBA(209, 52, 74, 1),
                                          "Approval to Proceed", RGBA(183, 121, 31, 1),
                                          "DOA Approval", RGBA(183, 121, 31, 1),

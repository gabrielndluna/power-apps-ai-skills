App:
  Properties:
    OnStart: |-
      =      Set(varCurrentUserEmail, User().Email);
      Set(varCurrentUserName, User().FullName);
      Set(varSelectedProject, { projectidentifier: "", projectname: "" });
      Set(varPRFilter, "all");
      Set(varDashTab, "approver");
      Set(varDetailTab, "request");
      Set(varLogSearch, "");
      Set(varIsAdmin, false);
      Set(varCurrentRole, "Viewer");
      Set(varCreateNonce, 1);
      Set(varExpandedLine, Blank());
      Set(varExpandedPcLine, Blank());
      Set(varPipeIndex, 0);
      Set(varPipeAllPo, false);
      Set(varPipeReturned, false);
      Set(varSettingsSelectedEmail, "");
      Set(varSettingsSelectedName, "");
      Set(varRuleSelectedEmail, "");
      Set(varRuleSelectedName, "");
      Set(varShowLogDelete, false);
      Set(varSkipGalleryNav, false);
      Set(varDeletePR, Blank());
      Set(varShowLineDelete, false);
      Set(varDeleteLine, Blank());
      Set(varShowAddSupplier, false);
      Set(varShowAddVendor, false);
      Set(varShowAddBuyer, false);
      Set(varBuyerPickEmail, "");
      Set(varBuyerPickName, "");
      Set(varSupplierDefault, "No Preference");
      Set(varIsProceedApprover, false);
      Set(varIsDoaApprover, false);
      Set(varAttachName, "");
      Set(varShowAttachmentPane, false);
      Set(varOpenAttachOnDetail, false);
      Set(varNewProceedEmail, "");
      Set(varNewProceedName, "");
      Set(varNewDoaEmail, "");
      Set(varNewDoaName, "");

      ClearCollect(
          colUserPermissions,
          Filter('PRTrack - Permissions', Title = varCurrentUserEmail)
      );
      If(
          CountRows(colUserPermissions) = 0,
          ClearCollect(
              colUserPermissions,
              Filter('PRTrack - Permissions', Title = Lower(varCurrentUserEmail))
          )
      );

      Set(
          varIsAdmin,
          !IsBlank(LookUp(colUserPermissions, Admin = true))
      );

      ClearCollect(colPermittedProjects, { projectidentifier: "", projectname: "" });
      Clear(colPermittedProjects);
      ForAll(
          colUserPermissions As perm,
          If(
              !IsBlank(perm.Project) && CountRows(Filter(colPermittedProjects, projectidentifier = perm.Project)) = 0,
              Collect(
                  colPermittedProjects,
                  {
                      projectidentifier: perm.Project,
                      projectname: perm.Project
                  }
              )
          )
      );

      If(
          CountRows(colPermittedProjects) > 0,
          Set(varSelectedProject, First(colPermittedProjects))
      );

      Set(
          varCurrentRole,
          Coalesce(
              LookUp(colUserPermissions, Project = varSelectedProject.projectidentifier).Role.Value,
              "Viewer"
          )
      );
      Set(
          varDashTab,
          Switch(
              varCurrentRole,
              "Approver", "approver",
              "Buyer", "buyer",
              "Project Controls", "pc",
              "requester"
          )
      );

      ClearCollect(
          colPermittedPRs,
          {
              Title: "",
              projectidentifier: "",
              prnumber: "",
              reqtype: { Value: "" },
              reqdate: Today(),
              requester: "",
              requesteremail: "",
              phase: { Value: "" },
              category: { Value: "" },
              onsitedate: Today(),
              deliveryloc: "",
              priority: { Value: "" },
              supplier: { Value: "" },
              contact: "",
              proceedapprover: "",
              doaapprover: "",
              comments: "",
              prstatus: { Value: "" }
          }
      );
      Set(varSelectedPR, First(colPermittedPRs));
      Clear(colPermittedPRs);
      ForAll(
          colPermittedProjects As p,
          Collect(
              colPermittedPRs,
              Filter(
                  'PRTrack - Requisitions',
                  projectidentifier = p.projectidentifier
              )
          )
      );

      ClearCollect(
          colPermittedLines,
          {
              Title: "",
              pridentifier: "",
              linenumber: 0,
              description: "",
              uom: { Value: "" },
              qty: 0,
              notes: "",
              buyer: "",
              vendor: "",
              podesc: "",
              quoted: 0,
              ponumber: "",
              sourcing: { Value: "" },
              leadtime: "",
              expdelivery: Today(),
              nwacode: "",
              nwaname: "",
              cbsnumber: "",
              cbsname: "",
              origbudget: 0,
              rembudget: 0,
              budgetstatus: { Value: "" },
              pcnotes: "",
              proceedstatus: { Value: "" },
              proceedapprover: "",
              proceedcomment: "",
              stage: { Value: "" },
              doaapprover: "",
              doacomment: ""
          }
      );
      Clear(colPermittedLines);
      ForAll(
          colPermittedPRs As pr,
          If(
              !IsBlank(pr.Title),
              Collect(
                  colPermittedLines,
                  Filter(
                      'PRTrack - LineItems',
                      pridentifier = pr.Title
                  )
              )
          )
      );

      ClearCollect(
          colAllPermissions,
          {
              ID: 0,
              Title: "",
              Project: "",
              displayname: "",
              Role: { Value: "" },
              Admin: false
          }
      );
      Clear(colAllPermissions);
      ForAll(
          colPermittedProjects As p,
          Collect(
              colAllPermissions,
              Filter('PRTrack - Permissions', Project = p.projectidentifier)
          )
      );

      ClearCollect(
          colAllApproverRules,
          {
              ID: 0,
              Project: "",
              RuleType: { Value: "" },
              Category: "",
              approvername: "",
              approveremail: "",
              minamount: 0
          }
      );
      Clear(colAllApproverRules);
      ForAll(
          colPermittedProjects As p,
          Collect(
              colAllApproverRules,
              Filter('PRTrack - ApproverRules', Project = p.projectidentifier)
          )
      );

      ClearCollect(
          colAllNWA,
          {
              ID: 0,
              Project: "",
              Title: "",
              nwacode: "",
              nwaname: ""
          }
      );
      Clear(colAllNWA);
      ForAll(
          colPermittedProjects As p,
          Collect(
              colAllNWA,
              Filter('PRTrack - NWA', Project = p.projectidentifier)
          )
      );

      ClearCollect(
          colAllAttachments,
          {
              ID: 0,
              Title: "",
              parenttype: { Value: "" },
              parentid: "",
              category: { Value: "" }
          }
      );
      Clear(colAllAttachments);
      ForAll(
          colPermittedPRs As pr,
          If(
              !IsBlank(pr.Title),
              Collect(
                  colAllAttachments,
                  Filter('PRTrack - Attachments', parentid = pr.Title)
              )
          )
      );

      ClearCollect(
          colProjectPRs,
          Filter(colPermittedPRs, projectidentifier = varSelectedProject.projectidentifier)
      );
      ClearCollect(
          colProjectLines,
          Filter(colPermittedLines, pridentifier in colProjectPRs.Title)
      );
      ClearCollect(
          colProjectPermissions,
          Filter(colAllPermissions, Project = varSelectedProject.projectidentifier)
      );
      ClearCollect(
          colApprovers,
          Filter(colProjectPermissions, Role.Value = "Approver")
      );
      ClearCollect(
          colBuyers,
          Filter(colProjectPermissions, Role.Value = "Buyer")
      );
      ClearCollect(colBuyerPick, { displayname: "Unassigned" });
      Collect(colBuyerPick, colBuyers);
      ClearCollect(
          colApproverRules,
          Filter(colAllApproverRules, Project = varSelectedProject.projectidentifier)
      );
      ClearCollect(
          colNWA,
          Filter(colAllNWA, Project = varSelectedProject.projectidentifier)
      );
      ClearCollect(
          colAttachments,
          Filter(colAllAttachments, parentid in colProjectPRs.Title)
      );
      ClearCollect(colSuppliers, { Value: "No Preference" });
      Collect(
          colSuppliers,
          Filter(
              Distinct(colPermittedPRs, supplier.Value),
              !IsBlank(Value) && Value <> "No Preference" && Value <> "Suggested supplier"
          )
      );
      ClearCollect(
          colVendors,
          Filter(Distinct(colPermittedLines, vendor), !IsBlank(Value))
      );
      ForAll(
          Filter(colSuppliers, !IsBlank(Value) && Value <> "No Preference") As s,
          If(
              CountRows(Filter(colVendors, Value = s.Value)) = 0,
              Collect(colVendors, { Value: s.Value })
          )
      );
      If(
          CountRows(colVendors) = 0,
          Collect(colVendors, { Value: "No Preference" })
      );
      ClearCollect(
          colUserHits,
          {
              Id: "",
              DisplayName: "",
              Mail: "",
              UserPrincipalName: "",
              Department: ""
          }
      );
      Clear(colUserHits);
      ClearCollect(
          colRuleHits,
          {
              Id: "",
              DisplayName: "",
              Mail: "",
              UserPrincipalName: "",
              Department: ""
          }
      );
      Clear(colRuleHits);
      ClearCollect(
          colDraftLines,
          {
              lineid: GUID(),
              lineno: 1,
              description: "",
              uom: "Each",
              qty: 1,
              notes: ""
          }
      );
    StartScreen: =Dashboard
    Theme: =PowerAppsTheme

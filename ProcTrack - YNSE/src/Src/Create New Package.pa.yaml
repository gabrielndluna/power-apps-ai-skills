                        AlignInContainer: =AlignInContainer.Stretch
                        ArrowVisible: =false
                        Fill: |
                          =Color.White
                        Height: =60
                        Icon: =Icon.Add
                        IconVisible: =false
                        LayoutMinHeight: =0
                        OnPressAction: "=// ── Validation ────────────────────────────────────────────────────────────────\r\nIf(\r\n    IsBlank(current_project_selected.Selected.projectidentifier) Or\r\n    IsBlank(bop_site_location_input.Text) Or\r\n    (varProcText <> \"Yes\" && IsBlank(varProcLead.UserPrincipalName)) Or\r\n    (varProcText = \"Yes\" && IsBlank(procurement_lead_input_txt.Text)) Or\r\n    (varOpsText <> \"Yes\" && IsBlank(varOpsLead.UserPrincipalName)) Or\r\n    (varOpsText = \"Yes\" && IsBlank(operations_lead_input_txt.Text)) Or\r\n    IsBlank(package_bundle_input.Selected.Value) Or\r\n    IsBlank(ras_input.SelectedDate),\r\n\r\n    // ── Show validation errors ───────────────────────────────────────────────\r\n    UpdateContext({varShowValidationErrors: true});\r\n    Notify(\"Please fill out all required fields before submitting.\", NotificationType.Error),\r\n\r\n    // ── Validation passed - proceed with save ────────────────────────────────\r\n    UpdateContext({varShowValidationErrors: false});\r\n    \r\n    // ── Patch to Sharepoint ──────────────────────────────────────────────────\r\n    IfError(\r\n        With(\r\n            {\r\n                newRecord: Patch(\r\n                    'ProcTrack - Packages',\r\n                    Defaults('ProcTrack - Packages'),\r\n                    {\r\n                        Title:                              GUID(),\r\n                        packageidentifier:                  GUID(),\r\n                        ProjectID: current_project_selected.Selected.projectid,\r\n                                    projectidentifier:                  current_project_selected.Selected.projectidentifier,\r\n                        packagedescription:                 package_description_input_1.Text,\r\n                        itemnumber:                         item_no_input.Text,\r\n                        prerequisitedesigndeliverable:      \"\",\r\n                        qualityprogram:                     \"\",\r\n                        bopsite:                            bop_site_location_input.Text,\r\n                        contracttype:                       If(!IsBlank(contract_type_input.Selected.Value), contract_type_input.Selected.Value, \"\"),\r\n                        procpackageleadname:                If(varProcText = \"Yes\", procurement_lead_input_txt.Text, Coalesce(varProcLead.DisplayName, \"\")),\r\n                        procurementpackageleadid:           If(varProcText = \"Yes\", \"\", Coalesce(varProcLead.UserPrincipalName, \"\")),\r\n                        opspackageleadname:                 If(varOpsText = \"Yes\", operations_lead_input_txt.Text, Coalesce(varOpsLead.DisplayName, \"\")),\r\n                        operationspackageleadid:            If(varOpsText = \"Yes\", \"\", Coalesce(varOpsLead.UserPrincipalName, \"\")),\r\n                        engineeringcontactname:             If(varTechText = \"Yes\", technical_lead_input_txt.Text, Coalesce(varTechLead.DisplayName, \"\")),\r\n                        engineeringcontactid:               If(varTechText = \"Yes\", \"\", Coalesce(varTechLead.UserPrincipalName, \"\")),\r\n                        operationspackagebundle:            Coalesce(package_bundle_input.Selected.Value, \"\"),\r\n                        requiredatsitedate:                 ras_input.SelectedDate,\r\n                        ras_original_input:                 ras_input.SelectedDate,\r\n                        plannedawarddate:                   p6_planned_award_input.SelectedDate,\r\n                        budgetamount:                       If(!IsBlank(est_budget_input.Text), Value(est_budget_input.Text), Blank()),\r\n                        mplcode:                            Coalesce(mpl_input.Selected.Value, \"\"),\r\n                        sole_source:                        \"No\",\r\n                        archived:                           false,\r\n\r\n                        // Durations\r\n                        leadtimesowtorfqissuedays:          15,\r\n                        leadtimerfqissuetoclosingdays:      30,\r\n                        leadtimeclosingtoevaluationdays:    30,\r\n                        leadtimeevaluationtoawarddays:      30,\r\n                        standardleadtimemonths:             30,\r\n\r\n                        // Original planned dates (backward from RAS)\r\n                        originalplannedsowdate:             DateAdd(ras_input.SelectedDate, -135, TimeUnit.Days),\r\n                        originalplannedrfqissuedate:        DateAdd(ras_input.SelectedDate, -120, TimeUnit.Days),\r\n                        originalplannedrfqclosingdate:      DateAdd(ras_input.SelectedDate, -90, TimeUnit.Days),\r\n                        originalplannedevaluationcompleti:  DateAdd(ras_input.SelectedDate, -60, TimeUnit.Days),\r\n                        originalplannedawarddate:           DateAdd(ras_input.SelectedDate, -30, TimeUnit.Days),\r\n\r\n                        // Revised planned dates (initialized equal to original planned)\r\n                        revisedplannedsowdate:              DateAdd(ras_input.SelectedDate, -135, TimeUnit.Days),\r\n                        revisedplannedrfqissuedate:         DateAdd(ras_input.SelectedDate, -120, TimeUnit.Days),\r\n                        revisedplannedrfqclosingdate:       DateAdd(ras_input.SelectedDate, -90, TimeUnit.Days),\r\n                        revisedplannedevaluationcompletio:  DateAdd(ras_input.SelectedDate, -60, TimeUnit.Days),\r\n                        revisedplannedawarddate:            DateAdd(ras_input.SelectedDate, -30, TimeUnit.Days)\r\n                    }\r\n                )\r\n            },\r\n\r\n            // ── Patch succeeded — build collection and navigate ─────────────\r\n            ClearCollect(\r\n                colPackageDetails,\r\n                {\r\n                    title:                              newRecord.Title,\r\n                    packageidentifier:                  newRecord.packageidentifier,\r\n                    projectidentifier:                  newRecord.projectidentifier,\r\n                    itemnumber:                         newRecord.itemnumber,\r\n                    archived:                           false,\r\n                    packagedescription:                 newRecord.packagedescription,\r\n                    packagetype:                        newRecord.packagetype,\r\n                    contracttype:                       newRecord.contracttype,\r\n                    qualityprogram:                     newRecord.qualityprogram,\r\n                    prerequisitedesigndeliverable:      newRecord.prerequisitedesigndeliverable,\r\n                    bopsite:                            newRecord.bopsite,\r\n                    mplcode:                            newRecord.mplcode,\r\n                    Created:                            newRecord.Created,\r\n                    comments:                           newRecord.comments,\r\n                    sole_source:                        newRecord.sole_source,\r\n\r\n                    procpackageleadname:                newRecord.procpackageleadname,\r\n                    procurementpackageleadid:           newRecord.procurementpackageleadid,\r\n                    opspackageleadname:                 newRecord.opspackageleadname,\r\n                    operationspackageleadid:            newRecord.operationspackageleadid,\r\n                    engineeringcontactid:               newRecord.engineeringcontactid,\r\n                    engineeringcontactname:             newRecord.engineeringcontactname,\r\n                    operationspackagebundle:            newRecord.operationspackagebundle,\r\n\r\n                    leadtimesowtorfqissuedays:          newRecord.leadtimesowtorfqissuedays,\r\n                    leadtimerfqissuetoclosingdays:      newRecord.leadtimerfqissuetoclosingdays,\r\n                    leadtimeclosingtoevaluationdays:    newRecord.leadtimeclosingtoevaluationdays,\r\n                    leadtimeevaluationtoawarddays:      newRecord.leadtimeevaluationtoawarddays,\r\n                    standardleadtimemonths:             newRecord.standardleadtimemonths,\r\n\r\n                    originalplannedsowdate:             newRecord.originalplannedsowdate,\r\n                    originalplannedrfqissuedate:        newRecord.originalplannedrfqissuedate,\r\n                    originalplannedrfqclosingdate:      newRecord.originalplannedrfqclosingdate,\r\n                    originalplannedevaluationcompleti:  newRecord.originalplannedevaluationcompleti,\r\n                    originalplannedawarddate:           newRecord.originalplannedawarddate,\r\n                    plannedawarddate:                   newRecord.plannedawarddate,\r\n                    requiredatsitedate:                 newRecord.requiredatsitedate,\r\n                    ras_original_input:                 newRecord.ras_original_input,\r\n\r\n                    actualsowdate:                      newRecord.actualsowdate,\r\n                    actualrfqissuedate:                 newRecord.actualrfqissuedate,\r\n                    actualrfqclosingdate:               newRecord.actualrfqclosingdate,\r\n                    actualevaluationcompletiondate:     newRecord.actualevaluationcompletiondate,\r\n                    actualawarddate:                    newRecord.actualawarddate,\r\n\r\n                    revisedplannedsowdate:              newRecord.revisedplannedsowdate,\r\n                    revisedplannedrfqissuedate:         newRecord.revisedplannedrfqissuedate,\r\n                    revisedplannedrfqclosingdate:       newRecord.revisedplannedrfqclosingdate,\r\n                    revisedplannedevaluationcompletio:  newRecord.revisedplannedevaluationcompletio,\r\n                    revisedplannedawarddate:            newRecord.revisedplannedawarddate,\r\n\r\n                    subcontractorname:                  newRecord.subcontractorname,\r\n                    purchaseordernumber:                newRecord.purchaseordernumber,\r\n                    awardvalue:                         newRecord.awardvalue,\r\n                    indigenous_award:                   newRecord.indigenous_award,\r\n                    ontario_award:                      newRecord.ontario_award,\r\n                    budgetamount:                       newRecord.budgetamount,\r\n                    buybackresaletarget:                newRecord.buybackresaletarget\r\n                }\r\n            );\r\n            \r\n            // ── Clear variables and navigate ─────────────────────────────────\r\n            UpdateContext({varFormattedNumber: \"\"});\r\n            Collect(colPermittedPackages, newRecord); Collect(colProjectPackages, newRecord); Navigate('Package Details', ScreenTransition.Fade)\r\n        ),\r\n\r\n        // ── Patch failed ─────────────────────────────────────────────────────\r\n        Notify(\"Something went wrong saving the record. Please try again.\", NotificationType.Error)\r\n    )\r\n)"
                        Text: ="Add Package"
                        TextSize: =12
                        Width: =220

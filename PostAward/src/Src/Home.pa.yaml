Screens:
  Home:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varShowSettings, false);
        If(
            IsBlank(varSelectedProject) && CountRows(colPermittedProjects) > 0,
            Set(varSelectedProject, First(colPermittedProjects))
        );
        If(
            !IsBlank(varSelectedProject),
            Set(
                varCanEditCurrentProject,
                !IsBlank(
                    LookUp(
                        colUserPermissions,
                        Project = varSelectedProject.projectidentifier && Edit_allowed = "yes"
                    )
                )
            );
            ClearCollect(
                colProjectSubcontracts,
                Filter(
                    'PostAward - Subcontracts',
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colProjectChanges,
                Filter(
                    'PostAward - Changes',
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colProjectPackages,
                Filter(
                    colPermittedPackages,
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colRegisterView,
                ForAll(
                    colProjectSubcontracts As s,
                    With(
                        {
                            approvedSum: Coalesce(
                                Sum(
                                    AddColumns(
                                        Filter(
                                            colProjectChanges,
                                            subcontractid = s.packageidentifier && status.Value = "Approved"
                                        ),
                                        _amt,
                                        Coalesce(finalvalue, value)
                                    ),
                                    _amt
                                ),
                                0
                            ),
                            pendingSum: Coalesce(
                                Sum(
                                    AddColumns(
                                        Filter(
                                            colProjectChanges,
                                            subcontractid = s.packageidentifier && status.Value = "Pending"
                                        ),
                                        _amt,
                                        Coalesce(finalvalue, value)
                                    ),
                                    _amt
                                ),
                                0
                            ),
                            potentialSum: Coalesce(
                                Sum(
                                    AddColumns(
                                        Filter(
                                            colProjectChanges,
                                            subcontractid = s.packageidentifier && status.Value = "Potential"
                                        ),
                                        _amt,
                                        Coalesce(finalvalue, value)
                                    ),
                                    _amt
                                ),
                                0
                            )
                        },
                        {
                            ID: s.ID,
                            packageidentifier: s.packageidentifier,
                            subcontractnumber: s.subcontractnumber,
                            ponumber: s.ponumber,
                            vendor: s.vendor,
                            scope: s.scope,
                            bundle: s.bundle,
                            contracttype: s.contracttype,
                            originalvalue: Coalesce(s.originalvalue, 0),
                            invoicedtodate: Coalesce(s.invoicedtodate, 0),
                            responsibleca: s.responsibleca,
                            backupca: s.backupca,
                            currentlyactive: s.currentlyactive,
                            holdback: s.holdback,
                            closeoutstatus: s.closeoutstatus,
                            startdate: s.startdate,
                            completiondate: s.completiondate,
                            projectidentifier: s.projectidentifier,
                            apprCO: approvedSum,
                            currentValue: Coalesce(s.originalvalue, 0) + approvedSum,
                            futureLiab: pendingSum + potentialSum,
                            eac: Coalesce(s.originalvalue, 0) + approvedSum + pendingSum + potentialSum,
                            isOver: Coalesce(s.invoicedtodate, 0) > (Coalesce(s.originalvalue, 0) + approvedSum),
                            isClosed: s.closeoutstatus.Value = "Closed",
                            changeCount: CountRows(
                                Filter(colProjectChanges, subcontractid = s.packageidentifier)
                            )
                        }
                    )
                )
            );
            Set(varHomeSubCount, CountRows(colRegisterView));
            Set(varHomeActive, CountRows(Filter(colRegisterView, !isClosed && !isOver)));
            Set(varHomeOver, CountRows(Filter(colRegisterView, isOver && !isClosed)));
            Set(varHomeClosed, CountRows(Filter(colRegisterView, isClosed)));
            Set(varHomeOriginal, Coalesce(Sum(colRegisterView, originalvalue), 0));
            Set(varHomeCurrent, Coalesce(Sum(colRegisterView, currentValue), 0));
            Set(varHomeFuture, Coalesce(Sum(colRegisterView, futureLiab), 0));
            Set(varHomeEac, Coalesce(Sum(colRegisterView, eac), 0));
            Set(varHomePendingChg, CountRows(Filter(colProjectChanges, status.Value = "Pending")));
            Set(varHomePotentialChg, CountRows(Filter(colProjectChanges, status.Value = "Potential")));
            Set(
                varHomePctComplete,
                If(
                    varHomeCurrent <= 0,
                    0,
                    Min(
                        100,
                        Round(
                            Coalesce(Sum(colRegisterView, invoicedtodate), 0) / varHomeCurrent * 100,
                            0
                        )
                    )
                )
            );
            ClearCollect(
                colHomeAttention,
                Filter(colRegisterView, isOver && !isClosed)
            );
            ClearCollect(
                colHomePendingChanges,
                FirstN(
                    Sort(
                        Filter(colProjectChanges, status.Value = "Pending" || status.Value = "Potential"),
                        changedate,
                        SortOrder.Descending
                    ),
                    8
                )
            )
        )

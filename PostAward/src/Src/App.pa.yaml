App:
  Properties:
    OnStart: |-
      =Set(varCurrentUserEmail, User().Email);
      Set(varCanEditCurrentProject, false);
      Set(varSelectedProject, Blank());
      Set(varSelectedSubcontract, Blank());
      Set(varRegisterFilter, "all");
      Set(varSearchCA, "");
      Set(varSearchVendor, "");
      Set(varSearchSub, "");
      Set(varSortColumn, "subcontractnumber");
      Set(varSortAscending, true);
      Set(varShowAddSub, false);
      Set(varShowSettings, false);
      Set(varShowAddChange, false);
      Set(varEditingChange, Blank());
      Set(varShowValidationErrors, false);
      Set(varCaFreeText, false);
      Set(varBackupCaFreeText, false);
      Set(
          varSubcontractsListUrl,
          "https://aecon1.sharepoint.com/sites/CivilPlanningteam/Lists/PostAward%20-%20Subcontracts/AllItems.aspx"
      );

      ClearCollect(
          colUserPermissions,
          Filter('ProcTrack - Permissions', Title = varCurrentUserEmail)
      );

      ClearCollect(
          colPermittedProjects,
          ForAll(
              colUserPermissions As perm,
              LookUp('ProcTrack - Projects', projectidentifier = perm.Project)
          )
      );

      ClearCollect(colPermittedPackages, Blank());
      ForAll(
          colUserPermissions As perm,
          Collect(
              colPermittedPackages,
              Filter('ProcTrack - Packages', projectidentifier = perm.Project)
          )
      );

      ClearCollect(colProjectSubcontracts, Blank());
      ClearCollect(colProjectChanges, Blank());
      ClearCollect(colProjectPackages, Blank());
      ClearCollect(colRegisterView, Blank());
      ClearCollect(colAwardedAvailable, Blank());
      ClearCollect(colSubChanges, Blank());
    StartScreen: =Register
    Theme: =PowerAppsTheme

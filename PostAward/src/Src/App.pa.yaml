App:
  Properties:
    OnStart: |-
      =Set(varCurrentUserEmail, User().Email);
      Set(varCanEditCurrentProject, false);
      Set(varSelectedProject, Blank());
      Set(varSelectedSubcontract, Blank());
      Set(varRegisterFilter, "all");
      Set(varSearchCA, "");
      Set(varSearchVendor, "");
      Set(varSearchSub, "");
      Set(varSortColumn, "subcontractnumber");
      Set(varSortAscending, true);
      Set(varShowAddSub, false);
      Set(varShowSettings, false);
      Set(varShowAddChange, false);
      Set(varEditingChange, Blank());
      Set(varShowValidationErrors, false);
      Set(varCaFreeText, false);
      Set(varBackupCaFreeText, false);
      Set(varOwnerFreeText, false);
      Set(varDetLeftTab, "details");
      Set(varSubCurrency, "CAD");
      Set(varPendingOpenAddSub, false);
      Set(varExporting, false);
      Set(varExportResult, Blank());
      Set(
          varSubcontractsListUrl,
          "https://aecon1.sharepoint.com/sites/CivilPlanningteam/Lists/PostAward%20-%20Subcontracts/AllItems.aspx"
      );

      Set(varCurrentUserEmail, Lower(varCurrentUserEmail));
      Set(
          varUserPerm,
          LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail)
      );
      Set(varIsAdmin, Coalesce(varUserPerm.IsAdmin, false));
      If(
          IsBlank(varUserPerm),
          Notify(
              "No ProcTrack - Permissions row for " & varCurrentUserEmail,
              NotificationType.Warning
          )
      );

      ClearCollect(
          colMyProjectIds,
          Distinct(
              Filter(
                  Split(
                      Coalesce(varUserPerm.Edit_Projects, "") & ";" & Coalesce(varUserPerm.View_Projects, ""),
                      ";"
                  ),
                  !IsBlank(Trim(ThisRecord.Value))
              ),
              Value
          )
      );
      Clear(colPermittedProjects);
      ForAll(
          colMyProjectIds As idRow,
          Collect(
              colPermittedProjects,
              LookUp('ProcTrack - Projects', projectid = Trim(idRow.Value))
          )
      );
      ClearCollect(
          colPermittedProjects,
          Filter(colPermittedProjects, !IsBlank(projectid))
      );
      If(
          CountRows(colPermittedProjects) = 0,
          Notify(
              "colPermittedProjects is empty (check Permissions Edit_Projects/View_Projects vs Projects.projectid).",
              NotificationType.Warning
          )
      );

      ClearCollect(
          colOwnerSubs,
          Filter(
              'PostAward - Subcontracts',
              !IsBlank(operationalowneremail) &&
              Lower(Trim(operationalowneremail)) = Lower(Trim(varCurrentUserEmail))
          )
      );
      ForAll(
          colOwnerSubs As os,
          If(
              !IsBlank(os.projectidentifier) &&
              IsBlank(
                  LookUp(
                      colPermittedProjects,
                      projectidentifier = os.projectidentifier
                  )
              ),
              Collect(
                  colPermittedProjects,
                  LookUp(
                      'ProcTrack - Projects',
                      projectidentifier = os.projectidentifier
                  )
              )
          )
      );

      Clear(colPermittedPackages);
      ForAll(
          colPermittedProjects As p,
          Collect(
              colPermittedPackages,
              Filter(
                  'ProcTrack - Packages',
                  ProjectID = p.projectid || projectidentifier = p.projectidentifier
              )
          )
      );

      Clear(colProjectSubcontracts);
      Clear(colProjectChanges);
      Clear(colProjectPackages);
      Clear(colRegisterView);
      Clear(colAwardedAvailable);
      Clear(colSubChanges);
      Clear(colHomeAttention);
      Clear(colHomePendingChanges);
    StartScreen: =Home
    Theme: =PowerAppsTheme

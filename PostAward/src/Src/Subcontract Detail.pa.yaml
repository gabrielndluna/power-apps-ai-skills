                              BorderThickness: =1
                              Color: =RGBA(214, 12, 48, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =38

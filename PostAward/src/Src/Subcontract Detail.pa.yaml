Screens:
  Subcontract Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varShowAddChange, false);
        Set(varEditingChange, Blank());
        Set(varDeletingChange, false);
        Set(varCaFreeText, false);
        Set(varBackupCaFreeText, false);
        ClearCollect(
            colSubChanges,
            Filter(
                colProjectChanges,
                subcontractid = varSelectedSubcontract.packageidentifier
            )
        );
        Set(
            varApprovedSum,
            Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved"), value), 0)
        );
        Set(
            varPendingSum,
            Coalesce(Sum(Filter(colSubChanges, status.Value = "Pending"), value), 0)
        );
        Set(
            varPotentialSum,
            Coalesce(Sum(Filter(colSubChanges, status.Value = "Potential"), value), 0)
        );
        Set(
            varRejectedSum,
            Coalesce(Sum(Filter(colSubChanges, status.Value = "Rejected"), value), 0)
        );
        Set(varCurrentValue, Coalesce(varSelectedSubcontract.originalvalue, 0) + varApprovedSum);
        Set(varFutureLiab, varPendingSum + varPotentialSum);
        Set(varEAC, varCurrentValue + varFutureLiab);
        Set(
            varIsOver,
            Coalesce(varSelectedSubcontract.invoicedtodate, 0) > varCurrentValue
        );
        Set(
            varIsClosed,
            !varSelectedSubcontract.currentlyactive ||
            varSelectedSubcontract.closeoutstatus.Value = "Closed"
        );
        Set(
            varReasonDesign,
            Coalesce(
                Sum(
                    Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Design Change"),
                    value
                ),
                0
            )
        );
        Set(
            varReasonScope,
            Coalesce(
                Sum(
                    Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Scope Gap"),
                    value
                ),
                0
            )
        );
        Set(
            varReasonVar,
            Coalesce(
                Sum(
                    Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Variation"),
                    value
                ),
                0
            )
        );
        Set(
            varReasonAccel,
            Coalesce(
                Sum(
                    Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Acceleration"),
                    value
                ),
                0
            )
        )

                  PaddingRight: =22
                  PaddingTop: =4
                Children:
                  - det_btn_cancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(214, 12, 48, 1)
                        BorderThickness: =1
                        Color: =RGBA(214, 12, 48, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Navigate(Register, ScreenTransition.Fade)
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =13
                        Text: ="Cancel"
                        Width: =120
                  - det_btn_save:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(varCanEditCurrentProject, DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =RGBA(214, 12, 48, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =With(
                              {
                                  caName: If(
                                      varCaFreeText,
                                      Trim(det_ca_txt.Text),
                                      Coalesce(Trim(det_ca_combo.Selected.DisplayName), varSelectedSubcontract.responsibleca)
                                  ),
                                  backupName: If(
                                      varBackupCaFreeText,
                                      Trim(det_backup_txt.Text),
                                      Coalesce(Trim(det_backup_combo.Selected.DisplayName), varSelectedSubcontract.backupca)
                                  ),
                                  ownerName: If(
                                      varOwnerFreeText,
                                      Trim(det_owner_txt.Text),
                                      Coalesce(Trim(det_owner_combo.Selected.DisplayName), varSelectedSubcontract.operationalowner)
                                  ),
                                  ownerEmail: If(
                                      varOwnerFreeText,
                                      "",
                                      Lower(Coalesce(det_owner_combo.Selected.Mail, det_owner_combo.Selected.UserPrincipalName))
                                  )
                              },
                              Patch(
                                  'PostAward - Subcontracts',
                                  LookUp(
                                      'PostAward - Subcontracts',
                                      packageidentifier = varSelectedSubcontract.packageidentifier
                                  ),
                                  {
                                      startdate: det_start.SelectedDate,
                                      completiondate: det_end.SelectedDate,
                                      revisedenddate: det_revised.SelectedDate,
                                      sapvendornumber: Trim(det_sap.Text),
                                      currencycode: det_currency.SelectedText,
                                      indigenouscontribution: det_indigenous.SelectedText,
                                      worktype: det_worktype.SelectedText,
                                      responsibleca: caName,
                                      backupca: backupName,
                                      operationalowner: ownerName,
                                      operationalowneremail: ownerEmail,
                                      currentlyactive: det_active.SelectedText.Value = "Yes",
                                      holdback: det_hb.SelectedText,
                                      closeoutstatus: det_close.SelectedText
                                  }
                              );
                              Set(
                                  varSelectedSubcontract,
                                  LookUp(
                                      'PostAward - Subcontracts',
                                      packageidentifier = varSelectedSubcontract.packageidentifier
                                  )
                              );
                              Notify("Changes saved.", NotificationType.Success);
                              Navigate(Register, ScreenTransition.Fade)
                          )
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =13
                        Text: ="Save Changes"
                        Width: =150

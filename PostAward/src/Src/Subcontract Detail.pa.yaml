                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =Switch(
                                                ThisItem.status.Value,
                                                "Approved", RGBA(46, 158, 91, 1),
                                                "Pending", RGBA(214, 154, 0, 1),
                                                "Potential", RGBA(47, 111, 179, 1),
                                                "Canceled", RGBA(108, 113, 118, 1),
                                                RGBA(214, 12, 48, 1)
                                            )
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold

                                                  );
                                                  Set(varApprovedSum, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved"), _amt, value), _amt), 0));
                                                  Set(varPendingSum, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Pending"), _amt, value), _amt), 0));
                                                  Set(varPotentialSum, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Potential"), _amt, value), _amt), 0));
                                                  Set(varRejectedSum, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Rejected"), _amt, value), _amt), 0));
                                                  Set(varCurrentValue, Coalesce(Value(varSelectedSubcontract.originalvalue), 0) + varApprovedSum);
                                                  Set(varFutureLiab, varPendingSum + varPotentialSum);
                                                  Set(varEAC, varCurrentValue + varFutureLiab);
                                                  Set(varIsOver, Coalesce(Value(varSelectedSubcontract.invoicedtodate), 0) > varCurrentValue);
                                                  Set(varReasonDesign, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Design Change"), _amt, value), _amt), 0));
                                                  Set(varReasonScope, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Scope Gap"), _amt, value), _amt), 0));
                                                  Set(varReasonVar, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Variation"), _amt, value), _amt), 0));
                                                  Set(varReasonAccel, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Acceleration"), _amt, value), _amt), 0));
                                                  Set(varReasonNewScope, Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "New Scope"), _amt, value), _amt), 0));
                                                  Set(varPctComplete, Min(100, Round(Coalesce(Value(varSelectedSubcontract.invoicedtodate), 0) / Max(varCurrentValue, 1) * 100, 0)));
                                                  Set(varRollMaxStatus, Max(Abs(varApprovedSum), Abs(varPendingSum), Abs(varPotentialSum), Abs(varRejectedSum), 1));
                                                  Set(varRollMaxReason, Max(Abs(varReasonDesign), Abs(varReasonScope), Abs(varReasonVar), Abs(varReasonAccel), Abs(varReasonNewScope), 1));
                                                  Set(varDeletingChange, false);
                                                  Notify("Change deleted.", NotificationType.Success)
                                                Tooltip: ="Delete change"

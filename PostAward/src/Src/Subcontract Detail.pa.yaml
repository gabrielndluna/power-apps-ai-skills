                                          Color: =If(Coalesce(ThisItem.finalvalue, ThisItem.value) < 0, RGBA(214, 12, 48, 1), RGBA(35, 38, 43, 1))
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =11
                                          Text: =Text(Coalesce(ThisItem.finalvalue, ThisItem.value), "$#,##0.00")
                                          Width: =88

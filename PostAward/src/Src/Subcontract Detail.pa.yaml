                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =38
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(det_cp_ref.Text)),
                                          Notify("Ref No. is required.", NotificationType.Error),
                                    If(
                                        IsBlank(varEditingChange),
                                        Patch(
                                            'PostAward - Changes',
                                            Defaults('PostAward - Changes'),
                                            {
                                                Title: Trim(det_cp_ref.Text),
                                                subcontractid: varSelectedSubcontract.packageidentifier,
                                                projectidentifier: varSelectedSubcontract.projectidentifier,
                                                refnumber: Trim(det_cp_ref.Text),
                                                changedate: det_cp_date.SelectedDate,
                                                description: det_cp_desc.Text,
                                                      changetype: det_cp_type.SelectedText,
                                                      reason: det_cp_reason.SelectedText,
                                                      value: Value(det_cp_val.Text),
                                                      status: det_cp_st.SelectedText,
                                                      aeconref: Trim(det_cp_aecon.Text)
                                                  }
                                              ),
                                              Patch(
                                                  'PostAward - Changes',
                                                  LookUp('PostAward - Changes', ID = varEditingChange.ID),
                                                  {
                                                      Title: Trim(det_cp_ref.Text),
                                                      refnumber: Trim(det_cp_ref.Text),
                                                      changedate: det_cp_date.SelectedDate,
                                                      description: det_cp_desc.Text,
                                                      changetype: det_cp_type.SelectedText,
                                                      reason: det_cp_reason.SelectedText,
                                                      value: Value(det_cp_val.Text),
                                                      status: det_cp_st.SelectedText,
                                                      aeconref: Trim(det_cp_aecon.Text)
                                                  }
                                              )
                                    );
                                    Set(varShowAddChange, false);
                                    Set(varEditingChange, Blank());
                                    ClearCollect(
                                                colSubChanges,
                                                Filter(
                                                    'PostAward - Changes',
                                                    subcontractid = varSelectedSubcontract.packageidentifier
                                                )
                                            );
                                            ClearCollect(
                                                colProjectChanges,
                                                Filter(
                                                    'PostAward - Changes',
                                                    projectidentifier = varSelectedSubcontract.projectidentifier
                                                )
                                            );
                                            Set(varApprovedSum, Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved"), value), 0));
                                            Set(varPendingSum, Coalesce(Sum(Filter(colSubChanges, status.Value = "Pending"), value), 0));
                                            Set(varPotentialSum, Coalesce(Sum(Filter(colSubChanges, status.Value = "Potential"), value), 0));
                                            Set(varRejectedSum, Coalesce(Sum(Filter(colSubChanges, status.Value = "Rejected"), value), 0));
                                            Set(varCurrentValue, Coalesce(varSelectedSubcontract.originalvalue, 0) + varApprovedSum);
                                            Set(varFutureLiab, varPendingSum + varPotentialSum);
                                            Set(varEAC, varCurrentValue + varFutureLiab);
                                            Set(varIsOver, Coalesce(varSelectedSubcontract.invoicedtodate, 0) > varCurrentValue);
                                            Set(varReasonDesign, Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Design Change"), value), 0));
                                            Set(varReasonScope, Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Scope Gap"), value), 0));
                                            Set(varReasonVar, Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Variation"), value), 0));
                                            Set(varReasonAccel, Coalesce(Sum(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Acceleration"), value), 0));
                                    Notify("Change saved.", NotificationType.Success)
                                )

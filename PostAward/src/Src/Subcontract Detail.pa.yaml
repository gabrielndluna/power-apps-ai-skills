                  - det_xls_wrap:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =32
                        LayoutMaxWidth: =32
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =32
                      Children:
                        - det_xls_img:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              DisplayMode: =If(varExporting || IsBlank(varSelectedSubcontract), DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =22
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: ='excel-icon-17'
                              OnSelect: |-
                                =Set(varExporting, true);
                                Set(
                                    varExportResult,
                                    'PostAward-Excelexport'.Run(
                                        JSON(
                                            [
                                                {
                                                    Project: Coalesce(varSelectedProject.projectname, varSelectedSubcontract.projectidentifier, "") & "",
                                                    Subcontract: Coalesce(varSelectedSubcontract.subcontractnumber, "") & "",
                                                    PONumber: Coalesce(varSelectedSubcontract.ponumber, "") & "",
                                                    Vendor: Coalesce(varSelectedSubcontract.vendor, "") & "",
                                                    Scope: Coalesce(varSelectedSubcontract.scope, "") & "",
                                                    Bundle: Coalesce(varSelectedSubcontract.bundle, "") & "",
                                                    ContractType: Coalesce(varSelectedSubcontract.contracttype, "") & "",
                                                    OriginalValue: Text(Coalesce(Value(varSelectedSubcontract.originalvalue), 0)),
                                                    ApprovedCO: Text(Coalesce(varApprovedSum, 0)),
                                                    CurrentValue: Text(Coalesce(varCurrentValue, 0)),
                                                    InvoicedToDate: Text(Coalesce(Value(varSelectedSubcontract.invoicedtodate), 0)),
                                                    FutureLiability: Text(Coalesce(varPendingSum, 0) + Coalesce(varPotentialSum, 0)),
                                                    EAC: Text(Coalesce(varCurrentValue, 0) + Coalesce(varPendingSum, 0) + Coalesce(varPotentialSum, 0)),
                                                    ContractAdmin: Coalesce(varSelectedSubcontract.responsibleca, "") & "",
                                                    BackupCA: If(IsBlank(varSelectedSubcontract.backupca), "-", varSelectedSubcontract.backupca) & "",
                                                    OperationalOwner: If(IsBlank(varSelectedSubcontract.operationalowner), "-", varSelectedSubcontract.operationalowner) & "",
                                                    CurrentlyActive: If(varSelectedSubcontract.currentlyactive, "Yes", "No"),
                                                    Holdback: If(IsBlank(varSelectedSubcontract.holdback), "-", Coalesce(varSelectedSubcontract.holdback.Value, "-")) & "",
                                                    CloseoutStatus: If(IsBlank(varSelectedSubcontract.closeoutstatus), "-", Coalesce(varSelectedSubcontract.closeoutstatus.Value, "-")) & "",
                                                    StartDate: If(IsBlank(varSelectedSubcontract.startdate), "-", Text(varSelectedSubcontract.startdate, "yyyy-mm-dd")),
                                                    EndDate: If(IsBlank(varSelectedSubcontract.completiondate), "-", Text(varSelectedSubcontract.completiondate, "yyyy-mm-dd")),
                                                    RevisedEndDate: If(IsBlank(varSelectedSubcontract.revisedenddate), "-", Text(varSelectedSubcontract.revisedenddate, "yyyy-mm-dd")),
                                                    SAPVendorNumber: If(IsBlank(varSelectedSubcontract.sapvendornumber), "-", varSelectedSubcontract.sapvendornumber) & "",
                                                    Currency: Coalesce(varSubCurrency, "CAD"),
                                                    IndigenousContribution: If(IsBlank(varSelectedSubcontract.indigenouscontribution), "0", Coalesce(varSelectedSubcontract.indigenouscontribution.Value, "0")) & "",
                                                    WorkType: If(IsBlank(varSelectedSubcontract.worktype), "-", Coalesce(varSelectedSubcontract.worktype.Value, "-")) & "",
                                                    IsOverBudget: If(varIsOver, "Yes", "No")
                                                }
                                            ],
                                            JSONFormat.Compact
                                        )
                                    )
                                );
                                Set(varExporting, false);
                                If(
                                    !IsBlank(varExportResult.filelink),
                                    Launch(Substitute(varExportResult.filelink, " ", "%20")),
                                    Notify("Excel export failed - open Power Automate run history for PostAward - Excel export.", NotificationType.Error)
                                )
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =22
                              X: =5
                              Y: =5

Screens:
  Subcontract Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varShowAddChange, false);
        Set(varEditingChange, Blank());
        Set(varDeletingChange, false);
        Set(varCaFreeText, false);
        Set(varBackupCaFreeText, false);
        Set(varOwnerFreeText, false);
        ClearCollect(
            colSubChanges,
            Filter(
                colProjectChanges,
                subcontractid = varSelectedSubcontract.packageidentifier
            )
        );
        Set(
            varApprovedSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varPendingSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Pending"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varPotentialSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Potential"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varRejectedSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Rejected"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(varCurrentValue, Coalesce(varSelectedSubcontract.originalvalue, 0) + varApprovedSum);
        Set(varFutureLiab, varPendingSum + varPotentialSum);
        Set(varEAC, varCurrentValue + varFutureLiab);
        Set(
            varIsOver,
            Coalesce(varSelectedSubcontract.invoicedtodate, 0) > varCurrentValue
        );
        Set(
            varIsClosed,
            varSelectedSubcontract.closeoutstatus.Value = "Closed"
        );
        Set(
            varReasonDesign,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Design Change"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varReasonScope,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Scope Gap"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varReasonVar,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Variation"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varReasonAccel,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Acceleration"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(
            varReasonNewScope,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "New Scope"), _amt, Coalesce(finalvalue, value)), _amt), 0)
        );
        Set(varPctComplete, Min(100, Round(Coalesce(varSelectedSubcontract.invoicedtodate, 0) / Max(varCurrentValue, 1) * 100, 0)));
        Set(varRollMaxStatus, Max(Abs(varApprovedSum), Abs(varPendingSum), Abs(varPotentialSum), Abs(varRejectedSum), 1));
        Set(varRollMaxReason, Max(Abs(varReasonDesign), Abs(varReasonScope), Abs(varReasonVar), Abs(varReasonAccel), Abs(varReasonNewScope), 1))

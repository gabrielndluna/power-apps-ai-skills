                              LayoutMinWidth: =0
                              PaddingBottom: =4
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =4
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10

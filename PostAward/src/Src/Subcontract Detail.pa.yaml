Screens:
  Subcontract Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varShowAddChange, false);
        Set(varEditingChange, Blank());
        Set(varShowDeleteSub, false);
        Set(varDeletingChange, false);
        Set(varCaFreeText, false);
        Set(varBackupCaFreeText, false);
        Set(varOwnerFreeText, false);
        Set(varDetLeftTab, "details");
        ClearCollect(
            colSubChanges,
            Filter(
                colProjectChanges,
                subcontractid = varSelectedSubcontract.packageidentifier
            )
        );
        Set(
            varApprovedSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved"), _amt, value), _amt), 0)
        );
        Set(
            varPendingSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Pending"), _amt, value), _amt), 0)
        );
        Set(
            varPotentialSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Potential"), _amt, value), _amt), 0)
        );
        Set(
            varRejectedSum,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Rejected"), _amt, value), _amt), 0)
        );
        Set(varCurrentValue, Coalesce(Value(varSelectedSubcontract.originalvalue), 0) + varApprovedSum);
        Set(varFutureLiab, varPendingSum + varPotentialSum);
        Set(varEAC, varCurrentValue + varFutureLiab);
        Set(
            varIsOver,
            Coalesce(Value(varSelectedSubcontract.invoicedtodate), 0) > varCurrentValue
        );
        Set(
            varIsClosed,
            varSelectedSubcontract.closeoutstatus.Value = "Closed"
        );
        Set(
            varReasonDesign,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Design Change"), _amt, value), _amt), 0)
        );
        Set(
            varReasonScope,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Scope Gap"), _amt, value), _amt), 0)
        );
        Set(
            varReasonVar,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Variation"), _amt, value), _amt), 0)
        );
        Set(
            varReasonAccel,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "Acceleration"), _amt, value), _amt), 0)
        );
        Set(
            varReasonNewScope,
            Coalesce(Sum(AddColumns(Filter(colSubChanges, status.Value = "Approved" && reason.Value = "New Scope"), _amt, value), _amt), 0)
        );
        Set(varPctComplete, Min(100, Round(Coalesce(Value(varSelectedSubcontract.invoicedtodate), 0) / Max(varCurrentValue, 1) * 100, 0)));
        Set(varRollMaxStatus, Max(Abs(varApprovedSum), Abs(varPendingSum), Abs(varPotentialSum), Abs(varRejectedSum), 1));
        Set(varRollMaxReason, Max(Abs(varReasonDesign), Abs(varReasonScope), Abs(varReasonVar), Abs(varReasonAccel), Abs(varReasonNewScope), 1));
        Set(varSubCurrency, Coalesce(varSubCurrency, "CAD"))
    Children:
      - det_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            PaddingBottom: =8
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - det_header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =RGBA(214, 12, 48, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - det_back_wrap:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center

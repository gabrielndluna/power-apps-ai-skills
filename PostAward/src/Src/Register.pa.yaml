                                            varCaFreeText,
                                            Trim(reg_add_ca_txt.Text),
                                            Trim(reg_add_ca_combo.Selected.DisplayName)
                                        )
                                    },
                                    If(
                                        IsBlank(pkg) || IsBlank(caName),
                                        Set(varShowValidationErrors, true);
                                        Notify("Select an awarded package and a responsible CA.", NotificationType.Error),
                                        Patch(
                                            'PostAward - Subcontracts',
                                            Defaults('PostAward - Subcontracts'),
                                            {
                                                Title: Coalesce(pkg.itemnumber, pkg.packageidentifier),
                                                subcontractnumber: Coalesce(pkg.itemnumber, pkg.packageidentifier),
                                                packageidentifier: pkg.packageidentifier,
                                                projectidentifier: varSelectedProject.projectidentifier,
                                                ponumber: pkg.purchaseordernumber,
                                                vendor: pkg.subcontractorname,
                                                scope: pkg.packagedescription,
                                                bundle: pkg.operationspackagebundle,
                                                contracttype: pkg.contracttype,
                                                originalvalue: Coalesce(pkg.awardvalue, 0),
                                                responsibleca: caName,
                                                backupca: "",
                                                currentlyactive: true,
                                                holdback: {Value: "Applicable"},
                                                closeoutstatus: {Value: "In progress"},
                                                invoicedtodate: 0
                                            }
                                              );
                                              Set(varShowAddSub, false);
                                              Notify("Subcontract added.", NotificationType.Success);
                                              Navigate(Register, ScreenTransition.None)
                                          )
                                      )
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =12
                              Text: ="Add"
      - reg_overlay_settings:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            Visible: =varShowSettings
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - reg_settings_panel:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =280
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  PaddingBottom: =16
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =420
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - reg_settings_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(27, 27, 27, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =16
                        Text: ="Settings"
                  - reg_settings_user:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(60, 65, 71, 1)
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Size: =12
                        Text: ="Signed in as " & User().FullName & " (" & varCurrentUserEmail & ")"
                        Wrap: =true
                  - reg_settings_edit:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(60, 65, 71, 1)
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Size: =12
                        Text: |-
                          ="Edit access for this project: " &
                          If(varCanEditCurrentProject, "Yes", "No (view only)")
                        Wrap: =true
                  - reg_settings_help:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(108, 113, 118, 1)
                        Font: =Font.'Segoe UI'
                        Height: =70
                        Size: =12
                        Text: ="Permissions use ProcTrack - Permissions. XLS opens the SharePoint subcontracts list for Export to Excel. ProcTrack package fields stay read-only in PostAward."
                        Wrap: =true
                  - reg_settings_close:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(214, 12, 48, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Set(varShowSettings, false)
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =12
                        Text: ="Close"
                        Width: =110

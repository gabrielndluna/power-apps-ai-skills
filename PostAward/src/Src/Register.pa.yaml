Screens:
  Register:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varShowAddSub, false);
        Set(varShowSettings, false);
        Set(varShowValidationErrors, false);
        If(
            IsBlank(varSelectedProject) && CountRows(colPermittedProjects) > 0,
            Set(varSelectedProject, First(colPermittedProjects))
        );
        If(
            !IsBlank(varSelectedProject),
            Set(
                varCanEditCurrentProject,
                !IsBlank(
                    LookUp(
                        colUserPermissions,
                        Project = varSelectedProject.projectidentifier && Edit_allowed = "yes"
                    )
                )
            );
            ClearCollect(
                colProjectSubcontracts,
                Filter(
                    'PostAward - Subcontracts',
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colProjectChanges,
                Filter(
                    'PostAward - Changes',
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colProjectPackages,
                Filter(
                    colPermittedPackages,
                    projectidentifier = varSelectedProject.projectidentifier
                )
            );
            ClearCollect(
                colRegisterView,
                ForAll(
                    colProjectSubcontracts As s,
                    With(
                        {
                            approvedSum: Coalesce(
                                Sum(
                                    Filter(
                                        colProjectChanges,
                                        subcontractid = s.packageidentifier && status.Value = "Approved"
                                    ),
                                    value
                                ),
                                0
                            ),
                            pendingSum: Coalesce(
                                Sum(
                                    Filter(
                                        colProjectChanges,
                                        subcontractid = s.packageidentifier && status.Value = "Pending"
                                    ),
                                    value
                                ),
                                0
                            ),
                            potentialSum: Coalesce(
                                Sum(
                                    Filter(
                                        colProjectChanges,
                                        subcontractid = s.packageidentifier && status.Value = "Potential"
                                    ),
                                    value
                                ),
                                0
                            )
                        },
                        {
                            ID: s.ID,
                            packageidentifier: s.packageidentifier,
                            subcontractnumber: s.subcontractnumber,
                            ponumber: s.ponumber,
                            vendor: s.vendor,
                            scope: s.scope,
                            bundle: s.bundle,
                            contracttype: s.contracttype,
                            originalvalue: Coalesce(s.originalvalue, 0),
                            invoicedtodate: Coalesce(s.invoicedtodate, 0),
                            responsibleca: s.responsibleca,
                            backupca: s.backupca,
                            currentlyactive: s.currentlyactive,
                            holdback: s.holdback,
                            closeoutstatus: s.closeoutstatus,
                            startdate: s.startdate,
                            completiondate: s.completiondate,
                            projectidentifier: s.projectidentifier,
                            apprCO: approvedSum,
                            currentValue: Coalesce(s.originalvalue, 0) + approvedSum,
                            futureLiab: pendingSum + potentialSum,
                            eac: Coalesce(s.originalvalue, 0) + approvedSum + pendingSum + potentialSum,
                            isOver: Coalesce(s.invoicedtodate, 0) > (Coalesce(s.originalvalue, 0) + approvedSum),
                            isClosed: !s.currentlyactive || s.closeoutstatus.Value = "Closed",
                            changeCount: CountRows(
                                Filter(colProjectChanges, subcontractid = s.packageidentifier)
                            )
                        }
                    )
                )
            );
            ClearCollect(
                colAwardedAvailable,
                Filter(
                    colProjectPackages,
                    !IsBlank(actualawarddate) &&
                    IsBlank(
                        LookUp(
                            colProjectSubcontracts,
                            packageidentifier = ThisRecord.packageidentifier
                        )
                    )
                )
            )
        )

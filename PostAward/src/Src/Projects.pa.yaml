Screens:
  Projects:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varSelectedProject, Blank());
        ClearCollect(colAllPermissions, 'ProcTrack - Permissions');
        ClearCollect(colAllProjects, 'ProcTrack - Projects');
        Set(varUserPerm, LookUp(colAllPermissions, Lower(Title) = varCurrentUserEmail));
        Set(
            varIsAdmin,
            !IsBlank(varUserPerm) &&
            (
                varUserPerm.IsAdmin = true ||
                Lower(Text(varUserPerm.IsAdmin)) = "true" ||
                Lower(Text(varUserPerm.IsAdmin)) = "yes"
            )
        );
        ClearCollect(
            colMyProjectIds,
            Filter(
                Split(
                    Coalesce(varUserPerm.Edit_Projects, "") & ";" & Coalesce(varUserPerm.View_Projects, ""),
                    ";"
                ),
                !IsBlank(Trim(Value))
            )
        );
        ClearCollect(
            colPermittedProjects,
            If(
                varIsAdmin,
                Filter(colAllProjects, !IsBlank(projectid)),
                Filter(
                    colAllProjects,
                    !IsBlank(LookUp(colMyProjectIds, Trim(Value) = projectid))
                )
            )
        );
        ClearCollect(
            colOwnerSubs,
            Filter(
                'PostAward - Subcontracts',
                operationalowneremail = varCurrentUserEmail
            )
        );
        ForAll(
            colOwnerSubs As os,
            If(
                !IsBlank(os.projectidentifier) &&
                IsBlank(
                    LookUp(
                        colPermittedProjects,
                        projectidentifier = os.projectidentifier
                    )
                ),
                Collect(
                    colPermittedProjects,
                    LookUp(
                        colAllProjects,
                        projectidentifier = os.projectidentifier
                    )
                )
            )
        );
        ClearCollect(
            colPermittedProjects,
            Filter(colPermittedProjects, !IsBlank(projectid) || !IsBlank(projectidentifier))
        );
        Clear(colDashSubs);
        Clear(colDashChanges);
        Clear(colDashView);
        IfError(
            ForAll(
                colPermittedProjects As p,
                Collect(
                    colDashSubs,
                    Filter(
                        'PostAward - Subcontracts',
                        projectidentifier = p.projectidentifier
                    )
                )
            );
            ForAll(
                colPermittedProjects As p,
                Collect(
                    colDashChanges,
                    Filter(
                        'PostAward - Changes',
                        projectidentifier = p.projectidentifier
                    )
                )
            );
            ClearCollect(
                colDashView,
                ForAll(
                    colDashSubs As s,
                    With(
                        {
                            approvedSum: Coalesce(
                                Sum(
                                    AddColumns(
                                        Filter(
                                            colDashChanges,
                                            subcontractid = s.packageidentifier && status.Value = "Approved"
                                        ),
                                        _amt,
                                        value
                                    ),
                                    _amt
                                ),
                                0
                            ),
                            closed: !IsBlank(s.closeoutstatus) && s.closeoutstatus.Value = "Closed"
                        },
                        {
                            projectidentifier: s.projectidentifier,
                            isClosed: closed,
                            isOver: !closed && Coalesce(s.invoicedtodate, 0) > (Coalesce(s.originalvalue, 0) + approvedSum)
                        }
                    )
                )
            ),
            Notify("Project list is available. Metrics could not be loaded.", NotificationType.Warning)
        )

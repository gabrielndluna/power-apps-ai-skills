App:
  Properties:
    OnStart: |-
      =ClearCollect(
          colEmployees,
          Filter(
              Employees_1,
              IsActive = true && UseDayaway = true
          )
      );

      ClearCollect(
          colVacationsUpdates,
          {
              ID: 0,
              Type_of_leave: "",
              ApprovalStatus_1: "",
              ApprovalStatus_2: "",
              Approver_Comments: "",
              Employee: "",
              TypeofLeave: "",
              StartDate: Today(),
              EndDate: Today(),
              ApproverID_1: "",
              LOG_ID: ""
          }
      );
      Clear(colVacationsUpdates);

      ClearCollect(
          colMyRequests,
          {
              ID: 0,
              LOG_ID: "",
              StartDate: Today(),
              EndDate: Today(),
              Days: 0,
              Type_of_leave: "",
              Leave_Time: "",
              Comments: "",
              ApprovalStatus_1: "",
              Approver_Comments: "",
              ApproverID_1: ""
          }
      );
      Clear(colMyRequests);

      ClearCollect(
          colLeaveDates,
          {
              LeaveDate: Today()
          }
      );
      Clear(colLeaveDates);

      ClearCollect(
          colHoursSync,
          {
              ID: 0,
              LOG_ID: "",
              Date: Today(),
              ApprovalStatus_1: ""
          }
      );
      Clear(colHoursSync);

      ClearCollect(
          colApprovalsSource,
          {
              ID: 0,
              Employee: "",
              Employee_Name: "",
              StartDate: Today(),
              EndDate: Today(),
              Days: 0,
              Type_of_leave: "",
              Leave_Time: "",
              Comments: "",
              ApprovalStatus_1: "",
              Approver_Comments: "",
              ApproverID_1: "",
              LOG_ID: "",
              Project: ""
          }
      );
      Clear(colApprovalsSource);

      Set(GUID_Var, GUID());
      Set(varIsSaving, false);
      Set(varShowDeleteConfirm, false);
      Set(varShowApprDelete, false);
      Set(varDeleteEmployee, "");
      Set(varDeleteRequestID, 0);
      Set(varDeleteRequestLog, "");
      Set(varDeleteStart, Blank());
      Set(varDeleteEnd, Blank());
      Set(varFilterEmployee, "");
      Set(varFilterFrom, Blank());
      Set(varFilterTo, Blank());
      Set(varApprovalStatusFilter, "Pending");
      Set(varShowSubmitSheet, false);
      Set(varShowRequestDetail, false);
      Set(varDetailType, "");
      Set(varDetailDates, "");
      Set(varDetailStatus, "");
      Set(varDetailDays, Value(0));
      Set(varDetailComments, "");
      Set(varDetailApproverComments, "");
      Set(varLeaveTime, "Full Day");

      Set(
          varEmployeeRecord,
          LookUp(
              colEmployees,
              Lower(Trim(Email)) = Lower(Trim(User().Email))
          )
      );
      Set(SelectedProject, varEmployeeRecord.ProjectName);
      Set(Selected_ProjectID, varEmployeeRecord.ProjectCode);
      Set(varHourThreshold, Coalesce(varEmployeeRecord.TotalVacationDays, 0));
      Set(varApproverEmail, Coalesce(Trim(varEmployeeRecord.ApproverEmail), ""));
      Set(
          varApproverName,
          Coalesce(
              Trim(varEmployeeRecord.ApproverName),
              If(
                  IsBlank(varApproverEmail),
                  "",
                  Trim(
                      LookUp(
                          colEmployees,
                          Lower(Trim(Email)) = Lower(Trim(varApproverEmail))
                      ).Title
                  )
              ),
              ""
          )
      );

      ClearCollect(
          colPublic_Holidays,
          Filter(
              AddColumns(
                  'Public Holidays',
                  CleanDate,
                  DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"),
                  CleanDateKey,
                  Text(DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"), "yyyy-mm-dd")
              ),
              IsBlank(SelectedProject) || SelectedProject in Projects
          )
      );

      Set(varIsAdmin, Coalesce(varEmployeeRecord.IsAdmin, false));

      Set(
          varIsApprover,
          varIsAdmin ||
          !IsBlank(
              LookUp(
                  'Vacations Tracking (Days)',
                  ApproverID_1 = User().Email
              )
          ) ||
          !IsBlank(
              LookUp(
                  colEmployees,
                  Lower(Trim(ApproverEmail)) = Lower(Trim(User().Email))
              )
          )
      );
      Set(varSettingsTab, "Employees");
      Set(varSettingsFilter, "");
      Set(varSettingsId, 0);
      Set(varSettingsHolidayId, 0);
      Set(varSettingsCodeId, 0);
      Set(varSettingsModal, "");
      Set(varIsSavingSettings, false);
      ClearCollect(colSettingsEmployees, Employees_1);
      ClearCollect(
          colSettingsHolidays,
          SortByColumns('Public Holidays', "HolidayDate", SortOrder.Descending)
      );
      ClearCollect(colSettingsCodes, 'Cost Codes');

      If(
          varIsAdmin,
          ClearCollect(colApprovalsSource, 'Vacations Tracking (Days)'),
          ClearCollect(
              colApprovalsSource,
              Filter('Vacations Tracking (Days)', ApproverID_1 = User().Email)
          )
      );

      ClearCollect(
          colMyRequests,
          SortByColumns(
              Filter('Vacations Tracking (Days)', Employee = User().Email),
              "StartDate",
              SortOrder.Descending
          )
      );
    StartScreen: ='Vacations Tracking'
    SizeBreakpoints: =[680, 900, 1200]
    Theme: =PowerAppsTheme

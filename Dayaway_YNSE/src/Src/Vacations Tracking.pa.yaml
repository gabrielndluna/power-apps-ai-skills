      - Overlay_DeleteConfirm:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Fill: =RGBA(10, 12, 30, 0.42)
            Height: =Parent.Height
            Visible: =varShowDeleteConfirm
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - DeleteConfirm_Card:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =112
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =18
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =Min(Parent.Width * 0.9, 320)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - Label_DeleteTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(23, 26, 51, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =14
                        Text: ="Delete this request?"
                        Width: =Parent.Width
                  - delete_btn_row:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        Height: =42
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        Width: =Parent.Width
                      Children:
                        - btn_DeleteCancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              Color: =RGBA(23, 26, 51, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: =Set(varShowDeleteConfirm, false)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Cancel"
                              Width: =1
                        - btn_DeleteConfirm:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(179, 38, 30, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Remove(
                                    'Vacations Tracking (Days)',
                                    LookUp('Vacations Tracking (Days)', ID = varDeleteRequestID)
                                );
                                ClearCollect(
                                    colHoursSync,
                                    Filter(
                                        'Hours Tracking (Hours)',
                                        Employee = User().Email &&
                                        Date >= varDeleteStart &&
                                        Date <= varDeleteEnd
                                    )
                                );
                                ClearCollect(
                                    colHoursSync,
                                    Filter(
                                        colHoursSync,
                                        StartsWith(LOG_ID, varDeleteRequestLog & "_")
                                    )
                                );
                                ForAll(
                                    colHoursSync As h,
                                    Remove(
                                        'Hours Tracking (Hours)',
                                        LookUp('Hours Tracking (Hours)', ID = h.ID)
                                    )
                                );
                                Set(varShowDeleteConfirm, false);
                                Notify("Request deleted", NotificationType.Success);
                                ClearCollect(
                                    colMyRequests,
                                    SortByColumns(
                                        Filter('Vacations Tracking (Days)', Employee = User().Email),
                                        "StartDate",
                                        SortOrder.Descending
                                    )
                                );
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =12
                              Text: ="Delete"
                              Width: =1

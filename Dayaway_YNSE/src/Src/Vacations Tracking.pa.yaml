Screens:
  Vacations Tracking:
    Properties:
      Fill: =RGBA(245, 246, 251, 1)
      LoadingSpinnerColor: =RGBA(0, 18, 107, 1)
      OnVisible: |-
        =ClearCollect(
            colMyRequests,
            SortByColumns(
                Filter('Vacations Tracking (Days)', Employee = User().Email),
                "StartDate",
                SortOrder.Descending
            )
        );
        Set(varShowSubmitSheet, false);
        Set(varShowDeleteConfirm, false);
        Set(varShowRequestDetail, false);
        Set(varLeaveTime, "Full Day");
    Children:
      - vt_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Fill: =RGBA(245, 246, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - vt_header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 680, 230, 220)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  PaddingBottom: =14
                  PaddingLeft: =If(App.Width < 680, 12, 16)
                  PaddingRight: =If(App.Width < 680, 12, 16)
                  PaddingTop: =If(App.Width < 680, 18, 20)
                  Width: =Parent.Width
                Children:
                  - vt_brand_row:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMinWidth: =0
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        Width: =Parent.Width
                      Children:
                        - Logo_Dayaway_Wrap:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =72
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =180
                            Children:
                              - Logo_Dayaway:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderThickness: =0
                                    Height: =72
                                    Image: ='Subtitle (1)'
                                    ImagePosition: =ImagePosition.Fit
                                    Width: =180
                                    X: =0
                                    Y: =0
                        - Logo_Department_Wrap:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =64
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =160
                            Children:
                              - Logo_Department:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderThickness: =0
                                    Height: =64
                                    Image: ='Department Logo'
                                    ImagePosition: =ImagePosition.Fit
                                    Width: =160
                                    X: =0
                                    Y: =0
                        - brand_spacer:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              Height: =1
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =8
                        - btn_ApproverTab_VT:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              Color: =RGBA(23, 26, 51, 1)
                              Fill: =RGBA(245, 247, 250, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: =Navigate(Approvals, ScreenTransition.Fade)
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =11
                              Text: ="Approvals"
                              Visible: =varIsApprover && App.Width >= 680
                              Width: =96
                        - btn_NewRequest_Web:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 18, 107, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: |-
                                =Reset(dd_LeaveType);
                                Reset(txt_Comments);
                                Set(varLeaveTime, "Full Day");
                                Set(varShowSubmitSheet, true);
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =11
                              Text: ="+ New request"
                              Visible: =App.Width >= 680
                              Width: =120
                  - Label_WelcomeName:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(23, 26, 51, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        PaddingBottom: =2
                        PaddingTop: =8
                        Size: =If(App.Width < 680, 18, 20)
                        Text: ="Hi, " & Coalesce(First(Split(User().FullName, " ")).Value, User().FullName)
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width
                  - Label_GreetingSub:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(91, 97, 120, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =22
                        Size: =12
                        Text: =Coalesce(Selected_ProjectID, "") & " · " & Coalesce(SelectedProject, "")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width
                  - vt_metrics:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMinWidth: =0
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - metric_used:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 247, 250, 1)
                              FillPortions: =1
                              Height: =52
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =6
                              PaddingLeft: =12
                              PaddingRight: =10
                              PaddingTop: =6
                              RadiusBottomLeft: =11
                              RadiusBottomRight: =11
                              RadiusTopLeft: =11
                              RadiusTopRight: =11
                            Children:
                              - Label_MetricUsedVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(23, 26, 51, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =16
                                    Text: |-
                                      =Text(
                                          Sum(
                                              Filter(
                                                  colMyRequests,
                                                  Year(StartDate) = Year(Today()) &&
                                                  ApprovalStatus_1 <> "Rejected" &&
                                                  Type_of_leave = "Vacation Paid"
                                              ),
                                              Days
                                          )
                                      )
                                    Width: =Parent.Width
                              - Label_MetricUsedCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =14
                                    Size: =9
                                    Text: ="USED / PENDING"
                                    Width: =Parent.Width
                        - metric_approver:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 247, 250, 1)
                              FillPortions: =1
                              Height: =52
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =6
                              PaddingLeft: =12
                              PaddingRight: =10
                              PaddingTop: =6
                              RadiusBottomLeft: =11
                              RadiusBottomRight: =11
                              RadiusTopLeft: =11
                              RadiusTopRight: =11
                              Visible: =App.Width >= 680
                            Children:
                              - Label_MetricApprVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(23, 26, 51, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(Trim(varApproverName)),
                                          "-",
                                          With(
                                              { parts: Split(Trim(varApproverName), " ") },
                                              If(
                                                  CountRows(parts) = 1,
                                                  First(parts).Value,
                                                  First(parts).Value & " " & Last(parts).Value
                                              )
                                          )
                                      )
                                    Width: =Parent.Width
                              - Label_MetricApprCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =14
                                    Size: =9
                                    Text: ="APPROVER"
                                    Width: =Parent.Width
            - vt_list_section:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =RGBA(245, 246, 251, 1)
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =If(App.Width < 680, 110, 24)
                  PaddingLeft: =If(App.Width < 680, 12, 16)
                  PaddingRight: =If(App.Width < 680, 12, 16)
                  PaddingTop: =If(App.Width < 680, 16, 22)
                  Width: =Parent.Width
                Children:
                  - Label_MyRequests:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(91, 97, 120, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =11
                        Text: ="YOUR REQUESTS"
                        Width: =Parent.Width
                  - Label_EmptyRequests:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(91, 97, 120, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =90
                        PaddingTop: =40
                        Size: =13
                        Text: =If(App.Width < 680, "No leave requests yet. Tap the + button to submit time off.", "No leave requests yet. Use New request to submit time off.")
                        Visible: =CountRows(colMyRequests) = 0
                        Width: =Parent.Width
                  - Gallery_MyRequests:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Height: =200
                        Items: =colMyRequests
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplatePadding: =8
                        TemplateSize: =108
                        Visible: =CountRows(colMyRequests) > 0
                        Width: =Parent.Width
                        WrapCount: =1
                      Children:
                        - card_Req:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =100
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - status_bar:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =If(Text(ThisItem.ApprovalStatus_1) = "Approved", RGBA(20, 108, 67, 1), Text(ThisItem.ApprovalStatus_1) = "Rejected", RGBA(179, 38, 30, 1), RGBA(184, 121, 26, 1))
                                    FillPortions: =0
                                    Height: =100
                                    OnSelect: |-
                                      =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                      Set(
                                          varDetailDates,
                                          If(
                                              ThisItem.StartDate = ThisItem.EndDate,
                                              Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                              Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                          )
                                      );
                                      Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                      Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                      Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                      Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                      Set(varShowRequestDetail, true);
                                    Width: =4
                              - req_main:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    Height: =100
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =10
                                    PaddingLeft: =12
                                    PaddingRight: =8
                                    PaddingTop: =10
                                  Children:
                                    - lbl_ReqType:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(23, 26, 51, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          OnSelect: |-
                                            =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                            Set(
                                                varDetailDates,
                                                If(
                                                    ThisItem.StartDate = ThisItem.EndDate,
                                                    Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                                    Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                                )
                                            );
                                            Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                            Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                            Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                            Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                            Set(varShowRequestDetail, true);
                                          Size: =14
                                          Text: =Text(ThisItem.Type_of_leave)
                                          Width: =Parent.Width
                                    - lbl_ReqDates:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(91, 97, 120, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          OnSelect: |-
                                            =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                            Set(
                                                varDetailDates,
                                                If(
                                                    ThisItem.StartDate = ThisItem.EndDate,
                                                    Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                                    Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                                )
                                            );
                                            Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                            Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                            Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                            Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                            Set(varShowRequestDetail, true);
                                          Size: =12
                                          Text: =If(ThisItem.StartDate = ThisItem.EndDate, Text(ThisItem.StartDate, "mmm d") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""), Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d")) & " · " & Text(ThisItem.Days) & If(Coalesce(Value(ThisItem.Days), 0) = 1, " day", " days")
                                          Width: =Parent.Width
                                    - row_ReqComments:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =20
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Visible: |-
                                            =!IsBlank(Trim(Coalesce(Text(ThisItem.Comments), ""))) ||
                                            !IsBlank(Trim(Coalesce(Text(ThisItem.Approver_Comments), "")))
                                          Width: =Parent.Width
                                        Children:
                                          - icon_ReqComments:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(0, 18, 107, 1)
                                                FillPortions: =0
                                                Height: =16
                                                Icon: =Icon.Message
                                                OnSelect: |-
                                                  =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                                  Set(
                                                      varDetailDates,
                                                      If(
                                                          ThisItem.StartDate = ThisItem.EndDate,
                                                          Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                                          Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                                      )
                                                  );
                                                  Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                                  Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                                  Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                                  Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                                  Set(varShowRequestDetail, true);
                                                Width: =16
                                          - lbl_ReqComments:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(0, 18, 107, 1)
                                                FillPortions: =1
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                                  Set(
                                                      varDetailDates,
                                                      If(
                                                          ThisItem.StartDate = ThisItem.EndDate,
                                                          Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                                          Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                                      )
                                                  );
                                                  Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                                  Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                                  Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                                  Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                                  Set(varShowRequestDetail, true);
                                                Size: =11
                                                Text: ="Comments"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =120
                              - req_actions:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =100
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingRight: =8
                                    Width: =If(ThisItem.ApprovalStatus_1 = "Pending" || ThisItem.ApprovalStatus_1 = "Rejected", 140, 96)
                                  Children:
                                    - pill_ReqStatus:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderThickness: =0
                                          Color: =If(Text(ThisItem.ApprovalStatus_1) = "Approved", RGBA(20, 108, 67, 1), Text(ThisItem.ApprovalStatus_1) = "Rejected", RGBA(179, 38, 30, 1), RGBA(184, 121, 26, 1))
                                          Fill: =If(Text(ThisItem.ApprovalStatus_1) = "Approved", RGBA(223, 243, 232, 1), Text(ThisItem.ApprovalStatus_1) = "Rejected", RGBA(251, 226, 224, 1), RGBA(252, 239, 217, 1))
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =24
                                          OnSelect: |-
                                            =Set(varDetailType, Coalesce(Text(ThisItem.Type_of_leave), ""));
                                            Set(
                                                varDetailDates,
                                                If(
                                                    ThisItem.StartDate = ThisItem.EndDate,
                                                    Text(ThisItem.StartDate, "mmm d, yyyy") & If(Coalesce(Value(ThisItem.Days), 0) < 1, " · " & Coalesce(Text(ThisItem.Leave_Time), ""), ""),
                                                    Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                                                )
                                            );
                                            Set(varDetailStatus, Coalesce(Text(ThisItem.ApprovalStatus_1), ""));
                                            Set(varDetailDays, Coalesce(Value(ThisItem.Days), 0));
                                            Set(varDetailComments, Coalesce(Text(ThisItem.Comments), ""));
                                            Set(varDetailApproverComments, Coalesce(Text(ThisItem.Approver_Comments), ""));
                                            Set(varShowRequestDetail, true);
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =10
                                          Text: =Upper(Text(ThisItem.ApprovalStatus_1))
                                          Width: =88
                                    - btn_ReqDelete:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(91, 97, 120, 1)
                                          FillPortions: =0
                                          Height: =26
                                          Icon: =Icon.Trash
                                          OnSelect: |-
                                            =Set(varShowRequestDetail, false);
                                            Set(varDeleteRequestID, ThisItem.ID);
                                            Set(varDeleteRequestLog, ThisItem.LOG_ID);
                                            Set(varDeleteStart, ThisItem.StartDate);
                                            Set(varDeleteEnd, ThisItem.EndDate);
                                            Set(varShowDeleteConfirm, true);
                                          Visible: =ThisItem.ApprovalStatus_1 = "Pending" || ThisItem.ApprovalStatus_1 = "Rejected"
                                          Width: =26
            - vt_phone_footer:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0

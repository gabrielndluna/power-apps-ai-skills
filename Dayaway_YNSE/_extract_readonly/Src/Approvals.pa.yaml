      - BG Header:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: "=// Max height if more than 13 rows\r\n\r\nMin(556,\r\n49 + 40 * CountRows(\r\nSortByColumns(\r\n    If(\r\n        !IsBlank(\r\n            LookUp(\r\n                'Vacations Tracking (Permissions)',\r\n                User_Email = User().Email,\r\n                User_Email\r\n            )\r\n        ),\r\n        // If user exists in Permissions list → show ALL entries\r\n        Filter(\r\n        'Vacations Tracking (Days)',\r\n        (IsBlank(Dropdown_Crew_App.Selected.Value) || Employee_Name = Dropdown_Crew_App.Selected.Value) &&\r\n        (IsBlank(DatePickerFrom_Date_App.SelectedDate) || StartDate >= DatePickerFrom_Date_App.SelectedDate) &&\r\n        (IsBlank(DatePickerTo_Date_App.SelectedDate) || EndDate <= DatePickerTo_Date_App.SelectedDate)\r\n        ),\r\n\r\n        \r\n        // Else → only entries where ApproverID_1 = current user\r\n        Filter(\r\n        'Vacations Tracking (Days)',\r\n        ApproverID_1 = User().Email,\r\n        (IsBlank(Dropdown_Crew_App.Selected.Value) || Employee_Name = Dropdown_Crew_App.Selected.Value)&&\r\n        (IsBlank(DatePickerFrom_Date_App.SelectedDate) || StartDate >= DatePickerFrom_Date_App.SelectedDate) &&\r\n        (IsBlank(DatePickerTo_Date_App.SelectedDate) || EndDate <= DatePickerTo_Date_App.SelectedDate)\r\n        )\r\n    ),\r\n    \"EndDate\",\r\n    SortOrder.Descending\r\n)\r\n    )\r\n)"
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =
            Width: =Rectangle_Header_App.Width
            X: =Rectangle_Header_App.X
            Y: =200

                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  OnSelect: =Select(Parent)
                  Size: =9
                  Text: =ThisItem.StartDate
                  Width: =StartDate_Header_App.Width
                  X: =TextLabel_Employee_App.X + TextLabel_Employee_App.Width
            - Label_EndDate_App:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  OnSelect: =Select(Parent)

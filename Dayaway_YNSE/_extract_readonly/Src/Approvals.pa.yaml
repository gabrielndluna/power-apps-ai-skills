            - Dropdown_Approval1_App:
                Control: Classic/DropDown@2.3.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =1
                  ChevronBackground: =RGBA(102, 113, 166, 1)
                  ChevronFill: =RGBA(255, 255, 255, 1)
                  ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  ChevronHoverFill: =RGBA(255, 255, 255, 1)
                  Default: =ThisItem.ApprovalStatus_1
                  Fill: |-
                    =If(
                        ThisItem.ApprovalStatus_1 = "Approved", RGBA(108, 212, 136, 1), // Green
                        ThisItem.ApprovalStatus_1 = "Rejected", RGBA(252, 124, 124, 1), // Red
                        ThisItem.ApprovalStatus_1 = "Pending", RGBA(252, 250, 124, 1), // Yellow
                        RGBA(255, 255, 255, 1) // Transparent
                    )
                  Font: =Font.'Open Sans'
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Items: =["Pending","Approved","Rejected"]
                  Items.Value: =Value
                  OnChange: |-
                    =If(
                        IsBlank(
                            LookUp(
                                colVacationsUpdates,
                                ID = ThisItem.ID
                            )
                        ),
                        Collect(
                            colVacationsUpdates,
                            {
                                ID: ThisItem.ID,
                                Employee: ThisItem.Employee,
                                ApproverID_1: ThisItem.ApproverID_1,
                                TypeofLeave : ThisItem.Type_of_leave, 
                                StartDate: ThisItem.StartDate,
                                EndDate: ThisItem.EndDate,
                                ApprovalStatus_1: Dropdown_Approval1_App.Selected.Value,
                                Approver_Comments: TextInput_AppComment_App.Text
                            }
                        ),
                        UpdateIf(
                            colVacationsUpdates,
                            ID = ThisItem.ID,
                            {
                                Employee: ThisItem.Employee,
                                ApproverID_1: ThisItem.ApproverID_1,
                                ApproverID_2: ThisItem.ApproverID_2,
                                TypeofLeave : ThisItem.Type_of_leave, 
                                StartDate: ThisItem.StartDate,
                                EndDate: ThisItem.EndDate,
                                ApprovalStatus_1: Dropdown_Approval1_App.Selected.Value,
                                Approver_Comments: TextInput_AppComment_App.Text
                            }
                        )
                    );
                  OnSelect: =Select(Parent)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  SelectionColor: =RGBA(255, 255, 255, 1)
                  SelectionFill: =RGBA(56, 96, 178, 1)
                  Size: =9
                  Width: =Approval1_Header_App.Width
                  X: =TextLabel_Comments_App.X + TextLabel_Comments_App.Width
            - TextInput_AppComment_App:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderThickness: =1
                  Default: =ThisItem.Approver_Comments
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: |-
                    =If(
                        IsBlank(
                            LookUp(
                                colVacationsUpdates,
                                ID = ThisItem.ID
                            )
                        ),
                        Collect(
                            colVacationsUpdates,
                            {
                                ID: ThisItem.ID,
                                ApprovalStatus_1: Dropdown_Approval1_App.Selected.Value,
                                Approver_Comments: TextInput_AppComment_App.Text
                            }
                        ),
                        UpdateIf(
                            colVacationsUpdates,
                            ID = ThisItem.ID,
                            {
                                ApprovalStatus_1: Dropdown_Approval1_App.Selected.Value,
                                Approver_Comments: TextInput_AppComment_App.Text
                            }
                        )
                    );
                  OnSelect: =Select(Parent)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =9
                  Width: =App_Comments_Header_App.Width
                  X: =Dropdown_Approval1_App.X + Dropdown_Approval1_App.Width

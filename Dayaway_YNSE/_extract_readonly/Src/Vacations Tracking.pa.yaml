      - Days_w/o_weekends:
          Control: Label@2.5.1
          Group: User_Selections
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: |+
              =With(
                  {
                      varStart: StartDatePicker_Date.SelectedDate,
                      varEnd: EndDatePicker_Date.SelectedDate,
                      varDiff: DateDiff(StartDatePicker_Date.SelectedDate, EndDatePicker_Date.SelectedDate) + 1
                  },
                  If(
                      Or(
                          IsBlank(varStart),
                          IsBlank(varEnd),
                          varDiff <= 0,
                          varDiff > 50000
                      ),
                      0,
                      If(
                          Leave_Time.Selected.Value <> "Full Day",
                          0.5,
                          With(
                              {
                                  varDateRange: ForAll(
                                      Sequence(varDiff),
                                      varStart + Value - 1
                                  )
                              },
                              CountIf(
                                  varDateRange,
                                  And(
                                      Weekday(Value) in [2, 3, 4, 5, 6],
                                      Not(Value in ForAll(colPublic_Holidays, DateValue(CleanDate)))
                                  )
                              )
                          )
                      )
                  )
              )
            Visible: =false
            Width: =91
            X: =1010
            Y: =107

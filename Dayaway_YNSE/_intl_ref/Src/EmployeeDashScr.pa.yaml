                                With(
                                    {
                                        s1: Coalesce(varSelectedRequest.ApprovalStatus_1, ""),
                                        s2: Coalesce(varSelectedRequest.ProjectDirector_ApprovalStatus.Value, "")
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(s1 = "Approved", s2 = "Approved"),
                                        ColorValue("#00643A"),

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected" , s2="Withdrawn"),
                                        ColorValue("#D61E2C"),

                                        // 🕒 Waiting (manager approved but PD pending/blank/N-A, or neither has acted)
                                        ColorValue("#FFC933")
                                    )
                                )
                              Height: =24
                              Icon: |-
                                =With(
                                    {
                                        s1: Coalesce(varSelectedRequest.ApprovalStatus_1, ""),
                                        s2: Coalesce(varSelectedRequest.ProjectDirector_ApprovalStatus.Value, "")
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(s1 = "Approved", s2 = "Approved"),
                                        Icon.CheckBadge,

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected"),
                                        Icon.CancelBadge,

                                        // 🕒 Manager approved, PD not acted yet (blank/pending/N/A)
                                        And(s1 = "Approved", Or(IsBlank(s2), s2 = "", s2 = "Pending", s2 = "N/A")),
                                        Icon.Clock,

                                        // 🕒 None acted yet (both blank/pending)
                                        And(Or(IsBlank(s1), s1 = "", s1 = "Pending"), Or(IsBlank(s2), s2 = "", s2 = "Pending")),
                                        Icon.Clock,

                                        s2 = "Withdrawn",
                                        Icon.Blocked,


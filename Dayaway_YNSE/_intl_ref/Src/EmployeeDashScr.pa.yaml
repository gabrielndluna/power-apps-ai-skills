                        - ApprovalDateLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =ThisItem.Modified
                              Width: =120
                              X: =(HRApprovalIcon.X + HRApprovalIcon.Width + 85)
                              Y: =(Rectangle.Height - Self.Height) / 2
                        - DeptApprovalIcon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: |-
                                =
                                With(
                                    {
                                        s1: Coalesce(ThisItem.ApprovalStatus_1, ""),
                                        s2: Coalesce(ThisItem.ProjectDirector_ApprovalStatus.Value, "")
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(s1 = "Approved", s2 = "Approved"),
                                        ColorValue("#00643A"),

                                        And(DateValue(ThisItem.Created) < Date(2025,03,18), s1="Approved"),
                                        ColorValue("#00643A"),//PhaseOut Eventually (End of 2026)

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected" , s1="Withdrawn", s2="Withdrawn"),
                                        ColorValue("#D61E2C"),

                                        // 🕒 Waiting (manager approved but PD pending/blank/N-A, or neither has acted)
                                        ColorValue("#FFC933")
                                    )
                                )
                              Height: =38
                              Icon: "=With(\r\n    {\r\n        s1: Coalesce(ThisItem.ApprovalStatus_1, \"\"),\r\n        s2: Coalesce(ThisItem.ProjectDirector_ApprovalStatus.Value, \"\")\r\n    },\r\n    If(\r\n        // ✅ Both approved\r\n        And(s1 = \"Approved\", s2 = \"Approved\"),\r\n        Icon.CheckBadge,\r\n\r\n        And(DateValue(ThisItem.Created) < Date(2025,03,18), ThisItem.ApprovalStatus_1=\"Approved\"),\r\n        Icon.CheckBadge,\r\n        \r\n        // ❌ Either rejected\r\n        Or(s1 = \"Rejected\", s2 = \"Rejected\"),\r\n        Icon.CancelBadge,\r\n\r\n        // \U0001F552 Manager approved, PD not acted yet (blank/pending/N/A)\r\n        And(s1 = \"Approved\", Or(IsBlank(s2), s2 = \"\", s2 = \"Pending\", s2 = \"N/A\")),\r\n        Icon.Clock,\r\n\r\n        // \U0001F552 None acted yet (both blank/pending)\r\n        And(Or(IsBlank(s1), s1 = \"\", s1 = \"Pending\"), Or(IsBlank(s2), s2 = \"\", s2 = \"Pending\")),\r\n        Icon.Clock,\r\n\r\n        s1 = \"Withdrawn\" || s2 = \"Withdrawn\",\r\n        Icon.Blocked,\r\n\r\n        // Default → still waiting\r\n        Icon.Clock\r\n    )\r\n)\r\n"
                              Width: =38
                              X: =(TotalDaysLabel.X + TotalDaysLabel.Width + 80)
                              Y: =(Rectangle.Height - Self.Height) / 2
                        - HRApprovalIcon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: |-
                                =With(
                                    {
                                        hasFlight: !IsBlank(ThisItem.Flight_DepartureDate),
                                        s1: Coalesce(ThisItem.ApprovalStatus_1, ""),
                                        s2: Coalesce(ThisItem.ProjectDirector_ApprovalStatus.Value, ""),
                                        sHR: Coalesce(ThisItem.ApprovalStatus_2, "")
                                    },
                                    If(
                                        hasFlight,
                                            // Flights present → color by HR status
                                            If(
                                                sHR = "Approved", ColorValue("#00643A"),   // Green
                                                sHR = "Rejected" || s1 = "Rejected" || s2 = "Rejected" || sHR="Withdrawn", ColorValue("#D61E2C"),   // Red
                                                ColorValue("#FFC933")                      // Yellow
                                            ),
                                        // No flights → color by combined Approver1 + PD status
                                        If(
                                            Or(s1 = "Rejected", s2 = "Rejected"), ColorValue("#D61E2C"),   // Red
                                            And(s1 = "Approved", s2 = "Approved"), ColorValue("#00643A"),  // Green
                                            ColorValue("#FFC933")                                           // Yellow
                                        )
                                    )
                                )
                              Height: =38
                              Icon: |-

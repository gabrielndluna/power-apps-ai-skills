                                        s2: Coalesce(ThisItem.ProjectDirector_ApprovalStatus.Value, ""),
                                        sHR: Coalesce(ThisItem.ApprovalStatus_2, "")
                                    },
                                    If(
                                        hasFlight,
                                            // Flights present → reflect HR status (ApprovalStatus_2)
                                            If(
                                                sHR = "Approved", Icon.CheckBadge,
                                                sHR = "Withdrawn", Icon.Blocked,
                                                sHR = "Rejected" || s1  = "Rejected" || s2 = "Rejected", Icon.CancelBadge,
                                                Icon.Clock
                                            ),
                                        // No flights → require both Approver1 and PD approved
                                        If(
                                            Or(s1 = "Rejected", s2 = "Rejected"), "",
                                            And(s1 = "Approved", s2 = "Approved"), " ",
                                            ""
                                        )
                                    )

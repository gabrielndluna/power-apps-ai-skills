                                        _hasFlights1: !IsBlank(ThisItem.Flight_DepartureDate),
                                        _HRApprove: Coalesce(ThisItem.ApprovalStatus_2, "")
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(!_hasFlights1, s1 = "Approved", s2 = "Approved"),
                                        Icon.CheckBadge,

                                        And(_hasFlights1, s1 = "Approved", s2 = "Approved", _HRApprove = "Approved"),
                                        Icon.CheckBadge,

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected", _HRApprove = "Rejected"),
                                        Icon.CancelBadge,

                                        Or(s1 = "Withdrawn", s2 = "Withdrawn", _HRApprove = "Withdrawn"),
                                        Icon.Blocked,

                                        // 🕒 Manager approved, PD not acted yet (blank/pending/N/A)
                                        And(s1 = "Approved", Or(IsBlank(s2), s2 = "", s2 = "Pending", s2 = "N/A")),

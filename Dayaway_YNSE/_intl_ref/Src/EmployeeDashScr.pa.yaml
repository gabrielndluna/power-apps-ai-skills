                  - Label5_1:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =ColorValue("#494949")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =25
                        Size: =16
                        Text: ="Flight Information"
                        Visible: |-
                          =If(
                              CountRows(Gallery1_1.AllItems) > 0,
                              true,
                              false)
                        Width: =250
                        X: =Container3_1.X
                        Y: =SummaryHeaderLabel_12.Y + 330
                  - Button3_19:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: |
                          =ColorValue("#D60C30")
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: "=// ------------------------------\n// 1) VALIDATIONS\n// ------------------------------\nSet(_valid, true);\n\n// Pre-calc flight flags and rows (needed for validation)\nSet(_hasFlights, CountRows(colFlights) > 0);\nSet(_r1, If(CountRows(colFlights) >= 1, First(colFlights), Blank()));\nSet(_r2, If(CountRows(colFlights) >= 2, Last(FirstN(colFlights, 2)), Blank()));\nSet(_r3, If(CountRows(colFlights) >= 3, Last(colFlights), Blank()));\n\n// Basic date checks: required, not in the past, and End >= Start (same-day allowed)\nIf(\n    Or(\n        // Required\n        IsBlank(DatePicker1_2.SelectedDate),\n        IsBlank(DatePicker1_3.SelectedDate),\n\n        // Not in the past\n        DateValue(DatePicker1_2.SelectedDate) < Today(),\n        DateValue(DatePicker1_3.SelectedDate) < Today(),\n\n        // End must be same or after Start\n        DatePicker1_3.SelectedDate < DatePicker1_2.SelectedDate\n    ),\n    Notify(\n        \"Start and End dates are required, must be on or after today, and End Date cannot be before Start Date.\",\n        NotificationType.Error\n    );\n    Set(_valid, false)\n);\n\n// Must be same year, and CURRENT year (Jan 1 – Dec 31)\nIf(\n    _valid &&\n    Or(\n        Year(DatePicker1_2.SelectedDate) <> Year(DatePicker1_3.SelectedDate),\n        Year(DatePicker1_2.SelectedDate) <> Year(Today()),\n        Year(DatePicker1_3.SelectedDate) <> Year(Today())\n    ),\n    Notify(\n        \"Dates must be within the current calendar year (Jan 1–Dec 31). Submit next-year days separately.\",\n        NotificationType.Error\n    );\n    Set(_valid, false)\n);\n\n// Request Type is required (Dropdown3)\nIf(\n    _valid &&\n    (IsBlank(Dropdown3_5.Selected) || IsBlank(Dropdown3_5.Selected.Value)),\n    Notify(\"Please select a Request Type before submitting.\", NotificationType.Error);\n    Set(_valid, false)\n);\n\n// Flight requirements if any flight exists\nIf(\n    _valid && _hasFlights,\n    // Primary traveler flight fields required\n    If(\n        Or(\n            IsBlank(_r1),    // safety if collection changed mid-run\n            IsBlank(_r1.DepartureDate),\n            IsBlank(_r1.ArrivalDate),\n            IsBlank(_r1.DepartureLocation) || Trim(_r1.DepartureLocation) = \"\",\n            IsBlank(_r1.ArrivalLocation)   || Trim(_r1.ArrivalLocation) = \"\"\n        ),\n        Notify(\n            \"When adding flights, Departure Date, Departure Location, Arrival Date, and Arrival Location are required for the primary traveler.\",\n            NotificationType.Error\n        );\n        Set(_valid, false)\n    );\n\n    // Companion 1 name required iff a second row exists\n    If(\n        _valid && CountRows(colFlights) >= 2 && (IsBlank(_r2.TravellerName) || Trim(_r2.TravellerName) = \"\"),\n        Notify(\"Please enter Companion 1 name.\", NotificationType.Error);\n        Set(_valid, false)\n    );\n\n    // Companion 2 name required iff a third row exists\n    If(\n        _valid && CountRows(colFlights) >= 3 && (IsBlank(_r3.TravellerName) || Trim(_r3.TravellerName) = \"\"),\n        Notify(\"Please enter Companion 2 name.\", NotificationType.Error);\n        Set(_valid, false)\n    )\n);\n\n// ------------------------------\n// 2) ONLY PROCEED IF VALID\n// ------------------------------\nIf(\n    _valid,\n\n    // Helpers\n    Set(vStart, DatePicker1_2.SelectedDate);\n    Set(vEnd,   DatePicker1_3.SelectedDate);\n    Set(vEmployeeName, Trim(varEmployeeRow.'First Name' & \" \" & varEmployeeRow.'Last Name'));\n    Set(GUID_Var, GUID());\n\n    // Project text (ensure consistent matching)\n    Set(_projectNameText, Coalesce(varProjectRow.'Project Name', varEmployeeRow.'Project Name'));\n\n    // ------------------------------\n    // BUSINESS DAYS (Mon–Fri minus project holidays)\n    // ------------------------------\n\n    // \U0001F449 VERSION A (Holidays → Projects is TEXT): use this\n    Set(\n        _holidaysForProject,\n        Filter(\n            'Vacations Tracking (Public Holidays)',\n            Projects = _projectNameText\n        )\n    );\n\n    /*\n    // \U0001F449 VERSION B (Holidays → Projects is LOOKUP): if A errors, comment A and UNCOMMENT this\n    Set(\n        _holidaysForProject,\n        Filter(\n            'Vacations Tracking (Public Holidays)',\n            Projects.Value = _projectNameText\n        )\n    );\n    */\n\n    // Inclusive vStart..vEnd; Monday=1..Friday=5; exclude holidays\n    Set(\n        _businessDays,\n        Sum(\n            ForAll(\n                Sequence( DateDiff( DateValue(vStart), DateValue(vEnd) ) + 1 ),\n                With(\n                    { d: DateAdd( DateValue(vStart), Value - 1, TimeUnit.Days ) },\n                    If(\n                        And(\n                            Weekday(d, StartOfWeek.Monday) <= 5,\n                            IsBlank( LookUp( _holidaysForProject, Date = DateValue(d) ) )\n                        ),\n                        1,\n                        0\n                    )\n                )\n            ),\n            Value\n        )\n    );\n\n    // ------------------------------\n    // TRAVEL DAYS (simple from Employees when any flight exists)\n    // ------------------------------\n    Set(_travelDays, If(_hasFlights || ((varUserProject=\"Barbados Central\" || varUserProject=\"Pendry Hotel\") && Dropdown3_8.Selected.Value=\"Yes\"), varEmployeeRow.'Travel days per home leave', 0));\n\n    Set(\n        varPublicHolidaysWorked3,\n        Sum(\n            Filter(\n                'Vacations Tracking (Worked Holidays)',\n                Lower(Employee_email) = Lower(User().Email),\n                Year = Year(Today())\n            ),\n            Total\n        )\n    );\n\n    // Entitlement\n    Set(\n        varEntitlement3,\n        Coalesce(\n            varEmployeeRow.'Vacation Entitlement (per anum)' +\n            varEmployeeRow.Carryover +\n            varPublicHolidaysWorked3,\n            0\n        )\n    );\n\n    // Days Used (consolidated approval logic)\n    Set(\n        varDaysUsed3,\n        Sum(\n            Filter(\n                'Vacations Tracking (Days)',\n                Lower(Employee) = Lower(User().Email),\n                EndDate >= DateValue(\"01/01/\" & Year(Today())),\n                StartDate <= DateValue(\"12/31/\" & Year(Today())),\n                Archived <> \"Yes\" && Archived <> \"Withdrawn\",\n                Type_of_leave <> \"Sick Day\",\n\n                If(\n                    !IsBlank(Flight_DepartureDate),\n                    ApprovalStatus_2 = \"Approved\",\n                    \n                    If(\n                        DateValue(Created) < Date(2026,03,18),\n                        ApprovalStatus_1 = \"Approved\",\n                        ProjectDirector_ApprovalStatus.Value = \"Approved\"\n                    \n                    )\n                )\n            ),\n            Days\n        )\n    );\n\n    // Days Available\n    Set(\n        varDaysAvailable3,\n        Max(varEntitlement3 - varDaysUsed3, 0)\n    );\n\n    // -----------------------------------------------------\n    // ✅ NEW DAYS AVAILABLE VALIDATION\n    // -----------------------------------------------------\n    If(\n        _valid,\n        Set(\n            _daysRequested,\n            If(\n                Dropdown3_3.Selected.Value = \"First Half\" || Dropdown3_3.Selected.Value = \"Second Half\",\n                0.5,\n                _businessDays\n            )\n        );\n\n        If(\n            _daysRequested > varDaysAvailable,\n            Notify(\n                \"You do not have enough available vacation days available to submit this request.\",\n                NotificationType.Error\n            );\n            Set(_valid, false)\n        )\n    );\n\n    // ------------------------------\n    // PATCH TO 'Vacations Tracking (Days)'\n    // ------------------------------\n    If (_valid ,Set(\n        varNewVacation,\n        Patch(\n            'Vacations Tracking (Days)',\n            Defaults('Vacations Tracking (Days)'),\n            {\n                // Identity\n                Employee: User().Email,\n                Employee_Name: vEmployeeName,\n                Project: _projectNameText,\n                Title: GUID_Var,\n                LOG_ID: GUID_Var,\n\n                // Dates\n                StartDate: vStart,\n                EndDate:   vEnd,\n                Leave_Time: Dropdown3_6.Selected.Value,\n\n                // Computed\n                Days: If(Dropdown3_6.Selected.Value=\"First Half\" || Dropdown3_6.Selected.Value=\"Second Half\", 0.5 ,Max(_businessDays-_travelDays,0)),\n                Travel_Days: Max(0, _travelDays),\n\n                // Meta\n                Comments: ManagerNameField_36.Text,\n                Type_of_leave: Dropdown3_5.Selected.Value,\n                App_Name: \"Dayaway_HR_Tracking\",\n\n                'Travel Days Needed': If(varUserProject = \"Barbados Central\" || varUserProject = \"Pendry Hotel\", TravelDaysNeeded, \"\" ),\n\n                // Approvals\n                ApproverID_1: varEmployeeRow.'Approver Email',\n                ApprovalStatus_1: \"Pending\",\n\n                // Flights (use precomputed _r1/_r2/_r3)\n                Flight_DepartureDate:     If(IsBlank(_r1), Blank(), _r1.DepartureDate),\n                Flight_DepartureLocation: If(IsBlank(_r1), \"\", _r1.DepartureLocation),\n                Flight_ArrivalDate:       If(IsBlank(_r1), Blank(), _r1.ArrivalDate),\n                Flight_ArrivalLocation:   If(IsBlank(_r1), \"\", _r1.ArrivalLocation),\n\n                Companion_1:              If(IsBlank(_r2), \"\", _r2.TravellerName),\n                Comp1_DepartureDate:      If(IsBlank(_r2), Blank(), _r2.DepartureDate),\n                Comp1_DepartureLocation:  If(IsBlank(_r2), \"\", _r2.DepartureLocation),\n                Comp1_ArrivalDate:        If(IsBlank(_r2), Blank(), _r2.ArrivalDate),\n                Comp1_ArrivalLocation:    If(IsBlank(_r2), \"\", _r2.ArrivalLocation),\n\n                Companion_2:              If(IsBlank(_r3), \"\", _r3.TravellerName),\n                Comp2_DepartureDate:      If(IsBlank(_r3), Blank(), _r3.DepartureDate),\n                Comp2_DepartureLocation:  If(IsBlank(_r3), \"\", _r3.DepartureLocation),\n                Comp2_ArrivalDate:        If(IsBlank(_r3), Blank(), _r3.ArrivalDate),\n                Comp2_ArrivalLocation:    If(IsBlank(_r3), \"\", _r3.ArrivalLocation)\n            }\n        )\n    );\n\n    // ------------------------------\n    // SUCCESS UX\n    // ------------------------------\n    If(\n        !IsBlank(varNewVacation.ID),\n        UpdateContext({ showSubmitDialog: false });\n        Notify(\"Your request was submitted. Please allow 3-5 business days for review.\", NotificationType.Success);\n        Clear(colFlights);\n        Reset(DatePicker1_2); Reset(DatePicker1_3); Reset(ManagerNameField_36); Reset(Dropdown3_5)\n    );\n\n    // ------------------------------\n    // EMAILS (after success)\n    // ------------------------------\n    If(\n        _hasFlights,\n        Office365Outlook.SendEmailV2(\n            varEmployeeRow.'Approver Email',\n            \"Vacation request (with flights) - \" & vEmployeeName,\n            \"<p>A vacation request with flights was submitted by \" & vEmployeeName & \".</p>\" &\n            \"<p><strong>Requested dates</strong></p>\" &\n            \"<p>Start Date: \" & Text(vStart, \"[$-en-US]mmm d, yyyy\") & \"</p>\" &\n            \"<p>End Date: \" & Text(vEnd, \"[$-en-US]mmm d, yyyy\") & \"</p>\"&\n            \"<p>Access the <a href=\"\"https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028\"\">Dayaway</a> app to review the request.</p>\",\n            { From: User().Email, Cc: User().Email, IsHtml: true }\n        ),\n        Office365Outlook.SendEmailV2(\n            varEmployeeRow.'Approver Email',\n            \"Vacation request - \" & vEmployeeName,\n            \"<p>A vacation request was submitted by \" & vEmployeeName & \".</p>\" &\n            \"<p><strong>Requested dates</strong></p>\" &\n            \"<p>Start Date: \" & Text(vStart, \"[$-en-US]mmm d, yyyy\") & \"</p>\" &\n            \"<p>End Date: \" & Text(vEnd, \"[$-en-US]mmm d, yyyy\") & \"</p>\" &\n            \"<p>Access the <a href=\"\"https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028\"\">Dayaway</a> app to review the request.</p>\",\n            { From: User().Email, Cc: User().Email, IsHtml: true }\n        )\n    );\n\n    UpdateContext({ locSubmitBoxPhone: false });\n));"
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Submit Request"

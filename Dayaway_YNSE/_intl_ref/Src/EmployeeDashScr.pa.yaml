Screens:
  EmployeeDashScr:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=\r\nUpdateContext({ locSection: \"EmployeeHome\" });\r\n\r\nSet(varShowDialog, false);\r\nSet(varSaving, false);\r\n\r\nClearCollect(\r\n    colFlights,\r\n    {\r\n        TravellerName: Trim(varEmployeeRow.'First Name' & \" \" & varEmployeeRow.'Last Name'),\r\n        TravellerType: \"Employee\",\r\n        DepartureDate: DateValue(\"01/01/2000\") ,\r\n        DepartureLocation: \"\",\r\n        ArrivalDate: DateValue(\"01/01/2000\"),\r\n        ArrivalLocation: \"\"\r\n    }\r\n);\r\n\r\nSet(\r\n    varPublicHolidaysWorked,\r\n    Sum(\r\n        Filter(\r\n            'Vacations Tracking (Worked Holidays)',\r\n\r\n            // If your email column is named 'Employee' (text), keep your original compare:\r\n            Lower(Employee_email) = Lower(User().Email),   // <-- if your column is actually 'Employee Email', change to Lower('Employee Email')\r\n\r\n            Year = Year(Today())\r\n        ),\r\n        Total\r\n    )\r\n);\r\n\r\n\r\n\r\n\r\nSet(varEntitlement,        Coalesce(varEmployeeRow.'Vacation Entitlement (per anum)' + varEmployeeRow.Carryover + varPublicHolidaysWorked, 0));\r\n\r\n\r\nSet(\r\n    varDaysUsed,\r\n    Sum(\r\n        Filter(\r\n            'Vacations Tracking (Days)',\r\n\r\n            // Employee match\r\n            Lower(Employee) = Lower(User().Email),\r\n\r\n            // Falls within year\r\n            EndDate >= varYearStart,\r\n            StartDate <= varYearEnd,\r\n\r\n            // Not archived\r\n            Archived <> \"Yes\"  && Archived <> \"Withdrawn\",\r\n            Type_of_leave <> \"Sick Day\",\r\n\r\n            // Consolidated approval logic\r\n            If(\r\n                // --- 1. Flights exist → ApprovalStatus_2 required\r\n                !IsBlank(Flight_DepartureDate),\r\n                ApprovalStatus_2 = \"Approved\",\r\n\r\n                // --- 2. No flights → PD logic\r\n                \r\n                If(\r\n                    DateValue(Created) < Date (2026, 03, 18),\r\n                        // Old app logic → use ApprovalStatus_1\r\n                    ApprovalStatus_1 = \"Approved\",\r\n\r\n                        // New app logic → PD approval required\r\n                    ProjectDirector_ApprovalStatus.Value = \"Approved\"\r\n                )\r\n                \r\n            )\r\n        ),\r\n        Days\r\n    )\r\n);\r\n\r\nSet(\r\n    varDaysAvailable,\r\n    Max(varEntitlement - varDaysUsed, 0)\r\n);\r\n"
    Children:

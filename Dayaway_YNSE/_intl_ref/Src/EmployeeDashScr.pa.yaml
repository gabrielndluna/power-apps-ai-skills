                              Y: =(Rectangle.Height - Self.Height) / 2
                        - EndDateLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14

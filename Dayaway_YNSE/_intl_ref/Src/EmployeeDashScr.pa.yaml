                                    {
                                        s1: Coalesce(ThisItem.ApprovalStatus_1, ""),
                                        s2: Coalesce(ThisItem.ProjectDirector_ApprovalStatus.Value, ""),
                                        _HRApprove: Coalesce(ThisItem.ApprovalStatus_2, ""),
                                        _hasFlights1: !IsBlank(ThisItem.Flight_DepartureDate)
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(!_hasFlights1, s1 = "Approved", s2 = "Approved"),
                                        ColorValue("#00643A"),

                                        And(_hasFlights1, s1 = "Approved", s2 = "Approved", _HRApprove ="Approved"),
                                        ColorValue("#00643A"),

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected", _HRApprove="Rejected", s1 = "Withdrawn", s2 = "Withdrawn", _HRApprove="Withdrawn"),
                                        ColorValue("#D61E2C"),

                                        // 🕒 Waiting (manager approved but PD pending/blank/N-A, or neither has acted)
                                        ColorValue("#FFC933")
                                    )
                                )
                              Height: =28
                              Icon: |
                                =With(
                                    {

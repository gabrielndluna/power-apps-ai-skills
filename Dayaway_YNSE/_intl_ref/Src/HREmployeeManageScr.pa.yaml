                        BorderColor: =ColorValue("#494949")
                        BorderThickness: =1
                        ChevronBackground: =ColorValue("#D60C30")
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        Color: =ColorValue("#494949")
                        DefaultSelectedItems: |-
                          =With(
                              {
                                  approverEmail: Trim(varSelectedEmployee.'Approver Email')
                              },
                              If(
                                  !IsBlank(approverEmail),
                                  With(
                                      { u: Office365Users.UserProfileV2(approverEmail) },
                                      Table(
                                          {
                                              Id: u.id,
                                              DisplayName: u.displayName,
                                              Mail: Coalesce(u.mail, u.userPrincipalName),
                                              UserPrincipalName: u.userPrincipalName,
                                              Department: u.department
                                          }
                                      )
                                  ),
                                  []
                              )
                          )
                        DisplayFields: =["DisplayName"]
                        Fill: =ColorValue("#D9ECFA")
                        Font: =Font.'Segoe UI'
                        Height: =45
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Items: |-
                          =If(
                              Len(Trim(Self.SearchText)) >= 2,
                              ShowColumns(
                                  Office365Users.SearchUser(
                                      {
                                          searchTerm: Trim(Self.SearchText),
                                          top: 5
                                      }
                                  ),
                                  Id,
                                  DisplayName,
                                  Mail,
                                  UserPrincipalName,
                                  Department
                              )
                          )
                        OnChange: |-
                          =Set(
                              varSelectedEmployee,
                              Patch(
                                  varSelectedEmployee,
                                  {
                                      'Approver Name': Self.Selected.DisplayName,
                                      'Approver Email': Self.Selected.Mail
                                  }
                              )
                          );

                          Reset(ManagerNameField_16);
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["DisplayName","Mail"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width*0.45
                        X: =28
                        Y: =417

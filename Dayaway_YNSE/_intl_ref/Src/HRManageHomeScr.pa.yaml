                  - Button3_12:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: |
                          =ColorValue("#D60C30")
                        Font: =Font.'Segoe UI'
                        Height: |
                          =50
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: "=// =======================================================\r\n// 1) INITIALIZE\r\n// =======================================================\r\nSet(_valid, true);\r\n\r\n// Employee\r\nSet(\r\n    varEmployeeLine,\r\n    LookUp(\r\n        'Vacations Tracking (Employees)',\r\n        Lower(Email) = Lower(ComboBox4.Selected.Mail)\r\n    )\r\n);\r\n\r\n// Project\r\nSet(\r\n    _projectNameText,\r\n    Coalesce(\r\n        LookUp(\r\n            'Vacations Tracking (Projects)',\r\n            Lower('Project Name') = Lower(varEmployeeLine.'Project Name')\r\n        ).'Project Name',\r\n        varEmployeeLine.'Project Name'\r\n    )\r\n);\r\n\r\n// Dates\r\nSet(vStart, DatePicker1_4.SelectedDate);\r\nSet(vEnd,   DatePicker1_5.SelectedDate);\r\n\r\n// Flights\r\nSet(_hasFlights, CountRows(colFlights) > 0);\r\nSet(_r1, If(CountRows(colFlights) >= 1, First(colFlights), Blank()));\r\nSet(_r2, If(CountRows(colFlights) >= 2, Last(FirstN(colFlights, 2)), Blank()));\r\nSet(_r3, If(CountRows(colFlights) >= 3, Last(colFlights), Blank()));\r\n\r\n\r\n// =======================================================\r\n// 2) VALIDATIONS\r\n// =======================================================\r\n\r\n// Date checks\r\nIf(\r\n    Or(IsBlank(vStart), IsBlank(vEnd), vEnd < vStart),\r\n    Notify(\"Start and End dates are required and must be valid.\", NotificationType.Error);\r\n    Set(_valid, false)\r\n);\r\n\r\n// Same calendar year\r\nIf(\r\n    _valid &&\r\n    Or(\r\n        Year(vStart) <> Year(vEnd),\r\n        Year(vStart) <> Year(Today())\r\n    ),\r\n    Notify(\"Dates must be within the current calendar year.\", NotificationType.Error);\r\n    Set(_valid, false)\r\n);\r\n\r\n// Request type\r\nIf(\r\n    _valid && IsBlank(Dropdown3_9.Selected.Value),\r\n    Notify(\"Please select a Request Type.\", NotificationType.Error);\r\n    Set(_valid, false)\r\n);\r\n\r\n// Flight validation\r\nIf(\r\n    _valid && _hasFlights,\r\n    If(\r\n        Or(\r\n            IsBlank(_r1.DepartureDate),\r\n            IsBlank(_r1.ArrivalDate),\r\n            IsBlank(_r1.DepartureLocation),\r\n            IsBlank(_r1.ArrivalLocation)\r\n        ),\r\n        Notify(\"Primary traveler flight details are required.\", NotificationType.Error);\r\n        Set(_valid, false)\r\n    );\r\n\r\n    If(\r\n        _valid && CountRows(colFlights) >= 2 && IsBlank(_r2.TravellerName),\r\n        Notify(\"Please enter Companion 1 name.\", NotificationType.Error);\r\n        Set(_valid, false)\r\n    );\r\n\r\n    If(\r\n        _valid && CountRows(colFlights) >= 3 && IsBlank(_r3.TravellerName),\r\n        Notify(\"Please enter Companion 2 name.\", NotificationType.Error);\r\n        Set(_valid, false)\r\n    )\r\n);\r\n\r\n\r\n// =======================================================\r\n// 3) CALCULATIONS (ONLY IF STILL VALID)\r\n// =======================================================\r\nIf(_valid,\r\n\r\n    // ---------------------------------------------------\r\n    // Holidays\r\n    // ---------------------------------------------------\r\n    Set(\r\n        _holidaysForProject,\r\n        Filter(\r\n            'Vacations Tracking (Public Holidays)',\r\n            Projects = _projectNameText\r\n        )\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // Business days (deterministic)\r\n    // ---------------------------------------------------\r\n    Set(\r\n        _businessDays,\r\n        Sum(\r\n            ForAll(\r\n                Sequence(DateDiff(vStart, vEnd) + 1),\r\n                With(\r\n                    { d: DateAdd(vStart, Value - 1) },\r\n                    If(\r\n                        Weekday(d, StartOfWeek.Monday) <= 5 &&\r\n                        IsBlank(LookUp(_holidaysForProject, Date = d)),\r\n                        1,\r\n                        0\r\n                    )\r\n                )\r\n            ),\r\n            Value\r\n        )\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // Travel days\r\n    // ---------------------------------------------------\r\n    Set(\r\n        _travelDays,\r\n        If(\r\n            _hasFlights || Dropdown3_11.Selected.Value = \"Yes\",\r\n            Coalesce(varEmployeeLine.'Travel days per home leave', 0),\r\n            0\r\n        )\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // ENTITLEMENT\r\n    // ---------------------------------------------------\r\n    Set(\r\n        varPublicHolidaysWorked4,\r\n        Coalesce(\r\n            Sum(\r\n                Filter(\r\n                    'Vacations Tracking (Worked Holidays)',\r\n                    Lower(Employee_email) = Lower(ComboBox4.Selected.Mail),\r\n                    Year = Year(Today())\r\n                ),\r\n                Total\r\n            ),\r\n            0\r\n        )\r\n    );\r\n\r\n    Set(\r\n        varEntitlement4,\r\n        Coalesce(\r\n            varEmployeeLine.'Vacation Entitlement (per anum)' +\r\n            varEmployeeLine.Carryover +\r\n            varPublicHolidaysWorked4,\r\n            0\r\n        )\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // DAYS USED (CORRECT OVERLAP + APPROVAL LOGIC)\r\n    // ---------------------------------------------------\r\n    Set(\r\n        varDaysUsed4,\r\n        Coalesce(\r\n            Sum(\r\n                Filter(\r\n                    'Vacations Tracking (Days)',\r\n                    Lower(Employee) = Lower(ComboBox4.Selected.Mail),\r\n                    Archived <> \"Yes\" && Archived <> \"Withdrawn\",\r\n                    Type_of_leave <> \"Sick Day\",\r\n                    StartDate <= Date(Year(Today()), 12, 31),\r\n                    EndDate   >= Date(Year(Today()), 1, 1),\r\n                    (\r\n                        ApprovalStatus_1 = \"Approved\" ||\r\n                        ApprovalStatus_2 = \"Approved\" ||\r\n                        ProjectDirector_ApprovalStatus.Value = \"Approved\"\r\n                    )\r\n                ),\r\n                Days\r\n            ),\r\n            0\r\n        )\r\n    );\r\n    \r\n\r\n    // ---------------------------------------------------\r\n    // AVAILABLE\r\n    // ---------------------------------------------------\r\n    Set(\r\n        varDaysAvailable4,\r\n        Max(varEntitlement4 - varDaysUsed4, 0)\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // DAYS REQUESTED (EXACT MATCH TO PATCH)\r\n    // ---------------------------------------------------\r\n    Set(\r\n        _daysRequested,\r\n        If(\r\n            Dropdown3_10.Selected.Value = \"First Half\" ||\r\n            Dropdown3_10.Selected.Value = \"Second Half\",\r\n            0.5,\r\n            Max((_businessDays - _travelDays), 0)\r\n        )\r\n    );\r\n\r\n    // ---------------------------------------------------\r\n    // FINAL AVAILABILITY CHECK\r\n    // ---------------------------------------------------\r\n    If(\r\n        _daysRequested > varDaysAvailable4,\r\n        Notify(\r\n            \"Not enough available vacation days.\" &\r\n            \" Requested: \" & _daysRequested &\r\n            \" | Available: \" & varDaysAvailable4 &\r\n            \" | Available: \" & varDaysAvailable4,\r\n            NotificationType.Error\r\n        );\r\n        Set(_valid, false)\r\n    )\r\n);\r\n\r\n\r\n// =======================================================\r\n// 4) PATCH\r\n// =======================================================\r\nIf(_valid,\r\n\r\n    Set(GUID_Var, GUID());\r\n\r\n    Patch(\r\n        'Vacations Tracking (Days)',\r\n        Defaults('Vacations Tracking (Days)'),\r\n        {\r\n            Employee: ComboBox4.Selected.Mail,\r\n            Employee_Name: ComboBox4.Selected.DisplayName,\r\n            Project: _projectNameText,\r\n            Title: GUID_Var,\r\n            LOG_ID: GUID_Var,\r\n\r\n            StartDate: vStart,\r\n            EndDate: vEnd,\r\n            Leave_Time: Dropdown3_10.Selected.Value,\r\n\r\n            Days: _daysRequested,\r\n            Travel_Days: _travelDays,\r\n\r\n            Type_of_leave: Dropdown3_9.Selected.Value,\r\n            Comments: ManagerNameField_15.Text,\r\n            App_Name: \"Dayaway_HR_Tracking\",\r\n\r\n            ApproverID_1: varEmployeeLine.'Approver Email',\r\n            ApprovalStatus_1: \"Pending\" ,\r\n\r\n            Flight_DepartureDate: _r1.DepartureDate,\r\n            Flight_DepartureLocation: _r1.DepartureLocation,\r\n            Flight_ArrivalDate: _r1.ArrivalDate,\r\n            Flight_ArrivalLocation: _r1.ArrivalLocation,\r\n\r\n            Companion_1: _r2.TravellerName,\r\n            Companion_2: _r3.TravellerName\r\n        }\r\n    );\r\n\r\n    Notify(\"Your request was submitted successfully.\", NotificationType.Success);\r\n\r\n    Clear(colFlights);\r\n    Reset(DatePicker1_4);\r\n    Reset(DatePicker1_5);\r\n    Reset(Dropdown3_9)\r\n);\r\n\r\nReset(Dropdown3_11);\r\nRefresh('Vacations Tracking (Days)');\r\nClear(colFlights);\r\nReset(DatePicker1_4);\r\nReset(DatePicker1_5);\r\nReset(Dropdown3_9);\r\nReset(ComboBox4);"
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Submit Request"
                        Width: =200
                        X: =(Parent.Width-Self.Width)/2
                        Y: =622

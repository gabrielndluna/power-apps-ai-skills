                  - Label5_2:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =ColorValue("#494949")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =24
                        Text: ="Flight Information"
                        Visible: |-
                          =If(
                              CountRows(Gallery1_2.AllItems) > 0,
                              true,
                              false)
                        Width: =300

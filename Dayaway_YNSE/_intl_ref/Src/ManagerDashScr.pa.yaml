                                                sHR = "Rejected" || s1 = "Rejected" || s2 = "Rejected" || sHR = "Withdrawn", ColorValue("#D61E2C"),   // Red
                                                ColorValue("#FFC933")                      // Yellow
                                            ),
                                        // No flights → color by combined Approver1 + PD status
                                        If(
                                            Or(s1 = "Rejected", s2 = "Rejected"), ColorValue("#D61E2C"),   // Red
                                            And(s1 = "Approved", s2 = "Approved"), ColorValue("#00643A"),  // Green

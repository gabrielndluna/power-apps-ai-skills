                        - TableIcon_2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =ColorValue("#494949")
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              DisabledColor: =RGBA(119, 119, 119, 1)
                              Height: =50
                              Icon: =Icon.ChevronRight
                              OnSelect: "=\nSet(varSelectedRequest, ThisItem);\nUpdateContext({ locShowSummary: true });\n\nSet(\n    varEmployeeRowManage,\n    LookUp(\n        'Vacations Tracking (Employees)',   // <-- double-check the list name spelling; use your exact name\n        Lower(Email) = Lower(varSelectedRequest.Employee)\n    )\n);\n\n\nSet(\n    varPublicHolidaysWorked2,\n    Sum(\n        Filter(\n            'Vacations Tracking (Worked Holidays)',\n\n            // If your email column is named 'Employee' (text), keep your original compare:\n            Lower(Employee_email) = Lower(varSelectedRequest.Employee),   // <-- if your column is actually 'Employee Email', change to Lower('Employee Email')\n\n            Year = Year(Today())\n        ),\n        Total\n    )\n);\n\n\n\n\nSet(varEntitlement2,        Coalesce(varEmployeeRowManage.'Vacation Entitlement (per anum)' + varEmployeeRowManage.Carryover + varPublicHolidaysWorked2, 0));\n\nSet(\n    varDaysUsed2,\n    Sum(\n        Filter(\n            'Vacations Tracking (Days)',\n\n            // Employee match\n            Lower(Employee) = Lower(varSelectedRequest.Employee),\n\n            // Falls within year\n            EndDate >= varYearStart,\n            StartDate <= varYearEnd,\n\n            // Not archived\n            Archived <> \"Yes\" && Archived <> \"Withdrawn\",\n            Type_of_leave <> \"Sick Day\",\n\n            // Consolidated approval logic\n            If(\n                // --- 1. Flights exist → ApprovalStatus_2 required\n                !IsBlank(Flight_DepartureDate),\n                ApprovalStatus_2 = \"Approved\",\n\n                // --- 2. No flights → PD logic\n                \n                If(\n                    DateValue(Created) < Date (2026, 03, 18),\n                        // Old app logic → use ApprovalStatus_1\n                    ApprovalStatus_1 = \"Approved\",\n\n                        // New app logic → PD approval required\n                    ProjectDirector_ApprovalStatus.Value = \"Approved\"\n                )\n                \n            )\n        ),\n        Days\n    )\n);\n\n\nSet(\n    varDaysAvailable2,\n    Max(varEntitlement2 - varDaysUsed2, 0)\n);\n\n\nRefresh('Vacations Tracking (Days)')"

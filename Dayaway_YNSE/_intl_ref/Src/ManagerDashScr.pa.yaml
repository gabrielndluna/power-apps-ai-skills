                              Width: =450
                              Wrap: =false
                              X: '=Parent.X + 15 '
                              Y: =140
                        - EmployeeRoleLabel_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =ColorValue("#D60C30")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold

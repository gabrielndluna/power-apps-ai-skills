                              Y: =170
                        - EmployeeRoleLabel_2:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: |+
                                =ColorValue("#D60C30")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =16
                              Text: =varUserProject
                              Width: =NameLabel_1.Width
                              X: =NameLabel_1.X
                              Y: =195
                        - NameLabel_2:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =ColorValue("#494949")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =80
                              Size: =24
                              Text: =If(CountRows(Gallery2_1.AllItems) > 1, "Pending Requests", "Pending Request")
                              Width: =300
                              X: =Parent.Width - Self.Width - 30
                              Y: |+
                                =115
                        - NameLabel_3:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =ColorValue("#D60C30")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: |+
                                =60
                              Size: =52
                              Text: =CountRows(Gallery2_1.AllItems)
                              Width: =300
                              X: |+
                                =Parent.Width - Self.Width - 30
                              Y: =60
                  - SummaryText_1:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =ColorValue("#494949")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        PaddingLeft: =25
                        PaddingRight: =25
                        Size: =28
                        Text: ="Pending Requests"
                        Width: =Parent.Width - DayAwayLogoOnly_1.Width -20
                        Wrap: =false
                        Y: =AnalyticsCardManager.Height + Self.Height + 80
                  - RequestSummaryButton_1:
                      Control: CanvasComponent
                      ComponentName: RequestSummaryButton
                      Properties:
                        Height: =60
                        OnPressAction: |-
                          =UpdateContext({ locSection: "Requests" });
                          Refresh('Vacations Tracking (Days)');
                          Reset(TextInput3)
                        Width: =350
                        X: =MainConManager.Width - 325
                        Y: =SummaryText_1.Y
                  - Container1:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =ColorValue("#D60C30")
                        Height: =50
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 60
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =SummaryText_1.Y + 70
                  - SubmissionDateHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Employee Name"
                        Width: =170
                        X: =Container1.X + 10
                        Y: =(RequestSummaryButton_1.Y + 75)
                  - StartDateHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Submission Date"
                        X: =SubmissionDateHeader_1.X + SubmissionDateHeader_1.Width + 10
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - EndDateHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Start Date"
                        X: =StartDateHeader_1.X + StartDateHeader_1.Width + 10
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - TotalDaysHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="End Date"
                        X: =EndDateHeader_1.X + EndDateHeader_1.Width + 10
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - DeptApprovalHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Total Days"
                        X: =TotalDaysHeader_1.X + TotalDaysHeader_1.Width + 10
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - HRApprovalHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Flights"
                        X: =DeptApprovalHeader_1.X + DeptApprovalHeader_1.Width + 10
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - ApprovalDateHeader_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Text: ="Approval"
                        X: '=HRApprovalHeader_1.X + HRApprovalHeader_1.Width '
                        Y: |+
                          =(RequestSummaryButton_1.Y + 75)
                  - Gallery2_1:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =ColorValue("#F5f5f5")
                        Height: =226
                        Items: "=Sort(\r\n    Filter(\r\n        'Vacations Tracking (Days)',\r\n        \r\n        // --- Who qualifies: A1 approver OR PD approver OR Permissions (A2) ---\r\n        (\r\n            (ApproverID_1 = User().Email && ApprovalStatus_1 = \"Pending\")\r\n            ||\r\n            (ProjectDirector_Email = User().Email && ProjectDirector_ApprovalStatus.Value = \"Pending\")\r\n            ||\r\n            (\r\n                ApprovalStatus_2 = \"Pending\" &&\r\n                !IsBlank(\r\n                    LookUp(\r\n                        'Vacations Tracking (Permissions)',\r\n                        Lower(User_Email) = Lower(User().Email)\r\n                    )\r\n                )\r\n            )\r\n        )\r\n        &&\r\n        // --- Date window applies to ALL branches ---\r\n        StartDate >= varYearStart &&\r\n        StartDate <= varYearEnd && Archived <> \"Yes\"\r\n    ),\r\n    Created,\r\n    SortOrder.Descending\r\n)"
                        TemplateSize: =60
                        Width: =Container1.Width
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =Container1.Y + Container1.Height
                      Children:
                        - Rectangle_1:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =ColorValue("#FFFFFF00")
                              Height: =Parent.TemplateHeight - Separator_1.Height
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =4
                        - TableIcon_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =ColorValue("#494949")
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              DisabledColor: =RGBA(119, 119, 119, 1)
                              Height: =50
                              Icon: =Icon.ChevronRight
                              OnSelect: "=\r\nSet(varSelectedRequest, ThisItem);\r\nUpdateContext({ locShowSummary: true });\r\n\r\nSet(\r\n    varEmployeeRowManage,\r\n    LookUp(\r\n        'Vacations Tracking (Employees)',   // <-- double-check the list name spelling; use your exact name\r\n        Lower(Email) = Lower(varSelectedRequest.Employee)\r\n    )\r\n);\r\n\r\nSet(\r\n    varPublicHolidaysWorked2,\r\n    Sum(\r\n        Filter(\r\n            'Vacations Tracking (Worked Holidays)',\r\n\r\n            // If your email column is named 'Employee' (text), keep your original compare:\r\n            Lower(Employee_email) = Lower(varSelectedRequest.Employee),   // <-- if your column is actually 'Employee Email', change to Lower('Employee Email')\r\n\r\n            Year = Year(Today())\r\n        ),\r\n        Total\r\n    )\r\n);\r\n\r\n\r\n\r\n\r\nSet(varEntitlement2,        Coalesce(varEmployeeRowManage.'Vacation Entitlement (per anum)' + varEmployeeRowManage.Carryover + varPublicHolidaysWorked2, 0));\r\n\r\n\r\nSet(\r\n    varDaysUsed2,\r\n    Sum(\r\n        Filter(\r\n            'Vacations Tracking (Days)',\r\n\r\n            // Employee match\r\n            Lower(Employee) = Lower(varSelectedRequest.Employee),\r\n\r\n            // Falls within year\r\n            EndDate >= varYearStart,\r\n            StartDate <= varYearEnd,\r\n\r\n            // Not archived\r\n            Archived <> \"Yes\" && Archived <> \"Withdrawn\",\r\n\r\n            // Consolidated approval logic\r\n            If(\r\n                // --- 1. Flights exist → ApprovalStatus_2 required\r\n                !IsBlank(Flight_DepartureDate),\r\n                ApprovalStatus_2 = \"Approved\",\r\n\r\n                // --- 2. No flights → PD logic\r\n                \r\n                If(\r\n                    DateValue(Created) < Date (2026, 03, 18),\r\n                        // Old app logic → use ApprovalStatus_1\r\n                    ApprovalStatus_1 = \"Approved\",\r\n\r\n                        // New app logic → PD approval required\r\n                    ProjectDirector_ApprovalStatus.Value = \"Approved\"\r\n                )\r\n                \r\n            )\r\n        ),\r\n        Days\r\n    )\r\n);\r\n\r\nSet(\r\n    varDaysAvailable2,\r\n    Max(varEntitlement2 - varDaysUsed2, 0)\r\n);\r\n\r\nRefresh('Vacations Tracking (Days)')"
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Tooltip: ="View item details"
                              Width: =50
                              X: =Parent.TemplateWidth - Self.Width
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - StartDateLabel_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =ThisItem.Created
                              Width: =120
                              X: =(DateCreatedLabel_1.X + DateCreatedLabel_1.Width + 30)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - EndDateLabel_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =ThisItem.StartDate
                              Width: =120
                              X: =(StartDateLabel_1.X + StartDateLabel_1.Width + 40)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - TotalDaysLabel_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =ThisItem.EndDate
                              Width: =120
                              X: =(EndDateLabel_1.X + EndDateLabel_1.Width + 40)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - HRApprovalIcon_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =ColorValue("#D60C30")
                              Height: =38
                              Icon: =Icon.Airplane
                              Rotation: =-45
                              Visible: |+
                                =If(ThisItem.Flight_DepartureDate = Blank(), false, true)
                              Width: =38
                              X: =(TotalDaysLabel_2.X + TotalDaysLabel_2.Width + 80)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - DateCreatedLabel_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Normal, FontWeight.Normal)
                              Height: =37
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =ThisItem.Employee_Name
                              Width: =155
                              Wrap: =false
                              X: =(Rectangle_1.X + 20)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - Separator_1:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =ColorValue("#D9ECFA")
                              Height: =4
                              OnSelect: =Select(Parent)
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - Self.Height
                        - TotalDaysLabel_2:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =ThisItem.Days
                              Width: =120
                              X: =(TotalDaysLabel_1.X + TotalDaysLabel_1.Width + 40)
                              Y: =(Rectangle_1.Height - Self.Height) / 2
                        - Dropdown2:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =ColorValue("#494949")
                              BorderThickness: |+
                                =1
                              ChevronBackground: =ColorValue("#D60C30")
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorValue("#D60C30")
                              ChevronHoverFill: =ColorFade(RGBA(214, 12, 48, 1), 30%)
                              Color: =ColorValue("#494949")
                              Default: |-
                                =With(
                                    {
                                        isA1: ThisItem.ApproverID_1 = User().Email,
                                        isPD: ThisItem.ProjectDirector_Email = User().Email,
                                        isA2: !IsBlank(
                                            LookUp(
                                                'Vacations Tracking (Permissions)',
                                                User_Email = User().Email
                                            )
                                        ),
                                        hasFlights: !IsBlank(ThisItem.Flight_DepartureDate)
                                    },

                                    // -------------------------------
                                    // 1️⃣ SINGLE‑ROLE USERS
                                    // -------------------------------
                                    If(
                                        isA1 && !isPD && !isA2,
                                        ThisItem.ApprovalStatus_1,

                                        isPD && !isA1 && !isA2,
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        isA2 && !isA1 && !isPD,
                                        If(
                                            hasFlights,
                                            ThisItem.ApprovalStatus_2,
                                            ThisItem.ProjectDirector_ApprovalStatus.Value
                                        ),

                                        // -------------------------------
                                        // 2️⃣ MULTI‑ROLE USERS
                                        // -------------------------------

                                        // 🔴 Rejection precedence (highest applicable role)
                                        hasFlights && isA2 && ThisItem.ApprovalStatus_2 = "Rejected",
                                        ThisItem.ApprovalStatus_2,

                                        isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Rejected",
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        isA1 && ThisItem.ApprovalStatus_1 = "Rejected",
                                        ThisItem.ApprovalStatus_1,

                                        // 🟡 Pending precedence (lowest level first)
                                        isA1 && ThisItem.ApprovalStatus_1 = "Pending",
                                        ThisItem.ApprovalStatus_1,

                                        isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending",
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        hasFlights && isA2 && ThisItem.ApprovalStatus_2 = "Pending",
                                        ThisItem.ApprovalStatus_2,

                                        // ✅ All my applicable levels approved → show highest I own
                                        If(
                                            hasFlights && isA2,
                                            ThisItem.ApprovalStatus_2,
                                            ThisItem.ProjectDirector_ApprovalStatus.Value
                                        )
                                    )
                                )
                              DisplayMode: |-
                                =With(
                                    {
                                        hasPending:
                                            ThisItem.ApprovalStatus_1 = "Pending"
                                            || ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending"
                                            || ThisItem.ApprovalStatus_2 = "Pending",

                                        hasWithdrawn:
                                            ThisItem.ApprovalStatus_1 = "Withdrawn"
                                            || ThisItem.ProjectDirector_ApprovalStatus.Value = "Withdrawn"
                                            || ThisItem.ApprovalStatus_2 = "Withdrawn",

                                        canApprove1:
                                            ThisItem.ApprovalStatus_1 = "Pending"
                                            && ThisItem.ApproverID_1 = User().Email,

                                        canApprovePD:
                                            ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending"
                                            && ThisItem.ProjectDirector_Email = User().Email,

                                        // ✅ UPDATED: Level 2 approval now depends on PD being Approved
                                        canApprove2:
                                            ThisItem.ApprovalStatus_2 = "Pending"
                                            && ThisItem.ProjectDirector_ApprovalStatus.Value = "Approved"
                                            && !IsBlank(
                                                LookUp(
                                                    'Vacations Tracking (Permissions)',
                                                    User_Email = User().Email
                                                )
                                            )
                                    },

                                    If(
                                        // Withdrawn → always read‑only
                                        hasWithdrawn,
                                        DisplayMode.Disabled,

                                        // No pending approvals → read‑only
                                        !hasPending,
                                        DisplayMode.Disabled,

                                        // Any valid approver for the current stage → editable
                                        (canApprove1 || canApprovePD || canApprove2),
                                        DisplayMode.Edit,

                                        DisplayMode.Disabled
                                    )
                                )
                              FocusedBorderColor: =ColorValue("#D60C30")
                              Font: =Font.'Segoe UI'
                              HoverColor: =ColorValue("#F5F5F5")
                              HoverFill: =ColorValue("#D60C30")
                              Items: =["Pending","Approved","Rejected"]
                              Items.Value: =Value
                              OnChange: |+
                                =// Optimistic UI with success/error notifications + HR routing for flight cases
                                If(
                                    // 0) Do nothing if user picked "Pending"
                                    Self.Selected.Value = "Pending",
                                    Notify("No change saved. Select Approved or Rejected to update.", NotificationType.Information),

                                    With(
                                        {
                                            _isA1: Lower(ThisItem.ApproverID_1) = Lower(User().Email),
                                            _isPD: Lower(ThisItem.ProjectDirector_Email) = Lower(User().Email),
                                            _isHR: !IsBlank(
                                                LookUp(
                                                    'Vacations Tracking (Permissions)',
                                                    Lower(User_Email) = Lower(User().Email)
                                                )
                                            ),
                                            _hasFlight: !IsBlank(ThisItem.Flight_DepartureDate)
                                        },

                                        // 1a) Not the assignee → block
                                        If(
                                            !_isA1 && !_isPD && !_isHR,
                                            Notify("You are not the assignee for this request.", NotificationType.Error);
                                            Reset(Self),

                                            // ⭐ NEW: Resolve which approval level is CURRENTLY ACTIVE
                                            With(
                                                {
                                                    currentLevel:
                                                        If(
                                                            _isA1 && ThisItem.ApprovalStatus_1 = "Pending",
                                                            "A1",

                                                            _isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending",
                                                            "PD",

                                                            _hasFlight && _isHR && ThisItem.ApprovalStatus_2 = "Pending",
                                                            "A2",

                                                            // All approved → highest level I own
                                                            If(
                                                                _hasFlight && _isHR,
                                                                "A2",
                                                                "PD"
                                                            )
                                                        )
                                                },

                                                // ✅ PATCH — ONLY CURRENT LEVEL
                                                Set(varSaving, true);
                                                IfError(
                                                    Patch(
                                                        'Vacations Tracking (Days)',
                                                        ThisItem,
                                                        Switch(
                                                            currentLevel,
                                                            "A1",
                                                                { ApprovalStatus_1: Self.Selected.Value },

                                                            "PD",
                                                                { ProjectDirector_ApprovalStatus: { Value: Self.Selected.Value } },

                                                            "A2",
                                                                { ApprovalStatus_2: Self.Selected.Value }
                                                        )
                                                    ),
                                                    Set(varSaving, false);
                                                    Notify("Couldn't update status. Please try again.", NotificationType.Error);
                                                    Reset(Self),

                                                    Set(varSaving, false);
                                                    Notify("Status updated.", NotificationType.Success)
                                                );

                                                // =========================
                                                // ROUTING LOGIC (UNCHANGED)
                                                // =========================

                                                // 2) Route to Project Director IF Approver1 chose "Approved"
                                                If(
                                                    currentLevel = "A1" && Self.Selected.Value = "Approved",
                                                    IfError(
                                                        Patch(
                                                            'Vacations Tracking (Days)',
                                                            ThisItem,
                                                            {
                                                                ProjectDirector_Email:
                                                                    LookUp(
                                                                        'Vacations Tracking (Projects)',
                                                                        'Project Name' = ThisItem.Project,
                                                                        'Project Director Email'
                                                                    ),
                                                                ProjectDirector_ApprovalStatus: { Value: "Pending" }
                                                            }
                                                        ),
                                                        Notify("Approved by Approver 1, but PD assignment failed. Check the project mapping.", NotificationType.Error),
                                                        Notify("Routed to Project Director.", NotificationType.Success)
                                                    )
                                                );

                                                // 3) Route to HR ONLY when flight exists AND PD approves
                                                If(
                                                    currentLevel = "PD" && _hasFlight && Self.Selected.Value = "Approved",
                                                    IfError(
                                                        Patch(
                                                            'Vacations Tracking (Days)',
                                                            ThisItem,
                                                            {
                                                                ApproverID_2: "geohr@aecon.com",
                                                                ApprovalStatus_2: "Pending"
                                                            }
                                                        ),
                                                        Notify("PD approved, but HR assignment failed.", NotificationType.Error),
                                                        Notify("Routed to HR (GEO HR).", NotificationType.Success)
                                                    )
                                                );

                                                // 4) OPTIONAL: If there is a flight and either approver rejects, ensure HR is not engaged
                                                If(
                                                    _hasFlight && (_isA1 || _isPD) && Self.Selected.Value = "Rejected",
                                                    Patch(
                                                        'Vacations Tracking (Days)',
                                                        ThisItem,
                                                        {
                                                            ApproverID_2: Blank(),
                                                            ApprovalStatus_2: "N/A"
                                                        }
                                                    )
                                                );

                                                // =========================
                                                // ✅ EMAIL LOGIC — 100% UNCHANGED
                                                // =========================

                                                If(
                                                    currentLevel = "A1" && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(LookUp('Vacations Tracking (Projects)','Project Name' = ThisItem.Project, 'Project Director Email' ),
                                                        If(
                                                            _hasFlight,
                                                            "Vacation request (with flights) - " & ThisItem.Employee_Name,
                                                            "Vacation request - " & ThisItem.Employee_Name
                                                        ),
                                                        If(
                                                            _hasFlight,
                                                            "<p>A vacation request <b>with flights</b> was submitted by " & ThisItem.Employee &
                                                            " and has been assigned to you for review after approval from their direct manager.</p>",
                                                            "<p>A vacation request was submitted by " & ThisItem.Employee &
                                                            " and has been assigned to you for review after approval from their direct manager.</p>"
                                                        ) &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "PD" && _hasFlight && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        "geohr@aecon.com",
                                                        "Vacation request with Flights - " & ThisItem.Employee_Name,
                                                        "<p>A vacation request <b>with flights</b> was submitted by " & ThisItem.Employee &
                                                        " and has been assigned to HR for review after approval from their Direct manager & Project Manager.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "PD" && !_hasFlight && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Your Vacation request - " & ThisItem.Employee_Name,
                                                        "<p>Your vacation request has been approved.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "A2" && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Vacation request with Flights- " & ThisItem.Employee_Name,
                                                        "<p>Your vacation request with flights has been approved.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    (_isA1 || _isPD || _isHR) && Self.Selected.Value = "Rejected",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Vacation request - Rejected - " & ThisItem.Employee_Name,
                                                        "<p>Hello " & ThisItem.Employee_Name & ",</p>" &
                                                        "<p>Your vacation request was <b>rejected</b>.</p>" &
                                                        "<p>Please review the request details and resubmit if needed.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PaddingLeft: =5
                              PressedColor: =ColorValue("#D60C30")
                              PressedFill: =ColorValue("#D60C30")
                              SelectionColor: =ColorValue("#494949")
                              SelectionFill: =ColorValue("#FFFFFF")

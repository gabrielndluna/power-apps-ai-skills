                        X: =30
                        Y: =Container1_1.Y + Container1_1.Height
                      Children:
                        - Rectangle_2:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =ColorValue("#FFFFFF00")
                              Height: =Parent.TemplateHeight - Separator_2.Height
                              OnSelect: =Select(Parent)

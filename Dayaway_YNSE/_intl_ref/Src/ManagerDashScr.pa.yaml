                        - Dropdown2_1:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =ColorValue("#494949")
                              BorderThickness: |
                                =1
                              ChevronBackground: =ColorValue("#D60C30")
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorValue("#D60C30")
                              ChevronHoverFill: =ColorFade(RGBA(214, 12, 48, 1), 30%)
                              Color: =ColorValue("#494949")
                              Default: |+
                                =
                                With(
                                    {
                                        isA1: ThisItem.ApproverID_1 = User().Email,
                                        isPD: ThisItem.ProjectDirector_Email = User().Email,
                                        isA2: !IsBlank(
                                            LookUp(
                                                'Vacations Tracking (Permissions)',
                                                User_Email = User().Email
                                            )
                                        ),
                                        hasFlights: !IsBlank(ThisItem.Flight_DepartureDate)
                                    },

                                    // -------------------------------
                                    // 1️⃣ SINGLE‑ROLE USERS
                                    // -------------------------------
                                    If(
                                        isA1 && !isPD && !isA2,
                                        ThisItem.ApprovalStatus_1,

                                        isPD && !isA1 && !isA2,
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        isA2 && !isA1 && !isPD,
                                        If(
                                            hasFlights,
                                            ThisItem.ApprovalStatus_2,
                                            ThisItem.ProjectDirector_ApprovalStatus.Value
                                        ),

                                        // -------------------------------
                                        // 2️⃣ MULTI‑ROLE USERS
                                        // -------------------------------

                                        // 🔴 Rejection precedence (highest applicable role)
                                        hasFlights && isA2 && ThisItem.ApprovalStatus_2 = "Rejected",
                                        ThisItem.ApprovalStatus_2,

                                        isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Rejected",
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        isA1 && ThisItem.ApprovalStatus_1 = "Rejected",
                                        ThisItem.ApprovalStatus_1,

                                        // 🟡 Pending precedence (lowest level first)
                                        isA1 && ThisItem.ApprovalStatus_1 = "Pending",
                                        ThisItem.ApprovalStatus_1,

                                        isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending",
                                        ThisItem.ProjectDirector_ApprovalStatus.Value,

                                        hasFlights && isA2 && ThisItem.ApprovalStatus_2 = "Pending",
                                        ThisItem.ApprovalStatus_2,

                                        // ✅ All my applicable levels approved → show highest I own
                                        If(
                                            hasFlights && isA2,
                                            ThisItem.ApprovalStatus_2,
                                            ThisItem.ProjectDirector_ApprovalStatus.Value
                                        )
                                    )
                                )
                              DisplayMode: |-
                                =With(
                                    {
                                        hasPending:
                                            ThisItem.ApprovalStatus_1 = "Pending"
                                            || ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending"
                                            || ThisItem.ApprovalStatus_2 = "Pending",

                                        hasWithdrawn:
                                            ThisItem.ApprovalStatus_1 = "Withdrawn"
                                            || ThisItem.ProjectDirector_ApprovalStatus.Value = "Withdrawn"
                                            || ThisItem.ApprovalStatus_2 = "Withdrawn",

                                        canApprove1:
                                            ThisItem.ApprovalStatus_1 = "Pending"
                                            && ThisItem.ApproverID_1 = User().Email,

                                        canApprovePD:
                                            ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending"
                                            && ThisItem.ProjectDirector_Email = User().Email,

                                        // ✅ UPDATED: Level 2 approval now depends on PD being Approved
                                        canApprove2:
                                            ThisItem.ApprovalStatus_2 = "Pending"
                                            && ThisItem.ProjectDirector_ApprovalStatus.Value = "Approved"
                                            && !IsBlank(
                                                LookUp(
                                                    'Vacations Tracking (Permissions)',
                                                    User_Email = User().Email
                                                )
                                            )
                                    },

                                    If(
                                        // Withdrawn → always read‑only
                                        hasWithdrawn,
                                        DisplayMode.Disabled,

                                        // No pending approvals → read‑only
                                        !hasPending,
                                        DisplayMode.Disabled,

                                        // Any valid approver for the current stage → editable
                                        (canApprove1 || canApprovePD || canApprove2),
                                        DisplayMode.Edit,

                                        DisplayMode.Disabled
                                    )
                                )
                              FocusedBorderColor: =ColorValue("#D60C30")
                              Font: =Font.'Segoe UI'
                              HoverColor: =ColorValue("#f5f5f5")
                              HoverFill: =ColorValue("#D60C30")
                              Items: |+
                                =
                                With(
                                    {
                                        currentStatus:
                                            Coalesce(
                                                ThisItem.ProjectDirector_ApprovalStatus.Value,
                                                ThisItem.ApprovalStatus_1,
                                                ThisItem.ApprovalStatus_2
                                            )
                                    },
                                    If(
                                        currentStatus = "N/A" || currentStatus = "Withdrawn",
                                        ["Pending", "Approved", "Rejected", currentStatus],
                                        ["Pending", "Approved", "Rejected"]
                                    )
                                )
                              Items.Value: =Value
                              OnChange: |
                                =// Optimistic UI with success/error notifications + HR routing for flight cases
                                If(
                                    // 0) Do nothing if user picked "Pending"
                                    Self.Selected.Value = "Pending",
                                    Notify("No change saved. Select Approved or Rejected to update.", NotificationType.Information),

                                    With(
                                        {
                                            _isA1: Lower(ThisItem.ApproverID_1) = Lower(User().Email),
                                            _isPD: Lower(ThisItem.ProjectDirector_Email) = Lower(User().Email),
                                            _isHR: !IsBlank(
                                                LookUp(
                                                    'Vacations Tracking (Permissions)',
                                                    Lower(User_Email) = Lower(User().Email)
                                                )
                                            ),
                                            _hasFlight: !IsBlank(ThisItem.Flight_DepartureDate)
                                        },

                                        // 1a) Not the assignee → block
                                        If(
                                            !_isA1 && !_isPD && !_isHR,
                                            Notify("You are not the assignee for this request.", NotificationType.Error);
                                            Reset(Self),

                                            // ⭐ NEW: Resolve which approval level is CURRENTLY ACTIVE
                                            With(
                                                {
                                                    currentLevel:
                                                        If(
                                                            _isA1 && ThisItem.ApprovalStatus_1 = "Pending",
                                                            "A1",

                                                            _isPD && ThisItem.ProjectDirector_ApprovalStatus.Value = "Pending",
                                                            "PD",

                                                            _hasFlight && _isHR && ThisItem.ApprovalStatus_2 = "Pending",
                                                            "A2",

                                                            // All approved → highest level I own
                                                            If(
                                                                _hasFlight && _isHR,
                                                                "A2",
                                                                "PD"
                                                            )
                                                        )
                                                },

                                                // ✅ PATCH — ONLY CURRENT LEVEL
                                                Set(varSaving, true);
                                                IfError(
                                                    Patch(
                                                        'Vacations Tracking (Days)',
                                                        ThisItem,
                                                        Switch(
                                                            currentLevel,
                                                            "A1",
                                                                { ApprovalStatus_1: Self.Selected.Value },

                                                            "PD",
                                                                { ProjectDirector_ApprovalStatus: { Value: Self.Selected.Value } },

                                                            "A2",
                                                                { ApprovalStatus_2: Self.Selected.Value }
                                                        )
                                                    ),
                                                    Set(varSaving, false);
                                                    Notify("Couldn't update status. Please try again.", NotificationType.Error);
                                                    Reset(Self),

                                                    Set(varSaving, false);
                                                    Notify("Status updated.", NotificationType.Success)
                                                );

                                                // =========================
                                                // ROUTING LOGIC (UNCHANGED)
                                                // =========================

                                                // 2) Route to Project Director IF Approver1 chose "Approved"
                                                If(
                                                    currentLevel = "A1" && Self.Selected.Value = "Approved",
                                                    IfError(
                                                        Patch(
                                                            'Vacations Tracking (Days)',
                                                            ThisItem,
                                                            {
                                                                ProjectDirector_Email:
                                                                    LookUp(
                                                                        'Vacations Tracking (Projects)',
                                                                        'Project Name' = ThisItem.Project,
                                                                        'Project Director Email'
                                                                    ),
                                                                ProjectDirector_ApprovalStatus: { Value: "Pending" }
                                                            }
                                                        ),
                                                        Notify("Approved by Approver 1, but PD assignment failed. Check the project mapping.", NotificationType.Error),
                                                        Notify("Routed to Project Director.", NotificationType.Success)
                                                    )
                                                );

                                                // 3) Route to HR ONLY when flight exists AND PD approves
                                                If(
                                                    currentLevel = "PD" && _hasFlight && Self.Selected.Value = "Approved",
                                                    IfError(
                                                        Patch(
                                                            'Vacations Tracking (Days)',
                                                            ThisItem,
                                                            {
                                                                ApproverID_2: "geohr@aecon.com",
                                                                ApprovalStatus_2: "Pending"
                                                            }
                                                        ),
                                                        Notify("PD approved, but HR assignment failed.", NotificationType.Error),
                                                        Notify("Routed to HR (GEO HR).", NotificationType.Success)
                                                    )
                                                );

                                                // 4) OPTIONAL: If there is a flight and either approver rejects, ensure HR is not engaged
                                                If(
                                                    _hasFlight && (_isA1 || _isPD) && Self.Selected.Value = "Rejected",
                                                    Patch(
                                                        'Vacations Tracking (Days)',
                                                        ThisItem,
                                                        {
                                                            ApproverID_2: Blank(),
                                                            ApprovalStatus_2: "N/A"
                                                        }
                                                    )
                                                );

                                                // =========================
                                                // ✅ EMAIL LOGIC — 100% UNCHANGED
                                                // =========================

                                                If(
                                                    currentLevel = "A1" && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(LookUp('Vacations Tracking (Projects)','Project Name' = ThisItem.Project, 'Project Director Email' ),
                                                        If(
                                                            _hasFlight,
                                                            "Vacation request (with flights) - " & ThisItem.Employee_Name,
                                                            "Vacation request - " & ThisItem.Employee_Name
                                                        ),
                                                        If(
                                                            _hasFlight,
                                                            "<p>A vacation request <b>with flights</b> was submitted by " & ThisItem.Employee &
                                                            " and has been assigned to you for review after approval from their direct manager.</p>",
                                                            "<p>A vacation request was submitted by " & ThisItem.Employee &
                                                            " and has been assigned to you for review after approval from their direct manager.</p>"
                                                        ) &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "PD" && _hasFlight && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        "geohr@aecon.com",
                                                        "Vacation request with Flights - " & ThisItem.Employee_Name,
                                                        "<p>A vacation request <b>with flights</b> was submitted by " & ThisItem.Employee &
                                                        " and has been assigned to HR for review after approval from their Direct manager & Project Manager.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "PD" && !_hasFlight && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Your Vacation request - " & ThisItem.Employee_Name,
                                                        "<p>Your vacation request has been approved.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    currentLevel = "A2" && Self.Selected.Value = "Approved",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Vacation request with Flights- " & ThisItem.Employee_Name,
                                                        "<p>Your vacation request with flights has been approved.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                );

                                                If(
                                                    (_isA1 || _isPD || _isHR) && Self.Selected.Value = "Rejected",
                                                    Office365Outlook.SendEmailV2(
                                                        ThisItem.Employee,
                                                        "Vacation request - Rejected - " & ThisItem.Employee_Name,
                                                        "<p>Hello " & ThisItem.Employee_Name & ",</p>" &
                                                        "<p>Your vacation request was <b>rejected</b>.</p>" &
                                                        "<p>Please review the request details and resubmit if needed.</p>" &
                                                        "<p>Access the <a href=""https://apps.powerapps.com/play/e/default-dd3edd7f-5cb4-4f13-8645-b0f69dacb19a/a/f278eca2-cf28-4d9c-a7ad-bbaed4865210?tenantId=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&hint=ee1713ad-43d1-4bc0-8d26-58f078455185&sourcetime=1772804639028"">Dayaway</a> app to review the request.</p>",
                                                        { IsHtml: true }
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )

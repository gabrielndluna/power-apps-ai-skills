                  - Gallery2_2:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =ColorValue("#F5f5f5")
                        Height: |+
                          =525
                        Items: "=With(\n    {\n        canSeeAllFromPermissions:\n            !IsBlank(\n                LookUp(\n                    'Vacations Tracking (Permissions)',\n                    User_Email = User().Email\n                )\n            )\n    },\n    Sort(\n        Filter(\n            'Vacations Tracking (Days)',\n            // Access rules\n            (\n                (ApproverID_1 = User().Email\n                ||\n                ProjectDirector_Email = User().Email\n                ||\n                canSeeAllFromPermissions)\n            \n                &&\n                Archived <> \"Yes\"\n\n                &&\n                StartDate >= varYearStart && EndDate <= varYearEnd\n            )\n            &&\n            // Optional search\n            (\n                IsBlank(Trim(TextInput3.Text))\n                ||\n                StartsWith(Employee_Name, Trim(TextInput3.Text))\n            )\n        ),\n        Created,\n        SortOrder.Descending\n    )\n)"
                        TemplateSize: =60

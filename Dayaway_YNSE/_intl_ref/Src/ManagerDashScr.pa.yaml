                                        s2: Coalesce(varSelectedRequest.ProjectDirector_ApprovalStatus.Value, "")
                                    },
                                    If(
                                        // ✅ Both approved
                                        And(s1 = "Approved", s2 = "Approved"),
                                        Icon.CheckBadge,

                                        // ❌ Either rejected
                                        Or(s1 = "Rejected", s2 = "Rejected"),
                                        Icon.CancelBadge,

                                        // 🕒 Manager approved, PD not acted yet (blank/pending/N/A)
                                        And(s1 = "Approved", Or(IsBlank(s2), s2 = "", s2 = "Pending", s2 = "N/A")),
                                        Icon.Clock,


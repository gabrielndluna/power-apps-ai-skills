Screens:
  ManagerDashScr:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({ locSection: "MainConManager" });

        Set(
            varPendingCount,
            CountRows(
                Filter(
                    'Vacations Tracking (Days)',
                    Lower(ApproverID_1) = Lower(User().Email) || Lower(ProjectDirector_Email) = Lower(User().Email),
                    ApprovalStatus_1 = "Pending" || ProjectDirector_ApprovalStatus.Value = "Pending",
                    EndDate >= varYearStart,
                    StartDate <= varYearEnd
                )
            )
        );
    Children:
      - WebLayoutManager:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.White
            Height: =768
            Visible: =App.Width >= 680
            Width: =1366
            X: =(App.Width - Self.Width) / 2
            Y: =(App.Height - Self.Height) / 2
          Children:
            - SideBarConManager:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue("#D60C30")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =16
                  RadiusTopLeft: =0
                  RadiusTopRight: =16
                  Width: =Parent.Width * 0.085
                Children:
                  - HRManagementIcon_2:
                      Control: CanvasComponent
                      ComponentName: HRManagementIcon
                      Properties:
                        Fill: =ColorValue("#D60C30")
                        Height: =75
                        OnPressAction: |+
                          =If(
                              IsBlank(HRManager),
                              Notify("Access denied. Your account is not registered as a HR Manager. Please contact Human Resources.", NotificationType.Error, 5000),
                              Navigate(HRManageHomeScr, ScreenTransition.Fade)
                          );
                        Visible: |-
                          =If(
                              IsBlank(HRManager),
                              false,
                              true
                          )
                        Width: =115
                        X: =1
                        Y: =678
                  - IOCLogoWhite_1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =75
                        Image: ='IOC Logo White-No text'
                        Width: =75
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =14
                  - SummaryButton_1:
                      Control: CanvasComponent
                      ComponentName: SummaryButton
                      Properties:
                        Fill: =ColorValue("#D60C30")
                        Height: =75
                        OnPressAction: |-
                          =UpdateContext({ locSection: "Requests" });
                          UpdateContext({ locSection: "Requests" });
                          Refresh('Vacations Tracking (Days)');
                          Reset(TextInput3)
                        Width: =115
                        X: =1
                        Y: =267
                  - DashboardButton_1:
                      Control: CanvasComponent
                      ComponentName: DashboardButton
                      Properties:
                        Fill: =ColorValue("#D60C30")
                        Height: =75
                        OnPressAction: =Launch("https://app.powerbi.com/Redirect?action=OpenApp&appId=8b5f2e86-7dff-4932-bc91-59b17008279b&ctid=dd3edd7f-5cb4-4f13-8645-b0f69dacb19a&experience=power-bi")
                        Width: =115
                        X: =1
                        Y: =350
                  - SubmitRequestsButton_1:
                      Control: CanvasComponent
                      ComponentName: SubmitRequestsButton
                      Properties:
                        Fill: =ColorValue("#D60C30")
                        Height: =75
                        OnPressAction: |-
                          =If(
                              IsBlank(varEmployeeRow),
                              Notify("Access denied. Your account is not registered in Employees.  Please contact Human Resources.", NotificationType.Error, 5000),
                              Navigate(EmployeeDashScr, ScreenTransition.Fade)
                          );

                          Refresh('Vacations Tracking (Days)')
                        Width: =115
                        X: =1
                        Y: =433
            - MainConManager:
                Control: GroupContainer@1.5.0

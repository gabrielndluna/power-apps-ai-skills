ComponentDefinitions:
  SubmitRequestsButton:
    DefinitionType: CanvasComponent
    CustomProperties:
      OnPressAction:
        PropertyKind: Event
        DisplayName: OnPressAction
        Description: A custom property
        ReturnType: None
        Default: =
    Properties:
      Fill: =ColorValue("#D60C30")
      Height: =75
      Width: |+
        =140
    Children:
      - Icon1_3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =38
            Icon: =Icon.AddDocument
            OnSelect: =SubmitRequestsButton.OnPressAction()
            Width: =38
            X: =(Parent.Width - Self.Width)/2
            Y: =13
      - Label3_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =15
            OnSelect: =SubmitRequestsButton.OnPressAction()
            Size: =9
            Text: ="Submit Requests"
            Width: =SubmitRequestsButton.Width
            X: =(Parent.Width - Self.Width)/2
            Y: =53

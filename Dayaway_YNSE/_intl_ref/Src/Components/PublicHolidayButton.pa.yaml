ComponentDefinitions:
  PublicHolidayButton:
    DefinitionType: CanvasComponent
    CustomProperties:
      OnPressAction:
        PropertyKind: Event
        DisplayName: OnPressAction
        Description: A custom property
        ReturnType: None
        Default: =
    Properties:
      Fill: =ColorValue("#D60C30")
      Height: =70
      Width: =115
    Children:
      - Icon1_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =50
            Icon: =Icon.CalendarBlank
            OnSelect: =PublicHolidayButton.OnPressAction()
            Width: =38
            X: =(Parent.Width - Self.Width)/2
            Y: =(Parent.Height - Self.Height)/2
      - Label3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =15
            OnSelect: =PublicHolidayButton.OnPressAction()
            Size: =10
            Text: ="Public Holidays"
            Width: =Parent.Width
            X: =(Parent.Width - Self.Width)/2
            Y: =54

ComponentDefinitions:
  BackButton:
    DefinitionType: CanvasComponent
    CustomProperties:
      OnPressAction:
        PropertyKind: Event
        DisplayName: OnPressAction
        Description: A custom property
        ReturnType: None
        Default: =
    Properties:
      Fill: =ColorValue("#FFFFFF00")
      Height: =75
      Width: =115
    Children:
      - Icon1_8:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =ColorValue("#D60C30")
            Height: =26
            Icon: =Icon.BackArrow
            OnSelect: =BackButton.OnPressAction()
            Width: =26
            X: =18
            Y: =25
      - Label3_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =ColorValue("#D60C30")
            Font: =Font.'Segoe UI'
            Height: =25
            OnSelect: =BackButton.OnPressAction()
            Size: =16
            Text: ="Back"
            Width: |+
              =Parent.Width * 0.60
            X: =40
            Y: =26

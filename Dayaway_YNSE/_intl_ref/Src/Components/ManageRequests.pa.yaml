ComponentDefinitions:
  ManageRequests:
    DefinitionType: CanvasComponent
    CustomProperties:
      OnPressAction:
        PropertyKind: Event
        DisplayName: OnPressAction
        Description: A custom property
        ReturnType: None
        Default: =
    Properties:
      Height: =60
      Width: =350
    Children:
      - Button1_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#D60C30")
            BorderThickness: =3
            Color: =ColorValue("#D60C30")
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Segoe UI'
            Height: =Parent.Height*0.90
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorValue("#D61E2C")
            OnSelect: =ManageRequests.OnPressAction()
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.White
            Size: =20
            Text: ="Manage Requests"
            Width: =Parent.Width*0.90
            X: =(Parent.Width - Self.Width ) /2
            Y: =(Parent.Height - Self.Height ) /2
      - Icon3_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =34
            Icon: =Icon.DockCheckProperties
            OnSelect: =ManageRequests.OnPressAction()
            Width: =34
            X: =25
            Y: =13
      - Icon4_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =ColorValue("#D61E2C")
            Height: =30
            Icon: =Icon.ChevronRight
            OnSelect: =ManageRequests.OnPressAction()
            Width: =30
            X: =295
            Y: =15

                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        Color: =ColorValue("#494949")
                        DefaultSelectedItems: |-
                          =With(
                              { u: Office365Users.UserProfileV2(varSelectedProject.'Project Director Email') },
                              If(
                                  !IsBlank(u),
                                  Table(
                                      {
                                          Id: u.id,
                                          DisplayName: u.displayName,
                                          Mail: Coalesce(u.mail, u.userPrincipalName), // fall back if Mail missing
                                          UserPrincipalName: u.userPrincipalName,
                                          Department: u.department
                                      }
                                  ))
                          )
                        DisplayFields: =["DisplayName"]
                        Fill: =ColorValue("#D9ECFA")
                        Font: =Font.'Segoe UI'
                        Height: =45
                        HoverFill: =RGBA(186, 202, 226, 1)
                        Items: |
                          =If(
                              !IsBlank(Trim(Self.SearchText)),
                              ShowColumns(
                                  Office365Users.SearchUser(
                                      { searchTerm: Trim(Self.SearchText), top: 15 }
                                  ),
                                  Id,            // GUID for the user
                                  DisplayName,   // display name
                                  Mail,          // email
                                  UserPrincipalName,  // UPN
                                  Department
                              )
                          )
                        OnChange: |-
                          =Set(
                              varSelectedProject,
                              Patch(
                                  varSelectedProject,
                                  {
                                      'Project Director Name': Self.Selected.DisplayName,
                                      'Project Director Email': Self.Selected.Mail
                                  }
                              )
                          );

                          Reset(ManagerNameField_31);
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["DisplayName","Mail","UserPrincipalName"]
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Size: =12
                        Width: =Parent.Width * 0.45
                        X: =(Parent.Width-Self.Width)/2
                        Y: =228
                  - Button3_24:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: |
                          =ColorValue("#D60C30")
                        Font: =Font.'Segoe UI'
                        Height: |
                          =50
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |+
                          =
                          Remove('Vacations Tracking (Projects)', varSelectedProject);


                          UpdateContext({ locShowProjectDetails: false });
                          Refresh('Vacations Tracking (Projects)')

                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Delete"

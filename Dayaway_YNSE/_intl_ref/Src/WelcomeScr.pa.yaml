Screens:
  WelcomeScr:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - WebLayout:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =768
            Visible: =App.Width >= 680
            Width: |+
              =1366
            X: =(App.Width - Self.Width) / 2
            Y: =(App.Height - Self.Height) / 2
          Children:
            - WebLeft:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue("#D61E2C")
                  Height: =Parent.Height
                  Width: =Parent.Width * 0.6
                Children:
                  - Label1:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Width*0.30
                        PaddingLeft: =25
                        Size: =56
                        Text: ="Welcome" & Char(10) & "Back."
                        Width: =Parent.Width*0.50
                        Y: =Parent.Y + Parent.Height -Self.Height
                  - WebAeconLogo:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =Parent.Width*0.10
                        Image: ='AECON Logo - Red with Transparent Back Ground 1'
                        Width: =Parent.Width*0.30
            - WebRight:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =Parent.Height
                  Width: =Parent.Width - WebLeft.Width
                  X: =WebLeft.Width
                Children:
                  - HRManageButton_1:
                      Control: CanvasComponent
                      ComponentName: HRManageButton
                      Properties:
                        Fill: |
                          =Color.White
                        Height: |+
                          =Parent.Height*0.075
                        OnPressAction: |+
                          =If(
                              IsBlank(HRManager),
                              Notify("Access denied. Your account is not registered as a HR Manager. Please contact Human Resources.", NotificationType.Error, 5000),
                              Navigate(HRManageHomeScr, ScreenTransition.Fade)
                          );
                        Visible: |-
                          =If(
                              IsBlank(HRManager),
                              false,
                              true
                          )
                        Width: =Parent.Width*0.65
                        X: |+
                          =(Parent.Width - Self.Width ) / 2
                        Y: |+
                          =ManageRequests_1.Y + ManageRequests_1.Height + 30
                  - Image2:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Image: ='Dayaway Logo With Name'
                        Width: =400
                        X: =(Parent.Width - Self.Width) /2
                        Y: =Parent.Height - Self.Height
                  - ManageRequests_1:
                      Control: CanvasComponent
                      ComponentName: ManageRequests
                      Properties:
                        Height: =Parent.Height*0.075
                        OnPressAction: |+
                          =If(
                              IsBlank(varManagerRow),
                              Notify("Access denied. Your account is not registered as a Manager. Please contact Human Resources.", NotificationType.Error, 5000),
                              Navigate(ManagerDashScr, ScreenTransition.Fade)
                          );
                        Width: =Parent.Width*0.65
                        X: =(Parent.Width - Self.Width ) / 2
                        Y: '=SubmitRequest_1.Y + SubmitRequest_1.Height + 30 '
                  - SubmitRequest_1:
                      Control: CanvasComponent
                      ComponentName: SubmitRequest
                      Properties:
                        Fill: |+
                          =Color.White
                        Height: =Parent.Height*0.075
                        OnPressAction: |+
                          =
                          If(
                              IsBlank(varEmployeeRow),
                              Notify("Access denied. Your account is not registered in Employees. Please contact Human Resources.", NotificationType.Error, 5000),
                              Navigate(EmployeeDashScr, ScreenTransition.Fade)
                          );
                        Width: =Parent.Width*0.65
                        X: =(Parent.Width - Self.Width)/2
                        Y: |+
                          =With(
                              {
                                  totalHeight: SubmitRequest_1.Height + ManageRequests_1.Height + HRManageButton_1.Height +90
                              },
                              (Parent.Width - totalHeight) / 2
                          )
      - PhoneLayout:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =App.Width < 680
            Width: =Parent.Width
          Children:
            - PhoneHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue("#D61E2C")
                  Height: =Parent.Height * 0.40
                  Width: =Parent.Width
                Children:
                  - Image3:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Image: ='AECON Logo - Red with Transparent Back Ground 1'
                        Width: =300
                        X: =(Parent.Width - Self.Width) / 2
            - PhoneFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =100
                  Width: =Parent.Width
                  Y: =PhoneLayout.Height - Self.Height
                Children:
                  - Image4:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Image: ='Dayaway Logo With Name'
                        Width: =300
                        X: =(Parent.Width - Self.Width) / 2
            - ButtonsContainer:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =Parent.Height - PhoneHeader.Height - PhoneFooter.Height
                  Width: =Parent.Width
                  Y: =PhoneHeader.Height
                Children:
                  - SubmitRequest_2:
                      Control: CanvasComponent
                      ComponentName: SubmitRequest
                      Properties:
                        Fill: |+
                          =Color.White
                        Height: =60
                        OnPressAction: |+
                          = 
                          If(
                              IsBlank(varEmployeeRow),
                              Notify("Access denied. Your account is not registered in Employees.", NotificationType.Error, 5000),
                              Navigate(EmployeeDashScr, ScreenTransition.Fade)
                          );
                        Width: =350
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height)/ 2 - (80)
                  - ManageRequests_2:
                      Control: CanvasComponent
                      ComponentName: ManageRequests
                      Properties:
                        Height: =60
                        OnPressAction: |-
                          =If(
                              IsBlank(varManagerRow),
                              Notify("Access denied. Your account is not registered as a Manager.", NotificationType.Error, 5000),
                              Navigate(ManagerDashScr, ScreenTransition.Fade)
                          );
                        Width: =350
                        X: =(Parent.Width - Self.Width)/2
                        Y: '=(Parent.Height - Self.Height)/2 '

                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =52
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8

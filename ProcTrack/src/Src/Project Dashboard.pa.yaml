Screens:
  Project Dashboard:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varPackageFilter, "all");
        Set(varSelectedProject, Blank());
        ClearCollect(
            colPermittedProjects,
            ForAll(
                colUserPermissions As perm,
                LookUp('ProcTrack - Projects', projectidentifier = perm.Project)
            )
        );
        ClearCollect(colPermittedPackages, Blank());
        ForAll(
            colUserPermissions As perm,
            Collect(
                colPermittedPackages,
                Filter('ProcTrack - Packages', projectidentifier = perm.Project)
            )
        )
    Children:
      - dash_main_container:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            PaddingBottom: =12
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =12
            Width: =Parent.Width
          Children:
            - dash_header_container:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =RGBA(214, 12, 48, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =10
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - dash_header_icon_wrap:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 0.18)
                        FillPortions: =0
                        Height: =36
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Width: =36
                      Children:
                        - dash_header_icon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =20
                              Icon: =Icon.Home
                              Width: =20
                              X: =8
                              Y: =8
                  - dash_header_text_col:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                      Children:
                        - dash_header_title:
                            Control: Text@0.0.51
                            Properties:
                              AutoHeight: =true
                              FontColor: =RGBA(255, 255, 255, 1)
                              Size: =20
                              Text: ="ProcTrack"
                              Weight: ='TextCanvas.Weight'.Bold
                              Width: =260
                        - dash_header_subtitle:
                            Control: Text@0.0.51
                            Properties:
                              AutoHeight: =true
                              FontColor: =RGBA(255, 255, 255, 0.82)
                              Size: =12
                              Text: ="Project procurement dashboard"
                              Width: =260
                  - dash_header_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                  - dash_header_user_col:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout

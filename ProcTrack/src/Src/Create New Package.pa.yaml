   newRecord.revisedplannedawarddate,\r\n\r\n                    subcontractorname:                  newRecord.subcontractorname,\r\n                    purchaseordernumber:                newRecord.purchaseordernumber,\r\n                    awardvalue:                         newRecord.awardvalue,\r\n                    indigenous_award:                   newRecord.indigenous_award,\r\n                    ontario_award:                      newRecord.ontario_award,\r\n                    budgetamount:                       newRecord.budgetamount,\r\n                    buybackresaletarget:                newRecord.buybackresaletarget\r\n                }\r\n            );\r\n            \r\n            // ── Clear variables and navigate ─────────────────────────────────\r\n            UpdateContext({varFormattedNumber: \"\"});\r\n            Navigate('Package Details', ScreenTransition.Fade)\r\n        ),\r\n\r\n        // ── Patch failed ─────────────────────────────────────────────────────\r\n        Notify(\"Something went wrong saving the record. Please try again.\", NotificationType.Error)\r\n    )\r\n)"

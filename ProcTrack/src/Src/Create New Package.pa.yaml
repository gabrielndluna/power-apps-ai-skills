                        OnPressAction: "=// ── Validation ────────────────────────────────────────────────────────────────\r\nIf(\r\n    IsBlank(current_project_selected.Selected.projectidentifier) Or\r\n    IsBlank(prerequisite_design_input.Selected.Value) Or\r\n    IsBlank(quality_program_input.Selected.Value) Or\r\n    IsBlank(bop_site_location_input.Selected.Value) Or\r\n    (IsBlank(procurement_lead_input.Selected.UserPrincipalName) && IsBlank(procurement_lead_input_txt.Text)) Or\r\n    (IsBlank(operations_lead_input.Selected.UserPrincipalName) && IsBlank(operations_lead_input_txt.Text)) Or\r\n    IsBlank(package_bundle_input.Text) Or\r\n    IsBlank(ras_input.SelectedDate),\r\n\r\n    // ── Show validation errors ───────────────────────────────────────────────\r\n    UpdateContext({varShowValidationErrors: true});\r\n    Notify(\"Please fill out all required fields before submitting.\", NotificationType.Error),\r\n\r\n    // ── Validation passed - proceed with save ────────────────────────────────\r\n    UpdateContext({varShowValidationErrors: false});\r\n    \r\n    // ── Patch to Sharepoint ──────────────────────────────────────────────────\r\n    IfError(\r\n        With(\r\n            {\r\n                newRecord: Patch(\r\n                    'ProcTrack - Packages',\r\n                    Defaults('ProcTrack - Packages'),\r\n                    {\r\n                        Title:                              GUID(),\r\n                        packageidentifier:                  GUID(),\r\n                        projectidentifier:                  current_project_selected.Selected.projectidentifier,\r\n                        packagedescription:                 package_description_input_1.Text,\r\n                        itemnumber:                         item_no_input.Text,\r\n                        prerequisitedesigndeliverable:      prerequisite_design_input.Selected.Value,\r\n                        qualityprogram:                     If(!IsBlank(
                                    ChevronHoverFill: =RGBA(214, 12, 48, 1)
                                    Color: =RGBA(33, 33, 33, 1)
                                    DefaultSelectedItems: |
                                      =Filter(
                                          AddColumns(colPermittedProjects, Display, projectname),
                                          projectname = varSelectedProject.projectname
                                      )
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(255, 255, 255, 1)
                                    DisplayFields: =["Display"]
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(33, 33, 33, 1)
                                    HoverFill: =RGBA(255, 255, 255, 1)
                                    IsSearchable: =false
                                    Items: |-
                                      =AddColumns(colPermittedProjects, Display, projectname)
                                    OnChange: "=If(\n    !IsBlank(Self.Selected),\n    Set(varSelectedProject, Self.Selected);\n    \n    // Refresh packages collection for this project\n    ClearCollect(\n        colProjectPackages,\n        Filter(\n            'ProcTrack - Packages',\n            projectidentifier = Self.Selected.projectidentifier\n        )\n    );\n    \n    // Check if user can edit THIS specific project\n    Set(\n        varCanEditCurrentProject,\n        !IsBlank(\n            LookUp(\n                colUserPermissions,\n                Project = Self.Selected.projectidentifier && Edit_allowed = \"yes\"\n            )\n        )\n    )\n)"

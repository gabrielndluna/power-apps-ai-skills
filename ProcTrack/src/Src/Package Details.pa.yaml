                                    - OnSitePlannedDate:
                                        Control: ModernDatePicker@1.0.2
                                        Properties:
                                          DefaultDate: |-
                                            =If(
                                                varPackageScreenLoaded,
                                                If(
                                                    !IsBlank(First(colPackageDetails).requiredatsitedate),
                                                    First(colPackageDetails).requiredatsitedate,
                                                    Today()
                                                ),
                                                Today()
                                            )
                                          DisplayMode: |-
                                            =// DisplayMode
                                            If(varCanEditCurrentProject, DisplayMode.Edit, DisplayMode.View)
                                          Format: =DatePickerFormat.Short
                                          OnChange: "=With(\r\n    {\r\n        // Minimum feasible On-Site = latest actual + remaining durations to onsite\r\n        latestActual: Max(\r\n            Coalesce(First(colPackageDetails).actualsowdate, DateValue(\"1/1/1900\")),\r\n            Coalesce(First(colPackageDetails).actualrfqissuedate, DateValue(\"1/1/1900\")),\r\n            Coalesce(First(colPackageDetails).actualrfqclosingdate, DateValue(\"1/1/1900\")),\r\n            Coalesce(First(colPackageDetails).actualevaluationcompletiondate, DateValue(\"1/1/1900\")),\r\n            Coalesce(First(colPackageDetails).actualawarddate, DateValue(\"1/1/1900\"))\r\n        ),\r\n        hasAnyActual: !IsBlank(First(colPackageDetails).actualsowdate) ||\r\n                      !IsBlank(First(colPackageDetails).actualrfqissuedate) ||\r\n                      !IsBlank(First(colPackageDetails).actualrfqclosingdate) ||\r\n                      !IsBlank(First(colPackageDetails).actualevaluationcompletiondate) ||\r\n                      !IsBlank(First(colPackageDetails).actualawarddate)\r\n    },\r\n    With(\r\n        {\r\n            // Calculate the minimum feasible On-Site date based on remaining work after the latest actual\r\n            minOnSite: \r\n                // Award actual exists -> onsite must be at least award + leadtime\r\n                If(\r\n                    !IsBlank(First(colPackageDetails).actualawarddate),\r\n                    DateAdd(First(colPackageDetails).actualawarddate, First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                    If(\r\n                        !IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n                        DateAdd(DateAdd(First(colPackageDetails).actualevaluationcompletiondate, First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                        If(\r\n                            !IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                            DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualrfqclosingdate, First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                            If(\r\n                                !IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                                DateAdd(DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualrfqissuedate, First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                                If(\r\n                                    !IsBlank(First(colPackageDetails).actualsowdate),\r\n                                    DateAdd(DateAdd(DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                                    DateValue(\"1/1/1900\")\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n        },\r\n        If(\r\n            hasAnyActual && Self.SelectedDate < minOnSite,\r\n            \r\n            // BLOCK - infeasible, show error and don't apply\r\n            Notify(\r\n                \"On-Site date too early. Based on your completed actuals and durations, the earliest feasible On-Site date is \" & \r\n                Text(minOnSite, \"mmm dd, yyyy\") & \r\n                \". Please choose that date or later.\",\r\n                NotificationType.Error\r\n            ),\r\n            \r\n            // PROCEED - apply your existing OnSitePlannedDate OnChange logic\r\n            Patch(\r\n                colPackageDetails,\r\n                First(colPackageDetails),\r\n                {\r\n                    requiredatsitedate: Self.SelectedDate,\r\n                    originalplannedsowdate: If(\r\n                        IsBlank(First(colPackageDetails).actualsowdate),\r\n                        DateAdd(DateAdd(DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), -First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), -First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedsowdate\r\n                    ),\r\n                    originalplannedrfqissuedate: If(\r\n                        IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                        DateAdd(DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), -First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedrfqissuedate\r\n                    ),\r\n                    originalplannedrfqclosingdate: If(\r\n                        IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                        DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedrfqclosingdate\r\n                    ),\r\n                    originalplannedevaluationcompleti: If(\r\n                        IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n                        DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedevaluationcompleti\r\n                    ),\r\n                    originalplannedawarddate: If(\r\n                        IsBlank(First(colPackageDetails).actualawarddate),\r\n                        DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedawarddate\r\n                    ),\r\n                    revisedplannedsowdate: If(\r\n                        IsBlank(First(colPackageDetails).actualsowdate),\r\n                        DateAdd(DateAdd(DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), -First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), -First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days),\r\n                        First(colPackageDetails).revisedplannedsowdate\r\n                    ),\r\n                    revisedplannedrfqissuedate: If(\r\n                        IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                        DateAdd(DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), -First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days),\r\n                        First(colPackageDetails).revisedplannedrfqissuedate\r\n                    ),\r\n                    revisedplannedrfqclosingdate: If(\r\n                        IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                        DateAdd(DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days), -First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                        First(colPackageDetails).revisedplannedrfqclosingdate\r\n                    ),\r\n                    revisedplannedevaluationcompletio: If(\r\n                        IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n                        DateAdd(DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days), -First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                        First(colPackageDetails).revisedplannedevaluationcompletio\r\n                    ),\r\n                    revisedplannedawarddate: If(\r\n                        IsBlank(First(colPackageDetails).actualawarddate),\r\n                        DateAdd(Self.SelectedDate, -First(colPackageDetails).standardleadtimemonths, TimeUnit.Days),\r\n                        First(colPackageDetails).revisedplannedawarddate\r\n                    )\r\n                }\r\n            )\r\n        )\r\n    )\r\n)"

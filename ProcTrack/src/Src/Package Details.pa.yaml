                Children:
                  - checkmark_icon:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(214, 12, 48, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: |-
                          =// DisplayMode
                          If(varCanEditCurrentProject, DisplayMode.Edit, DisplayMode.View)
                        FocusedBorderThickness: =4
                        Height: =24
                        Width: =24
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(54, 176, 75, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.CheckBadge
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=Switch(\r\n    true,\r\n    // SOW Completion - if not complete\r\n    IsBlank(First(colPackageDetails).actualsowdate),\r\n    Patch(\r\n        colPackageDetails,\r\n        First(colPackageDetails),\r\n        {\r\n            actualsowdate: Today(),\r\n            // If sole source, cascade SOW date to RFQ dates\r\n            actualrfqissuedate: If(\r\n                First(colPackageDetails).sole_source = \"Yes\",\r\n                Today(),\r\n                First(colPackageDetails).actualrfqissuedate\r\n            ),\r\n            actualrfqclosingdate: If(\r\n                First(colPackageDetails).sole_source = \"Yes\",\r\n                Today(),\r\n                First(colPackageDetails).actualrfqclosingdate\r\n            ),\r\n            // Update revised dates if SOW actual date exceeds planned\r\n            revisedplannedrfqissuedate: If(\r\n                Today() > First(colPackageDetails).originalplannedsowdate,\r\n                Max(\r\n                    First(colPackageDetails).originalplannedrfqissuedate,\r\n                    DateAdd(Today(), First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days)\r\n                ),\r\n                First(colPackageDetails).revisedplannedrfqissuedate\r\n            ),\r\n            revisedplannedrfqclosingdate: If(\r\n                Today() > First(colPackageDetails).originalplannedsowdate,\r\n                Max(\r\n                    First(colPackageDetails).originalplannedrfqclosingdate,\r\n                    DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days)\r\n                ),\r\n                First(colPackageDetails).revisedplannedrfqclosingdate\r\n            ),\r\n            revisedplannedevaluationcompletio: If(\r\n                Today() > First(colPackageDetails).originalplannedsowdate,\r\n                Max(\r\n                    First(colPackageDetails).originalplannedevaluationcompleti,\r\n                    DateAdd(DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days)\r\n                ),\r\n                First(colPackageDetails).revisedplannedevaluationcompletio\r\n            ),\r\n            revisedplannedawarddate: If(\r\n                Today() > First(colPackageDetails).originalplannedsowdate,\r\n                Max(\r\n                    First(colPackageDetails).originalplannedawarddate,\r\n                    DateAdd(DateAdd(DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days)\r\n                ),\r\n                First(colPackageDetails).revisedplannedawarddate\r\n            )\r\n        }\r\n    );\r\n    Notify(\"SOW Completion marked as complete!\", NotificationType.Success),\r\n    \r\n    // RFQ Issue - if SOW is complete but RFQ Issue is not (and not sole source)\r\n    !IsBlank(First(colPackageDetails).actualsowdate) &&\r\n    IsBlank(First(colPackageDetails).actualrfqissuedate) &&\r\n    First(colPackageDetails).sole_source = \"No\",\r\n    Patch(\r\n        colPackageDetails,\r\n        First(colPackageDetails),\r\n        {\r\n            actualrfqissuedate: Today(),\r\n            revisedplannedrfqclosingdate: If(\r\n                Today() > First(colPackageDetails).revisedplannedrfqissuedate,\r\n                Max(First(colPackageDetails).originalplannedrfqclosingdate, DateAdd(Today(), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedrfqclosingdate\r\n            ),\r\n            revisedplannedevaluationcompletio: If(\r\n                Today() > First(colPackageDetails).revisedplannedrfqissuedate,\r\n                Max(First(colPackageDetails).originalplannedevaluationcompleti, DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedevaluationcompletio\r\n            ),\r\n            revisedplannedawarddate: If(\r\n                Today() > First(colPackageDetails).revisedplannedrfqissuedate,\r\n                Max(First(colPackageDetails).originalplannedawarddate, DateAdd(DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedawarddate\r\n            )\r\n        }\r\n    );\r\n    Notify(\"RFQ Issue marked as complete!\", NotificationType.Success),\r\n    \r\n    // RFQ Closing - if RFQ Issue is complete but RFQ Closing is not (and not sole source)\r\n    !IsBlank(First(colPackageDetails).actualrfqissuedate) &&\r\n    IsBlank(First(colPackageDetails).actualrfqclosingdate) &&\r\n    First(colPackageDetails).sole_source = \"No\",\r\n    Patch(\r\n        colPackageDetails,\r\n        First(colPackageDetails),\r\n        {\r\n            actualrfqclosingdate: Today(),\r\n            revisedplannedevaluationcompletio: If(\r\n                Today() > First(colPackageDetails).revisedplannedrfqclosingdate,\r\n                Max(First(colPackageDetails).originalplannedevaluationcompleti, DateAdd(Today(), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedevaluationcompletio\r\n            ),\r\n            revisedplannedawarddate: If(\r\n                Today() > First(colPackageDetails).revisedplannedrfqclosingdate,\r\n                Max(First(colPackageDetails).originalplannedawarddate, DateAdd(DateAdd(Today(), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedawarddate\r\n            )\r\n        }\r\n    );\r\n    Notify(\"RFQ Closing marked as complete!\", NotificationType.Success),\r\n    \r\n    // Evaluation - if RFQ Closing is complete (or SOW if sole source) but Evaluation is not\r\n    (\r\n        (!IsBlank(First(colPackageDetails).actualrfqclosingdate) && First(colPackageDetails).sole_source = \"No\") ||\r\n        (!IsBlank(First(colPackageDetails).actualsowdate) && First(colPackageDetails).sole_source = \"Yes\")\r\n    ) &&\r\n    IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n    Patch(\r\n        colPackageDetails,\r\n        First(colPackageDetails),\r\n        {\r\n            actualevaluationcompletiondate: Today(),\r\n            revisedplannedawarddate: If(\r\n                Today() > First(colPackageDetails).revisedplannedevaluationcompletio,\r\n                Max(First(colPackageDetails).originalplannedawarddate, DateAdd(Today(), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days)),\r\n                First(colPackageDetails).revisedplannedawarddate\r\n            )\r\n        }\r\n    );\r\n    Notify(\"Evaluation marked as complete!\", NotificationType.Success),\r\n    \r\n    // Award - if Evaluation is complete but Award is not\r\n    !IsBlank(First(colPackageDetails).actualevaluationcompletiondate) &&\r\n    IsBlank(First(colPackageDetails).actualawarddate),\r\n    Patch(\r\n        colPackageDetails,\r\n        First(colPackageDetails),\r\n        {\r\n            actualawarddate: Today()\r\n        }\r\n    );\r\n    Notify(\"Award marked as complete!\", NotificationType.Success),\r\n    \r\n    // All steps complete\r\n    Notify(\"All steps are already complete!\", NotificationType.Warning)\r\n)"
                        PressedBorderColor: =RGBA(0, 0, 0, 0)

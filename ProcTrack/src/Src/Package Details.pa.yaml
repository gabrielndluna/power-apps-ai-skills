                  - archive_package_button:
                      Control: CanvasComponent
                      ComponentName: ButtonInverted
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        ArrowVisible: =false
                        Fill: |
                          =Color.White
                        Height: =60
                        Icon: ="Text"
                        IconVisible: =false
                        LayoutMinHeight: =0
                        OnPressAction: |-
                          =IfError(
                              Patch(
                                  'ProcTrack - Packages',
                                  LookUp(
                                      'ProcTrack - Packages',
                                      packageidentifier = First(colPackageDetails).packageidentifier
                                  ),
                                  {archived: true}
                              );
                              Patch(
                                  colPackageDetails,
                                  First(colPackageDetails),
                                  {archived: true}
                              );
                              Patch(
                                  colProjectPackages,
                                  LookUp(
                                      colProjectPackages,
                                      packageidentifier = First(colPackageDetails).packageidentifier
                                  ),
                                  {archived: true}
                              );
                              If(
                                  !IsBlank(
                                      LookUp(
                                          colPermittedPackages,
                                          packageidentifier = First(colPackageDetails).packageidentifier
                                      )
                                  ),
                                  Patch(
                                      colPermittedPackages,
                                      LookUp(
                                          colPermittedPackages,
                                          packageidentifier = First(colPackageDetails).packageidentifier
                                      ),
                                      {archived: true}
                                  )
                              );
                              Notify("Package archived.", NotificationType.Success);
                              Navigate('Welcome screen', ScreenTransition.Fade),
                              Notify(
                                  "Error archiving: " & FirstError.Message,
                                  NotificationType.Error
                              )
                          )
                        Text: ="Archive"
                        TextSize: =12
                        Visible: |-
                          =varCanEditCurrentProject && First(colPackageDetails).archived <> true
                        Width: =160

                                          leadtimeclosingtoevaluationdays:    First(colPackageDetails).leadtimeclosingtoevaluationdays,
                                          leadtimeevaluationtoawarddays:      First(colPackageDetails).leadtimeevaluationtoawarddays,
                                          standardleadtimemonths:             First(colPackageDetails).standardleadtimemonths,

                                          // Planned dates
                                          originalplannedsowdate:             First(colPackageDetails).originalplannedsowdate,
                                          originalplannedrfqissuedate:        First(colPackageDetails).originalplannedrfqissuedate,
                                          originalplannedrfqclosingdate:      First(colPackageDetails).originalplannedrfqclosingdate,
                                          originalplannedevaluationcompleti:  First(colPackageDetails).originalplannedevaluationcompleti,
                                          originalplannedawarddate:           First(colPackageDetails).originalplannedawarddate,
                                          requiredatsitedate:                 First(colPackageDetails).requiredatsitedate,

                                          // Actual dates
                                          actualsowdate:                      First(colPackageDetails).actualsowdate,
                                          actualrfqissuedate:                 First(colPackageDetails).actualrfqissuedate,
                                          actualrfqclosingdate:               First(colPackageDetails).actualrfqclosingdate,
                                          actualevaluationcompletiondate:     First(colPackageDetails).actualevaluationcompletiondate,
                                          actualawarddate:                    First(colPackageDetails).actualawarddate,

                                          // Revised Planned dates
                                          revisedplannedsowdate:              First(colPackageDetails).revisedplannedsowdate,
                                          revisedplannedrfqissuedate:         First(colPackageDetails).revisedplannedrfqissuedate,
                                          revisedplannedrfqclosingdate:       First(colPackageDetails).revisedplannedrfqclosingdate,
                                          revisedplannedevaluationcompletio:  First(colPackageDetails).revisedplannedevaluationcompletio,
                                          revisedplannedawarddate:            First(colPackageDetails).revisedplannedawarddate,

                                          // Post Award
                                          subcontractorname:                  First(colPackageDetails).subcontractorname,
                                          purchaseordernumber:                First(colPackageDetails).purchaseordernumber,
                                          awardvalue:                         First(colPackageDetails).awardvalue,
                                          indigenous_award:                   First(colPackageDetails).indigenous_award,
                                          ontario_award:                      First(colPackageDetails).ontario_award,
                                          budgetamount:                       First(colPackageDetails).budgetamount,
                                          buybackresaletarget:                First(colPackageDetails).buybackresaletarget
                                      }
                                  )
                              );
                              Patch(
                                  colProjectPackages,
                                  LookUp(
                                      colProjectPackages,
                                      packageidentifier = varSavedPackage.packageidentifier
                                  ),
                                  varSavedPackage
                              );
                              Notify("All changes saved successfully!", NotificationType.Success),

                              Notify(
                                  "Error saving: " & FirstError.Message,
                                  NotificationType.Error
                              )
                          )
                        Text: ="Save Changes"
                        TextSize: =12
                        Visible: =varCanEditCurrentProject
                        Width: =220

                                                OnPressAction: "=With(\r\n    {\r\n        hasActuals: !IsBlank(First(colPackageDetails).actualsowdate) ||\r\n                    !IsBlank(First(colPackageDetails).actualrfqissuedate) ||\r\n                    !IsBlank(First(colPackageDetails).actualrfqclosingdate) ||\r\n                    !IsBlank(First(colPackageDetails).actualevaluationcompletiondate) ||\r\n                    !IsBlank(First(colPackageDetails).actualawarddate)\r\n    },\r\n    If(\r\n        hasActuals,\r\n        // FORWARD from latest actual: completed steps' plan = their actual; remaining steps chain forward with durations\r\n        Patch(\r\n            colPackageDetails,\r\n            First(colPackageDetails),\r\n            {\r\n                originalplannedsowdate: If(\r\n                    !IsBlank(First(colPackageDetails).actualsowdate),\r\n                    First(colPackageDetails).actualsowdate,\r\n                    First(colPackageDetails).originalplannedsowdate\r\n                ),\r\n                \r\n                originalplannedrfqissuedate: If(\r\n                    !IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                    First(colPackageDetails).actualrfqissuedate,\r\n                    If(\r\n                        !IsBlank(First(colPackageDetails).actualsowdate),\r\n                        DateAdd(First(colPackageDetails).actualsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days),\r\n                        First(colPackageDetails).originalplannedrfqissuedate\r\n                    )\r\n                ),\r\n                \r\n                originalplannedrfqclosingdate: If(\r\n                    !IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                    First(colPackageDetails).actualrfqclosingdate,\r\n                    If(\r\n                        !IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                        DateAdd(First(colPackageDetails).actualrfqissuedate, First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days),\r\n                        If(\r\n                            !IsBlank(First(colPackageDetails).actualsowdate),\r\n                            DateAdd(DateAdd(First(colPackageDetails).actualsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days),\r\n                            First(colPackageDetails).originalplannedrfqclosingdate\r\n                        )\r\n                    )\r\n                ),\r\n                \r\n                originalplannedevaluationcompleti: If(\r\n                    !IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n                    First(colPackageDetails).actualevaluationcompletiondate,\r\n                    If(\r\n                        !IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                        DateAdd(First(colPackageDetails).actualrfqclosingdate, First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                        If(\r\n                            !IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                            DateAdd(DateAdd(First(colPackageDetails).actualrfqissuedate, First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                            If(\r\n                                !IsBlank(First(colPackageDetails).actualsowdate),\r\n                                DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                                First(colPackageDetails).originalplannedevaluationcompleti\r\n                            )\r\n                        )\r\n                    )\r\n                ),\r\n                \r\n                originalplannedawarddate: If(\r\n                    !IsBlank(First(colPackageDetails).actualawarddate),\r\n                    First(colPackageDetails).actualawarddate,\r\n                    If(\r\n                        !IsBlank(First(colPackageDetails).actualevaluationcompletiondate),\r\n                        DateAdd(First(colPackageDetails).actualevaluationcompletiondate, First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                        If(\r\n                            !IsBlank(First(colPackageDetails).actualrfqclosingdate),\r\n                            DateAdd(DateAdd(First(colPackageDetails).actualrfqclosingdate, First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                            If(\r\n                                !IsBlank(First(colPackageDetails).actualrfqissuedate),\r\n                                DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualrfqissuedate, First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                                If(\r\n                                    !IsBlank(First(colPackageDetails).actualsowdate),\r\n                                    DateAdd(DateAdd(DateAdd(DateAdd(First(colPackageDetails).actualsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days),\r\n                                    First(colPackageDetails).originalplannedawarddate\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            }\r\n        );\r\n        // Mirror plan to forecast and update On-Site date\r\n        Patch(\r\n            colPackageDetails,\r\n            First(colPackageDetails),\r\n            {\r\n                revisedplannedsowdate: First(colPackageDetails).originalplannedsowdate,\r\n                revisedplannedrfqissuedate: First(colPackageDetails).originalplannedrfqissuedate,\r\n                revisedplannedrfqclosingdate: First(colPackageDetails).originalplannedrfqclosingdate,\r\n                revisedplannedevaluationcompletio: First(colPackageDetails).originalplannedevaluationcompleti,\r\n                revisedplannedawarddate: First(colPackageDetails).originalplannedawarddate,\r\n                requiredatsitedate: DateAdd(First(colPackageDetails).originalplannedawarddate, First(colPackageDetails).standardleadtimemonths, TimeUnit.Days)\r\n            }\r\n        );\r\n        Notify(\"Plan recalculated forward from actuals. Forecast and On-Site date updated to match.\", NotificationType.Success),\r\n        \r\n        // FORWARD from SOW plan: no actuals - chain forward using durations, including On-Site\r\n        Patch(\r\n            colPackageDetails,\r\n            First(colPackageDetails),\r\n            {\r\n                originalplannedrfqissuedate: DateAdd(First(colPackageDetails).originalplannedsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days),\r\n                originalplannedrfqclosingdate: DateAdd(DateAdd(First(colPackageDetails).originalplannedsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days),\r\n                originalplannedevaluationcompleti: DateAdd(DateAdd(DateAdd(First(colPackageDetails).originalplannedsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days),\r\n                originalplannedawarddate: DateAdd(DateAdd(DateAdd(DateAdd(First(colPackageDetails).originalplannedsowdate, First(colPackageDetails).leadtimesowtorfqissuedays, TimeUnit.Days), First(colPackageDetails).leadtimerfqissuetoclosingdays, TimeUnit.Days), First(colPackageDetails).leadtimeclosingtoevaluationdays, TimeUnit.Days), First(colPackageDetails).leadtimeevaluationtoawarddays, TimeUnit.Days)\r\n            }\r\n        );\r\n        Patch(\r\n            colPackageDetails,\r\n            First(colPackageDetails),\r\n            {\r\n                revisedplannedsowdate: First(colPackageDetails).originalplannedsowdate,\r\n                revisedplannedrfqissuedate: First(colPackageDetails).originalplannedrfqissuedate,\r\n                revisedplannedrfqclosingdate: First(colPackageDetails).originalplannedrfqclosingdate,\r\n                revisedplannedevaluationcompletio: First(colPackageDetails).originalplannedevaluationcompleti,\r\n                revisedplannedawarddate: First(colPackageDetails).originalplannedawarddate,\r\n                requiredatsitedate: DateAdd(First(colPackageDetails).originalplannedawarddate, First(colPackageDetails).standardleadtimemonths, TimeUnit.Days)\r\n            }\r\n        );\r\n        Notify(\"Plan recalculated forward from SOW date. Forecast and On-Site date updated to match.\", NotificationType.Success)\r\n    )\r\n)"
                                                Text: ="Recalculate Plan"

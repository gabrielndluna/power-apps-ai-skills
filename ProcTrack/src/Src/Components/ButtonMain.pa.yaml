ComponentDefinitions:
  ButtonMain:
    DefinitionType: CanvasComponent
    CustomProperties:
      ArrowVisible:
        PropertyKind: Input
        DisplayName: ArrowVisible
        Description: A custom property
        DataType: Boolean
        Default: =true
      Icon:
        PropertyKind: Input
        DisplayName: Icon
        Description: A custom property
        DataType: Text
        Default: ="Text"
      IconVisible:
        PropertyKind: Input
        DisplayName: IconVisible
        Description: A custom property
        DataType: Boolean
        Default: =true
      OnPressAction:
        PropertyKind: Event
        DisplayName: OnPressAction
        Description: Onselect of the button
        ReturnType: None
        Default: =
      Text:
        PropertyKind: Input
        DisplayName: Text
        Description: A custom property
        DataType: Text
        Default: ="Text"
      TextSize:
        PropertyKind: Input
        DisplayName: TextSize
        Description: A custom property
        DataType: Number
        Default: =100
    Properties:
      Fill: |
        =Color.White
      Height: =60
      Width: =350
    Children:
      - Button1_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#D61E2C")
            BorderThickness: =3
            Color: =ColorValue("#FFFFFF")
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(214, 12, 48, 1)
            Font: =Font.'Segoe UI'
            Height: =ButtonMain.Height
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorValue("#D61E2C")
            OnSelect: =ButtonMain.OnPressAction()
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.White
            Size: =ButtonMain.TextSize
            Text: =ButtonMain.Text
            Width: =ButtonMain.Width
            X: =(Parent.Width - Self.Width ) /2
            Y: =(Parent.Height - Self.Height ) /2
      - Icon4_2:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =ColorValue("#FFFFFF")
            Height: =ButtonMain.Height
            Icon: =Icon.ChevronRight
            OnSelect: =ButtonMain.OnPressAction()
            Visible: =ButtonMain.ArrowVisible
            Width: =30
            X: =ButtonMain.Width*0.85
      - Icon4_3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =ColorValue("#FFFFFF")
            Height: =ButtonMain.Height
            Icon: =ButtonMain.Icon
            OnSelect: =ButtonMain.OnPressAction()
            Visible: =ButtonMain.IconVisible
            Width: =30
            X: =ButtonMain.Width*0.07

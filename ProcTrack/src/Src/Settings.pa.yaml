                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                    - set_proj_cancel:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(200, 204, 210, 1)
                                          Color: =RGBA(48, 48, 48, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =36
                                          OnSelect: |-
                                            =Set(varSettingsEditProject, Blank());
                                            Reset(set_proj_id);
                                            Reset(set_proj_name);
                                            Reset(set_proj_code)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =12
                                          Text: ="Cancel"
                                          Width: =90
                                    - set_proj_save:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisplayMode: |-
                                            =If(
                                                IsBlank(Trim(set_proj_id.Text)) || IsBlank(Trim(set_proj_name.Text)),
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Fill: =RGBA(214, 12, 48, 1)
                                          Height: =36
                                          OnSelect: |-
                                            =If(
                                                IsBlank(Trim(set_proj_id.Text)) || IsBlank(Trim(set_proj_name.Text)),
                                                Notify("Identifier and name are required.", NotificationType.Warning),
                                                If(
                                                    IsBlank(varSettingsEditProject),
                                                    With(
                                                        { newId: Lower(Text(GUID())) },
                                                        Patch(
                                                            'ProcTrack - Projects',
                                                            Defaults('ProcTrack - Projects'),
                                                            {
                                                                projectid: newId,
                                                                projectidentifier: Trim(set_proj_id.Text),
                                                                projectname: Trim(set_proj_name.Text),
                                                                projectcode: Trim(set_proj_code.Text),
                                                                Title: Trim(set_proj_id.Text),
                                                                creationdate: Today()
                                                            }
                                                        );
                                                        With(
                                                            {
                                                                existing: LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail),
                                                                editIds: If(
                                                                    IsBlank(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail)),
                                                                    newId,
                                                                    If(
                                                                        IsBlank(LookUp(Split(Coalesce(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects, ""), ";"), Trim(Value) = newId)),
                                                                        If(
                                                                            IsBlank(Trim(Coalesce(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects, ""))),
                                                                            newId,
                                                                            Trim(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects) & ";" & newId
                                                                        ),
                                                                        LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects
                                                                    )
                                                                )
                                                            },
                                                            Patch(
                                                                'ProcTrack - Permissions',
                                                                Coalesce(existing, Defaults('ProcTrack - Permissions')),
                                                                {
                                                                    Title: varCurrentUserEmail,
                                                                    Name: User().FullName,
                                                                    IsAdmin: If(IsBlank(existing), true, Coalesce(existing.IsAdmin, true)),
                                                                    Edit_Projects: editIds,
                                                                    View_Projects: Coalesce(existing.View_Projects, "")
                                                                }
                                                            )
                                                        );
                                                        Notify("Project created. You were granted Edit access.", NotificationType.Success)
                                                    ),
                                                    Patch(
                                                        'ProcTrack - Projects',
                                                        varSettingsEditProject,
                                                        {
                                                            projectidentifier: Trim(set_proj_id.Text),
                                                            projectname: Trim(set_proj_name.Text),
                                                            projectcode: Trim(set_proj_code.Text),
                                                            Title: Trim(set_proj_id.Text)
                                                        }
                                                    );
                                                    Notify("Project updated.", NotificationType.Success)
                                                );
                                                ClearCollect(colAllProjects, 'ProcTrack - Projects');
                                                Set(varUserPerm, LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail));
                                                Set(varIsAdmin, Coalesce(varUserPerm.IsAdmin, false));
                                                ClearCollect(
                                                    colMyProjectIds,
                                                    Distinct(
                                                        Filter(
                                                            Split(
                                                                Coalesce(varUserPerm.Edit_Projects, "") & ";" & Coalesce(varUserPerm.View_Projects, ""),
                                                                ";"
                                                            ),
                                                            !IsBlank(Trim(ThisRecord.Value))
                                                        ),
                                                        Value
                                                    )
                                                );
                                                Clear(colPermittedProjects);
                                                ForAll(
                                                    colMyProjectIds As idRow,
                                                    Collect(
                                                        colPermittedProjects,
                                                        LookUp('ProcTrack - Projects', projectid = Trim(idRow.Value))
                                                    )
                                                );
                                                ClearCollect(
                                                    colPermittedProjects,
                                                    Filter(colPermittedProjects, !IsBlank(projectid))
                                                );
                                                Set(varSettingsEditProject, Blank());
                                                Reset(set_proj_id);
                                                Reset(set_proj_name);
                                                Reset(set_proj_code)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =12
                                          Text: =If(IsBlank(varSettingsEditProject), "Add project", "Save project")
                                          Width: =130

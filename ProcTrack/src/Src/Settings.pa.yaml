Screens:
  Settings:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(214, 12, 48, 1)
      OnVisible: |-
        =Set(varCurrentUserEmail, Lower(User().Email));
        ClearCollect(colAllPermissions, 'ProcTrack - Permissions');
        Set(varUserPerm, LookUp(colAllPermissions, Lower(Title) = varCurrentUserEmail));
        Set(
            varIsAdmin,
            !IsBlank(varUserPerm) &&
            (
                varUserPerm.IsAdmin = true ||
                Lower(Text(varUserPerm.IsAdmin)) = "true" ||
                Lower(Text(varUserPerm.IsAdmin)) = "yes"
            )
        );
        Set(varSettingsTab, If(varIsAdmin, "users", "columns"));
        Set(varSettingsSelectedEmail, "");
        Set(varSettingsSelectedName, "");
        Set(varSettingsEntraId, "");
        Set(varSettingsGrantAdmin, false);
        Set(varSettingsEditProject, Blank());
        Set(varSettingsFilter, "");
        Set(varShowUserModal, false);
        Set(varShowProjectModal, false);
        Set(varSettingsUserIsNew, true);
        ClearCollect(colAllProjects, 'ProcTrack - Projects');
        ClearCollect(
            colSettingsProjectAccess,
            ForAll(
                Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                {
                    projectid: p.projectid,
                    projectidentifier: Coalesce(p.projectidentifier, p.Title),
                    projectname: Coalesce(p.projectname, ""),
                    access: "None"
                }
            )
        );
        ClearCollect(
            colSettingsUserMatrix,
            ForAll(
                colAllPermissions As u,
                {
                    Title: u.Title,
                    Name: u.Name,
                    IsAdmin: u.IsAdmin,
                    Entra_ID: u.Entra_ID,
                    Edit_Projects: u.Edit_Projects,
                    View_Projects: u.View_Projects,
                    checks: ForAll(
                        Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                        {
                            projectid: p.projectid,
                            label: Coalesce(p.projectidentifier, p.Title),
                            hasAccess: !IsBlank(
                                LookUp(
                                    Split(
                                        Coalesce(u.Edit_Projects, "") & ";" & Coalesce(u.View_Projects, ""),
                                        ";"
                                    ),
                                    Trim(Value) = p.projectid
                                )
                            )
                        }
                    )
                }
            )
        );
        Reset(set_user_combo)
    Children:
      - set_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =Parent.Height
            LayoutMinWidth: =Parent.Width
            PaddingBottom: =12
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =12
            Width: =Parent.Width
          Children:
            - set_header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Light
                  Fill: =RGBA(214, 12, 48, 1)
                  FillPortions: =0
                  Height: =84
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =84
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =10
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - set_back_btn:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(214, 12, 48, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Back()
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Back"
                        Width: =72
                  - set_header_title_col:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                      Children:
                        - set_header_title:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =18
                              Text: ="Settings"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                        - set_header_sub:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.92)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: =User().FullName & "  |  " & If(varIsAdmin, "Admin", "User")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                              Wrap: =false
            - set_tabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =42
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =42
                  Width: =Parent.Width
                Children:
                  - set_tab_users:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varSettingsTab = "users", RGBA(255, 255, 255, 1), RGBA(48, 48, 48, 1))
                        Fill: =If(varSettingsTab = "users", RGBA(214, 12, 48, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "users")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Users"
                  - set_tab_projects:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varSettingsTab = "projects", RGBA(255, 255, 255, 1), RGBA(48, 48, 48, 1))
                        Fill: =If(varSettingsTab = "projects", RGBA(214, 12, 48, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "projects")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Projects"
                  - set_tab_columns:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varSettingsTab = "columns", RGBA(255, 255, 255, 1), RGBA(48, 48, 48, 1))
                        Fill: =If(varSettingsTab = "columns", RGBA(214, 12, 48, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "columns")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Columns"
            - set_body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - set_users_panel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =12
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =varSettingsTab = "users"
                        Width: =Parent.Width
                      Children:
                        - set_users_admin_gate:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(176, 51, 63, 1)
                              Fill: =RGBA(255, 245, 245, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =48
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =8
                              Size: =12
                              Text: ="Admin access required. Set IsAdmin = Yes on your ProcTrack - Permissions row."
                              Visible: =!varIsAdmin
                              Width: =Parent.Width
                              Wrap: =true
                        - set_users_toolbar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                            Children:
                              - set_users_list_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(48, 48, 48, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Size: =16
                                    Text: ="All users"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                              - set_users_add_btn:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(214, 12, 48, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varSettingsUserIsNew, true);
                                      Set(varSettingsSelectedEmail, "");
                                      Set(varSettingsSelectedName, "");
                                      Set(varSettingsEntraId, "");
                                      Set(varSettingsGrantAdmin, false);
                                      ClearCollect(
                                          colSettingsProjectAccess,
                                          ForAll(
                                              Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                                              {
                                                  projectid: p.projectid,
                                                  projectidentifier: Coalesce(p.projectidentifier, p.Title),
                                                  projectname: Coalesce(p.projectname, ""),
                                                  access: "None"
                                              }
                                          )
                                      );
                                      Reset(set_user_combo);
                                      Set(varShowUserModal, true)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="Add user"
                                    Width: =110
                        - set_users_filter:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =34
                              HintText: ="Filter by name or email"
                              OnChange: =Set(varSettingsFilter, Lower(Trim(Self.Text)))
                              Size: =12
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                        - set_users_col_header:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(248, 249, 250, 1)
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =36
                              LayoutMinWidth: =0
                              PaddingLeft: =10
                              PaddingRight: =10
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                            Children:
                              - set_users_h_name:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(106, 122, 127, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =11
                                    Text: ="Name"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =150
                              - set_users_h_email:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(106, 122, 127, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =11
                                    Text: ="Email"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =200
                              - set_users_h_projects:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    FillPortions: =1
                                    Height: =28
                                    Items: =Sort(colAllProjects, Title, SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplatePadding: =0
                                    TemplateSize: =72
                                    Width: =Parent.Width
                                  Children:
                                    - set_users_h_proj_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(106, 122, 127, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          Size: =9
                                          Text: =Coalesce(ThisItem.projectidentifier, ThisItem.Title)
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.TemplateWidth
                                          Wrap: =false
                                          X: =0
                                          Y: =2
                              - set_users_h_edit:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(106, 122, 127, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =11
                                    Text: =""
                                    Width: =70
                        - set_users_gallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              FillPortions: =1
                              Height: =280
                              Items: |-
                                =Filter(
                                    colSettingsUserMatrix,
                                    IsBlank(varSettingsFilter) ||
                                    varSettingsFilter in Lower(Coalesce(Name, "")) ||
                                    varSettingsFilter in Lower(Coalesce(Title, ""))
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplatePadding: =2
                              TemplateSize: =56
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                            Children:
                              - set_ug_row:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 251, 252, 1)
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinWidth: =0
                                    PaddingLeft: =10
                                    PaddingRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - set_ug_name:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(48, 48, 48, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Size: =12
                                          Text: =ThisItem.Name & If(ThisItem.IsAdmin, " · Admin", "")
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =150
                                          Wrap: =true
                                    - set_ug_email:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(106, 122, 127, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =40
                                          Size: =11
                                          Text: =ThisItem.Title
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =200
                                          Wrap: =true
                                    - set_ug_checks:
                                        Control: Gallery@2.15.0
                                        Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                                        Properties:
                                          FillPortions: =1
                                          Height: =40
                                          Items: =ThisItem.checks
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TemplatePadding: =0
                                          TemplateSize: =72
                                          Width: =Parent.Width
                                        Children:
                                          - set_ug_check_icon:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Color: =If(ThisItem.hasAccess, RGBA(34, 139, 34, 1), RGBA(200, 204, 210, 1))
                                                Height: =22
                                                Icon: =If(ThisItem.hasAccess, Icon.CheckBadge, Icon.CancelBadge)
                                                Width: =22
                                                X: =(Parent.TemplateWidth - Self.Width) / 2
                                                Y: =9
                                    - set_ug_edit:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =RGBA(214, 12, 48, 1)
                                          FillPortions: =0
                                          Height: =30
                                          OnSelect: |-
                                            =Set(varSettingsUserIsNew, false);
                                            Set(varSettingsSelectedEmail, Lower(ThisItem.Title));
                                            Set(varSettingsSelectedName, ThisItem.Name);
                                            Set(
                                                varSettingsEntraId,
                                                Coalesce(
                                                    ThisItem.Entra_ID,
                                                    Office365Users.UserProfileV2(Lower(ThisItem.Title)).id
                                                )
                                            );
                                            Set(varSettingsGrantAdmin, Coalesce(ThisItem.IsAdmin, false));
                                            ClearCollect(
                                                colSettingsProjectAccess,
                                                ForAll(
                                                    Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                                                    {
                                                        projectid: p.projectid,
                                                        projectidentifier: Coalesce(p.projectidentifier, p.Title),
                                                        projectname: Coalesce(p.projectname, ""),
                                                        access: If(
                                                            !IsBlank(LookUp(Split(Coalesce(ThisItem.Edit_Projects, ""), ";"), Trim(Value) = p.projectid)),
                                                            "Edit",
                                                            If(
                                                                !IsBlank(LookUp(Split(Coalesce(ThisItem.View_Projects, ""), ";"), Trim(Value) = p.projectid)),
                                                                "View",
                                                                "None"
                                                            )
                                                        )
                                                    }
                                                )
                                            );
                                            Set(varShowUserModal, true)
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Size: =11
                                          Text: ="Edit"
                                          Width: =70
                  - set_projects_panel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =12
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =varSettingsTab = "projects"
                        Width: =Parent.Width
                      Children:
                        - set_proj_admin_gate:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(176, 51, 63, 1)
                              Fill: =RGBA(255, 245, 245, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =48
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =8
                              Size: =12
                              Text: ="Admin access required. Set IsAdmin = Yes on your ProcTrack - Permissions row."
                              Visible: =!varIsAdmin
                              Width: =Parent.Width
                              Wrap: =true
                        - set_proj_toolbar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =40
                              LayoutMinWidth: =0
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                            Children:
                              - set_proj_list_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(48, 48, 48, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Size: =16
                                    Text: ="All projects"
                                    VerticalAlign: =VerticalAlign.Middle
                              - set_proj_add_btn:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(214, 12, 48, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varSettingsEditProject, Blank());
                                      Reset(set_proj_id);
                                      Reset(set_proj_name);
                                      Reset(set_proj_code);
                                      Set(varShowProjectModal, true)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="New project"
                                    Width: =120
                        - set_proj_gallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              FillPortions: =1
                              Height: =280
                              Items: =Sort(colAllProjects, Title, SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplatePadding: =2
                              TemplateSize: =64
                              Visible: =varIsAdmin
                              Width: =Parent.Width
                            Children:
                              - set_pg_row:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 251, 252, 1)
                                    Height: =60
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinWidth: =0
                                    PaddingLeft: =10
                                    PaddingRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - set_pg_logo:
                                        Control: Image@2.2.3
                                        Properties:
                                          FillPortions: =0
                                          Height: =40
                                          Image: =ThisItem.project_logo
                                          Width: =40
                                    - set_pg_text:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - set_pg_name:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(48, 48, 48, 1)
                                                FillPortions: =0
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                Size: =13
                                                Text: =ThisItem.projectname
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =Parent.Width

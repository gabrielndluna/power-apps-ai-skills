                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =18
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                      Children:
                        - set_proj_modal_title_row:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinWidth: =0
                              Width: =Parent.Width - 40
                            Children:
                              - set_proj_form_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(48, 48, 48, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Size: =16
                                    Text: =If(IsBlank(varSettingsEditProject), "New project", "Edit project")
                                    VerticalAlign: =VerticalAlign.Middle
                              - set_proj_modal_close:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(90, 96, 105, 1)
                                    Fill: =RGBA(241, 242, 244, 1)
                                    FillPortions: =0
                                    Height: =32
                                    OnSelect: |-
                                      =Set(varShowProjectModal, false);
                                      Set(varSettingsEditProject, Blank())
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Text: ="Close"
                                    Width: =72
                        - set_proj_id_lbl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(106, 122, 127, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =11
                              Text: ="Project identifier"
                              Width: =Parent.Width - 40
                        - set_proj_id:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              Default: =Coalesce(varSettingsEditProject.projectidentifier, varSettingsEditProject.Title)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              Size: =12
                              Width: =Parent.Width - 40
                        - set_proj_code_lbl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(106, 122, 127, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =11
                              Text: ="Project code"
                              Width: =Parent.Width - 40
                        - set_proj_code:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              Default: =varSettingsEditProject.projectcode
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              Size: =12
                              Width: =Parent.Width - 40
                        - set_proj_name_lbl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(106, 122, 127, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =11
                              Text: ="Project name"
                              Width: =Parent.Width - 40
                        - set_proj_name:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              Default: =varSettingsEditProject.projectname
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              Size: =12
                              Width: =Parent.Width - 40
                        - set_proj_logo_row:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width - 40
                            Children:
                              - set_proj_logo_preview:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(200, 204, 210, 1)
                                    FillPortions: =0
                                    Height: =64
                                    Image: =varSettingsEditProject.project_logo
                                    Width: =64
                              - set_proj_logo_help:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(106, 122, 127, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Height: =64
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="Logo from SharePoint project_logo. Upload or replace it in the Projects list."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =true
                        - set_proj_actions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinWidth: =0
                              Width: =Parent.Width - 40
                            Children:
                              - set_proj_spacer:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                              - set_proj_cancel:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(200, 204, 210, 1)
                                    Color: =RGBA(48, 48, 48, 1)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varShowProjectModal, false);
                                      Set(varSettingsEditProject, Blank());
                                      Reset(set_proj_id);
                                      Reset(set_proj_name);
                                      Reset(set_proj_code)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="Cancel"
                                    Width: =90
                              - set_proj_save:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(Trim(set_proj_id.Text)) || IsBlank(Trim(set_proj_name.Text)),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Fill: =RGBA(214, 12, 48, 1)
                                    FillPortions: =0
                                    Height: =36
                                    OnSelect: |-
                                      =If(
                                          IsBlank(Trim(set_proj_id.Text)) || IsBlank(Trim(set_proj_name.Text)),
                                          Notify("Identifier and name are required.", NotificationType.Warning),
                                          If(
                                              IsBlank(varSettingsEditProject),
                                              With(
                                                  { newId: Lower(Text(GUID())) },
                                                  Patch(
                                                      'ProcTrack - Projects',
                                                      Defaults('ProcTrack - Projects'),
                                                      {
                                                          projectid: newId,
                                                          projectidentifier: Trim(set_proj_id.Text),
                                                          projectname: Trim(set_proj_name.Text),
                                                          projectcode: Trim(set_proj_code.Text),
                                                          Title: Trim(set_proj_id.Text),
                                                          creationdate: Today()
                                                      }
                                                  );
                                                  With(
                                                      {
                                                          existing: LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail),
                                                          editIds: If(
                                                              IsBlank(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail)),
                                                              newId,
                                                              If(
                                                                  IsBlank(LookUp(Split(Coalesce(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects, ""), ";"), Trim(Value) = newId)),
                                                                  If(
                                                                      IsBlank(Trim(Coalesce(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects, ""))),
                                                                      newId,
                                                                      Trim(LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects) & ";" & newId
                                                                  ),
                                                                  LookUp('ProcTrack - Permissions', Title = varCurrentUserEmail).Edit_Projects
                                                              )
                                                          )
                                                      },
                                                      Patch(
                                                          'ProcTrack - Permissions',
                                                          Coalesce(existing, Defaults('ProcTrack - Permissions')),
                                                          {
                                                              Title: varCurrentUserEmail,
                                                              Name: User().FullName,
                                                              Entra_ID: Coalesce(
                                                                  existing.Entra_ID,
                                                                  Office365Users.UserProfileV2(varCurrentUserEmail).id
                                                              ),
                                                              IsAdmin: If(IsBlank(existing), true, Coalesce(existing.IsAdmin, true)),
                                                              Edit_Projects: editIds,
                                                              View_Projects: Coalesce(existing.View_Projects, "")
                                                          }
                                                      )
                                                  );
                                                  Notify("Project created. You were granted Edit access.", NotificationType.Success)
                                              ),
                                              Patch(
                                                  'ProcTrack - Projects',
                                                  varSettingsEditProject,
                                                  {
                                                      projectidentifier: Trim(set_proj_id.Text),
                                                      projectname: Trim(set_proj_name.Text),
                                                      projectcode: Trim(set_proj_code.Text),
                                                      Title: Trim(set_proj_id.Text)
                                                  }
                                              );
                                              Notify("Project updated.", NotificationType.Success)
                                          );
                                          ClearCollect(colAllProjects, 'ProcTrack - Projects');
                                          ClearCollect(colAllPermissions, 'ProcTrack - Permissions');
                                          Set(varUserPerm, LookUp(colAllPermissions, Lower(Title) = varCurrentUserEmail));
                                          Set(
                                              varIsAdmin,
                                              !IsBlank(varUserPerm) &&
                                              (
                                                  varUserPerm.IsAdmin = true ||
                                                  Lower(Text(varUserPerm.IsAdmin)) = "true" ||
                                                  Lower(Text(varUserPerm.IsAdmin)) = "yes"
                                              )
                                          );
                                          ClearCollect(
                                              colMyProjectIds,
                                              Filter(
                                                  Split(
                                                      Coalesce(varUserPerm.Edit_Projects, "") & ";" & Coalesce(varUserPerm.View_Projects, ""),
                                                      ";"
                                                  ),
                                                  !IsBlank(Trim(Value))
                                              )
                                          );
                                          ClearCollect(
                                              colPermittedProjects,
                                              If(
                                                  varIsAdmin,
                                                  colAllProjects,
                                                  Filter(
                                                      colAllProjects,
                                                      !IsBlank(LookUp(colMyProjectIds, Trim(Value) = projectid))
                                                  )
                                              )
                                          );
                                          ClearCollect(
                                              colSettingsUserMatrix,
                                              ForAll(
                                                  colAllPermissions As u,
                                                  {
                                                      Title: u.Title,
                                                      Name: u.Name,
                                                      IsAdmin: u.IsAdmin,
                                                      Entra_ID: u.Entra_ID,
                                                      Edit_Projects: u.Edit_Projects,
                                                      View_Projects: u.View_Projects,
                                                      checks: ForAll(
                                                          Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                                                          {
                                                              projectid: p.projectid,
                                                              label: Coalesce(p.projectidentifier, p.Title),
                                                              hasAccess: !IsBlank(
                                                                  LookUp(
                                                                      Split(
                                                                          Coalesce(u.Edit_Projects, "") & ";" & Coalesce(u.View_Projects, ""),
                                                                          ";"
                                                                      ),
                                                                      Trim(Value) = p.projectid
                                                                  )
                                                              )
                                                          }
                                                      )
                                                  }
                                              )
                                          );
                                          Set(varSettingsEditProject, Blank());
                                          Reset(set_proj_id);
                                          Reset(set_proj_name);
                                          Reset(set_proj_code);
                                          Set(varShowProjectModal, false)
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: =If(IsBlank(varSettingsEditProject), "Create", "Save")
                                    Width: =110

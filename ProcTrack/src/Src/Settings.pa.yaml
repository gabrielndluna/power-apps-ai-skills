                              BorderColor: =RGBA(200, 204, 210, 1)
                              ChevronBackground: =RGBA(214, 12, 48, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              DisplayFields: =["DisplayName"]
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              InputTextPlaceholder: ="Search by name or email"
                              IsSearchable: =true
                              Items: |-
                                =If(
                                    !IsBlank(Trim(Self.SearchText)),
                                    ShowColumns(
                                        Office365Users.SearchUser(
                                            {
                                                searchTerm: Trim(Self.SearchText),
                                                top: 15
                                            }
                                        ),
                                        Id,
                                        DisplayName,
                                        Mail,
                                        UserPrincipalName,
                                        Department
                                    )
                                )
                              OnChange: |-
                                =Set(
                                    varSettingsSelectedEmail,
                                    Lower(Coalesce(Self.Selected.Mail, Self.Selected.UserPrincipalName))
                                );
                                Set(varSettingsSelectedName, Self.Selected.DisplayName);
                                Set(varSettingsEntraId, Self.Selected.Id);
                                With(
                                    {
                                        existing: LookUp(colAllPermissions, Lower(Title) = varSettingsSelectedEmail)
                                    },
                                    Set(varSettingsGrantAdmin, Coalesce(existing.IsAdmin, false));
                                    If(
                                        !IsBlank(existing.Entra_ID) && IsBlank(varSettingsEntraId),
                                        Set(varSettingsEntraId, existing.Entra_ID)
                                    );
                                    ClearCollect(
                                        colSettingsProjectAccess,
                                        ForAll(
                                            Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                                            {
                                                projectid: p.projectid,
                                                projectidentifier: Coalesce(p.projectidentifier, p.Title),
                                                projectname: Coalesce(p.projectname, ""),
                                                access: If(
                                                    !IsBlank(LookUp(Split(Coalesce(existing.Edit_Projects, ""), ";"), Trim(Value) = p.projectid)),
                                                    "Edit",
                                                    If(
                                                        !IsBlank(LookUp(Split(Coalesce(existing.View_Projects, ""), ";"), Trim(Value) = p.projectid)),
                                                        "View",
                                                        "None"
                                                    )
                                                )
                                            }
                                        )
                                    )
                                )

                                    Width: =90
                              - set_users_save:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(IsBlank(varSettingsSelectedEmail), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(214, 12, 48, 1)
                                    FillPortions: =0
                                    Height: =36
                                    OnSelect: |-
                                      =If(
                                          IsBlank(varSettingsSelectedEmail),
                                          Notify("Select a person first.", NotificationType.Warning),
                                          Set(
                                              varSettingsEntraId,
                                              Coalesce(
                                                  varSettingsEntraId,
                                                  Office365Users.UserProfileV2(varSettingsSelectedEmail).id
                                              )
                                          );
                                          If(
                                              IsBlank(varSettingsEntraId),
                                              Notify("Could not resolve Entra ID for this user.", NotificationType.Error),
                                              With(
                                                  {
                                                      editIds: Concat(
                                                          Filter(colSettingsProjectAccess, access = "Edit" && !IsBlank(projectid)),
                                                          projectid,
                                                          ";"
                                                      ),
                                                      viewIds: Concat(
                                                          Filter(colSettingsProjectAccess, access = "View" && !IsBlank(projectid)),
                                                          projectid,
                                                          ";"
                                                      ),
                                                      existing: LookUp(colAllPermissions, Lower(Title) = varSettingsSelectedEmail)
                                                  },
                                                  Collect(
                                                      colAllPermissions,
                                                      Patch(
                                                          'ProcTrack - Permissions',
                                                          Coalesce(existing, Defaults('ProcTrack - Permissions')),
                                                          {
                                                              Title: varSettingsSelectedEmail,
                                                              Name: varSettingsSelectedName,
                                                              Entra_ID: varSettingsEntraId,
                                                              IsAdmin: varSettingsGrantAdmin,
                                                              Edit_Projects: editIds,
                                                              View_Projects: viewIds
                                                          }
                                                      )
                                                  );
                                                  ClearCollect(colAllPermissions, 'ProcTrack - Permissions');
                                                  ClearCollect(
                                                      colSettingsUserMatrix,
                                                      ForAll(
                                                          colAllPermissions As u,
                                                          {
                                                              Title: u.Title,
                                                              Name: u.Name,
                                                              IsAdmin: u.IsAdmin,
                                                              Entra_ID: u.Entra_ID,
                                                              Edit_Projects: u.Edit_Projects,
                                                              View_Projects: u.View_Projects,
                                                              checks: ForAll(
                                                                  Sort(colAllProjects, Title, SortOrder.Ascending) As p,
                                                                  {
                                                                      projectid: p.projectid,
                                                                      label: Coalesce(p.projectidentifier, p.Title),
                                                                      hasAccess: !IsBlank(
                                                                          LookUp(
                                                                              Split(
                                                                                  Coalesce(u.Edit_Projects, "") & ";" & Coalesce(u.View_Projects, ""),
                                                                                  ";"
                                                                              ),
                                                                              Trim(Value) = p.projectid
                                                                          )
                                                                      )
                                                                  }
                                                              )
                                                          }
                                                      )
                                                  );
                                                  If(
                                                      varSettingsSelectedEmail = varCurrentUserEmail,
                                                      Set(varUserPerm, LookUp(colAllPermissions, Lower(Title) = varCurrentUserEmail));
                                                      Set(
                                                          varIsAdmin,
                                                          !IsBlank(varUserPerm) &&
                                                          (
                                                              varUserPerm.IsAdmin = true ||
                                                              Lower(Text(varUserPerm.IsAdmin)) = "true" ||
                                                              Lower(Text(varUserPerm.IsAdmin)) = "yes"
                                                          )
                                                      )
                                                  );
                                                  Set(varShowUserModal, false);
                                                  Notify("User saved.", NotificationType.Success)
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="Save user"
                                    Width: =120

                                          Image: =varSettingsEditProject.project_logo
                                          Width: =80
                                    - set_proj_logo_help:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(106, 122, 127, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'

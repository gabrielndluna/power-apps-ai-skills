                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(106, 122, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              OnSelect: |-
                                =With(
                                    { _sf: LookUp(colColumns, key = varCol3).sortField },

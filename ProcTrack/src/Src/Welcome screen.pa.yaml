                                    !IsBlank(ThisItem.actualawarddate) And !IsBlank(ThisItem.actualevaluationcompletiondate) And !IsBlank(ThisItem.actualrfqclosingdate) And !IsBlank(ThisItem.actualrfqissuedate) And !IsBlank(ThisItem.actualsowdate),
                                    RGBA(41, 182, 246, 1),      // On Site — light blue
                                    !IsBlank(ThisItem.actualawarddate),
                                    RGBA(56, 142, 60, 1),        // Awarded — green
                                    !IsBlank(ThisItem.actualevaluationcompletiondate),
                                    RGBA(251, 140, 0, 1),        // Awarding — amber
                                    !IsBlank(ThisItem.actualrfqclosingdate),
                                    RGBA(142, 36, 170, 1),       // Evaluating — purple
                                    !IsBlank(ThisItem.actualrfqissuedate),
                                    RGBA(21, 101, 192, 1),       // RFQ Closing — dark blue
                                    !IsBlank(ThisItem.actualsowdate),
                                    RGBA(0, 131, 143, 1),        // RFQ Issuing — teal
                                    RGBA(211, 47, 47, 1)         // SOW Completion — red
                                )

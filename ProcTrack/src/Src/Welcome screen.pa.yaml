                  - Gallery2:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        BorderThickness: =2
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =89
                        Items: |-
                          =With(
                              {
                                  _q: Trim(Search_Bar_3.search_text),
                                  _procLead: Trim(procurement_lead_filter.search_text),
                                  _opsLead: Trim(operations_lead_filter.search_text)
                              },
                              If(
                                  IsBlank(varSelectedProject.projectidentifier),
                                  Blank(),
                                  With(
                                      {
                                          _base: Filter(
                                              colProjectPackages,
                                              (
                                                  IsBlank(_q) ||
                                                  _q in packagedescription ||
                                                  _q in packageidentifier ||
                                                  _q in itemnumber
                                              ) &&
                                              (
                                                  IsBlank(_procLead) ||
                                                  _procLead in procpackageleadname
                                              ) &&
                                              (
                                                  IsBlank(_opsLead) ||
                                                  _opsLead in opspackageleadname
                                              )
                                          )
                                      },
                                      With(
                                          {
                                              _filtered: Switch(
                                                  varPackageFilter,
                                                  "all",      _base,
                                                  "awarded",  Filter(_base, !IsBlank(actualawarddate)),
                                                  "delayed",
                                                  Filter(
                                                      _base,
                                                      (
                                                          IsBlank(actualsowdate) &&
                                                          !IsBlank(revisedplannedsowdate) &&
                                                          revisedplannedsowdate < Today()
                                                      ) ||
                                                      (
                                                          !IsBlank(actualsowdate) &&
                                                          IsBlank(actualrfqissuedate) &&
                                                          !IsBlank(revisedplannedrfqissuedate) &&
                                                          revisedplannedrfqissuedate < Today()
                                                      ) ||
                                                      (
                                                          !IsBlank(actualrfqissuedate) &&
                                                          IsBlank(actualrfqclosingdate) &&
                                                          !IsBlank(revisedplannedrfqclosingdate) &&
                                                          revisedplannedrfqclosingdate < Today()
                                                      ) ||
                                                      (
                                                          !IsBlank(actualrfqclosingdate) &&
                                                          IsBlank(actualevaluationcompletiondate) &&
                                                          !IsBlank(revisedplannedevaluationcompletio) &&
                                                          revisedplannedevaluationcompletio < Today()
                                                      ) ||
                                                      (
                                                          !IsBlank(actualevaluationcompletiondate) &&
                                                          IsBlank(actualawarddate) &&
                                                          !IsBlank(revisedplannedawarddate) &&
                                                          revisedplannedawarddate < Today()
                                                      )
                                                  ),
                                                  "at_risk",
                                                  Filter(
                                                      _base,
                                                      (
                                                          IsBlank(actualsowdate) &&
                                                          !IsBlank(revisedplannedsowdate) &&
                                                          revisedplannedsowdate >= Today() &&
                                                          revisedplannedsowdate <= DateAdd(Today(), 7, TimeUnit.Days)
                                                      ) ||
                                                      (
                                                          !IsBlank(actualsowdate) &&
                                                          IsBlank(actualrfqissuedate) &&
                                                          !IsBlank(revisedplannedrfqissuedate) &&
                                                          revisedplannedrfqissuedate >= Today() &&
                                                          revisedplannedrfqissuedate <= DateAdd(Today(), 7, TimeUnit.Days)
                                                      ) ||
                                                      (
                                                          !IsBlank(actualrfqissuedate) &&
                                                          IsBlank(actualrfqclosingdate) &&
                                                          !IsBlank(revisedplannedrfqclosingdate) &&
                                                          revisedplannedrfqclosingdate >= Today() &&
                                                          revisedplannedrfqclosingdate <= DateAdd(Today(), 7, TimeUnit.Days)
                                                      ) ||
                                                      (
                                                          !IsBlank(actualrfqclosingdate) &&
                                                          IsBlank(actualevaluationcompletiondate) &&
                                                          !IsBlank(revisedplannedevaluationcompletio) &&
                                                          revisedplannedevaluationcompletio >= Today() &&
                                                          revisedplannedevaluationcompletio <= DateAdd(Today(), 7, TimeUnit.Days)
                                                      ) ||
                                                      (
                                                          !IsBlank(actualevaluationcompletiondate) &&
                                                          IsBlank(actualawarddate) &&
                                                          !IsBlank(revisedplannedawarddate) &&
                                                          revisedplannedawarddate >= Today() &&
                                                          revisedplannedawarddate <= DateAdd(Today(), 7, TimeUnit.Days)
                                                      )
                                                  ),
                                                  _base
                                              )
                                          },
                                          With(
                                              {
                                                  _dir: If(varSortAscending, SortOrder.Ascending, SortOrder.Descending),
                                                  _data: AddColumns(
                                                      _filtered,
                                                      _stageOrder,
                                                      If(
                                                          IsBlank(actualsowdate),                  1,
                                                          IsBlank(actualrfqissuedate),             2,
                                                          IsBlank(actualrfqclosingdate),           3,
                                                          IsBlank(actualevaluationcompletiondate), 4,
                                                          IsBlank(actualawarddate),                5,
                                                          IsBlank(purchaseordernumber),            6,
                                                          7
                                                      ),
                                                      _sortDue,
                                                      If(
                                                          IsBlank(actualsowdate),                  Coalesce(revisedplannedsowdate, originalplannedsowdate, Date(2098,1,1)),
                                                          IsBlank(actualrfqissuedate),             Coalesce(revisedplannedrfqissuedate, originalplannedrfqissuedate, Date(2098,1,1)),
                                                          IsBlank(actualrfqclosingdate),           Coalesce(revisedplannedrfqclosingdate, originalplannedrfqclosingdate, Date(2098,1,1)),
                                                          IsBlank(actualevaluationcompletiondate), Coalesce(revisedplannedevaluationcompletio, originalplannedevaluationcompleti, Date(2098,1,1)),
                                                          IsBlank(actualawarddate),                Coalesce(revisedplannedawarddate, originalplannedawarddate, Date(2098,1,1)),
                                                          !IsBlank(requiredatsitedate),            requiredatsitedate,
                                                          Date(2099,12,31)
                                                      )
                                                  )
                                              },
                                              Switch(
                                                  varSortColumn,

                                                  // ── Fixed columns ──────────────────────────────
                                                  "itemnumber",        Sort(_data, itemnumber, _dir),
                                                  "packagedescription",Sort(_data, packagedescription, _dir),
                                                  "_stageOrder",       Sort(_data, _stageOrder, _dir),
                                                  "_sortDue",          Sort(_data, _sortDue, _dir),

                                                  // ── Swappable: branch by the column's type ─────
                                                  Switch(
                                                      LookUp(colColumns, sortField = varSortColumn).type,
                                                      "date",
                                                      Sort(
                                                          _data,
                                                          Switch(
                                                              varSortColumn,
                                                              "requiredatsitedate",      requiredatsitedate,
                                                              "ras_original_input",      ras_original_input,
                                                              "revisedplannedawarddate", revisedplannedawarddate,
                                                              _sortDue
                                                          ),
                                                          _dir
                                                      ),
                                                      "money",
                                                      Sort(
                                                          _data,
                                                          Switch(
                                                              varSortColumn,
                                                              "budgetamount",     budgetamount,
                                                              "awardvalue",       awardvalue,
                                                              "indigenous_award", indigenous_award,
                                                              "ontario_award",    ontario_award,
                                                              0
                                                          ),
                                                          _dir
                                                      ),
                                                      "text",
                                                      Sort(
                                                          _data,
                                                          Switch(
                                                              varSortColumn,
                                                              "contracttype",      contracttype,
                                                              "mplcode",           mplcode,
                                                              "qualityprogram",    qualityprogram,
                                                              "bopsite",           bopsite,
                                                              "subcontractorname", subcontractorname,
                                                              ""
                                                          ),
                                                          _dir
                                                      ),
                                                      // default — next due date
                                                      Sort(_data, _sortDue, _dir)
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplatePadding: =8
                        TemplateSize: =75
                      Children:
                        - Separator24:

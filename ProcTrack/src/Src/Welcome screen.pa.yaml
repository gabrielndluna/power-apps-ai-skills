                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              Height: =32
                              LayoutMinHeight: =32
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =8
                              PaddingTop: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - welcome_project_label:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(106, 122, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =11
                                    Text: ="Project"
                                    Width: =68
                              - project_combobox:
                                  Control: Classic/ComboBox@2.4.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    ChevronBackground: =RGBA(255, 255, 255, 1)
                                    ChevronDisabledBackground: =RGBA(255, 255, 255, 1)
                                    ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                                    ChevronFill: =RGBA(214, 12, 48, 1)
                                    ChevronHoverBackground: =RGBA(255, 255, 255, 1)
                                    ChevronHoverFill: =RGBA(214, 12, 48, 1)
                                    Color: =RGBA(33, 33, 33, 1)
                                    DefaultSelectedItems: |+
                                      =Filter(
                                          AddColumns(colPermittedProjects, Display, projectname),
                                          projectname = varSelectedProject.projectname
                                      )
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(255, 255, 255, 1)
                                    DisplayFields: =["Display"]
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(33, 33, 33, 1)
                                    HoverFill: =RGBA(255, 255, 255, 1)
                                    IsSearchable: =false
                                    Items: |-
                                      =AddColumns(colPermittedProjects, Display, projectname)
                                    OnChange: "=If(\r\n    !IsBlank(Self.Selected),\r\n    Set(varSelectedProject, Self.Selected);\r\n    \r\n    // Refresh packages collection for this project\r\n    ClearCollect(\r\n        colProjectPackages,\r\n        Filter(\r\n            'ProcTrack - Packages',\r\n            projectidentifier = Self.Selected.projectidentifier\r\n        )\r\n    );\r\n    \r\n    // Check if user can edit THIS specific project\r\n    Set(\r\n        varCanEditCurrentProject,\r\n        !IsBlank(\r\n            LookUp(\r\n                colUserPermissions,\r\n                Project = Self.Selected.projectidentifier && Edit_allowed = \"yes\"\r\n            )\r\n        )\r\n    )\r\n)"
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(33, 33, 33, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    SearchFields: =["ComplianceAssetId"]
                                    SelectMultiple: =false
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(214, 12, 48, 1)
                                    Size: =12
                                    Width: =Parent.Width - 76
                        - Image1:
                            Control: Image@2.2.3
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =32
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: |-
                                =If(
                                    !IsBlank(varSelectedProject) && !IsBlank(varSelectedProject.project_logo),
                                    varSelectedProject.project_logo,
                                    Blank()
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Visible: =!IsBlank(varSelectedProject)
                              Width: =72
                        - welcome_pbi_dashboard_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)

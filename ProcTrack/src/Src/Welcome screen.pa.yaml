                                =With(
                                    { _sf: LookUp(colColumns, key = varCol4).sortField },
                                    If(
                                        varSortColumn = _sf,
                                        Set(varSortAscending, !varSortAscending),
                                        Set(varSortColumn, _sf); Set(varSortAscending, true)
                                    )
                                )
                              Size: =12
                              Text: |-
                                =LookUp(colColumns, key = varCol4).label &

                        - gallery_status_label:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =15
                              Size: =8
                              Text: |-
                                =Switch(
                                    true,

                                    // Ignored contract types - no status banner
                                    ThisItem.contracttype in varIgnoredContractTypes,
                                    "",

                                    // Delayed cases
                                    IsBlank(ThisItem.actualsowdate) &&
                                    !IsBlank(ThisItem.revisedplannedsowdate) &&
                                    ThisItem.revisedplannedsowdate < Today(),
                                    "⚠️ Delayed: SOW overdue by " & DateDiff(ThisItem.revisedplannedsowdate, Today(), TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualsowdate) &&
                                    IsBlank(ThisItem.actualrfqissuedate) &&
                                    !IsBlank(ThisItem.revisedplannedrfqissuedate) &&
                                    ThisItem.revisedplannedrfqissuedate < Today(),
                                    "⚠️ Delayed: RFQ Issue overdue by " & DateDiff(ThisItem.revisedplannedrfqissuedate, Today(), TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualrfqissuedate) &&
                                    IsBlank(ThisItem.actualrfqclosingdate) &&
                                    !IsBlank(ThisItem.revisedplannedrfqclosingdate) &&
                                    ThisItem.revisedplannedrfqclosingdate < Today(),
                                    "⚠️ Delayed: RFQ Closing overdue by " & DateDiff(ThisItem.revisedplannedrfqclosingdate, Today(), TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualrfqclosingdate) &&
                                    IsBlank(ThisItem.actualevaluationcompletiondate) &&
                                    !IsBlank(ThisItem.revisedplannedevaluationcompletio) &&
                                    ThisItem.revisedplannedevaluationcompletio < Today(),
                                    "⚠️ Delayed: Evaluation overdue by " & DateDiff(ThisItem.revisedplannedevaluationcompletio, Today(), TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualevaluationcompletiondate) &&
                                    IsBlank(ThisItem.actualawarddate) &&
                                    !IsBlank(ThisItem.revisedplannedawarddate) &&
                                    ThisItem.revisedplannedawarddate < Today(),
                                    "⚠️ Delayed: Award overdue by " & DateDiff(ThisItem.revisedplannedawarddate, Today(), TimeUnit.Days) & " days",

                                    // At Risk cases
                                    IsBlank(ThisItem.actualsowdate) &&
                                    !IsBlank(ThisItem.revisedplannedsowdate) &&
                                    ThisItem.revisedplannedsowdate >= Today() &&
                                    ThisItem.revisedplannedsowdate <= DateAdd(Today(), 7, TimeUnit.Days),
                                    "🔶 At Risk: SOW due in " & DateDiff(Today(), ThisItem.revisedplannedsowdate, TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualsowdate) &&
                                    IsBlank(ThisItem.actualrfqissuedate) &&
                                    !IsBlank(ThisItem.revisedplannedrfqissuedate) &&
                                    ThisItem.revisedplannedrfqissuedate >= Today() &&
                                    ThisItem.revisedplannedrfqissuedate <= DateAdd(Today(), 7, TimeUnit.Days),
                                    "🔶 At Risk: RFQ Issue due in " & DateDiff(Today(), ThisItem.revisedplannedrfqissuedate, TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualrfqissuedate) &&
                                    IsBlank(ThisItem.actualrfqclosingdate) &&
                                    !IsBlank(ThisItem.revisedplannedrfqclosingdate) &&
                                    ThisItem.revisedplannedrfqclosingdate >= Today() &&
                                    ThisItem.revisedplannedrfqclosingdate <= DateAdd(Today(), 7, TimeUnit.Days),
                                    "🔶 At Risk: RFQ Closing due in " & DateDiff(Today(), ThisItem.revisedplannedrfqclosingdate, TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualrfqclosingdate) &&
                                    IsBlank(ThisItem.actualevaluationcompletiondate) &&
                                    !IsBlank(ThisItem.revisedplannedevaluationcompletio) &&
                                    ThisItem.revisedplannedevaluationcompletio >= Today() &&
                                    ThisItem.revisedplannedevaluationcompletio <= DateAdd(Today(), 7, TimeUnit.Days),
                                    "🔶 At Risk: Evaluation due in " & DateDiff(Today(), ThisItem.revisedplannedevaluationcompletio, TimeUnit.Days) & " days",

                                    !IsBlank(ThisItem.actualevaluationcompletiondate) &&
                                    IsBlank(ThisItem.actualawarddate) &&
                                    !IsBlank(ThisItem.revisedplannedawarddate) &&
                                    ThisItem.revisedplannedawarddate >= Today() &&
                                    ThisItem.revisedplannedawarddate <= DateAdd(Today(), 7, TimeUnit.Days),
                                    "🔶 At Risk: Award due in " & DateDiff(Today(), ThisItem.revisedplannedawarddate, TimeUnit.Days) & " days",

                                    // On Track
                                    ""
                                )
                              Width: =358

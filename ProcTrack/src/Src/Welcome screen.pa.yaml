                              - welcome_brand_title:
                                  Control: Text@0.0.51
                                  Properties:
                                    AutoHeight: =true
                                    FontColor: =RGBA(255, 255, 255, 1)
                                    Size: =20
                                    Text: ="ProcTrack"
                                    Weight: ='TextCanvas.Weight'.Bold
                                    Width: =260
                              - welcome_brand_subtitle:
                                  Control: Text@0.0.51
                                  Properties:
                                    AutoHeight: =true
                                    FontColor: =RGBA(255, 255, 255, 0.82)
                                    Size: =12
                                    Text: ="Package tracking"
                                    Width: =260
                        - welcome_header_spacer:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                        - welcome_user_col:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.End
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                            Children:
                              - welcome_user_label:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.End
                                    AutoHeight: =true
                                    FontColor: =RGBA(255, 255, 255, 0.7)
                                    Size: =10
                                    Text: ="SIGNED IN AS"
                                    Weight: ='TextCanvas.Weight'.Bold
                                    Width: =200
                              - welcome_user_name:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.End
                                    AutoHeight: =true
                                    FontColor: =RGBA(255, 255, 255, 1)
                                    Size: =13
                                    Text: =User().FullName
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    Width: =200
                        - welcome_export_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =32
                              LayoutMinHeight: =32
                              LayoutMinWidth: =32
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =32
                            Children:
                              - Image2:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    DisplayMode: =If(varExporting, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =22
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Image: ='excel-icon-17'
                                    OnSelect: |-
                                      =Set(varExporting, true);

                                      Set(
                                          varExportResult,
                                          'PowerAppV2->ParseJSON,CreateCSVtable,Createfile,Createsharin...'.Run(
                                              JSON(
                                                  ForAll(
                                                      colProjectPackages As p,
                                                      {
                                                          Package:           p.itemnumber,
                                                          Bundle:            p.operationspackagebundle,
                                                          Description:       p.packagedescription,
                                                          ContractType:      p.contracttype,
                                                          ProcurementLead:   p.procpackageleadname,
                                                          OpsLead:           p.opspackageleadname,
                                                          QualityProgram:    p.qualityprogram,
                                                          BOPSite:           p.bopsite,
                                                          MPLCode:           p.mplcode,
                                                          PlannedSOW:        Text(Coalesce(p.revisedplannedsowdate, p.originalplannedsowdate), "yyyy-mm-dd"),
                                                          ActualSOW:         Text(p.actualsowdate, "yyyy-mm-dd"),
                                                          PlannedRFQIssue:   Text(Coalesce(p.revisedplannedrfqissuedate, p.originalplannedrfqissuedate), "yyyy-mm-dd"),
                                                          ActualRFQIssue:    Text(p.actualrfqissuedate, "yyyy-mm-dd"),
                                                          PlannedRFQClosing: Text(Coalesce(p.revisedplannedrfqclosingdate, p.originalplannedrfqclosingdate), "yyyy-mm-dd"),
                                                          ActualRFQClosing:  Text(p.actualrfqclosingdate, "yyyy-mm-dd"),
                                                          PlannedEvaluation: Text(Coalesce(p.revisedplannedevaluationcompletio, p.originalplannedevaluationcompleti), "yyyy-mm-dd"),
                                                          ActualEvaluation:  Text(p.actualevaluationcompletiondate, "yyyy-mm-dd"),
                                                          PlannedAward:      Text(Coalesce(p.revisedplannedawarddate, p.originalplannedawarddate), "yyyy-mm-dd"),
                                                          ActualAward:       Text(p.actualawarddate, "yyyy-mm-dd"),
                                                          RequiredAtSite:    Text(p.requiredatsitedate, "yyyy-mm-dd"),
                                                          Subcontractor:     p.subcontractorname,
                                                          PONumber:          p.purchaseordernumber,
                                                          Budget:            p.budgetamount,
                                                          AwardValue:        p.awardvalue,
                                                          IndigenousAward:   p.indigenous_award,
                                                          OntarioAward:      p.ontario_award
                                                      }
                                                  ),
                                                  JSONFormat.Compact
                                              )
                                          )
                                      );

                                      Set(varExporting, false);
                                      Launch(varExportResult.filelink)
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =22
                                    X: =5
                                    Y: =5
                        - welcome_settings_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 0.18)
                              FillPortions: =0
                              Height: =32
                              LayoutMinHeight: =32
                              LayoutMinWidth: =32
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Width: =32
                            Children:
                              - settings_icon:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Height: =18
                                    HoverColor: =RGBA(255, 255, 255, 0.85)
                                    Icon: =Icon.Settings
                                    OnSelect: =Set(varShowSettings, true)
                                    Width: =18
                                    X: =7
                                    Y: =7
                  - welcome_header_bottom:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =32
                        LayoutMinWidth: =16
                      Children:
                        - welcome_project_picker_wrap:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)

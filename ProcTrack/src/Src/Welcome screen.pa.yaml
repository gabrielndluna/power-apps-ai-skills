                                    BasePaletteColor: =If(varPackageFilter = "awarded", RGBA(214, 12, 48, 1), RGBA(255, 255, 255, 1))
                                    BorderColor: =If(varPackageFilter = "awarded", RGBA(192, 0, 0, 1), RGBA(180, 180, 180, 1))
                                    BorderThickness: =0
                                    FontColor: =If(varPackageFilter = "awarded", RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 1))
                                    Height: =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Set(varPackageFilter, "awarded")
                                    Text: ="Awarded"
                                    X: =40
                                    Y: =40
                              - delayed:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(varPackageFilter = "delayed", "Primary", "Outline")
                                    BasePaletteColor: =If(varPackageFilter = "delayed", RGBA(214, 12, 48, 1), RGBA(255, 255, 255, 1))
                                    BorderColor: =If(varPackageFilter = "delayed", RGBA(192, 0, 0, 1), RGBA(180, 180, 180, 1))
                                    BorderThickness: =0
                                    FontColor: =If(varPackageFilter = "delayed", RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 1))
                                    Height: =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Set(varPackageFilter, "delayed")
                                    Text: ="Delayed"
                                    X: =40

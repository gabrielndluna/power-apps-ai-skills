      - generate_gallery_button:
          Control: Classic/Button@2.2.0
          Group: User_Selections_Tracking
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =37
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  !IsBlank(DatePicker_Date.SelectedDate) &&
                  !IsBlank(DatePicker_To.SelectedDate) &&
                  !IsBlank(Dropdown_CostCode.Selected.Value),

                  ClearCollect(
                      colHoursGallery,
                      ForAll(
                          Sequence(
                              DateDiff(DatePicker_Date.SelectedDate, DatePicker_To.SelectedDate) + 1,
                              1,
                              1
                          ),
                          With(
                              { currentDate: DateAdd(DatePicker_Date.SelectedDate, Value - 1) },
                              {
                                  WorkDate: currentDate,
                                  CostCode: Dropdown_CostCode.Selected.Value,
                                  Comments: ""
                              }
                          )
                      )
                  ),
                  Notify("Please fill out all inputs", NotificationType.Error)
              );
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =10
            Text: |-
              ="Generate
              "
            Width: =91
            X: =1365
            Y: =130

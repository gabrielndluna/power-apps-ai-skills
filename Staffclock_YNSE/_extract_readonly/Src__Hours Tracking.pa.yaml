      - AddRecord_Button:
          Control: Classic/Icon@2.5.0
          Group: User_Selections_Tracking
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =37
            Icon: =Icon.Add
            OnSelect: |-
              =// Collect only valid records
              ClearCollect(
                  HoursCollection,
                  Filter(
                      Gallery_Hours.AllItems,
                      !IsBlank(Value(TextInput_Standard_2.Text))
                  )
              );

              // Patch records into 'Hours Tracking (Hours)' and create related approvals
              ForAll(
                  HoursCollection,
                  With(
                      {
                          logID: GUID()
                      },
                      // Add record to 'Hours Tracking (Hours)'
                      Patch(
                          'Hours Tracking (Hours)',
                          Defaults('Hours Tracking (Hours)'),
                          {
                              Title: logID,
                              LOG_ID: logID,
                              Employee_Name:User().FullName,
                              Employee: User().Email,
                              Project: Selected_ProjectID,
                              Cost_code: TextInput_CostCode_2.Selected.Value,
                              Date: DateValue(TextInput_Date_2.Text),
                              Standard_time: Value(TextInput_Standard_2.Text),
                              Comments: TextInput_Comments_2.Text,
                              App_Name: "Staffclock",
                              ApproverID_1: varApprover1Email,
                              ApprovalStatus_1: "Pending",
                              ApproverID_2: varApprover2Email,
                              ApprovalStatus_2: If(
                                  IsBlank(varApprover2Email) || varApprover2Email = "None",
                                  "None",
                                  "Pending"
                              )
                          }
                      );
                  )
              );

              // Notify user
              Notify("Hours Saved", NotificationType.Success);

              // Refresh and clear collection
              Refresh('Hours Tracking (Hours)');
              Clear(HoursCollection);
            PaddingRight: =0.00
            PaddingTop: =0.00
            Width: =39.51
            X: =1399
            Y: =197
      - AddHours_Button:
          Control: Classic/Button@2.2.0
          Group: User_Selections_Tracking
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =37
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =If(
                  Or(
                      IsBlank(DatePicker_Date.SelectedDate),
                      IsBlank(DatePicker_To.SelectedDate),
                      DatePicker_Date.SelectedDate > DatePicker_To.SelectedDate
                  ),
                  Notify("Please fill out dates correctly", NotificationType.Error),
                  Select(AddRecord_Button)
              );

              // Add user to active users list
              If(
                 varFirstTimeUser,
                 Patch(
                    'Hours Tracking (Active Users)',
                    Defaults('Hours Tracking (Active Users)'),
                    {
                       Title: User().Email,
                       Name: User().FullName
                    }
                 )
              );
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =10
            Text: |-
              ="Submit
              "
            Width: =91
            X: =1365
            Y: =198

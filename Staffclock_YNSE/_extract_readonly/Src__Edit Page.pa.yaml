            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =36
            Icon: =Icon.Save
            OnSelect: |+
              =// Update hours table
              If(
                  CountRows(colHoursUpdates) > 0,
                  Patch(
                      'Hours Tracking (Hours)',
                      ShowColumns(
                          colHoursUpdates,
                          ID,
                          Cost_code,
                          Employee,
                          Date,
                          Standard_time,
                          Overtime,
                          Vacation_time,
                          Holiday,
                          Comments,
                          ApprovalStatus_1,
                          ApprovalStatus_2)
                  )
              );
              Clear(colHoursUpdates);

              // Notify user
              Notify("Records updated successfully!", NotificationType.Success);

              // Refresh the data source
              Refresh('Hours Tracking (Hours)');

                  Height: =35
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =ClearCollect(
                        colApproveAll,
                        Filter(
                            'StaffClock Hours',
                            Lower(field_4) = Lower(ThisItem.Employee) &&
                            Date >= ThisItem.WeekStart &&
                            Date <= ThisItem.WeekEnd &&
                            Lower(ApproverID_1) = Lower(User().Email) &&
                            ApprovalStatus_1 = "Pending"
                        )
                    );

                    ForAll(
                        colApproveAll,
                        Patch(
                            'StaffClock Hours',
                            {ID: ThisRecord.ID},
                            {ApprovalStatus_1: "Rejected"}
                        )
                    );

                    Office365Outlook.SendEmailV2(
                        ThisItem.Employee,
                        "Timesheet Rejected — Week of " & Text(ThisItem.WeekStart, "mmm d") & " – " & Text(ThisItem.WeekEnd, "mmm d, yyyy"),
                        "<p>Hi " & Left(ThisItem.Employee_Name, Find(" ", ThisItem.Employee_Name) - 1) & ",</p>" &
                        "<br>" &
                        "<p>Your timesheet for the week of <strong>" & Text(ThisItem.WeekStart, "mmmm d") & " – " & Text(ThisItem.WeekEnd, "mmmm d, yyyy") & "</strong> has been rejected by " & User().FullName & ".</p>" &
                        "<br>" &
                        "<p>View your timesheet on <a href='https://apps.powerapps.com/play/e/default-7c4c3c29-f085-4e7d-b144-70b02e8de0f0/a/703dce0f-7a51-4cbf-b089-e021efe4964b?tenantId=7c4c3c29-f085-4e7d-b144-70b02e8de0f0&hint=777b3a11-f3d6-4f4b-987f-599dfbb9cb37&sourcetime=1775141766396'>StaffClock App</a></p>" &
                        "<br>" &
                        "<p>Thank you,</p>",
                        {IsHtml: true}
                    );

                    Clear(colApproveAll);
                    Notify("Week rejected for " & ThisItem.Employee_Name, NotificationType.Warning);
                    Refresh('StaffClock Hours');
                    Select(Button_ReloadWeeklySummary);

            OnSelect: |-
              =ClearCollect(
                  colApproveAllWeeks,
                  Filter(
                      'StaffClock Hours',
                      (
                          ApproverID_1 = User().Email ||
                          (varIsAdmin && !IsBlank(Dropdown_Employee_Weekly.Selected.Value))
                      ) &&
                      ApprovalStatus_1 = "Pending" &&
                      (
                          IsBlank(Dropdown_Employee_Weekly.Selected.Value) ||
                          Employee_Name = Dropdown_Employee_Weekly.Selected.Value
                      )
                  )
              );

              Refresh('StaffClock Hours');

              ForAll(
                  colApproveAllWeeks,
                  Patch(
                      'StaffClock Hours',
                      {ID: ThisRecord.ID},
                      {ApprovalStatus_1: "Approved"}
                  )
              );

              Clear(colApproveAllWeeks);
              Notify("All visible weeks approved", NotificationType.Success);
              Refresh('StaffClock Hours');
              Select(Button_ReloadWeeklySummary);

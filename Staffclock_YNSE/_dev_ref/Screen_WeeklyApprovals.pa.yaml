Screens:
  Screen_WeeklyApprovals:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ClearCollect(
            colRawHours,
            Filter(
                'StaffClock Hours',
                (
                    ApproverID_1 = User().Email ||
                    (varIsAdmin && !IsBlank(Dropdown_Employee_Weekly.Selected.Value) && Employee_Name = Dropdown_Employee_Weekly.Selected.Value)
                ) &&
                (
                    ApprovalStatus_1 = "Pending" ||
                    ApprovalStatus_1 = "Approved" ||
                    ApprovalStatus_1 = "Rejected"
                )
            )
        );

        ClearCollect(colAllPendingHours,
            ForAll(
                colRawHours,
                {
                    ID: ThisRecord.ID,
                    Employee: ThisRecord.field_4,
                    Employee_Name: ThisRecord.field_3,
                    Date: ThisRecord.Date,
                    Standard_time: ThisRecord.Standard_time,
                    Overtime: ThisRecord.Overtime,
                    ApprovalStatus_1: ThisRecord.ApprovalStatus_1,
                    Cost_Code_Description: ThisRecord.Cost_Code_Description,
                    Task_Code: ThisRecord.Task_Code,
                    ApproverID_1: ThisRecord.ApproverID_1
                }
            )
        );

        ClearCollect(colWeeklySummary,
            GroupBy(
                AddColumns(
                    colAllPendingHours,
                    WeekStart, DateAdd(Date, -(Weekday(Date, StartOfWeek.Monday) - 1), "Days")
                ),
                Employee_Name, Employee, WeekStart,
                WeekRecords
            )
        );

        ClearCollect(colWeeklySummaryDisplay,
            AddColumns(
                colWeeklySummary,
                WeekEnd, DateAdd(WeekStart, 6, "Days"),
                TotalStandard, Sum(WeekRecords, Standard_time),
                TotalOvertime, Sum(WeekRecords, Overtime),
                TotalDays, CountRows(WeekRecords),
                WeekStatus, If(
                    CountIf(WeekRecords, ApprovalStatus_1 = "Rejected") = CountRows(WeekRecords),
                    "Rejected",
                    If(
                        CountIf(WeekRecords, ApprovalStatus_1 = "Approved") = CountRows(WeekRecords),
                        "Approved",
                        If(
                            CountIf(WeekRecords, ApprovalStatus_1 = "Pending") > 0,
                            "Pending",
                            "Mixed"
                        )
                    )
                )
            )
        );

        Set(varShowAllWeeks, false);

      - AddRecord_Button:
          Control: Classic/Icon@2.5.0
          Group: User_Inputs_Hours
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =37
            Icon: =Icon.Add
            OnSelect: |-
              =ClearCollect(
                  HoursNewCollection,
                  Filter(colHoursGallery, !IsBlank(StandardHours) && RecordID = 0 && ApprovalStatus <> "Approved")
              );

              ForAll(
                  HoursNewCollection,
                  With({ logID: Text(GUID()) },
                      Patch('StaffClock Hours', Defaults('StaffClock Hours'),
                          {
                              Title: logID,
                              Employee_Name: varSubmitAsName,
                              Employee: varSubmitAsEmail,
                              Cost_code: CostCodeID,
                              Cost_Code_Description: CostCode,
                              Task_Code: If(IsBlank(TaskCode), "Work Day", TaskCode),
                              Date: WorkDate,
                              Standard_time: Value(StandardHours),
                              Comments: Comments,
                              ApproverID_1: varApprover1Email,
                              ApprovalStatus_1: If(IsBlank(varApprover1Email), "Approved", "Pending")
                          }
                      )
                  )
              );

              ClearCollect(
                  HoursDraftCollection,
                  Filter(colHoursGallery, !IsBlank(StandardHours) && RecordID <> 0 && ApprovalStatus = "Draft")
              );

              ForAll(
                  HoursDraftCollection,
                  Patch('StaffClock Hours', LookUp('StaffClock Hours', ID = RecordID),
                      {
                          Cost_code: CostCodeID,
                          Cost_Code_Description: CostCode,
                          Task_Code: If(IsBlank(TaskCode), "Work Day", TaskCode),
                          Standard_time: Value(StandardHours),
                          Comments: Comments,
                          ApprovalStatus_1: If(IsBlank(varApprover1Email), "Approved", "Pending")
                      }
                  )
              );

              ClearCollect(
                  HoursPendingCollection,
                  Filter(colHoursGallery, !IsBlank(StandardHours) && RecordID <> 0 && ApprovalStatus = "Pending" && IsDirty = true)
              );

              ForAll(
                  HoursPendingCollection,
                  Patch('StaffClock Hours', LookUp('StaffClock Hours', ID = RecordID),
                      {
                          Cost_code: CostCodeID,
                          Cost_Code_Description: CostCode,
                          Task_Code: If(IsBlank(TaskCode), "Work Day", TaskCode),
                          Standard_time: Value(StandardHours),
                          Comments: Comments
                      }
                  )
              );

              Notify("Hours Submitted", NotificationType.Success);
              Refresh('StaffClock Hours');
              Clear(HoursNewCollection);
              Clear(HoursDraftCollection);
              Clear(HoursPendingCollection);
              Clear(colHoursGallery);
              Select(Button_LoadWeek);
            PaddingRight: =0.00
            PaddingTop: =0.00
            Width: =39.51
            X: =1424
            Y: =238
      - submit_input:
          Control: Classic/Button@2.2.0
          Group: User_Inputs_Hours
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =If(varIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(varIsSaving, Notify("Please wait, saving in progress...", NotificationType.Warning),

              ClearCollect(
                  colDupCheck,
                  AddColumns(
                      Filter(colHoursGallery, !IsBlank(StandardHours) && TaskCode = "Work Day" && !IsBlank(CostCode)),
                      DupKey, Text(WorkDate, "yyyy-mm-dd") & "|" & CostCode
                  )
              );
              Set(varHasDuplicates, CountRows(colDupCheck) > CountRows(Distinct(colDupCheck, DupKey)));
              Clear(colDupCheck);

              Set(
                  varHasNonWorkTasks,
                  CountIf(
                      colHoursGallery,
                      !IsBlank(StandardHours) &&
                      !IsBlank(TaskCode) &&
                      TaskCode <> "Work Day" &&
                      TaskCode <> "Weekend" &&
                      TaskCode <> "Stat. Holiday" &&
                      ApprovalStatus <> "Approved"
                  ) > 0
              );

              If(
                  varCurrentWeekStart > varThisWeekStart &&
                  CountIf(colHoursGallery, !IsBlank(StandardHours) && (TaskCode = "Work Day" || IsBlank(TaskCode))) > 0,
                  Notify("Future weeks can only be submitted if all days are non-work day (e.g. full vacation week)", NotificationType.Error),

                  CountIf(colHoursGallery, !IsBlank(StandardHours) && ApprovalStatus <> "Approved") = 0,
                  Notify("No hours to submit", NotificationType.Warning),

                  CountIf(
                      colHoursGallery,
                      !IsBlank(StandardHours) &&
                      (TaskCode = "Work Day" || IsBlank(TaskCode)) &&
                      IsBlank(CostCode) &&
                      ApprovalStatus <> "Approved" &&
                      IsDirty = true
                  ) > 0,
                  Notify("Work Day entries must have a cost code", NotificationType.Error),

                  varHasDuplicates,
                  Notify("Duplicate cost codes found for the same day. Each day can only have one entry per cost code", NotificationType.Error),

                  varHasNonWorkTasks,
                  Set(varShowVacationReminder, true),

                  Set(varIsSaving, true);
                  Select(AddRecord_Button);
                  Set(varIsSaving, false)
              )
              );
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =12
            Text: ="Submit"
            Width: =120
            X: =1373
            Y: =237

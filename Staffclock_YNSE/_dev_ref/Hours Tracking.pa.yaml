      - Button_NextWeek:
          Control: Classic/Icon@2.5.0
          Group: User_Inputs_Hours
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =36
            Icon: =Icon.NextArrow
            OnSelect: |+
              =// Button_NextWeek OnSelect
              Set(varCurrentWeekStart, DateAdd(varCurrentWeekStart, 7, "Days"));
              Select(Button_LoadWeek);
            Visible: |-
              =If(
                  varCurrentWeekStart >= DateAdd(varThisWeekStart, 21, "Days"),
                  false,
                  If(
                      !IsBlank(varOffboardingDate) &&
                      DateAdd(varCurrentWeekStart, 7, "Days") > DateValue(Text(varOffboardingDate)),
                      false,
                      true
                  )
              )
            Width: =36
            X: =1262
            Y: =154
      - Button_LoadWeek:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =ClearCollect(
                  colExistingHours,
                  Filter(
                      'StaffClock Hours',
                      field_4 = varSubmitAsEmail &&
                      Date >= varCurrentWeekStart &&
                      Date <= DateAdd(varCurrentWeekStart, 6, "Days")
                  )
              );

              ClearCollect(
                  colHoursGallery,
                  ForAll(
                      colExistingHours,
                      {
                          RowKey: Text(GUID()),
                          WorkDate: DateAdd(ThisRecord.Date, 0, "Days"),
                          DayLabel: Text(DateAdd(ThisRecord.Date, 0, "Days"), "ddd"),
                          CostCode: ThisRecord.Cost_Code_Description,
                          CostCodeID: LookUp(colCostCodes, Cost_Code_Description = ThisRecord.Cost_Code_Description).Cost_Code,
                          TaskCode: ThisRecord.Task_Code,
                          Comments: ThisRecord.Comments,
                          StandardHours: Text(ThisRecord.Standard_time),
                          IsSubmitted: true,
                          RecordID: ThisRecord.ID,
                          ApprovalStatus: ThisRecord.ApprovalStatus_1,
                          IsDirty: false
                      }
                  )
              );

              ForAll(
                  Sequence(7, 0, 1),
                  With(
                      { currentDate: DateAdd(varCurrentWeekStart, Value, "Days") },
                      If(
                          IsEmpty(Filter(colExistingHours, DateAdd(Date, 0, "Days") = currentDate)) &&
                          (
                              IsBlank(varOffboardingDate) ||
                              currentDate <= DateAdd(varOffboardingDate, 1, "Days")
                          ),
                          Collect(
                              colHoursGallery,
                              {
                                  RowKey: Text(GUID()),
                                  WorkDate: currentDate,
                                  DayLabel: Text(currentDate, "ddd"),
                                  CostCode: If(
                                      Weekday(currentDate, StartOfWeek.Monday) >= 6,
                                      "",
                                      varSelectedCostCode
                                  ),
                                  CostCodeID: If(
                                      Weekday(currentDate, StartOfWeek.Monday) >= 6,
                                      "",
                                      varSelectedCostCodeID
                                  ),
                                  TaskCode: If(
                                      !IsBlank(LookUp(colHolidays, Date = currentDate)),
                                      "Stat. Holiday",
                                      If(
                                          Weekday(currentDate, StartOfWeek.Monday) >= 6,
                                          "Weekend",
                                          ""
                                      )
                                  ),
                                  Comments: "",
                                  StandardHours: "",
                                  IsSubmitted: false,
                                  RecordID: 0,
                                  ApprovalStatus: "",
                                  IsDirty: false
                              }
                          )
                      )
                  )
              );

              Set(varResetGallery, true);
              Set(varResetGallery, false);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Visible: =false
            X: =757
            Y: =39

Screens:
  Approvals:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =If(
            !varDrillFromWeekly,
            Set(varApprovalWeekStart, DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1), "Days"))
        );
        Set(varApprovalStatusFilter, "All");
        Set(varDrillFromWeekly, false);
    Children:
      - save_button:
          Control: Classic/Button@2.2.0
          Group: SaveButton
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            Height: =45
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  CountRows(colHoursUpdates) > 0,
                  ForAll(
                      colHoursUpdates,
                      Patch(
                          'StaffClock Hours',
                          {ID: ThisRecord.ID},
                          {
                              ApprovalStatus_1: ThisRecord.ApprovalStatus_1,
                              Approver_Comments: ThisRecord.Approver_Comments
                          }
                      )
                  )
              );

              // Send rejection emails for any rejected records
              ForAll(
                  Filter(colHoursUpdates, ApprovalStatus_1 = "Rejected"),
                  Office365Outlook.SendEmailV2(
                      ThisRecord.Employee,
                      "Timesheet Rejected — " & Text(ThisRecord.Date, "mmm d, yyyy"),
                      "<p>Hi " & Left(ThisRecord.Employee_Name, Find(" ", ThisRecord.Employee_Name) - 1) & ",</p>" &
                      "<br>" &
                      "<p>Your timesheet for date <strong>" & Text(ThisRecord.Date, "mmmm d, yyyy") & "</strong> has been rejected by " & User().FullName & ".</p>" &
                      "<br>" &
                      "<p>View your timesheet on <a href='https://apps.powerapps.com/play/e/default-7c4c3c29-f085-4e7d-b144-70b02e8de0f0/a/703dce0f-7a51-4cbf-b089-e021efe4964b?tenantId=7c4c3c29-f085-4e7d-b144-70b02e8de0f0&hint=777b3a11-f3d6-4f4b-987f-599dfbb9cb37&sourcetime=1775141766396'>StaffClock App</a></p>" &
                      "<br>" &
                      "<p>Thank you,</p>",
                      {IsHtml: true}
                  )
              );

              Clear(colHoursUpdates);
              Notify("Records updated successfully!", NotificationType.Success);
              Refresh('StaffClock Hours');
            PaddingRight: =15
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Save Changes"

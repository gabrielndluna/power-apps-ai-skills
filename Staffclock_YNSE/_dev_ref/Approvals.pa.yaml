                  colApproveAllWeeks,
                  Filter(
                      'StaffClock Hours',
                      (
                          ApproverID_1 = User().Email ||
                          (varIsAdmin && !IsBlank(Dropdown_Employee_App.Selected.Value))
                      ) &&
                      ApprovalStatus_1 = "Pending" &&
                      Date >= varApprovalWeekStart &&

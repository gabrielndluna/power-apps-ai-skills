Screens:
  Screen_Home:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=Set(varPendingApprovalWeeks,\r\n    CountRows(\r\n        Distinct(\r\n            Filter(\r\n                'StaffClock Hours',\r\n                ApproverID_1 = User().Email &&\r\n                ApprovalStatus_1 = \"Pending\"\r\n            ),\r\n            Text(DateAdd(Date, -(Weekday(Date, StartOfWeek.Monday) - 1), \"Days\"), \"yyyy-mm-dd\") & field_3\r\n        )\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colMyHours,\r\n    Filter(\r\n        'StaffClock Hours',\r\n        Employee = User().Email\r\n    )\r\n);\r\n\r\nClearCollect(colMissingWeeks,\r\n    ForAll(\r\n        Sequence(\r\n            RoundDown(DateDiff(varAppStartDate, Today(), \"Days\") / 7, 0) + 1,\r\n            0,\r\n            1\r\n        ),\r\n        With(\r\n            { weekStart: DateAdd(varAppStartDate, Value * 7 - Weekday(varAppStartDate, StartOfWeek.Monday) + 1, \"Days\") },\r\n            If(\r\n                weekStart <= varThisWeekStart &&\r\n                weekStart >= varAppStartDate &&\r\n                CountRows(\r\n                \r\n                 Filter(\r\n                     colMyHours,\r\n                    'Date' >= weekStart &&\r\n                     'Date' <= DateAdd(weekStart, 6, TimeUnit.Days)\r\n)\r\n\r\n                ) < 5,\r\n                {\r\n                    WeekStart: weekStart,\r\n                    WeekEnd: DateAdd(weekStart, 6, \"Days\"),\r\n                    WeekLabel: Text(weekStart, \"mmm d\") & \" – \" & Text(DateAdd(weekStart, 6, \"Days\"), \"mmm d, yyyy\")\r\n                }\r\n            )\r\n        )\r\n    )\r\n);"

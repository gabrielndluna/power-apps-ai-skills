                        Visible: =ThisItem.ApprovalStatus <> "Approved"
                        Width: =28
                        X: =Parent.TemplateWidth - 52
                        Y: =12
            - Button_LoadWeek:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =ClearCollect(
                        colExistingHours,
                        ForAll(
                            Filter(
                                'Hours Tracking (Hours)',
                                Employee = varSubmitAsEmail &&
                                Date >= varCurrentWeekStart &&
                                Date <= DateAdd(varCurrentWeekStart, 6, "Days")
                            ),
                            {
                                SrcID: ID,
                                SrcDate: Date,
                                SrcCostCode: Cost_code,
                                SrcTask: Task,
                                SrcComments: Comments,
                                SrcHours: Standard_time,
                                SrcStatus: ApprovalStatus_1
                            }
                        )
                    );

                    ClearCollect(
                        colHoursGallery,
                        ForAll(
                            colExistingHours As ExistingRow,
                            {
                                RowKey: Text(GUID()),
                                WorkDate: DateAdd(ExistingRow.SrcDate, 0, "Days"),
                                DayLabel: Text(DateAdd(ExistingRow.SrcDate, 0, "Days"), "ddd"),
                                CostCode: ExistingRow.SrcCostCode,
                                CostCodeID: LookUp(colCostCodes, Network_Activity_Name = ExistingRow.SrcCostCode).Network_Activity,
                                TaskCode: If(
                                    !IsBlank(ExistingRow.SrcTask),
                                    ExistingRow.SrcTask,
                                    If(
                                        IsBlank(ExistingRow.SrcComments),
                                        "Work Day",
                                        If(
                                            Find(" | ", ExistingRow.SrcComments) > 0,
                                            Left(ExistingRow.SrcComments, Find(" | ", ExistingRow.SrcComments) - 1),
                                            ExistingRow.SrcComments
                                        )
                                    )
                                ),
                                Comments: If(
                                    !IsBlank(ExistingRow.SrcTask),
                                    ExistingRow.SrcComments,
                                    If(
                                        Find(" | ", ExistingRow.SrcComments & "") > 0,
                                        Mid(ExistingRow.SrcComments, Find(" | ", ExistingRow.SrcComments) + 3, Len(ExistingRow.SrcComments)),
                                        ""
                                    )
                                ),
                                StandardHours: If(Mod(Round(Coalesce(ExistingRow.SrcHours, 0), 2), 1) = 0, Text(Round(Coalesce(ExistingRow.SrcHours, 0), 2), "0"), Text(Round(Coalesce(ExistingRow.SrcHours, 0), 2), "0.##")),
                                IsSubmitted: true,
                                RecordID: ExistingRow.SrcID,
                                ApprovalStatus: ExistingRow.SrcStatus,
                                IsDirty: false
                            }
                        )
                    );

                    ForAll(
                        Sequence(7, 0, 1),
                        With(
                            {
                                currentDate: DateAdd(varCurrentWeekStart, Value, "Days"),
                                isWeekend: Weekday(DateAdd(varCurrentWeekStart, Value, "Days"), StartOfWeek.Monday) >= 6,
                                isHoliday: Text(DateAdd(varCurrentWeekStart, Value, "Days"), "yyyy-mm-dd") in ForAll(colPublic_Holidays, CleanDateKey)
                            },
                            If(
                                IsEmpty(Filter(colExistingHours, DateAdd(SrcDate, 0, "Days") = currentDate)),
                                Collect(
                                    colHoursGallery,
                                    {
                                        RowKey: Text(GUID()),
                                        WorkDate: currentDate,
                                        DayLabel: Text(currentDate, "ddd"),
                                        CostCode: If(
                                            isWeekend || isHoliday,
                                            "",
                                            varSelectedCostCode
                                        ),
                                        CostCodeID: If(
                                            isWeekend || isHoliday,
                                            "",
                                            varSelectedCostCodeID
                                        ),
                                        TaskCode: If(
                                            isWeekend,
                                            "Weekend",
                                            isHoliday,
                                            "Stat. Holiday",
                                            "Work Day"
                                        ),
                                        Comments: "",
                                        StandardHours: "",
                                        IsSubmitted: false,
                                        RecordID: 0,
                                        ApprovalStatus: "",
                                        IsDirty: false
                                    }
                                )
                            )
                        )
                    );
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - AddRecord_Button:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =If(
                        varIsSaving,
                        Notify("Please wait, saving in progress...", NotificationType.Warning),
                        CountIf(
                            colHoursGallery,
                            Or(
                                And(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), !IsBlank(StandardHours)),
                                And(TaskCode <> "Work Day", TaskCode <> "Weekend", !IsBlank(TaskCode))
                            ) &&
                            ApprovalStatus <> "Approved"
                        ) = 0,
                        Notify("No hours to submit", NotificationType.Warning),
                        CountIf(
                            colHoursGallery,
                            !IsBlank(StandardHours) &&
                            (TaskCode = "Work Day" || IsBlank(TaskCode)) &&
                            IsBlank(CostCode) &&
                            ApprovalStatus <> "Approved"
                        ) > 0,
                        Notify("Work Day entries must have a cost code", NotificationType.Error),
                        Set(varIsSaving, true);
                        ClearCollect(
                            HoursNewCollection,
                            Filter(
                                colHoursGallery,
                                (
                                    (Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)) && !IsBlank(StandardHours)) ||
                                    (TaskCode <> "Work Day" && TaskCode <> "Weekend" && !IsBlank(TaskCode))
                                ) &&
                                RecordID = 0 &&
                                ApprovalStatus <> "Approved"
                            )
                        );
                        ForAll(
                            HoursNewCollection,
                            With(
                                { logID: Text(GUID()) },
                                Patch(
                                    'Hours Tracking (Hours)',
                                    Defaults('Hours Tracking (Hours)'),
                                    {
                                        Title: logID,
                                        LOG_ID: logID,
                                        Employee_Name: varSubmitAsName,
                                        Employee: varSubmitAsEmail,
                                        Cost_code: CostCode,
                                        Date: WorkDate,
                                        Standard_time: If(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), Value(Coalesce(StandardHours, "0")), 0),
                                        Task: Coalesce(TaskCode, "Work Day"),
                                        Comments: Comments,
                                        App_Name: "Staffclock",
                                        ApproverID_1: varApprover1Email,
                                        ApprovalStatus_1: If(IsBlank(varApprover1Email), "Approved", "Pending")
                                    }
                                )
                            )
                        );
                        ClearCollect(
                            HoursDraftCollection,
                            Filter(
                                colHoursGallery,
                                (
                                    (Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)) && !IsBlank(StandardHours)) ||
                                    (TaskCode <> "Work Day" && TaskCode <> "Weekend" && !IsBlank(TaskCode))
                                ) &&
                                RecordID <> 0 &&
                                ApprovalStatus <> "Approved"
                            )
                        );
                        ForAll(
                            HoursDraftCollection,
                            Patch(
                                'Hours Tracking (Hours)',
                                LookUp('Hours Tracking (Hours)', ID = RecordID),
                                {
                                    Cost_code: CostCode,
                                    Standard_time: If(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), Value(Coalesce(StandardHours, "0")), 0),
                                    Task: Coalesce(TaskCode, "Work Day"),
                                    Comments: Comments,
                                    ApprovalStatus_1: If(IsBlank(varApprover1Email), "Approved", "Pending")
                                }
                            )
                        );
                        If(
                            varFirstTimeUser,
                            Patch(
                                'Hours Tracking (Active Users)',
                                Defaults('Hours Tracking (Active Users)'),
                                {
                                    Title: User().Email,
                                    Name: User().FullName
                                }
                            );
                            Set(varFirstTimeUser, false)
                        );
                        Notify("Hours Submitted", NotificationType.Success);
                        Refresh('Hours Tracking (Hours)');
                        Clear(HoursNewCollection);
                        Clear(HoursDraftCollection);
                        Set(varIsSaving, false);
                        Select(Button_LoadWeek)
                    )
                  Text: ="SubmitEngine"
                  Visible: =false
                  Width: =1

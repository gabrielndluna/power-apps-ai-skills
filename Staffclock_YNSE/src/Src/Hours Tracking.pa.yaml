Screens:
  Hours Tracking:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Refresh(CostCodes);
        ClearCollect(colCostCodes, CostCodes);
        Set(varSubmitAsEmail, User().Email);
        Set(varSubmitAsName, User().FullName);
        Set(
            varApprovers,
            LookUp(colEmployeesAll, Lower(Email_Address) = Lower(User().Email))
        );
        Set(varApprover1Email, varApprovers.'Approver 1 Email');
        Set(SelectedProject, Trim(Coalesce(varApprovers.'Project Title', "")));
        ClearCollect(
            colPublic_Holidays,
            AddColumns(
                Filter(
                    Public_Holidays,
                    !IsBlank(SelectedProject) && SelectedProject in Projects
                ),
                CleanDate,
                DateValue(Trim(Text(Date))),
                CleanDateKey,
                Text(DateValue(Trim(Text(Date))), "yyyy-mm-dd")
            )
        );
        If(
            IsBlank(varSelectedCostCode),
            Set(varSelectedCostCode, First(Sort(Distinct(colCostCodes, Network_Activity_Name), Value)).Value);
            Set(
                varSelectedCostCodeID,
                LookUp(colCostCodes, Network_Activity_Name = varSelectedCostCode).Network_Activity
            )
        );
        If(
            IsBlank(varCurrentWeekStart),
            Set(
                varCurrentWeekStart,
                DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1), "Days")
            )
        );
        Select(Button_LoadWeek);
    Children:
      - hours_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - hours_header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =100
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingBottom: =8
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - Logo_App_Hours:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =0
                        Height: =72
                        Image: ='App Names'
                        Width: =180
                  - Logo_Crop_Hours:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =0
                        Height: =64
                        Image: ='Logo Cropped'
                        Width: =160
                  - hours_header_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        Height: =1
                        LayoutMinWidth: =20
                  - btn_HomeTab_Hours:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        BorderThickness: =2
                        Color: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: =Navigate(Screen_Home, ScreenTransition.Fade)
                        Text: ="Home"
                        Width: =96
                  - btn_ApproverTab_Hours:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        BorderThickness: =2
                        Color: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: |-
                          =If(
                              varIsApprover,
                              Navigate(Screen_WeeklyApprovals, ScreenTransition.Fade),
                              Notify("No timesheets for approval.", NotificationType.Error)
                          )
                        Text: ="Approver"
                        Visible: =varIsApprover
                        Width: =110
                  - btn_SettingsGear_Hours:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        FillPortions: =0
                        Height: =44
                        Icon: =Icon.Settings
                        OnSelect: |-
                          =If(
                              varIsAdmin,
                              Navigate(Screen_Settings, ScreenTransition.Fade),
                              Notify("Settings are for admins only", NotificationType.Error)
                          )
                        Tooltip: ="Settings"
                        Visible: =varIsAdmin
                        Width: =44
            - hours_rule:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 18, 107, 1)
                  FillPortions: =0
                  Height: =4
                  Width: =Parent.Width
            - hours_toolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =120
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =120
                  PaddingBottom: =8
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - hours_toolbar_nav:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        Width: =Parent.Width
                      Children:
                        - Button_PrevWeek:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              BorderThickness: =1
                              Color: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(245, 247, 250, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              OnSelect: |-
                                =Set(varCurrentWeekStart, DateAdd(varCurrentWeekStart, -7, "Days"));
                                Select(Button_LoadWeek);
                              Text: ="<"
                              Width: =40
                        - Label_CurrentWeek:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(0, 18, 107, 1)
                              FillPortions: =0
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Size: =14
                              Text: ="Week of " & Text(varCurrentWeekStart, "mmm d") & " - " & Text(DateAdd(varCurrentWeekStart, 6, "Days"), "mmm d, yyyy")
                              Width: =340
                        - Button_NextWeek:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              BorderThickness: =1
                              Color: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(245, 247, 250, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              OnSelect: |-
                                =Set(varCurrentWeekStart, DateAdd(varCurrentWeekStart, 7, "Days"));
                                Select(Button_LoadWeek);
                              Text: =">"
                              Visible: =varCurrentWeekStart < DateAdd(varThisWeekStart, 21, "Days")
                              Width: =40
                        - toolbar_nav_spacer:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              Height: =1
                              LayoutMinWidth: =10
                        - Label_CostCodeHint:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(106, 122, 127, 1)
                              FillPortions: =0
                              Font: =Font.'Open Sans'
                              Height: =40
                              LayoutMinHeight: =40
                              Size: =11
                              Text: ="Default cost code"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
                        - Dropdown_CostCode:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(200, 204, 210, 1)
                              ChevronBackground: =RGBA(0, 18, 107, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              Default: =varSelectedCostCode
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              Items: =Sort(Distinct(colCostCodes, Network_Activity_Name), Value)
                              Items.Value: =Value
                              OnChange: |-
                                =Set(varSelectedCostCode, Self.Selected.Value);
                                Set(varSelectedCostCodeID, LookUp(colCostCodes, Network_Activity_Name = Self.Selected.Value).Network_Activity);
                                Select(Button_LoadWeek);
                              Width: =280
                  - hours_toolbar_actions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(245, 247, 250, 1)
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =52
                        PaddingBottom: =6
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =6
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - total_chip:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              PaddingLeft: =10
                              PaddingRight: =10
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =160
                            Children:
                              - Label_TotalCaption:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =RGBA(106, 122, 127, 1)
                                    FillPortions: =0
                                    Font: =Font.'Open Sans'
                                    Height: =28
                                    LayoutMinHeight: =28
                                    Size: =10
                                    Text: ="Total"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =48
                              - Label_TotalHours:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Left
                                    Color: =If(Sum(colHoursGallery, Value(StandardHours)) > 40, RGBA(214, 12, 48, 1), RGBA(0, 18, 107, 1))
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinHeight: =28
                                    Size: =14
                                    Text: |-
                                      =If(
                                          Mod(Round(Coalesce(Sum(colHoursGallery, Value(StandardHours)), 0), 2), 1) = 0,
                                          Text(Round(Coalesce(Sum(colHoursGallery, Value(StandardHours)), 0), 2), "0"),
                                          Text(Round(Coalesce(Sum(colHoursGallery, Value(StandardHours)), 0), 2), "0.##")
                                      ) & " hrs"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =90
                        - actions_spacer:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =40
                              LayoutMinWidth: =8
                              Width: =8
                        - Button_Regenerate:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(106, 122, 127, 1)
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              HoverColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(230, 234, 238, 1)
                              LayoutMinHeight: =40
                              OnSelect: |-
                                =Notify("Week regenerated. Unsaved changes cleared.", NotificationType.Warning);
                                Select(Button_LoadWeek);
                              Size: =12
                              Text: ="Reset week"
                              Tooltip: ="Discard unsaved edits and reload this week"
                              Width: =110
                        - Button_SaveDraft:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderThickness: =2
                              Color: =RGBA(0, 18, 107, 1)
                              DisplayMode: =If(varIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              HoverFill: =RGBA(235, 240, 250, 1)
                              LayoutMinHeight: =40
                              OnSelect: |-
                                =If(
                                    varIsSaving,
                                    Notify("Please wait, saving in progress...", NotificationType.Warning),
                                    CountIf(
                                        colHoursGallery,
                                        Or(
                                            And(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), !IsBlank(StandardHours)),
                                            And(TaskCode <> "Work Day", TaskCode <> "Weekend", !IsBlank(TaskCode))
                                        ) &&
                                        ApprovalStatus <> "Approved"
                                    ) = 0,
                                    Notify("No hours to save", NotificationType.Warning),
                                    CountIf(
                                        colHoursGallery,
                                        !IsBlank(StandardHours) &&
                                        (TaskCode = "Work Day" || IsBlank(TaskCode)) &&
                                        IsBlank(CostCode) &&
                                        ApprovalStatus <> "Approved"
                                    ) > 0,
                                    Notify("Work Day entries must have a cost code", NotificationType.Error),
                                    Set(varIsSaving, true);
                                    ClearCollect(
                                        HoursDraftNew,
                                        Filter(
                                            colHoursGallery,
                                            (
                                                (Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)) && !IsBlank(StandardHours)) ||
                                                (TaskCode <> "Work Day" && TaskCode <> "Weekend" && !IsBlank(TaskCode))
                                            ) &&
                                            RecordID = 0 &&
                                            IsDirty = true &&
                                            ApprovalStatus <> "Approved"
                                        )
                                    );
                                    ForAll(
                                        HoursDraftNew,
                                        With(
                                            { logID: Text(GUID()) },
                                            Patch(
                                                'Hours Tracking (Hours)',
                                                Defaults('Hours Tracking (Hours)'),
                                                {
                                                    Title: logID,
                                                    LOG_ID: logID,
                                                    Employee_Name: varSubmitAsName,
                                                    Employee: varSubmitAsEmail,
                                                    Cost_code: CostCode,
                                                    Date: WorkDate,
                                                    Standard_time: If(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), Value(Coalesce(StandardHours, "0")), 0),
                                                    Task: Coalesce(TaskCode, "Work Day"),
                                                    Comments: Comments,
                                                    App_Name: "Staffclock",
                                                    ApproverID_1: varApprover1Email,
                                                    ApprovalStatus_1: "Draft"
                                                }
                                            )
                                        )
                                    );
                                    ClearCollect(
                                        HoursDraftUpdate,
                                        Filter(
                                            colHoursGallery,
                                            (
                                                (Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)) && !IsBlank(StandardHours)) ||
                                                (TaskCode <> "Work Day" && TaskCode <> "Weekend" && !IsBlank(TaskCode))
                                            ) &&
                                            RecordID <> 0 &&
                                            ApprovalStatus <> "Approved" &&
                                            IsDirty = true
                                        )
                                    );
                                    ForAll(
                                        HoursDraftUpdate,
                                        Patch(
                                            'Hours Tracking (Hours)',
                                            LookUp('Hours Tracking (Hours)', ID = RecordID),
                                            {
                                                Cost_code: CostCode,
                                                Standard_time: If(Or(TaskCode = "Work Day", TaskCode = "Weekend", IsBlank(TaskCode)), Value(Coalesce(StandardHours, "0")), 0),
                                                Task: Coalesce(TaskCode, "Work Day"),
                                                Comments: Comments,
                                                ApprovalStatus_1: If(ApprovalStatus = "Draft", "Draft", ApprovalStatus)
                                            }
                                        )
                                    );
                                    If(
                                        varFirstTimeUser,
                                        Patch(
                                            'Hours Tracking (Active Users)',
                                            Defaults('Hours Tracking (Active Users)'),
                                            {
                                                Title: User().Email,
                                                Name: User().FullName
                                            }
                                        );
                                        Set(varFirstTimeUser, false)
                                    );
                                    Notify("Saved as Draft", NotificationType.Success);
                                    Refresh('Hours Tracking (Hours)');
                                    Clear(HoursDraftNew);
                                    Clear(HoursDraftUpdate);
                                    Set(varIsSaving, false);
                                    Select(Button_LoadWeek)
                                )
                              Size: =12
                              Text: ="Save Draft"
                              Tooltip: ="Save without sending to your approver"
                              Width: =128
                        - Button_Submit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: =If(varIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 18, 107, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              HoverFill: =ColorFade(RGBA(0, 18, 107, 1), -15%)
                              LayoutMinHeight: =40
                              OnSelect: =Select(AddRecord_Button)
                              Size: =12
                              Text: ="Submit week"
                              Tooltip: ="Send this week for approval"
                              Width: =140
            - col_headers:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 18, 107, 1)
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =4
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - h_Day:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Day"
                        Width: =70
                  - h_Date:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Date"
                        Width: =110
                  - h_Cost:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Cost Code"
                        Width: =220
                  - h_Task:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Task"
                        Width: =160
                  - h_Hours:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Hours"
                        Width: =80
                  - h_Comments:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Comments"
                  - h_Status:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: ="Status"
                        Width: =100
                  - h_Actions:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =12
                        Text: =""
                        Width: =80
            - Gallery_Hours:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =1
                  Height: =400
                  Items: =SortByColumns(colHoursGallery, "WorkDate", SortOrder.Ascending)
                  TemplateSize: =52
                  Width: =Parent.Width
                Children:
                  - row_fill:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderThickness: =0
                        Fill: |-
                          =If(
                              Weekday(ThisItem.WorkDate, StartOfWeek.Monday) >= 6 ||
                              ThisItem.TaskCode = "Weekend" ||
                              ThisItem.TaskCode = "Stat. Holiday" ||
                              Text(ThisItem.WorkDate, "yyyy-mm-dd") in ForAll(colPublic_Holidays, CleanDateKey),
                              RGBA(240, 240, 240, 1),
                              RGBA(255, 255, 255, 1)
                          )
                        Height: =Parent.TemplateHeight
                        Width: =Parent.TemplateWidth
                  - lbl_Day:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        Height: =40
                        Size: =12
                        Text: =ThisItem.DayLabel
                        Width: =70
                        X: =16
                        Y: =6
                  - lbl_Date:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        Height: =40
                        Size: =12
                        Text: =Text(ThisItem.WorkDate, "yyyy-mm-dd")
                        Width: =110
                        X: =86
                        Y: =6
                  - dd_CostCode:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(0, 18, 107, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        Default: =ThisItem.CostCode
                        DisplayMode: =If(ThisItem.ApprovalStatus = "Approved", DisplayMode.View, Or(ThisItem.TaskCode = "Work Day", ThisItem.TaskCode = "Weekend", IsBlank(ThisItem.TaskCode)), DisplayMode.Edit, DisplayMode.View)
                        Font: =Font.'Open Sans'
                        Height: =36
                        Items: =Sort(Distinct(colCostCodes, Network_Activity_Name), Value)
                        Items.Value: =Value
                        OnChange: |-
                          =UpdateIf(
                              colHoursGallery,
                              RowKey = ThisItem.RowKey,
                              {
                                  CostCode: Self.Selected.Value,
                                  CostCodeID: LookUp(colCostCodes, Network_Activity_Name = Self.Selected.Value).Network_Activity,
                                  IsDirty: true
                              }
                          )
                        Size: =11
                        Width: =220
                        X: =196
                        Y: =8
                  - dd_Task:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(0, 18, 107, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        Default: =ThisItem.TaskCode
                        DisplayMode: =If(ThisItem.ApprovalStatus = "Approved", DisplayMode.View, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        Height: =36
                        Items: =["Work Day", "Weekend", "Stat. Holiday", "Vacation Paid", "Vacation Unpaid", "Sick Leave Paid", "Sick Leave Unpaid", "Bereavement", "Jury Duty", "Personal Day"]
                        OnChange: |-
                          =UpdateIf(
                              colHoursGallery,
                              RowKey = ThisItem.RowKey,
                              {
                                  TaskCode: Self.Selected.Value,
                                  IsDirty: true
                              }
                          )
                        Size: =11
                        Width: =160
                        X: =422
                        Y: =8
                  - txt_Hours:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.StandardHours
                        DisplayMode: =If(ThisItem.ApprovalStatus = "Approved", DisplayMode.View, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        Height: =36
                        OnChange: |-
                          =UpdateIf(
                              colHoursGallery,
                              RowKey = ThisItem.RowKey,
                              {
                                  StandardHours: Self.Text,
                                  IsDirty: true
                              }
                          )
                        Size: =12
                        Width: =80
                        X: =588
                        Y: =8
                  - txt_Comments:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.Comments
                        DisplayMode: =If(ThisItem.ApprovalStatus = "Approved", DisplayMode.View, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        Height: =36
                        OnChange: |-
                          =UpdateIf(
                              colHoursGallery,
                              RowKey = ThisItem.RowKey,
                              {
                                  Comments: Self.Text,
                                  IsDirty: true
                              }
                          )
                        Size: =11
                        Width: =Parent.TemplateWidth - 900
                        X: =674
                        Y: =8
                  - lbl_Status:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Fill: =If(ThisItem.ApprovalStatus = "Approved", RGBA(108, 212, 136, 1), ThisItem.ApprovalStatus = "Rejected", RGBA(252, 124, 124, 1), ThisItem.ApprovalStatus = "Pending", RGBA(252, 250, 124, 1), ThisItem.ApprovalStatus = "Draft", RGBA(200, 200, 200, 1), RGBA(0, 0, 0, 0))
                        Font: =Font.'Open Sans'

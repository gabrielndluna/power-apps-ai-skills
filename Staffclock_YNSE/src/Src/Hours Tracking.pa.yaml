                        Visible: =ThisItem.ApprovalStatus <> "Approved"
                        Width: =28
                        X: =Parent.TemplateWidth - 88
                        Y: =12
                  - btn_RemoveRow:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(214, 12, 48, 1)
                        Height: =28
                        Icon: =Icon.Trash
                        OnSelect: |-
                          =If(
                              ThisItem.RecordID <> 0,
                              Remove(
                                  'Hours Tracking (Hours)',
                                  LookUp('Hours Tracking (Hours)', ID = ThisItem.RecordID)

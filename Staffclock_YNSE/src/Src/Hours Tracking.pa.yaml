                        Size: =11
                        Text: =ThisItem.ApprovalStatus
                        Width: =100
                        X: =Parent.TemplateWidth - 200
                        Y: =8
                  - btn_AddRow:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(0, 18, 107, 1)
                        Height: =28
                        Icon: =Icon.Add
                        OnSelect: |-
                          =Collect(
                              colHoursGallery,
                              {
                                  RowKey: Text(GUID()),
                                  WorkDate: ThisItem.WorkDate,
                                  DayLabel: ThisItem.DayLabel,
                                  CostCode: varSelectedCostCode,
                                  CostCodeID: varSelectedCostCodeID,
                                  TaskCode: "Work Day",
                                  Comments: "",
                                  StandardHours: "",
                                  IsSubmitted: false,
                                  RecordID: 0,
                                  ApprovalStatus: "",
                                  IsDirty: true

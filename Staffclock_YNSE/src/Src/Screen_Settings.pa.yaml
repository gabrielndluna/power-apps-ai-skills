                        BorderThickness: =0
                        Color: =If(varSettingsTab = "Codes", RGBA(255, 255, 255, 1), RGBA(0, 18, 107, 1))
                        Fill: =If(varSettingsTab = "Codes", RGBA(0, 18, 107, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "Codes"); Set(varSettingsModal, "")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: ="Cost codes"
                        Width: =140
            - settings_body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout

                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =0
                                    PaddingLeft: =4
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Name"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =(Parent.Width - 576) * 0.5
                                    X: =8
                                    Y: =2
                              - lbl_HeadEmail:

                              Height: =32
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                            Children:
                              - lbl_HeadName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)

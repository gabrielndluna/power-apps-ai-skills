                                    Y: =2
                        - Gallery_People:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(226, 228, 240, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =Max(320, Parent.Height - 130)
                              LayoutMinHeight: =320
                              LayoutMinWidth: =0
                              TemplatePadding: =0
                              TemplateSize: =52
                              Width: =Parent.Width
                              WrapCount: =1
                              Items: |-
                                =SortByColumns(Search(colSettingsEmployees, Trim(txt_PeopleFilter.Text), Title, Email, FirstName, LastName), "LastName", SortOrder.Ascending)
                              OnSelect: |-
                                =Set(varSettingsModal, "Person");
                                Set(varSettingsId, ThisItem.ID);
                                Set(varSettingsEmail, Coalesce(ThisItem.Email, ""));
                                Set(varSettingsFirst, Coalesce(ThisItem.FirstName, ""));
                                Set(varSettingsLast, Coalesce(ThisItem.LastName, ""));
                                Set(varSettingsPersonnel, Coalesce(ThisItem.PersonnelNumber, ""));
                                Set(varSettingsDept, Coalesce(ThisItem.Department, ""));
                                Set(varSettingsProjectCode, Coalesce(ThisItem.ProjectCode, "A02264"));
                                Set(varSettingsProjectName, Coalesce(ThisItem.ProjectName, "YNSE"));
                                Set(varSettingsApproverName, Coalesce(ThisItem.ApproverName, ""));
                                Set(varSettingsApproverEmail, Coalesce(ThisItem.ApproverEmail, ""));
                                Set(varSettingsHasStart, !IsBlank(ThisItem.StartDate));
                                Set(varSettingsStart, If(varSettingsHasStart, DateAdd(ThisItem.StartDate, TimeZoneOffset(), "Minutes"), Today()));
                                Set(varSettingsHasEnd, !IsBlank(ThisItem.EndDate));
                                Set(varSettingsEnd, If(varSettingsHasEnd, DateAdd(ThisItem.EndDate, TimeZoneOffset(), "Minutes"), Today()));
                                Set(varSettingsUseDayaway, Coalesce(ThisItem.UseDayaway, false));
                                Set(varSettingsUseStaffclock, Coalesce(ThisItem.UseStaffclock, false));
                                Set(varSettingsIsActive, Coalesce(ThisItem.IsActive, false));
                                Set(varSettingsApproverOfAll, Coalesce(ThisItem.ApproverOfAll, false));
                                Set(varSettingsIsAdmin, Coalesce(ThisItem.IsAdmin, false));
                                Set(varSettingsApproverOfAll, varSettingsApproverOfAll || varSettingsIsAdmin);
                                Reset(txt_EmpEmail);
                                Reset(txt_EmpFirst);
                                Reset(txt_EmpLast);
                                Reset(txt_EmpPersonnel);
                                Reset(txt_EmpDept);
                                Reset(txt_EmpProjectCode);
                                Reset(txt_EmpProjectName);
                                Reset(txt_ApproverName);
                                Reset(txt_ApproverEmail);
                                Reset(dp_EmpStart);
                                Reset(dp_EmpEnd);

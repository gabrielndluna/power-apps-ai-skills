Screens:
  Screen_Settings:
    Properties:
      Fill: =RGBA(245, 246, 251, 1)
      LoadingSpinnerColor: =RGBA(0, 18, 107, 1)
      OnVisible: |-
        =Set(varIsSavingSettings, false);
        Set(varSettingsTab, Coalesce(varSettingsTab, "Employees"));
        Set(varSettingsModal, "");
        Set(varSettingsHasStart, false); Set(varSettingsStart, Today());
        Set(varSettingsHasEnd, false); Set(varSettingsEnd, Today());
        Refresh(Employees);
        Refresh('Public Holidays');
        Refresh('Cost Codes');
        ClearCollect(colSettingsEmployees, Employees);
        ClearCollect(
            colSettingsHolidays,
            SortByColumns('Public Holidays', "HolidayDate", SortOrder.Descending)
        );
        ClearCollect(colSettingsCodes, 'Cost Codes');
        ClearCollect(colEmployeesAll, Filter(Employees, IsActive = true));
        ClearCollect(
            colEmployees,
            Filter(
                colEmployeesAll,
                Lower(Email) = Lower(User().Email) && UseStaffclock = true
            )
        );
        ClearCollect(colCostCodes, 'Cost Codes');
        Set(
            varApprovers,
            LookUp(
                colEmployees,
                Lower(Email) = Lower(User().Email)
            )
        );
        Set(varIsAdmin, Coalesce(varApprovers.IsAdmin, false));
        Set(
            varIsSuperAdmin,
            varIsAdmin || Coalesce(varApprovers.ApproverOfAll, false)
        );
        Set(varCanUseStaffclock, !IsBlank(varApprovers.Email));
        ClearCollect(
            colPublic_Holidays,
            AddColumns(
                'Public Holidays',
                CleanDate,
                DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"),
                CleanDateKey,
                Text(DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"), "yyyy-mm-dd")
            )
        );
    Children:
      - settings_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 246, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - settings_header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  Width: =Parent.Width
                Children:
                  - Logo_Settings_A:
                      Control: Image@2.2.3
                      Properties:
                        Height: =36
                        Image: ='App Names'
                        ImagePosition: =ImagePosition.Fit
                        Width: =120
                  - Logo_Settings_B:
                      Control: Image@2.2.3
                      Properties:
                        Height: =36
                        Image: ='Logo Cropped'
                        ImagePosition: =ImagePosition.Fit
                        Width: =120
                  - Label_SettingsTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(23, 26, 51, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="Settings"
                        VerticalAlign: =VerticalAlign.Middle
                  - btn_Home_Settings:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(226, 228, 240, 1)
                        BorderThickness: =1
                        Color: =RGBA(23, 26, 51, 1)
                        Fill: =RGBA(245, 247, 250, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        OnSelect: =Navigate(Screen_Home, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Home"
                        Width: =88
                  - btn_Approver_Settings:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(226, 228, 240, 1)
                        BorderThickness: =1
                        Color: =RGBA(23, 26, 51, 1)
                        Fill: =RGBA(245, 247, 250, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        OnSelect: =Navigate(Screen_WeeklyApprovals, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =12
                        Text: ="Approver"
                        Visible: =varIsApprover
                        Width: =100
            - settings_tabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  Width: =Parent.Width
                Children:
                  - btn_TabPeople:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varSettingsTab = "Employees", RGBA(255, 255, 255, 1), RGBA(0, 18, 107, 1))
                        Fill: =If(varSettingsTab = "Employees", RGBA(0, 18, 107, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "Employees"); Set(varSettingsModal, "")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: ="Employees"
                        Width: =140
                  - btn_TabHolidays:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varSettingsTab = "Holidays", RGBA(255, 255, 255, 1), RGBA(0, 18, 107, 1))
                        Fill: =If(varSettingsTab = "Holidays", RGBA(0, 18, 107, 1), RGBA(255, 255, 255, 1))
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varSettingsTab, "Holidays"); Set(varSettingsModal, "")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: ="Holidays"
                        Width: =120
                  - btn_TabCodes:
                      Control: Classic/Button@2.2.0

                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =(Parent.Width - 576) * 0.46
                                    X: =16 + (Parent.Width - 576) * 0.5
                                    Y: =2
                              - lbl_HeadStart:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Start"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =100
                                    X: =Parent.Width - 560
                                    Y: =2
                              - lbl_HeadActive:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Active"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =88
                                    X: =Parent.Width - 450
                                    Y: =2
                              - lbl_HeadAdmin:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Admin"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =80
                                    X: =Parent.Width - 350
                                    Y: =2
                              - lbl_HeadApprover:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(91, 97, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Approver"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =96

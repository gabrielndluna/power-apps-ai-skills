                              Color: =RGBA(91, 97, 120, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              PaddingLeft: =4
                              PaddingTop: =6
                              Size: =12
                              Text: =If(CountRows(colSettingsEmployees) = 0, "No employees loaded.", "No employees match that search.")
                              Visible: =IsEmpty(Search(colSettingsEmployees, Trim(txt_PeopleFilter.Text), Title, Email, FirstName, LastName))
                              Width: =Parent.Width
                        - emp_col_header:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout

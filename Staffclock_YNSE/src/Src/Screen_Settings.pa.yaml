                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(0, 18, 107, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varSettingsModal, "Person");
                                      Set(varSettingsId, 0);
                                      Set(varSettingsEmail, "");
                                      Set(varSettingsFirst, "");
                                      Set(varSettingsLast, "");
                                      Set(varSettingsPersonnel, "");
                                      Set(varSettingsDept, "");
                                      Set(varSettingsProjectCode, "A02264");
                                      Set(varSettingsProjectName, "YNSE");
                                      Set(varSettingsApproverName, "");
                                      Set(varSettingsApproverEmail, "");
                                      Set(varSettingsHasStart, false); Set(varSettingsStart, Today());
                                      Set(varSettingsHasEnd, false); Set(varSettingsEnd, Today());
                                      Set(varSettingsUseDayaway, true);
                                      Set(varSettingsUseStaffclock, true);
                                      Set(varSettingsIsActive, true);
                                      Set(varSettingsApproverOfAll, false);
                                      Set(varSettingsIsAdmin, false);
                                      Reset(txt_EmpEmail);
                                      Reset(txt_EmpFirst);
                                      Reset(txt_EmpLast);
                                      Reset(txt_EmpPersonnel);
                                      Reset(txt_EmpDept);
                                      Reset(txt_EmpProjectCode);
                                      Reset(txt_EmpProjectName);
                                      Reset(txt_ApproverName);
                                      Reset(txt_ApproverEmail);
                                      Reset(dp_EmpStart);
                                      Reset(dp_EmpEnd);
                                      Set(varSettingsModal, "Person");

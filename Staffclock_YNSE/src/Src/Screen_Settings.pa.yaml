                        - modal_actions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              Width: =Parent.Width
                            Children:
                              - btn_SavePerson:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    DisplayMode: =If(varIsSavingSettings, DisplayMode.Disabled, DisplayMode.Edit)
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(0, 18, 107, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =If(
                                          varIsSavingSettings,
                                          Notify("Please wait...", NotificationType.Warning),
                                          IsBlank(Trim(txt_EmpEmail.Text)) || IsBlank(Trim(txt_EmpFirst.Text)) || IsBlank(Trim(txt_EmpLast.Text)),
                                          Notify("First name, last name, and email are required", NotificationType.Warning),
                                          varSettingsId = 0 && !IsBlank(LookUp(colSettingsEmployees, Lower(Email) = Lower(Trim(txt_EmpEmail.Text)))),
                                          Notify("That email is already on the list", NotificationType.Error),
                                          Set(varIsSavingSettings, true);
                                          Set(varSaveOk, true);
                                          IfError(
                                              Patch(
                                                  Employees,
                                                  If(varSettingsId = 0, Defaults(Employees), LookUp(Employees, ID = varSettingsId)),
                                                  {
                                                      Title: Trim(Trim(txt_EmpFirst.Text) & " " & Trim(txt_EmpLast.Text)),
                                                      Email: Lower(Trim(txt_EmpEmail.Text)),
                                                      FirstName: Trim(txt_EmpFirst.Text),
                                                      LastName: Trim(txt_EmpLast.Text),
                                                      PersonnelNumber: Trim(txt_EmpPersonnel.Text),
                                                      Department: Trim(txt_EmpDept.Text),
                                                      ProjectCode: Trim(txt_EmpProjectCode.Text),
                                                      ProjectName: Trim(txt_EmpProjectName.Text),
                                                      ApproverName: Trim(txt_ApproverName.Text),
                                                      ApproverEmail: Lower(Trim(txt_ApproverEmail.Text)),
                                                      StartDate: If(varSettingsHasStart, dp_EmpStart.SelectedDate, Blank()),
                                                      EndDate: If(varSettingsHasEnd, dp_EmpEnd.SelectedDate, Blank()),
                                                      UseDayaway: varSettingsUseDayaway,
                                                      UseStaffclock: varSettingsUseStaffclock,
                                                      IsActive: varSettingsIsActive,
                                                      IsAdmin: varSettingsIsAdmin,
                                                      ApproverOfAll: varSettingsIsAdmin || varSettingsApproverOfAll
                                                  }
                                              ),
                                              Set(varSaveOk, false)
                                          );
                                          If(
                                              varSaveOk,
                                              Notify("Employee saved", NotificationType.Success);
                                              Set(varSettingsModal, ""),
                                              Notify("Could not save that employee", NotificationType.Error)
                                          );
                                      Refresh(Employees);
                                      Refresh('Public Holidays');
                                      Refresh('Cost Codes');
                                      ClearCollect(colSettingsEmployees, Employees);
                                      ClearCollect(
                                          colSettingsHolidays,
                                          SortByColumns('Public Holidays', "HolidayDate", SortOrder.Descending)
                                      );
                                      ClearCollect(colSettingsCodes, 'Cost Codes');
                                      ClearCollect(colEmployeesAll, Filter(Employees, IsActive = true));
                                      ClearCollect(
                                          colEmployees,
                                          Filter(
                                              colEmployeesAll,
                                              Lower(Email) = Lower(User().Email) && UseStaffclock = true
                                          )
                                      );
                                      ClearCollect(colCostCodes, 'Cost Codes');
                                      Set(
                                          varApprovers,
                                          LookUp(
                                              colEmployees,
                                              Lower(Email) = Lower(User().Email)
                                          )
                                      );
                                      Set(varIsAdmin, Coalesce(varApprovers.IsAdmin, false));
                                      Set(
                                          varIsSuperAdmin,
                                          varIsAdmin || Coalesce(varApprovers.ApproverOfAll, false)
                                      );
                                      Set(varCanUseStaffclock, !IsBlank(varApprovers.Email));
                                      ClearCollect(
                                          colPublic_Holidays,
                                          AddColumns(
                                              'Public Holidays',
                                              CleanDate,
                                              DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"),
                                              CleanDateKey,
                                              Text(DateAdd(HolidayDate, TimeZoneOffset(), "Minutes"), "yyyy-mm-dd")
                                          )
                                      );
                                          Set(varIsSavingSettings, false)
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =12
                                    Text: ="Save employee"
                                    Width: =180
                                    Visible: =varSettingsModal = "Person"
                              - btn_SaveHoliday:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(0, 18, 107, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: |-
                                      =If(
                                          varIsSavingSettings,
                                          Notify("Please wait...", NotificationType.Warning),
                                          IsBlank(Trim(txt_HolTitle.Text)) || IsBlank(dp_Holiday.SelectedDate),
                                          Notify("Holiday name and date are required", NotificationType.Warning),
                                          Set(varIsSavingSettings, true);
                                          Set(varSaveOk, true);
                                          IfError(
                                              Patch(
                                                  'Public Holidays',
                                                  If(varSettingsHolidayId = 0, Defaults('Public Holidays'), LookUp('Public Holidays', ID = varSettingsHolidayId)),
                                                  {
                                                      Title: Trim(txt_HolTitle.Text),
                                                      HolidayDate: dp_Holiday.SelectedDate,
                                                      Country: If(IsBlank(Trim(txt_HolCountry.Text)), "Canada", Trim(txt_HolCountry.Text)),
                                                      Projects: If(IsBlank(Trim(txt_HolProjects.Text)), "YNSE", Trim(txt_HolProjects.Text))
                                                  }
                                              ),
                                              Set(varSaveOk, false)
                                          );
                                          If(
                                              varSaveOk,
                                              Notify("Holiday saved", NotificationType.Success);
                                              Set(varSettingsModal, ""),
                                              Notify("Could not save that holiday", NotificationType.Error)
                                          );
                                      Refresh(Employees);
                                      Refresh('Public Holidays');
                                      Refresh('Cost Codes');
                                      ClearCollect(colSettingsEmployees, Employees);

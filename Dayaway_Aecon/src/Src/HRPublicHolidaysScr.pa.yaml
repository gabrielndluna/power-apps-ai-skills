                        OnSelect: |-
                          =Set(
                              varHolidaySaved,
                              Patch(
                                  'Vacations Tracking (Public Holidays)',
                                  LookUp('Vacations Tracking (Public Holidays)', ID = varSelectedHoliday.ID),
                                  {
                                      Country: ManagerNameField_37.Text,
                                      Date: DatePicker4.SelectedDate,
                                      Motive:ManagerNameField_38.Text
                                  }
                              )
                          );

                          If(
                              IsEmpty(Errors('Vacations Tracking (Public Holidays)', varHolidaySaved)),
                              Set(varSelectedHoliday, varHolidaySaved);
                              Refresh('Vacations Tracking (Public Holidays)');
                              Notify("Public holiday saved successfully.", NotificationType.Success),
                              Notify(
                                  "Save failed: " & First(Errors('Vacations Tracking (Public Holidays)', varHolidaySaved)).Message,
                                  NotificationType.Error
                              )
                          );

                          UpdateContext({ locShowHolidayDetails: false });

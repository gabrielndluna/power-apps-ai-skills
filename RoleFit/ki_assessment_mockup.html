<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aecon · Key Individual Assessment</title>
<style>
/* ============ THEME TOKENS — swap --aecon-red for the exact brand hex ============ */
:root{
  --aecon-red:#E4002B;
  --aecon-red-dark:#B80022;
  --aecon-red-tint:#FDECEE;
  --ink:#1A1A1A;
  --charcoal:#2C2F33;
  --slate:#5A6069;
  --slate-2:#858B93;
  --line:#E4E7EB;
  --line-2:#EEF0F3;
  --bg:#F3F4F6;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --met:#1F8A54;
  --met-bg:#E8F5EE;
  --partial:#B9770B;
  --partial-bg:#FBF1DF;
  --gap:#8A9099;
  --gap-bg:#F1F2F4;
  --crit:#E4002B;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --shadow-lg:0 8px 24px rgba(16,24,40,.12);
  --radius:10px;
  --radius-sm:7px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ============ APP SHELL ============ */
.app{display:flex;min-height:100vh;}
.rail{
  width:224px;background:var(--charcoal);color:#D7DADE;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .logo{font-weight:700;font-size:22px;color:var(--aecon-red);letter-spacing:-.5px;line-height:1;}
.brand .logo::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--aecon-red);margin-left:1px;vertical-align:baseline;}
.brand .sub{font-size:10.5px;color:#9AA0A8;text-transform:uppercase;letter-spacing:.7px;margin-top:3px;}
.nav{padding:10px 8px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);
  color:#C6CACF;font-size:13.5px;font-weight:500;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--aecon-red);color:#fff;}
.nav-item .ic{width:17px;height:17px;flex-shrink:0;opacity:.9;}
.nav-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7C828B;}
.nav-foot .who{color:#C6CACF;font-weight:600;font-size:12px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30;
}
.topbar .crumbs{font-size:13px;color:var(--slate);display:flex;align-items:center;gap:8px;}
.topbar .crumbs b{color:var(--ink);font-weight:600;}
.topbar .crumbs .sep{color:var(--slate-2);}
.pill-proto{
  font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--aecon-red);
  background:var(--aecon-red-tint);border:1px solid #F6C9D1;padding:3px 9px;border-radius:20px;text-transform:uppercase;
}
.content{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ============ TYPO / SHARED ============ */
h1.page{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.2px;}
.page-sub{color:var(--slate);font-size:13.5px;margin:0 0 22px;max-width:720px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--aecon-red);margin-bottom:8px;}
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.12s;
}
.btn:hover{background:var(--surface-2);border-color:#D2D6DC;}
.btn.primary{background:var(--aecon-red);border-color:var(--aecon-red);color:#fff;}
.btn.primary:hover{background:var(--aecon-red-dark);border-color:var(--aecon-red-dark);}
.btn.ghost{border-color:transparent;background:transparent;color:var(--slate);}
.btn.ghost:hover{background:var(--line-2);color:var(--ink);}
.btn.sm{padding:6px 12px;font-size:12.5px;}

/* ============ HOME ============ */
.assigned-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px;
  border-left:4px solid var(--aecon-red);
}
.assigned-card .meta-row{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;}
.mini{font-size:12px;}
.mini .k{color:var(--slate-2);text-transform:uppercase;letter-spacing:.4px;font-size:10.5px;font-weight:600;margin-bottom:2px;}
.mini .v{color:var(--charcoal);font-weight:600;font-size:13px;}
.status-tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
.status-tag.pending{background:var(--partial-bg);color:var(--partial);}
.status-tag.done{background:var(--met-bg);color:var(--met);}
.status-tag.searching{background:#E7F0FB;color:#2C6EBD;}
.status-tag .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.section-label{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--slate-2);margin:30px 0 12px;}
.role-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;transition:.12s;
}
.role-row:hover{border-color:#D2D6DC;box-shadow:var(--shadow);}
.role-row .t{font-weight:600;font-size:14px;}
.role-row .d{font-size:12px;color:var(--slate);margin-top:2px;}

/* ============ ROLE WORKSPACE HEADER ============ */
.role-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:18px;}
.role-head h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px;}
.role-head .meta-row{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;}
.tab{
  border:none;background:none;padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--slate);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--aecon-red);border-bottom-color:var(--aecon-red);}
.tab .count{background:var(--line-2);color:var(--slate);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;}
.tab.active .count{background:var(--aecon-red-tint);color:var(--aecon-red);}

/* ============ REQUIREMENTS (accordion) ============ */
.sticky-progress{
  position:sticky;top:56px;z-index:20;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.progress-stats{display:flex;gap:26px;align-items:center;}
.stat{display:flex;flex-direction:column;}
.stat .num{font-size:20px;font-weight:700;line-height:1;color:var(--ink);}
.stat .num.red{color:var(--aecon-red);}
.stat .lbl{font-size:10.5px;color:var(--slate-2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:4px;}
.bar-wrap{flex:1;max-width:320px;}
.bar{height:7px;background:var(--line-2);border-radius:6px;overflow:hidden;}
.bar > span{display:block;height:100%;background:var(--aecon-red);border-radius:6px;transition:width .25s;}
.bar-cap{font-size:11px;color:var(--slate);margin-top:6px;}

.instr{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:var(--slate);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;}
.instr b{color:var(--charcoal);}

.pillar{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);}
.pillar-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;cursor:pointer;user-select:none;border-left:4px solid var(--pcolor,var(--aecon-red));}
.pillar-head:hover{background:var(--surface-2);}
.pillar-head .l{display:flex;align-items:center;gap:12px;}
.pillar-head .chev{transition:transform .2s;color:var(--slate-2);}
.pillar.collapsed .chev{transform:rotate(-90deg);}
.pillar-title{font-size:15.5px;font-weight:700;}
.pillar-desc{font-size:11.5px;color:var(--slate);margin-top:2px;max-width:520px;}
.pillar-count{font-size:12px;font-weight:700;color:var(--slate);background:var(--line-2);padding:3px 11px;border-radius:20px;white-space:nowrap;}
.pillar-count b{color:var(--pcolor,var(--aecon-red));}
.pillar-body{padding:4px 20px 14px;}
.pillar.collapsed .pillar-body{display:none;}

.cat{border-top:1px solid var(--line-2);}
.cat:first-child{border-top:none;}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;cursor:pointer;user-select:none;}
.cat-head:hover .cat-title{color:var(--aecon-red);}
.cat-head .l{display:flex;align-items:center;gap:10px;}
.cat-title{font-size:13.5px;font-weight:600;}
.cat-chev{color:var(--slate-2);transition:transform .2s;font-size:11px;}
.cat.collapsed .cat-chev{transform:rotate(-90deg);}
.cat-count{font-size:11px;color:var(--slate-2);font-weight:600;}
.cat-count.has{color:var(--met);}
.cat-body{padding:2px 0 10px;}
.cat.collapsed .cat-body{display:none;}

.item{display:flex;align-items:flex-start;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);transition:.1s;}
.item:hover{background:var(--surface-2);}
.item.on{background:var(--aecon-red-tint);}
.item.on:hover{background:#FCE3E7;}
.chk{
  width:19px;height:19px;border:2px solid #C4C9CF;border-radius:5px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;background:var(--surface);transition:.1s;
}
.item.on .chk{background:var(--aecon-red);border-color:var(--aecon-red);}
.chk svg{opacity:0;transform:scale(.6);transition:.1s;}
.item.on .chk svg{opacity:1;transform:scale(1);}
.item-main{flex:1;min-width:0;}
.item-text{font-size:13px;color:var(--charcoal);cursor:pointer;}
.item.on .item-text{color:var(--ink);font-weight:500;}
.item-tools{display:flex;align-items:center;gap:4px;flex-shrink:0;opacity:0;transition:.1s;}
.item:hover .item-tools,.item.on .item-tools{opacity:1;}
.tool-btn{
  border:1px solid transparent;background:none;border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600;
  color:var(--slate-2);display:inline-flex;align-items:center;gap:5px;
}
.tool-btn:hover{background:var(--line-2);color:var(--charcoal);}
.tool-btn.crit-on{color:var(--crit);background:var(--aecon-red-tint);}
.tool-btn.note-on{color:var(--aecon-red);}
.star{font-size:13px;line-height:1;}
.crit-badge{font-size:9.5px;font-weight:800;letter-spacing:.4px;color:#fff;background:var(--crit);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-left:8px;vertical-align:middle;}
.note-box{margin:6px 0 2px;}
.note-box textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit;font-size:12.5px;
  resize:vertical;min-height:44px;color:var(--charcoal);background:var(--surface);
}
.note-box textarea:focus{outline:none;border-color:var(--aecon-red);box-shadow:0 0 0 3px var(--aecon-red-tint);}
.add-custom{display:flex;gap:8px;align-items:center;padding:8px 10px;margin-top:4px;}
.add-custom input{flex:1;border:1px dashed #C4C9CF;border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit;font-size:12.5px;background:var(--surface-2);}
.add-custom input:focus{outline:none;border-color:var(--aecon-red);border-style:solid;background:var(--surface);}
.custom-flag{font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--slate);background:var(--line-2);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-left:8px;}

/* ============ CANDIDATES LIST ============ */
.cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.cand-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;transition:.12s;cursor:pointer;position:relative;}
.cand-card:hover{border-color:#D2D6DC;box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.cand-card.selected{border-color:var(--aecon-red);}
.cand-card.selected::before{content:"SELECTED FOR ROLE";position:absolute;top:-9px;left:16px;background:var(--aecon-red);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:4px;}
.cand-top{display:flex;gap:13px;align-items:center;margin-bottom:14px;}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
.cand-name{font-weight:700;font-size:15px;}
.cand-title{font-size:12px;color:var(--slate);}
.cand-score-row{display:flex;gap:18px;align-items:center;padding-top:14px;border-top:1px solid var(--line-2);}
.score-block{display:flex;flex-direction:column;}
.score-block .big{font-size:19px;font-weight:700;line-height:1;}
.score-block .big small{font-size:12px;color:var(--slate-2);font-weight:600;}
.score-block .cap{font-size:10px;color:var(--slate-2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:4px;}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--aecon-red) calc(var(--p)*1%),var(--line-2) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;}
.ring i{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-style:normal;color:var(--charcoal);}

/* ============ CANDIDATE DETAIL ============ */
.back-link{border:none;background:none;color:var(--slate);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:8px;}
.back-link:hover{color:var(--aecon-red);}
.attest-item{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);}
.attest-item:hover{background:var(--surface-2);}
.attest-text{flex:1;font-size:13px;color:var(--charcoal);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--surface);}
.seg button{border:none;background:none;padding:6px 13px;font-size:12px;font-weight:600;color:var(--slate);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button:hover{background:var(--surface-2);}
.seg button.on-met{background:var(--met);color:#fff;}
.seg button.on-partial{background:var(--partial);color:#fff;}
.seg button.on-gap{background:var(--gap);color:#fff;}

/* ============ COMPARE MATRIX ============ */
.compare-summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.sumbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;min-width:150px;}
.sumbox .n{font-size:22px;font-weight:700;line-height:1;}
.sumbox .n.red{color:var(--aecon-red);}
.sumbox .l{font-size:11px;color:var(--slate);margin-top:5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
.matrix-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
table.matrix{width:100%;border-collapse:collapse;}
.matrix thead th{position:sticky;top:56px;background:var(--surface);z-index:10;}
.matrix th.cand-col{padding:14px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top;border-left:1px solid var(--line-2);min-width:132px;}
.matrix th.req-col{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate-2);font-weight:700;width:46%;}
.cch-name{font-weight:700;font-size:13.5px;}
.cch-title{font-size:10.5px;color:var(--slate);margin:2px 0 8px;font-weight:500;}
.cch-score{font-size:17px;font-weight:700;}
.cch-score small{font-size:11px;color:var(--slate-2);font-weight:600;}
.cch-crit{font-size:10px;color:var(--slate);margin-top:3px;}
.cch-crit b{color:var(--aecon-red);}
.set-btn{margin-top:9px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--slate);}
.set-btn:hover{border-color:var(--aecon-red);color:var(--aecon-red);}
.set-btn.is-sel{background:var(--aecon-red);border-color:var(--aecon-red);color:#fff;}
.matrix .prow-head td{background:var(--surface-2);font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--charcoal);padding:9px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line-2);}
.matrix td.req-cell{padding:10px 18px;font-size:12.5px;color:var(--charcoal);border-top:1px solid var(--line-2);vertical-align:top;}
.matrix td.mark{text-align:center;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);vertical-align:middle;}
.matrix tr.selcol-hi td.selcol{background:var(--aecon-red-tint);}
.mk{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.mk.met{background:var(--met-bg);color:var(--met);}
.mk.partial{background:var(--partial-bg);color:var(--partial);}
.mk.gap{background:var(--gap-bg);color:var(--gap);}
.mk.critgap{background:var(--aecon-red-tint);color:var(--crit);border:1.5px solid var(--crit);}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin:16px 2px 26px;font-size:12px;color:var(--slate);}
.legend.legend-top{justify-content:flex-end;margin:0 2px 12px;gap:16px;}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.gaps-panel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--aecon-red);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-top:22px;}
.gaps-panel h3{margin:0 0 4px;font-size:15px;}
.gaps-panel .who{font-size:12.5px;color:var(--slate);margin-bottom:14px;}
.gap-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13px;}
.gap-item:first-of-type{border-top:none;}
.gap-item .tag{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px;text-transform:uppercase;}
.gap-item .tag.crit{background:var(--aecon-red-tint);color:var(--crit);}
.gap-item .tag.dev{background:var(--partial-bg);color:var(--partial);}
.crumb-link{color:var(--slate);cursor:pointer;}
.crumb-link:hover{color:var(--aecon-red);}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;align-items:center;gap:9px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .ok{color:#5FD08C;font-weight:800;}
/* homepage jump tiles */
.home-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.action-tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;transition:.12s;}
.action-tile:hover{border-color:var(--aecon-red);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.action-tile .at-ic{width:38px;height:38px;border-radius:9px;background:var(--aecon-red-tint);color:var(--aecon-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* =========================================================================
   ROLE PORTFOLIO — lifecycle:  pending reqs  ->  not-filled  ->  filled
   The flagship role (interactive) derives its status from live state so it
   visibly moves between stages as you finalize requirements / pick a person.
   ========================================================================= */
const ROLES = [
  { id:"r_nuclear", interactive:true, title:ROLE.title, project:ROLE.project, location:ROLE.location },
  { id:"r_ehs",     status:"pending",   title:"Director, EHS — Nuclear Portfolio",        project:"Nuclear Portfolio · Ontario" },
  { id:"r_vpcomm",  status:"pending",   title:"VP, Commercial — Utilities Program",       project:"Utility Infrastructure · Alberta" },
  { id:"r_transit", status:"searching", title:"Construction Director — Transit Expansion", project:"Urban Transit Line 4 · Toronto" },
  { id:"r_smr",     status:"searching", title:"Site Manager — SMR Pilot",                  project:"SMR Pilot Unit · Ontario" },
  { id:"r_marine",  status:"searching", title:"Package Manager — Marine Works",            project:"Deep-Water Intake · Ontario" },
  { id:"r_comm",    status:"filled", filledBy:"J. Marchetti", title:"Commissioning Lead — Refurb Unit 3",   project:"Refurbishment Program · Ontario" },
  { id:"r_proc",    status:"filled", filledBy:"L. Nguyen",    title:"Procurement Director — Major Projects", project:"Procurement · Ontario" },
];
const STATUS = {
  pending:  { key:"pending",   label:"Pending reqs", tag:"Requirements to define", cls:"pending",   action:"Open assessment",  tab:"req"  },
  searching:{ key:"searching", label:"Not-Filled",   tag:"Searching — not filled", cls:"searching", action:"Review candidates", tab:"cand" },
  filled:   { key:"filled",    label:"Filled",       tag:"Filled",                 cls:"done",       action:"View role",         tab:"comp" },
};
function roleStatus(r){
  if(!r.interactive) return r.status;
  if(!state.reqsFinalized) return "pending";
  if(!state.selectedCand)  return "searching";
  return "filled";
}

function candStatus(candId, itemId){
  const c=CAND[candId];
  if(c.met.has(itemId)) return "met";
  if(c.partial.has(itemId)) return "partial";
  return "gap";
}
function candScore(candId){
  const req=requiredIds();
  let met=0; req.forEach(id=>{ if(candStatus(candId,id)==="met") met++; });
  return {met, total:req.length, pct: req.length? Math.round(met/req.length*100):0};
}
function candCrit(candId){
  const crits=criticalIds();
  let ok=0; crits.forEach(id=>{ if(candStatus(candId,id)==="met") ok++; });
  return {ok,total:crits.length};
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let current={screen:"home", tab:"req", cand:null, rolesTab:"pending"};
function go(screen, opts={}){
  current.screen=screen;
  if(opts.tab){ current.tab=opts.tab; current.cand=null; }
  if(opts.cand!==undefined) current.cand=opts.cand;
  if(opts.rolesTab) current.rolesTab=opts.rolesTab;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.nav===screen || (screen==="role"&&n.dataset.nav==="home")));
  render();
  window.scrollTo(0,0);
}
function setTab(t){ current.tab=t; current.cand=null; render(); window.scrollTo(0,0); }

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const c=document.getElementById("content");
  const crumbs=document.getElementById("crumbs");
  if(current.screen==="home"){ crumbs.innerHTML="<b>Home</b>"; c.innerHTML=viewHome(); }
  else if(current.screen==="roles"){ crumbs.innerHTML="<b>All Roles</b>"; c.innerHTML=viewRoles(); }
  else if(current.screen==="pool"){ crumbs.innerHTML="<b>Talent Pool</b>"; c.innerHTML=viewPool(); }
  else if(current.screen==="role"){
    crumbs.innerHTML=`<span class="crumb-link" onclick="go('home')">Home</span> <span class="sep">/</span> <b>${ROLE.title}</b>`;
    c.innerHTML=viewRole();
  }
}

function renderPillar(p){
  const ids=[]; p.cats.forEach(c=>c.items.forEach(i=>ids.push(i.id)));
  const on=ids.filter(id=>state.req.has(id)).length;
  const collapsed = p.key!=="tech" ? "" : ""; // all expanded by default
  return `
  <div class="pillar ${p._collapsed?'collapsed':''}" id="pillar-${p.key}" style="--pcolor:${p.color}">
    <div class="pillar-head" onclick="togglePillar('${p.key}')">

        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>

      </div>
      <div class="pillar-count"><b>${on}</b> / ${ids.length} selected</div>
    </div>
    <div class="pillar-body">
      ${p.cats.map((c,ci)=>renderCat(p,c,ci)).join("")}
    </div>
  </div>`;
}
function renderCat(p,c,ci){
  const on=c.items.filter(i=>state.req.has(i.id)).length;
  const key=`${p.key}-${ci}`;
  return `
  <div class="cat ${c._collapsed?'collapsed':''}" id="cat-${key}">
    <div class="cat-head" onclick="toggleCat('${key}')">
      <div class="l">
        <svg class="cat-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
        <span class="cat-title">${c.name}</span>
      </div>
      <span class="cat-count ${on?'has':''}">${on} of ${c.items.length}</span>
    </div>
    <div class="cat-body">
      ${c.items.map(i=>renderItem(i)).join("")}
      <div class="add-custom">
        <span style="color:var(--slate-2);font-weight:700;">+</span>
        <input type="text" placeholder="Add your own requirement for this role…" onkeydown="if(event.key==='Enter'){addCustom('${key}',this)}">
      </div>
    </div>
  </div>`;
}
function renderItem(i){
  const on=state.req.has(i.id), crit=state.crit.has(i.id), note=state.notes[i.id]||"";
  return `
  <div class="item ${on?'on':''}" id="item-${i.id}">

}

/* ---------- COMPARE ---------- */
function viewCompare(){
  const req=requiredIds();
  const critN=criticalIds().length;
  const cands=roleCandList();
  // group required items by pillar for the matrix
  const groups=GUIDE.map(p=>{
    const items=[];
    p.cats.forEach(cat=>cat.items.forEach(it=>{ if(state.req.has(it.id)) items.push(it); }));
    return {p, items};
  }).filter(g=>g.items.length);

  const header=`<tr>
    <th class="req-col">Required statement</th>
    ${cands.map(c=>{
      const s=candScore(c.id), cc=candCrit(c.id), sel=c.id===state.selectedCand;
      return `<th class="cand-col ${sel?'selcol':''}">
        <div class="cch-name">${c.name}</div>
        <div class="cch-title">${c.title}</div>
        <div class="cch-score" style="color:${s.pct>=80?'var(--met)':s.pct>=60?'var(--partial)':'var(--charcoal)'}">${s.met}<small>/${s.total}</small></div>
        <div class="cch-crit">criticals <b style="color:${cc.ok===cc.total?'var(--met)':'var(--aecon-red)'}">${cc.ok}/${cc.total}</b></div>
        <button class="set-btn ${sel?'is-sel':''}" onclick="selectCand('${c.id}')">${sel?'✓ Selected':'Set as selected'}</button>
      </th>`;
    }).join("")}
  </tr>`;

  const rows=groups.map(g=>{
    const phead=`<tr class="prow-head"><td colspan="${1+cands.length}" style="border-left:4px solid ${g.p.color}">${g.p.name}</td></tr>`;
    const irows=g.items.map(it=>{
      const crit=state.crit.has(it.id);
      const cells=cands.map(c=>{
        const st=candStatus(c.id,it.id);
        const sel=c.id===state.selectedCand;
        let cls=st, glyph= st==='met'?'✓':st==='partial'?'◑':'–';
        if(st!=='met' && crit){ cls='critgap'; glyph='✕'; }
        return `<td class="mark ${sel?'selcol':''}"><span class="mk ${cls}">${glyph}</span></td>`;
      }).join("");
      return `<tr class="${state.selectedCand?'selcol-hi':''}"><td class="req-cell">${it.text}${crit?'<span class="crit-badge">Critical</span>':''}</td>${cells}</tr>`;
    }).join("");
    return phead+irows;
  }).join("");

  const legend=`<div class="legend legend-top">
    <span><span class="mk met" style="width:20px;height:20px;font-size:11px;">✓</span> Met</span>
    <span><span class="mk partial" style="width:20px;height:20px;font-size:11px;">◑</span> Partial</span>
    <span><span class="mk gap" style="width:20px;height:20px;font-size:11px;">–</span> Gap</span>
    <span><span class="mk critgap" style="width:20px;height:20px;font-size:11px;">✕</span> Critical gap</span>
  </div>`;

  return legend+`<div class="matrix-wrap"><table class="matrix"><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}

/* =========================================================================
   INTERACTIONS
   ========================================================================= */
function toggleReq(id){
  if(state.req.has(id)){ state.req.delete(id); state.crit.delete(id); }
  else state.req.add(id);
  render();
}
function toggleCrit(id){
  if(!state.req.has(id)) state.req.add(id);      // critical implies required
  state.crit.has(id)? state.crit.delete(id) : state.crit.add(id);
  render();
}
function toggleNote(id){
  const box=document.getElementById("note-"+id);
  if(!box) return;
  box.classList.toggle("hidden");
  if(!box.classList.contains("hidden")){ const ta=box.querySelector("textarea"); ta&&ta.focus(); }
}
function saveNote(id,v){ if(v.trim()) state.notes[id]=v; else delete state.notes[id]; }
let customSeq=0;
function addCustom(catKey,input){
  const v=input.value.trim(); if(!v) return;
  const [pk,ci]=catKey.split("-");
  const pillar=GUIDE.find(p=>p.key===pk); const cat=pillar.cats[+ci];
  const id="cx"+(customSeq++);
  const it={id,text:v,req:true,crit:false,_custom:true};
  cat.items.push(it);
  ITEM[id]={...it,pillar:pillar.name,cat:cat.name};
  state.req.add(id);
  render();
  showToast("Custom requirement added");
}
function togglePillar(k){ const p=GUIDE.find(x=>x.key===k); p._collapsed=!p._collapsed; render(); }
function toggleCat(key){ const [pk,ci]=key.split("-"); const cat=GUIDE.find(p=>p.key===pk).cats[+ci]; cat._collapsed=!cat._collapsed; render(); }
function setAttest(candId,itemId,val){
  const c=CAND[candId];
  c.met.delete(itemId); c.partial.delete(itemId);
  if(val==="met") c.met.add(itemId);
  else if(val==="partial") c.partial.add(itemId);
  render();
}
function selectCand(id){ state.selectedCand=id; render(); showToast(CAND[id].name+" selected — role marked as Filled"); }

function finalizeReqs(){
  state.reqsFinalized=true;
  render();
  showToast("Requirements saved — role is now searching for a candidate");
}

/* ---- add a person from a role; they persist in the Talent Pool ---- */
let newCandSeq=0;
function initialsFrom(name){
  const parts=(name||"").trim().split(/\s+/).filter(Boolean);
  return (parts.map(w=>w[0]).slice(0,2).join("")||"?").toUpperCase();
}
function openAddCandidate(){ state.addOpen=true; render(); }
function closeAddModal(e){ if(e && e.target && !e.target.classList.contains("modal-overlay")) return; state.addOpen=false; render(); }
function createNewCandidate(){
  const id="c_new"+(newCandSeq++);
  const c={ id, name:"New candidate", initials:"+", title:"Current title", tenure:"Added to Talent Pool",
            met:new Set(), partial:new Set(), extra:new Set(), _new:true,
            note:"New candidate. Mark what they already demonstrate below — it saves to the Talent Pool for future roles." };
  CANDIDATES.push(c); CAND[id]=c;
  state.roleCands.push(id);
  state.addOpen=false; current.tab="cand"; current.cand=id;
  render(); window.scrollTo(0,0);
  showToast("New candidate created — now mark what they have");
}
function attachFromPool(id){
  if(!state.roleCands.includes(id)) state.roleCands.push(id);
  state.addOpen=false; current.tab="cand"; current.cand=id;
  render(); window.scrollTo(0,0);
  showToast(CAND[id].name+" added from the Talent Pool");
}

let toastT;
function showToast(msg){
  const t=document.getElementById("toast"); document.getElementById("toast-msg").textContent=msg;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* boot */
render();
</script>

Screens:
  Home:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      LoadingSpinnerColor: =RGBA(228, 0, 43, 1)
      OnVisible: |-
        =ClearCollect(colRoles, KI_roles);
        ClearCollect(
            colMySponsorRoles,
            Filter(colRoles, Lower(sponsoremail) = varCurrentUserEmail)
        );
        Set(
            varTalentContextRole,
            Coalesce(
                First(Filter(colRoles, status.Value = "Searching")),
                First(colRoles)
            )
        )
    Children:
      - home_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - home_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(44, 47, 51, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =224
                Children:
                  - home_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =20
                        Text: ="RoleFit"
                  - home_nav_home:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Text: ="Home"
                        Width: =200
                  - home_nav_roles:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('All Roles', ScreenTransition.Fade)
                        Text: ="All Roles"
                        Visible: =varIsCreator
                        Width: =200
                  - home_nav_pool:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('Talent Pool', ScreenTransition.Fade)
                        Text: ="Talent Pool"
                        Visible: =varIsCreator
                        Width: =200
                  - home_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinHeight: =40
                  - home_user_name:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =12
                        Text: =User().FullName
                        Width: =200
                  - home_user_role:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(124, 130, 139, 1)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        Size: =11
                        Text: =If(varIsCreator, "HR Assessor", "Executive Sponsor")
            - home_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinWidth: =0
                Children:
                  - home_topbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =26
                        PaddingRight: =26
                      Children:
                        - home_crumb:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(26, 26, 26, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              Size: =13
                              Text: ="Home"
                  - home_content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =40
                        PaddingLeft: =30
                        PaddingRight: =30
                        PaddingTop: =26
                      Children:
                        - home_creator_section:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varIsCreator
                            Children:
                              - home_creator_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Color: =RGBA(26, 26, 26, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =32
                                    Size: =22
                                    Text: ="Dashboard"
                                    Width: =Parent.Width
                              - home_creator_sub:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Color: =RGBA(90, 96, 105, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =22
                                    Size: =13
                                    Text: ="Jump to roles by stage."
                                    Width: =Parent.Width
                              - home_jump_label:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Color: =RGBA(124, 130, 139, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Size: =11
                                    Text: ="JUMP TO"
                                    Width: =Parent.Width
                              - home_tiles_gallery:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =132
                                    Items: |-
                                      =Table(
                                          { key: "pending", title: "Roles pending requirements", desc: "Requirements not yet finalized", count: CountRows(Filter(colRoles, status.Value = "Pending Requirements")) },
                                          { key: "searching", title: "Roles to fill", desc: "Requirements set - searching for a candidate", count: CountRows(Filter(colRoles, status.Value = "Searching")) },
                                          { key: "filled", title: "Filled roles", desc: "A key individual has been selected", count: CountRows(Filter(colRoles, status.Value = "Filled")) }
                                      )
                                    LayoutMinHeight: =0
                                    OnSelect: |-
                                      =Set(varRolesListTab, ThisItem.key);
                                      Navigate('All Roles', ScreenTransition.Fade)
                                    TemplatePadding: =8
                                    TemplateSize: =116
                                    Width: =Parent.Width
                                    WrapCount: =3
                                  Children:
                                    - home_tile_card:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.Light
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =Parent.TemplateHeight - 4
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Width: =Parent.TemplateWidth - 4
                                        Children:
                                          - home_tile_icon_wrap:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                DropShadow: =DropShadow.None
                                                Fill: |-
                                                  =Switch(
                                                      ThisItem.key,
                                                      "pending", RGBA(251, 241, 223, 1),
                                                      "searching", RGBA(231, 240, 251, 1),
                                                      RGBA(232, 246, 238, 1)
                                                  )
                                                FillPortions: =0
                                                Height: =36
                                                LayoutMinHeight: =36
                                                LayoutMinWidth: =36
                                                RadiusBottomLeft: =18
                                                RadiusBottomRight: =18
                                                RadiusTopLeft: =18
                                                RadiusTopRight: =18
                                                Width: =36
                                              Children:
                                                - home_tile_icon:
                                                    Control: Classic/Icon@2.5.0
                                                    Properties:
                                                      Color: |-
                                                        =Switch(
                                                            ThisItem.key,
                                                            "pending", RGBA(185, 119, 11, 1),
                                                            "searching", RGBA(44, 110, 189, 1),
                                                            RGBA(31, 138, 84, 1)
                                                        )
                                                      Height: =18
                                                      Icon: |-
                                                        =Switch(
                                                            ThisItem.key,
                                                            "pending", Icon.Warning,
                                                            "searching", Icon.Search,
                                                            Icon.CheckBadge
                                                        )
                                                      OnSelect: |-
                                                        =Set(varRolesListTab, ThisItem.key);
                                                        Navigate('All Roles', ScreenTransition.Fade)
                                                      Width: =18
                                                      X: =9
                                                      Y: =9
                                          - home_tile_text:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(0, 0, 0, 0)
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - home_tile_title:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderThickness: =0
                                                      Color: =RGBA(26, 26, 26, 1)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Bold
                                                      Height: =36
                                                      OnSelect: |-
                                                        =Set(varRolesListTab, ThisItem.key);
                                                        Navigate('All Roles', ScreenTransition.Fade)
                                                      Size: =12
                                                      Text: =ThisItem.title
                                                      Width: =Parent.Width
                                                      Wrap: =true
                                                - home_tile_desc:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderThickness: =0
                                                      Color: =RGBA(90, 96, 105, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =34
                                                      OnSelect: |-
                                                        =Set(varRolesListTab, ThisItem.key);
                                                        Navigate('All Roles', ScreenTransition.Fade)
                                                      Size: =11
                                                      Text: =ThisItem.desc
                                                      Width: =Parent.Width
                                                      Wrap: =true
                                          - home_tile_count:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(44, 47, 51, 1)
                                                FillPortions: =0
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =28
                                                OnSelect: |-
                                                  =Set(varRolesListTab, ThisItem.key);
                                                  Navigate('All Roles', ScreenTransition.Fade)
                                                Size: =22
                                                Text: =Text(ThisItem.count)
                                                Width: =40
                        - home_exec_section:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              Visible: =!varIsCreator
                            Children:
                              - home_exec_eyebrow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(228, 0, 43, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="ASSIGNED TO YOU"
                              - home_exec_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(26, 26, 26, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =34
                                    Size: =22
                                    Text: ="Requirements to define"
                              - home_exec_sub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(90, 96, 105, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =40
                                    Size: =13
                                    Text: ="Open the assessment, tick requirements, flag critical ones, and add notes."
                                    Wrap: =true
                              - home_sponsor_gallery:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    Items: =colMySponsorRoles
                                    TemplatePadding: =8
                                    TemplateSize: =200
                                    Width: =Parent.Width
                                  Children:
                                    - home_sponsor_card:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Light
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =Parent.TemplateHeight - 4
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =0
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Width: =Parent.TemplateWidth - 4
                                        Children:
                                          - home_sponsor_accent:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                Fill: =RGBA(228, 0, 43, 1)
                                                FillPortions: =0
                                                Width: =4
                                          - home_sponsor_body:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =16
                                                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                                PaddingBottom: =16
                                                PaddingLeft: =18
                                                PaddingRight: =18
                                                PaddingTop: =16
                                              Children:
                                                - home_sponsor_card_left:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      FillPortions: =1
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - home_sponsor_role_title:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            Color: =RGBA(26, 26, 26, 1)
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =FontWeight.Bold
                                                            Height: =22
                                                            Size: =16
                                                            Text: =ThisItem.Title
                                                            Width: =Parent.Width
                                                      - home_sponsor_project:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            Color: =RGBA(90, 96, 105, 1)
                                                            Font: =Font.'Segoe UI'
                                                            Height: =18
                                                            Size: =12
                                                            Text: =ThisItem.project
                                                            Width: =Parent.Width
                                                      - home_sponsor_meta_row:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =20
                                                            LayoutWrap: =true
                                                          Children:
                                                            - home_sponsor_loc:
                                                                Control: GroupContainer@1.5.0
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  LayoutDirection: =LayoutDirection.Vertical
                                                                  LayoutGap: =2
                                                                Children:
                                                                  - home_sponsor_loc_lbl:
                                                                      Control: Label@2.5.1
                                                                      Properties:
                                                                        Color: =RGBA(124, 130, 139, 1)
                                                                        Font: =Font.'Segoe UI'
                                                                        FontWeight: =FontWeight.Semibold
                                                                        Height: =14
                                                                        Size: =10
                                                                        Text: ="LOCATION"
                                                                  - home_sponsor_loc_val:
                                                                      Control: Label@2.5.1
                                                                      Properties:
                                                                        Color: =RGBA(44, 47, 51, 1)
                                                                        Font: =Font.'Segoe UI'
                                                                        FontWeight: =FontWeight.Semibold
                                                                        Height: =18
                                                                        Size: =12
                                                                        Text: =ThisItem.location
                                                            - home_sponsor_band:
                                                                Control: GroupContainer@1.5.0
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  LayoutDirection: =LayoutDirection.Vertical
                                                                  LayoutGap: =2
                                                                Children:
                                                                  - home_sponsor_band_lbl:
                                                                      Control: Label@2.5.1
                                                                      Properties:
                                                                        Color: =RGBA(124, 130, 139, 1)
                                                                        Font: =Font.'Segoe UI'
                                                                        FontWeight: =FontWeight.Semibold
                                                                        Height: =14
                                                                        Size: =10
                                                                        Text: ="BAND"
                                                                  - home_sponsor_band_val:
                                                                      Control: Label@2.5.1
                                                                      Properties:
                                                                        Color: =RGBA(44, 47, 51, 1)
                                                                        Font: =Font.'Segoe UI'
                                                                        FontWeight: =FontWeight.Semibold
                                                                        Height: =18
                                                                        Size: =12
                                                                        Text: =ThisItem.band
                                                - home_sponsor_card_right:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      LayoutAlignItems: =LayoutAlignItems.End
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =14
                                                    Children:
                                                      - home_sponsor_status_pill:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            FillPortions: =0
                                                            Fill: |-
                                                              =Switch(
                                                                  ThisItem.status.Value,
                                                                  "Pending Requirements", RGBA(251, 241, 223, 1),
                                                                  "Searching", RGBA(231, 240, 251, 1),
                                                                  RGBA(232, 246, 238, 1)
                                                              )
                                                            Height: =28
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =6
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            RadiusBottomLeft: =14
                                                            RadiusBottomRight: =14
                                                            RadiusTopLeft: =14
                                                            RadiusTopRight: =14
                                                          Children:
                                                            - home_sponsor_status_dot:
                                                                Control: Rectangle@2.3.0
                                                                Properties:
                                                                  BorderColor: =RGBA(0, 0, 0, 0)
                                                                  Fill: |-
                                                                    =Switch(
                                                                        ThisItem.status.Value,
                                                                        "Pending Requirements", RGBA(185, 119, 11, 1),
                                                                        "Searching", RGBA(44, 110, 189, 1),
                                                                        RGBA(31, 138, 84, 1)
                                                                    )
                                                                  Height: =8
                                                                  Width: =8
                                                            - home_sponsor_status_text:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Color: |-
                                                                    =Switch(
                                                                        ThisItem.status.Value,
                                                                        "Pending Requirements", RGBA(185, 119, 11, 1),
                                                                        "Searching", RGBA(44, 110, 189, 1),
                                                                        RGBA(31, 138, 84, 1)
                                                                    )
                                                                  Font: =Font.'Segoe UI'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Height: =18
                                                                  Size: =11
                                                                  Text: |-
                                                                    =Switch(
                                                                        ThisItem.status.Value,
                                                                        "Pending Requirements", "Requirements to define",
                                                                        "Searching", "Searching - not filled",
                                                                        "Filled"
                                                                    )
                                                      - home_sponsor_open:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            BorderThickness: =0
                                                            Color: =RGBA(255, 255, 255, 1)
                                                            Fill: =RGBA(228, 0, 43, 1)
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =36
                                                            HoverFill: =RGBA(184, 0, 34, 1)
                                                            OnSelect: |-
                                                              =Set(varSelectedRole, ThisItem);
                                                              Set(
                                                                  varRoleTab,
                                                                  Switch(
                                                                      ThisItem.status.Value,
                                                                      "Pending Requirements", "req",
                                                                      "Searching", "cand",
                                                                      "comp"
                                                                  )
                                                              );
                                                              Navigate('Role Workspace', ScreenTransition.Fade)
                                                            Size: =11
                                                            Text: |-
                                                              =Switch(
                                                                  ThisItem.status.Value,
                                                                  "Pending Requirements", "Open assessment",
                                                                  "Searching", "Review candidates",
                                                                  "View role"
                                                              )
                                                            Width: =170
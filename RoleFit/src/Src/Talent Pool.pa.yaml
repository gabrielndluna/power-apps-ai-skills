Screens:
  Talent Pool:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      OnVisible: |-
        =ClearCollect(colCandidates, Filter(KI_candidates, isactive = true));
        ClearCollect(colRoleRequirements, KI_role_requirements);
        ClearCollect(colAttestations, KI_attestations)
    Children:
      - pool_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - pool_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(44, 47, 51, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =224
                Children:
                  - pool_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =20
                        Text: ="RoleFit"
                  - pool_nav_home:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate(Home, ScreenTransition.Fade)
                        Text: ="Home"
                        Width: =200
                  - pool_nav_roles:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('All Roles', ScreenTransition.Fade)
                        Text: ="All Roles"
                        Visible: =varIsCreator
                        Width: =200
                  - pool_nav_pool:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Text: ="Talent Pool"
                        Width: =200
                  - pool_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinHeight: =40
                  - pool_user_name:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(198, 202, 207, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        Size: =12
                        Text: =User().FullName
                  - pool_user_role:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(124, 130, 139, 1)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        Size: =11
                        Text: =If(varIsCreator, "HR Assessor", "Executive Sponsor")
            - pool_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinWidth: =0
                Children:
                  - pool_topbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        PaddingLeft: =26
                      Children:
                        - pool_crumb:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(26, 26, 26, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Talent Pool"
                  - pool_content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        PaddingBottom: =30
                        PaddingLeft: =30
                        PaddingRight: =30
                        PaddingTop: =24
                      Children:
                        - pool_title:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(26, 26, 26, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Size: =22
                              Text: ="Talent Pool"
                        - pool_context:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: |-
                                =If(
                                    !IsBlank(varTalentContextRole),
                                    "Match scores vs: " & varTalentContextRole.Title,
                                    "No active searching role for context scoring."
                                )
                        - pool_gallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =1
                              Items: =colCandidates
                              OnSelect: |-
                                =If(
                                    !IsBlank(varTalentContextRole),
                                    Set(varSelectedRole, varTalentContextRole);
                                    Set(varSelectedCandidate, ThisItem);
                                    Set(varRoleTab, "cand");
                                    Navigate('Role Workspace', ScreenTransition.Fade)
                                )
                              TemplatePadding: =8
                              TemplateSize: =180
                              Width: =Parent.Width
                              WrapCount: =Max(1, RoundDown((Self.Width - 16) / 360, 0))
                            Children:
                              - pool_card:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Light
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Parent.TemplateHeight - 4
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    PaddingBottom: =12
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =12
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =Parent.TemplateWidth - 4
                                  Children:
                                    - pool_card_name:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(26, 26, 26, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =22
                                          Size: =15
                                          Text: =ThisItem.Title
                                    - pool_card_title:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(90, 96, 105, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =32
                                          Size: =12
                                          Text: =ThisItem.currenttitle & " · " & ThisItem.tenuresource
                                          Wrap: =true
                                    - pool_card_scores:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =18
                                        Children:
                                          - pool_card_score_reqs:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(44, 47, 51, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =36
                                                Size: =12
                                                Text: |-
                                                  =With(
                                                      {
                                                          reqs: Filter(colRoleRequirements, rolecode = varTalentContextRole.rolecode && isrequired),
                                                          met: Filter(
                                                              colAttestations,
                                                              candidatecode = ThisItem.candidatecode && status.Value = "Met"
                                                          )
                                                      },
                                                      If(
                                                          CountRows(reqs) = 0,
                                                          "- / -" & Char(10) & "Requirements met",
                                                          With(
                                                              {
                                                                  metCount: CountRows(
                                                                      Filter(
                                                                          reqs As r,
                                                                          !IsBlank(
                                                                              LookUp(
                                                                                  met,
                                                                                  itemcode = r.itemcode || requirementcode = r.requirementcode
                                                                              )
                                                                          )
                                                                      )
                                                                  )
                                                              },
                                                              Text(metCount) & "/" & Text(CountRows(reqs)) & Char(10) & "Requirements met"
                                                          )
                                                      )
                                                  )
                                                Width: =120
                                                Wrap: =true
                                          - pool_card_score_crit:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(44, 47, 51, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =36
                                                Size: =12
                                                Text: |-
                                                  =With(
                                                      {
                                                          crits: Filter(colRoleRequirements, rolecode = varTalentContextRole.rolecode && iscritical),
                                                          met: Filter(
                                                              colAttestations,
                                                              candidatecode = ThisItem.candidatecode && status.Value = "Met"
                                                          )
                                                      },
                                                      If(
                                                          CountRows(crits) = 0,
                                                          "- / -" & Char(10) & "Criticals met",
                                                          With(
                                                              {
                                                                  metCount: CountRows(
                                                                      Filter(
                                                                          crits As r,
                                                                          !IsBlank(
                                                                              LookUp(
                                                                                  met,
                                                                                  itemcode = r.itemcode || requirementcode = r.requirementcode
                                                                              )
                                                                          )
                                                                      )
                                                                  )
                                                              },
                                                              Text(metCount) & "/" & Text(CountRows(crits)) & Char(10) & "Criticals met"
                                                          )
                                                      )
                                                  )
                                                Width: =110
                                                Wrap: =true
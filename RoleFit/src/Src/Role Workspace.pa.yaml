                              TemplateSize: =74
                              Width: =436
                            Children:
                              - ws_modal_pool_row:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    DropShadow: =DropShadow.None
                                    Height: =68
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.TemplateWidth - 8
                                  Children:
                                    - ws_modal_pool_left:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - ws_modal_pool_name:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(26, 26, 26, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =13
                                                Text: =ThisItem.Title
                                          - ws_modal_pool_sub:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(90, 96, 105, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =34
                                                Size: =11
                                                Text: =ThisItem.currenttitle & " · " & ThisItem.tenuresource
                                                Wrap: =true
                                    - ws_modal_pool_add:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(228, 0, 43, 1)
                                          Color: =RGBA(228, 0, 43, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =28
                                          OnSelect: |-
                                            =Patch(
                                                KI_role_candidates,
                                                Defaults(KI_role_candidates),
                                                {
                                                    Title: ThisItem.Title & " - " & varSelectedRole.rolecode,
                                                    rolecandidatecode: "RC-" & Text(CountRows(colRoleCandidates) + 1, "000"),
                                                    rolecode: varSelectedRole.rolecode,
                                                    candidatecode: ThisItem.candidatecode,
                                                    addedon: Now(),
                                                    addedbyemail: varCurrentUserEmail
                                                }
                                            );
                                            ClearCollect(colRoleCandidates, KI_role_candidates);
                                            Set(varShowAddCandidate, false);
                                            Notify(ThisItem.Title & " added from pool", NotificationType.Success)
                                          Text: ="Add"
                                          Width: =60
      - ws_create_modal:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            Visible: =varShowCreateCandidate
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - ws_create_backdrop:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.Height
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: |-
                    =Set(varShowCreateCandidate, false);
                    Set(varCreateCandidateLinkRole, "")
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Text: =""
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - ws_create_card:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =520
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =480
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - ws_create_body:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =22
                        PaddingRight: =22
                        PaddingTop: =18
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                      Children:
                        - ws_create_title_row:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =436
                            Children:
                              - ws_create_title:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Color: =RGBA(26, 26, 26, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =16
                                    Text: ="New candidate"
                              - ws_create_cancel:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =RGBA(90, 96, 105, 1)
                                    Fill: =RGBA(241, 242, 244, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: |-
                                      =Set(varShowCreateCandidate, false);
                                      Set(varCreateCandidateLinkRole, "")
                                    Size: =11
                                    Text: ="Cancel"
                                    Width: =88
                        - ws_create_hint:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =32
                              Size: =11
                              Text: |-
                                =If(
                                    !IsBlank(varCreateCandidateLinkRole),
                                    "Saved to Talent Pool and added to this role.",
                                    "Saved to Talent Pool. Assign to a role later from Role Workspace."
                                )
                              Width: =436
                              Wrap: =true
                        - ws_create_name_lbl:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Full name *"
                              Width: =436
                        - ws_create_name:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =""
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              HintText: ="e.g. Amara Chen"
                              Width: =436
                        - ws_create_title_lbl:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Current title"
                              Width: =436
                        - ws_create_jobtitle:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =""
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              HintText: ="e.g. Project Director"
                              Width: =436
                        - ws_create_tenure_lbl:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Tenure / source"
                              Width: =436
                        - ws_create_tenure:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =""
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              HintText: ="e.g. Aecon · 9 yrs"
                              Width: =436
                        - ws_create_note_lbl:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(90, 96, 105, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Assessor note"
                              Width: =436
                        - ws_create_note:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Default: =""
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =72
                              HintText: ="Optional notes for assessors"
                              Mode: =TextMode.MultiLine
                              Width: =436
                        - ws_create_save:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(228, 0, 43, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              HoverFill: =RGBA(184, 0, 34, 1)
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(ws_create_name.Text)),
                                    Notify("Full name is required", NotificationType.Error),
                                    With(
                                        {
                                            _code: "CAND-" & Text(CountRows(colCandidates) + 1, "000"),
                                            _name: Trim(ws_create_name.Text),
                                            _title: If(IsBlank(Trim(ws_create_jobtitle.Text)), "Title not set", Trim(ws_create_jobtitle.Text)),
                                            _tenure: If(IsBlank(Trim(ws_create_tenure.Text)), "Talent Pool", Trim(ws_create_tenure.Text)),
                                            _note: Trim(ws_create_note.Text),
                                            _linkRole: varCreateCandidateLinkRole
                                        },
                                        Patch(
                                            KI_candidates,
                                            Defaults(KI_candidates),
                                            {
                                                Title: _name,
                                                candidatecode: _code,
                                                currenttitle: _title,
                                                tenuresource: _tenure,
                                                assessornote: _note,
                                                isactive: true,
                                                createdbyemail: varCurrentUserEmail
                                            }
                                        );
                                        ClearCollect(colCandidates, Filter(KI_candidates, isactive = true));
                                        If(
                                            Not(IsBlank(_linkRole)),
                                            Patch(
                                                KI_role_candidates,
                                                Defaults(KI_role_candidates),
                                                {
                                                    Title: _name & " - " & _linkRole,
                                                    rolecandidatecode: "RC-" & Text(CountRows(colRoleCandidates) + 1, "000"),
                                                    rolecode: _linkRole,
                                                    candidatecode: _code,
                                                    addedon: Now(),
                                                    addedbyemail: varCurrentUserEmail
                                                }
                                            );
                                            ClearCollect(colRoleCandidates, KI_role_candidates);
                                            ClearCollect(
                                                colWsRoleCands,
                                                ForAll(
                                                    Filter(colRoleCandidates, rolecode = _linkRole) As r,
                                                    LookUp(colCandidates, candidatecode = r.candidatecode)
                                                )
                                            );
                                            Set(varSelectedCandidate, LookUp(colCandidates, candidatecode = _code));
                                            Set(varRoleTab, "cand");
                                            Clear(colWsAttestAccordion);
                                            ForAll(
                                                Filter(colWsPillars, Not(pillarcode = "CUSTOM")) As p,
                                                If(
                                                    CountRows(
                                                        Filter(
                                                            colRoleRequirements,
                                                            rolecode = varSelectedRole.rolecode && isrequired && pillarcode = p.pillarcode
                                                        )
                                                    ) > 0,
                                                    Collect(
                                                        colWsAttestAccordion,
                                                        {
                                                            rowkind: "pillar",
                                                            pillarcode: p.pillarcode,
                                                            Title: p.Title,
                                                            statement: "",
                                                            itemcode: "",
                                                            categorycode: "",
                                                            requirementcode: "",
                                                            iscustom: false,
                                                            iscritical: false,
                                                            sortorder: p.sortorder
                                                        }
                                                    );
                                                    ForAll(
                                                        SortByColumns(
                                                            Filter(colCategories, pillarcode = p.pillarcode),
                                                            "sortorder",
                                                            SortOrder.Ascending
                                                        ) As c,
                                                        If(
                                                            CountRows(
                                                                Filter(
                                                                    colRoleRequirements,
                                                                    rolecode = varSelectedRole.rolecode && isrequired && categorycode = c.categorycode
                                                                )
                                                            ) > 0,
                                                            Collect(
                                                                colWsAttestAccordion,
                                                                {
                                                                    rowkind: "category",
                                                                    pillarcode: c.pillarcode,
                                                                    Title: c.Title,
                                                                    statement: "",
                                                                    itemcode: "",
                                                                    categorycode: c.categorycode,
                                                                    requirementcode: "",
                                                                    iscustom: false,
                                                                    iscritical: false,
                                                                    sortorder: c.sortorder
                                                                }
                                                            );
                                                            Collect(
                                                                colWsAttestAccordion,
                                                                ForAll(
                                                                    SortByColumns(
                                                                        Filter(
                                                                            colRoleRequirements,
                                                                            rolecode = varSelectedRole.rolecode && isrequired && categorycode = c.categorycode
                                                                        ),
                                                                        "sortorder",
                                                                        SortOrder.Ascending
                                                                    ) As r,
                                                                    {
                                                                        rowkind: "item",
                                                                        pillarcode: r.pillarcode,
                                                                        Title: r.Title,
                                                                        statement: r.statement,
                                                                        itemcode: r.itemcode,
                                                                        categorycode: r.categorycode,
                                                                        requirementcode: r.requirementcode,
                                                                        iscustom: Coalesce(r.iscustom, false),
                                                                        iscritical: Coalesce(r.iscritical, false),
                                                                        sortorder: r.sortorder
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            );
                                            If(
                                                CountRows(
                                                    Filter(
                                                        colRoleRequirements,
                                                        rolecode = varSelectedRole.rolecode && isrequired && iscustom
                                                    )
                                                ) > 0,
                                                Collect(
                                                    colWsAttestAccordion,
                                                    {
                                                        rowkind: "pillar",
                                                        pillarcode: "CUSTOM",
                                                        Title: "Custom",
                                                        statement: "",
                                                        itemcode: "",
                                                        categorycode: "",
                                                        requirementcode: "",
                                                        iscustom: false,
                                                        iscritical: false,
                                                        sortorder: 999
                                                    }
                                                );
                                                Collect(
                                                    colWsAttestAccordion,
                                                    {
                                                        rowkind: "category",
                                                        pillarcode: "CUSTOM",
                                                        Title: "Custom",
                                                        statement: "",
                                                        itemcode: "",
                                                        categorycode: "CUSTOM",
                                                        requirementcode: "",
                                                        iscustom: false,
                                                        iscritical: false,
                                                        sortorder: 1
                                                    }
                                                );
                                                Collect(
                                                    colWsAttestAccordion,
                                                    ForAll(
                                                        SortByColumns(
                                                            Filter(
                                                                colRoleRequirements,
                                                                rolecode = varSelectedRole.rolecode && isrequired && iscustom
                                                            ),
                                                            "sortorder",
                                                            SortOrder.Ascending
                                                        ) As r,
                                                        {
                                                            rowkind: "item",
                                                            pillarcode: "CUSTOM",
                                                            Title: r.Title,
                                                            statement: r.statement,
                                                            itemcode: Coalesce(r.itemcode, r.requirementcode),
                                                            categorycode: "CUSTOM",
                                                            requirementcode: r.requirementcode,
                                                            iscustom: true,
                                                            iscritical: Coalesce(r.iscritical, false),
                                                            sortorder: r.sortorder
                                                        }
                                                    )
                                                )
                                            )
                                        );

                                        Reset(ws_create_name);
                                        Reset(ws_create_jobtitle);
                                        Reset(ws_create_tenure);
                                        Reset(ws_create_note);
                                        Set(varShowCreateCandidate, false);
                                        Set(varCreateCandidateLinkRole, "");
                                        Notify(_name & " added to Talent Pool", NotificationType.Success)
                                    )
                                )
                              Size: =12
                              Text: ="Save candidate"
                              Width: =436

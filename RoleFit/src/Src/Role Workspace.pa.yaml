                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.End
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =160
                                        Children:
                                          - ws_header_guide_lbl:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(124, 130, 139, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =14
                                                Size: =10
                                                Text: ="Reference guide"
                                                Width: =160
                                          - ws_header_guide_val:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(44, 47, 51, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =12
                                                Text: =Coalesce(LookUp(colGuides, guidecode = varSelectedRole.guidecode).Title, varSelectedRole.guidecode)
                                                Width: =160
                              - ws_header_meta_row:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =34
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - ws_header_loc:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - ws_header_loc_lbl:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(124, 130, 139, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =12
                                                Size: =10
                                                Text: ="LOCATION"
                                          - ws_header_loc_val:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(44, 47, 51, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =12
                                                Text: =Coalesce(varSelectedRole.location, "-")
                                    - ws_header_band:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - ws_header_band_lbl:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(124, 130, 139, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =12
                                                Size: =10
                                                Text: ="BAND"
                                          - ws_header_band_val:

                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutMinHeight: =0
                        PaddingLeft: =26
                      Children:
                        - ws_crumb:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(26, 26, 26, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =13
                              Text: =varSelectedRole.Title
                  - ws_scroll:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =40
                        PaddingLeft: =30
                        PaddingRight: =30
                        PaddingTop: =20
                      Children:
                        - ws_header:
                            Control: GroupContainer@1.5.0

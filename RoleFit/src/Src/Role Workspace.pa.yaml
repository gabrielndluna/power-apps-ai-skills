                                    BorderColor: =If(varRoleTab = "req", RGBA(228, 0, 43, 1), RGBA(228, 228, 228, 1))
                                    Color: =If(varRoleTab = "req", RGBA(228, 0, 43, 1), RGBA(90, 96, 105, 1))

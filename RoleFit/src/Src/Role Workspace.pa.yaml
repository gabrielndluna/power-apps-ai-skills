                                      ="Requirements (" & Text(CountRows(Filter(colRoleRequirements, rolecode = varSelectedRole.rolecode))) & ")"
                                    Width: =170
                              - ws_tab_cand:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varRoleTab = "cand", RGBA(228, 0, 43, 1), RGBA(228, 228, 228, 1))
                                    Color: =If(varRoleTab = "cand", RGBA(228, 0, 43, 1), RGBA(90, 96, 105, 1))
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: =Set(varRoleTab, "cand")
                                    Size: =12
                                    Text: |-
                                      ="Candidates (" & Text(CountRows(Filter(colRoleCandidates, rolecode = varSelectedRole.rolecode))) & ")"
                                    Visible: =varIsCreator
                                    Width: =150
                              - ws_tab_comp:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(varRoleTab = "comp", RGBA(228, 0, 43, 1), RGBA(228, 228, 228, 1))
                                    Color: =If(varRoleTab = "comp", RGBA(228, 0, 43, 1), RGBA(90, 96, 105, 1))
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    OnSelect: =Set(varRoleTab, "comp"); Set(varSelectedCandidate, Blank())
                                    Size: =12

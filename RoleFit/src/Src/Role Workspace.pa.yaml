Screens:
  Role Workspace:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      OnVisible: |-
        =ClearCollect(colRoles, KI_roles);
        ClearCollect(colPillars, KI_pillars);
        ClearCollect(colCategories, KI_categories);
        ClearCollect(colGuideItems, KI_guide_items);
        ClearCollect(colRoleRequirements, KI_role_requirements);
        ClearCollect(colRoleCandidates, KI_role_candidates);
        ClearCollect(colAttestations, KI_attestations);
        ClearCollect(colCandidates, Filter(KI_candidates, isactive));
        Set(varSelectedRole, LookUp(colRoles, rolecode = varSelectedRole.rolecode));
        ClearCollect(
            colWsPillars,
            SortByColumns(
                Filter(colPillars, guidecode = varSelectedRole.guidecode),
                "sortorder",
                SortOrder.Ascending
            )
        );
        Collect(
            colWsPillars,
            {
                Title: "Custom",
                pillarcode: "CUSTOM",
                guidecode: varSelectedRole.guidecode,
                description: "Role-specific custom requirements",
                sortorder: 999,
                colorhex: "#6B7280"
            }
        );
        Set(varWsExpandedPillar, "");
        Set(varWsExpandedCategory, "");
        Set(varCompFilter, "all");
        Clear(colWsAccordion);
        ForAll(
            colWsPillars As p,
            Collect(
                colWsAccordion,
                {
                    rowkind: "pillar",
                    pillarcode: p.pillarcode,
                    Title: p.Title,
                    description: p.description,
                    statement: "",
                    itemcode: "",
                    categorycode: "",
                    sortorder: p.sortorder,
                    defaultcritical: false
                }
            );
            If(
                p.pillarcode = varWsExpandedPillar,
                If(
                    p.pillarcode = "CUSTOM",
                    Collect(
                        colWsAccordion,
                        {
                            rowkind: "category",
                            pillarcode: "CUSTOM",
                            Title: "Custom",
                            description: "",
                            statement: "",
                            itemcode: "",
                            categorycode: "CUSTOM",
                            sortorder: 1,
                            defaultcritical: false
                        }
                    );
                    If(
                        varWsExpandedCategory = "CUSTOM",
                        Collect(
                            colWsAccordion,
                            ForAll(
                                SortByColumns(
                                    Filter(
                                        colRoleRequirements,
                                        rolecode = varSelectedRole.rolecode && iscustom
                                    ),
                                    "sortorder",
                                    SortOrder.Ascending
                                ) As r,
                                {
                                    rowkind: "item",
                                    pillarcode: "CUSTOM",
                                    Title: r.Title,
                                    description: "",
                                    statement: r.statement,
                                    itemcode: Coalesce(r.itemcode, r.requirementcode),
                                    categorycode: "CUSTOM",
                                    sortorder: r.sortorder,
                                    defaultcritical: false
                                }
                            )
                        )
                    ),
                    ForAll(
                        SortByColumns(
                            Filter(colCategories, pillarcode = p.pillarcode),
                            "sortorder",
                            SortOrder.Ascending
                        ) As c,
                        Collect(
                            colWsAccordion,
                            {
                                rowkind: "category",
                                pillarcode: c.pillarcode,
                                Title: c.Title,
                                description: "",
                                statement: "",
                                itemcode: "",
                                categorycode: c.categorycode,
                                sortorder: c.sortorder,
                                defaultcritical: false
                            }
                        );
                        If(
                            c.categorycode = varWsExpandedCategory,
                            Collect(
                                colWsAccordion,
                                ForAll(
                                    SortByColumns(
                                        Filter(colGuideItems, categorycode = c.categorycode),
                                        "sortorder",
                                        SortOrder.Ascending
                                    ) As g,
                                    {
                                        rowkind: "item",
                                        pillarcode: g.pillarcode,
                                        Title: g.Title,
                                        description: "",
                                        statement: g.statement,
                                        itemcode: g.itemcode,
                                        categorycode: g.categorycode,
                                        sortorder: g.sortorder,
                                        defaultcritical: g.defaultcritical
                                    }
                                )
                            )
                        )
                    )
                )
            )
        );
        ClearCollect(
            colWsRoleCands,
            ForAll(
                Filter(colRoleCandidates, rolecode = varSelectedRole.rolecode) As rc,
                LookUp(colCandidates, candidatecode = rc.candidatecode)
            )
        );
        Clear(colWsAttestAccordion);
        ForAll(
            Filter(colWsPillars, Not(pillarcode = "CUSTOM")) As p,
            If(
                CountRows(
                    Filter(
                        colRoleRequirements,
                        rolecode = varSelectedRole.rolecode && isrequired && pillarcode = p.pillarcode
                    )
                ) > 0,
                Collect(
                    colWsAttestAccordion,
                    {
                        rowkind: "pillar",
                        pillarcode: p.pillarcode,
                        Title: p.Title,
                        statement: "",
                        itemcode: "",
                        categorycode: "",
                        requirementcode: "",
                        iscustom: false,
                        iscritical: false,
                        sortorder: p.sortorder
                    }
                );
                ForAll(
                    SortByColumns(
                        Filter(colCategories, pillarcode = p.pillarcode),
                        "sortorder",
                        SortOrder.Ascending
                    ) As c,
                    If(
                        CountRows(
                            Filter(
                                colRoleRequirements,
                                rolecode = varSelectedRole.rolecode && isrequired && categorycode = c.categorycode
                            )
                        ) > 0,
                        Collect(
                            colWsAttestAccordion,
                            {
                                rowkind: "category",
                                pillarcode: c.pillarcode,
                                Title: c.Title,
                                statement: "",
                                itemcode: "",
                                categorycode: c.categorycode,
                                requirementcode: "",
                                iscustom: false,
                                iscritical: false,
                                sortorder: c.sortorder
                            }
                        );
                        Collect(
                            colWsAttestAccordion,
                            ForAll(
                                SortByColumns(
                                    Filter(
                                        colRoleRequirements,
                                        rolecode = varSelectedRole.rolecode && isrequired && categorycode = c.categorycode
                                    ),
                                    "sortorder",
                                    SortOrder.Ascending
                                ) As r,
                                {
                                    rowkind: "item",
                                    pillarcode: r.pillarcode,
                                    Title: r.Title,
                                    statement: r.statement,
                                    itemcode: r.itemcode,
                                    categorycode: r.categorycode,
                                    requirementcode: r.requirementcode,
                                    iscustom: Coalesce(r.iscustom, false),
                                    iscritical: Coalesce(r.iscritical, false),
                                    sortorder: r.sortorder
                                }
                            )
                        )
                    )
                )
            )
        );
        If(
            CountRows(
                Filter(
                    colRoleRequirements,
                    rolecode = varSelectedRole.rolecode && isrequired && iscustom
                )
            ) > 0,
            Collect(
                colWsAttestAccordion,
                {
                    rowkind: "pillar",
                    pillarcode: "CUSTOM",
                    Title: "Custom",
                    statement: "",
                    itemcode: "",
                    categorycode: "",
                    requirementcode: "",
                    iscustom: false,
                    iscritical: false,
                    sortorder: 999
                }
            );
            Collect(
                colWsAttestAccordion,
                {
                    rowkind: "category",
                    pillarcode: "CUSTOM",
                    Title: "Custom",
                    statement: "",
                    itemcode: "",
                    categorycode: "CUSTOM",
                    requirementcode: "",
                    iscustom: false,
                    iscritical: false,
                    sortorder: 1
                }
            );
            Collect(
                colWsAttestAccordion,
                ForAll(
                    SortByColumns(
                        Filter(
                            colRoleRequirements,
                            rolecode = varSelectedRole.rolecode && isrequired && iscustom
                        ),
                        "sortorder",
                        SortOrder.Ascending
                    ) As r,
                    {
                        rowkind: "item",
                        pillarcode: "CUSTOM",
                        Title: r.Title,
                        statement: r.statement,
                        itemcode: Coalesce(r.itemcode, r.requirementcode),
                        categorycode: "CUSTOM",
                        requirementcode: r.requirementcode,
                        iscustom: true,
                        iscritical: Coalesce(r.iscritical, false),
                        sortorder: r.sortorder
                    }
                )
            )
        );
        Clear(colWsCompAccordion);
        ForAll(
            Filter(colWsPillars, Not(pillarcode = "CUSTOM")) As p,
            If(
                CountRows(
                    Filter(
                        colRoleRequirements,
                        rolecode = varSelectedRole.rolecode &&
                        isrequired &&
                        pillarcode = p.pillarcode &&
                        (
                            varCompFilter = "all" ||
                            (varCompFilter = "critical" && iscritical) ||
                            (varCompFilter = "other" && !iscritical)
                        )
                    )
                ) > 0,
                Collect(
                    colWsCompAccordion,
                    {
                        rowkind: "pillar",
                        pillarcode: p.pillarcode,
                        Title: p.Title,
                        statement: "",
                        itemcode: "",
                        categorycode: "",
                        requirementcode: "",
                        iscustom: false,
                        iscritical: false,
                        sortorder: p.sortorder
                    }
                );
                ForAll(
                    SortByColumns(
                        Filter(colCategories, pillarcode = p.pillarcode),
                        "sortorder",
                        SortOrder.Ascending
                    ) As c,
                    If(
                        CountRows(
                            Filter(
                                colRoleRequirements,
                                rolecode = varSelectedRole.rolecode &&
                                isrequired &&
                                categorycode = c.categorycode &&
                                (
                                    varCompFilter = "all" ||
                                    (varCompFilter = "critical" && iscritical) ||
                                    (varCompFilter = "other" && !iscritical)
                                )
                            )
                        ) > 0,
                        Collect(
                            colWsCompAccordion,
                            {
                                rowkind: "category",
                                pillarcode: c.pillarcode,
                                Title: c.Title,
                                statement: "",
                                itemcode: "",
                                categorycode: c.categorycode,
                                requirementcode: "",
                                iscustom: false,
                                iscritical: false,
                                sortorder: c.sortorder
                            }
                        );
                        Collect(
                            colWsCompAccordion,
                            ForAll(
                                SortByColumns(
                                    Filter(
                                        colRoleRequirements,
                                        rolecode = varSelectedRole.rolecode &&
                                        isrequired &&
                                        categorycode = c.categorycode &&
                                        (
                                            varCompFilter = "all" ||
                                            (varCompFilter = "critical" && iscritical) ||
                                            (varCompFilter = "other" && !iscritical)
                                        )
                                    ),
                                    "sortorder",
                                    SortOrder.Ascending
                                ) As r,
                                {
                                    rowkind: "item",
                                    pillarcode: r.pillarcode,
                                    Title: r.Title,
                                    statement: r.statement,
                                    itemcode: r.itemcode,
                                    categorycode: r.categorycode,
                                    requirementcode: r.requirementcode,
                                    iscustom: Coalesce(r.iscustom, false),
                                    iscritical: Coalesce(r.iscritical, false),
                                    sortorder: r.sortorder
                                }
                            )
                        )
                    )
                )
            )
        );
        If(
            CountRows(
                Filter(
                    colRoleRequirements,
                    rolecode = varSelectedRole.rolecode &&
                    isrequired &&
                    iscustom &&
                    (
                        varCompFilter = "all" ||
                        (varCompFilter = "critical" && iscritical) ||
                        (varCompFilter = "other" && !iscritical)
                    )
                )
            ) > 0,
            Collect(
                colWsCompAccordion,
                {
                    rowkind: "pillar",
                    pillarcode: "CUSTOM",
                    Title: "Custom",
                    statement: "",
                    itemcode: "",
                    categorycode: "",
                    requirementcode: "",
                    iscustom: false,
                    iscritical: false,
                    sortorder: 999
                }
            );
            Collect(
                colWsCompAccordion,
                {
                    rowkind: "category",
                    pillarcode: "CUSTOM",
                    Title: "Custom",
                    statement: "",
                    itemcode: "",
                    categorycode: "CUSTOM",
                    requirementcode: "",
                    iscustom: false,
                    iscritical: false,
                    sortorder: 1
                }
            );
            Collect(
                colWsCompAccordion,
                ForAll(
                    SortByColumns(
                        Filter(
                            colRoleRequirements,
                            rolecode = varSelectedRole.rolecode &&
                            isrequired &&
                            iscustom &&
                            (
                                varCompFilter = "all" ||
                                (varCompFilter = "critical" && iscritical) ||
                                (varCompFilter = "other" && !iscritical)
                            )
                        ),
                        "sortorder",
                        SortOrder.Ascending
                    ) As r,
                    {
                        rowkind: "item",
                        pillarcode: "CUSTOM",
                        Title: r.Title,
                        statement: r.statement,
                        itemcode: Coalesce(r.itemcode, r.requirementcode),
                        categorycode: "CUSTOM",
                        requirementcode: r.requirementcode,
                        iscustom: true,
                        iscritical: Coalesce(r.iscritical, false),
                        sortorder: r.sortorder
                    }
                )
            )
        );
    Children:
      - ws_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ws_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(44, 47, 51, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =224
                Children:
                  - ws_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =20
                        Text: ="RoleFit"
                  - ws_nav_home:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate(Home, ScreenTransition.Fade)
                        Text: ="Home"
                        Width: =200
                  - ws_nav_roles:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('All Roles', ScreenTransition.Fade)
                        Text: ="All Roles"
                        Visible: =varIsCreator
                        Width: =200
                  - ws_nav_pool:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('Talent Pool', ScreenTransition.Fade)
                        Text: ="Talent Pool"
                        Visible: =varIsCreator
                        Width: =200
                  - ws_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinHeight: =40
                  - ws_user_name:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =12
                        Text: =User().FullName
                        Width: =200
                  - ws_user_role:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(124, 130, 139, 1)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        Size: =11
                        Text: =If(varIsCreator, "HR Assessor", "Executive Sponsor")
            - ws_main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinWidth: =0
                Children:
                  - ws_topbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutMinHeight: =0
                        PaddingLeft: =26
                      Children:
                        - ws_crumb:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(26, 26, 26, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =12
                              Text: =varSelectedRole.Title
                              Width: =Parent.Width - 40
                  - ws_scroll:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =30
                        PaddingRight: =30
                        PaddingTop: =14
                      Children:
                        - ws_header:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsBlank(varSelectedRole.selectedcandidatecode),
                                    112,
                                    164
                                )
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: |-
                                =If(
                                    IsBlank(varSelectedRole.selectedcandidatecode),
                                    112,
                                    164
                                )
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                            Children:
                              - ws_header_top:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - ws_header_left:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - ws_header_title:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(26, 26, 26, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =26
                                                Size: =18
                                                Text: =varSelectedRole.Title
                                                Width: =Parent.Width
                                          - ws_header_status_row:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(0, 0, 0, 0)
                                                FillPortions: =0
                                                Height: =24
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - ws_header_status_pill:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderThickness: =0
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Fill: |-
                                                        =Switch(
                                                            varSelectedRole.status.Value,
                                                            "Pending Requirements", RGBA(251, 241, 223, 1),
                                                            "Searching", RGBA(231, 240, 251, 1),
                                                            RGBA(232, 246, 238, 1)
                                                        )
                                                      Height: =28
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =6
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      RadiusBottomLeft: =12
                                                      RadiusBottomRight: =12
                                                      RadiusTopLeft: =12
                                                      RadiusTopRight: =12
                                                      Width: =136
                                                    Children:
                                                      - ws_header_status_dot:
                                                          Control: Rectangle@2.3.0
                                                          Properties:
                                                            BorderColor: =RGBA(0, 0, 0, 0)
                                                            Fill: |-
                                                              =Switch(
                                                                  varSelectedRole.status.Value,
                                                                  "Pending Requirements", RGBA(185, 119, 11, 1),
                                                                  "Searching", RGBA(44, 110, 189, 1),
                                                                  RGBA(31, 138, 84, 1)
                                                              )
                                                            FillPortions: =0
                                                            Height: =7
                                                            Width: =7
                                                      - ws_header_status_text:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            BorderColor: =RGBA(0, 0, 0, 0)
                                                            BorderThickness: =0
                                                            Color: |-
                                                              =Switch(
                                                                  varSelectedRole.status.Value,
                                                                  "Pending Requirements", RGBA(185, 119, 11, 1),
                                                                  "Searching", RGBA(44, 110, 189, 1),
                                                                  RGBA(31, 138, 84, 1)
                                                              )
                                                            FillPortions: =0
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =22
                                                            Size: =11
                                                            Text: |-
                                                              =Switch(
                                                                  varSelectedRole.status.Value,
                                                                  "Pending Requirements", "Pending reqs",
                                                                  "Searching", "Not-Filled",
                                                                  "Filled"
                                                              )
                                                            Width: =108
                                                - ws_header_project:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderThickness: =0
                                                      Color: =RGBA(90, 96, 105, 1)
                                                      FillPortions: =1
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      Size: =12
                                                      Text: =varSelectedRole.project
                                    - ws_header_guide:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.End
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =160
                                        Children:
                                          - ws_header_guide_lbl:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Color: =RGBA(124, 130, 139, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =14
                                                Size: =10
                                                Text: ="Reference guide"
                                                Width: =160
                                          - ws_header_guide_val:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right

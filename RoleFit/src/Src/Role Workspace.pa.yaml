Screens:
  Role Workspace:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      OnVisible: |-
        =ClearCollect(colRoles, KI_roles);
        ClearCollect(colPillars, KI_pillars);
        ClearCollect(colGuideItems, KI_guide_items);
        ClearCollect(colRoleRequirements, KI_role_requirements);
        ClearCollect(colRoleCandidates, KI_role_candidates);
        ClearCollect(colAttestations, KI_attestations);
        ClearCollect(colCandidates, Filter(KI_candidates, isactive));
        Set(varSelectedRole, LookUp(colRoles, rolecode = varSelectedRole.rolecode));
        Set(varWsExpandedCategory, "");
        Set(
            varWsExpandedPillar,
            Coalesce(
                First(
                    SortByColumns(
                        Filter(colPillars, guidecode = varSelectedRole.guidecode),
                        "sortorder",
                        SortOrder.Ascending
                    )
                ).pillarcode,
                ""
            )
        );
        ClearCollect(
            colWsPillars,
            SortByColumns(
                Filter(colPillars, guidecode = varSelectedRole.guidecode),
                "sortorder",
                SortOrder.Ascending
            )
        );
        Clear(colWsAccordion);
        ForAll(
            colWsPillars As p,
            With(
                {
                    pillarRow: {
                        rowkind: "pillar",
                        pillarcode: p.pillarcode,
                        Title: p.Title,
                        description: p.description,
                        statement: "",
                        itemcode: "",
                        categorycode: "",
                        sortorder: p.sortorder,
                        defaultcritical: false
                    },
                    itemRows: If(
                        p.pillarcode = varWsExpandedPillar,
                        ForAll(
                            SortByColumns(
                                Filter(colGuideItems, pillarcode = p.pillarcode),
                                "sortorder",
                                SortOrder.Ascending
                            ) As g,
                            {
                                rowkind: "item",
                                pillarcode: g.pillarcode,
                                Title: g.Title,
                                description: "",
                                statement: g.statement,
                                itemcode: g.itemcode,
                                categorycode: g.categorycode,
                                sortorder: g.sortorder,
                                defaultcritical: g.defaultcritical
                            }
                        ),
                        Table()
                    )
                },
                Collect(colWsAccordion, pillarRow);
                Collect(colWsAccordion, itemRows)
            )
        );
        ClearCollect(
            colWsRoleCands,
            ForAll(
                Filter(colRoleCandidates, rolecode = varSelectedRole.rolecode) As rc,
                LookUp(colCandidates, candidatecode = rc.candidatecode)
            )
        )
    Children:
      - ws_root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ws_rail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(44, 47, 51, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =18
                  Width: =224
                Children:
                  - ws_brand_title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(228, 0, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =20
                        Text: ="RoleFit"
                  - ws_nav_home:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate(Home, ScreenTransition.Fade)
                        Text: ="Home"
                        Width: =200
                  - ws_nav_roles:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('All Roles', ScreenTransition.Fade)
                        Text: ="All Roles"
                        Visible: =varIsCreator
                        Width: =200
                  - ws_nav_pool:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =RGBA(198, 202, 207, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate('Talent Pool', ScreenTransition.Fade)
                        Text: ="Talent Pool"
                        Visible: =varIsCreator
                        Width: =200
                  - ws_rail_spacer:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinHeight: =40
                  - ws_user_name:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(198, 202, 207, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        Size: =12
                        Text: =User().FullName
                  - ws_user_role:
                      Control: Label@2.5.1

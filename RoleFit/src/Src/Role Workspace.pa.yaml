                                      ="Compare (" & Text(CountRows(colWsRoleCands)) & ")"
                                    Visible: =varIsCreator
                                    Width: =140
                        - ws_req_panel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
